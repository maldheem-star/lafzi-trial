name: Deploy Lafzi Trial

# ===== الجذر إنتاجٌ، و/preview بيئةُ تجريب — ٢٩ أغسطس =====
# كان `main` هو الإنتاج ولا شيء غيره: ما يُدمج يصل الثلاثة دفعةً واحدة بلا موضعٍ
# يُفتح فيه على جهازٍ حقيقي قبل ذلك. وهذه ثغرةٌ اعتُمدت صراحةً بعد سؤال «هل طبّقت
# كل مراحل SDLC؟» — والجواب كان: لا بيئة تجريب، ولا خطّة تراجع، ولا جهاز حقيقي.
#
# والنشر على Pages ذرّيّ: قطعةٌ واحدة تُرفع فتحلّ محلّ الموقع كلّه. فلا يمكن نشر
# فرعين مستقلّين، لكن يمكن أن تحمل القطعةُ الواحدة الاثنين: جذرُها من `main`،
# ومجلّد `preview/` من فرع التطوير.
#
# ولهذا نتيجتان مقصودتان:
#   • ما يفتحه الأبناء (الجذر) لا يتغيّر إلّا بدمجٍ إلى `main` — كما كان تماماً.
#   • و`preview/` يُسحب من فرع التطوير في كل تشغيل، فيُفتح على جهازٍ حقيقي قبل الشحن.
#     وهذا بالضبط ما لا تستطيعه اختباراتنا: كلّها Chromium بلا رأس على لينكس،
#     والعطل الذي فتح جلسة ٢٩ أغسطس (`synthesis-failed` على Android 10) من صنفٍ
#     لا يُمسك إلّا على جهازٍ حقيقي.
#
# ===== ولا يُطلَق من فرع التطوير — قاعدةُ حماية البيئة ترفضه =====
# جُرِّب الدفع من الفرع فسقط التشغيلان في **ثانيتين**، بلا عدّاء (`runner_id: 0`)
# وبلا خطوةٍ واحدة: أي أن المهمّة رُفضت **قبل أن تُخصَّص لها آلة**. وهذا توقيع
# قاعدة حماية بيئة `github-pages`: لا تقبل النشر إلّا من الفرع الافتراضي.
#
# ويمكن تغييرها من إعدادات المستودع، لكن ذلك يُوسّع صلاحية النشر لفرعٍ يتغيّر كل
# ساعة — ثمنٌ أمنيّ لا يستحقّه تحديثُ معاينة. فالإطلاق يبقى من `main` (بالدفع أو
# يدوياً بـ`workflow_dispatch`)، **والمعاينة تُسحب من الفرع في الحالتين**: أي أن
# تحديثها نداءٌ واحد بعد دفع الفرع، بلا لمس أيّ إعداد.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # الجذر من `main` دائماً — أيّاً كان الفرع الذي أطلق التشغيل. فدفعُ فرع
      # التطوير لا يستطيع أن يمسّ ما يفتحه الأبناء ولو أخطأ أحدٌ في إعداد الشرط.
      - name: Checkout main (production root)
        uses: actions/checkout@v4
        with:
          ref: main
      # وفرعُ التطوير في مجلّدٍ فرعي. `continue-on-error` مقصود: فرعٌ محذوف أو
      # غير موجود يجب ألّا يمنع نشر الإنتاج — التجريب إضافةٌ لا شرط.
      - name: Checkout dev branch into preview/
        id: preview
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: claude/talent-app-fixes-visuals-poevc6
          path: preview
      # الوسم يُكتب **قبل** نزع git — وإلّا قرأ بصمة `main` لا بصمة الفرع، فقال
      # للفاحص إنه يرى الإنتاج وهو يرى التجريب. (رُتِّب هكذا عمداً.)
      - name: Mark preview
        if: steps.preview.outcome == 'success'
        run: |
          printf '%s' "preview · $(git -C preview rev-parse --short HEAD) · $(date -u +%Y-%m-%dT%H:%MZ)" > preview/PREVIEW.txt
      # ===== وسمُ النسخة يُختم آلياً — درس ١٨ أغسطس واقعاً مرّةً ثالثة =====
      # `BUILD` ثابتٌ مكتوبٌ بيدٍ في `index.html`، فيبقى على تاريخٍ قديم ما لم
      # يتذكّر أحدٌ تحديثه. وقد وقع ثمنُه اليوم في فحصٍ حيّ: بطاقة جهاز هيا وصلت
      # تقول «بناء:build-20260825-0100» بينما تحمل الصفحةُ فعلاً شيفرة ٣٠ أغسطس —
      # فتعذّر الحكم من الوسم: أهي نسخةٌ قديمة أم وسمٌ قديم فوق نسخةٍ جديدة؟
      #
      # والقاعدة المكتوبة في ذاكرة المشروع صريحة: «آليةٌ تعتمد على أن يتذكّر أحدٌ
      # خطوةً يدوية ستفشل، ولا يكفي إصلاحها مرّةً — يجب نزع التذكّر من مسارها».
      # فيُختم هنا من بصمة الالتزام وزمن النشر: يتحرّك مع كل شحنة بلا أن ينتظر أحداً.
      - name: Stamp build id from commit
        run: |
          # صفحتا الأخوين تُحمّلان index.html نفسه، فالوسم فيه وحده — ويُبحَث عنه
          # بالنمط لا بالسطر، فانتقالُه لا يُسقط الختم صامتاً.
          stamp(){                       # $1 = الملفّ · $2 = الوسم
            [ -f "$1" ] || return 0
            grep -q 'var BUILD="' "$1" || { echo "::error::لا وسم BUILD في $1"; exit 1; }
            sed -i "s|var BUILD=\"[^\"]*\"|var BUILD=\"$2\"|" "$1"
          }
          stamp index.html "$(git rev-parse --short HEAD)-$(date -u +%Y%m%d-%H%M)"
          # وسمُ التجريب مسبوقٌ بـpv- فلا يُقرأ فحصُ التجريب على أنه فحصُ الإنتاج
          if [ -d preview/.git ]; then
            stamp preview/index.html "pv-$(git -C preview rev-parse --short HEAD)-$(date -u +%Y%m%d-%H%M)"
          fi
          grep -o 'var BUILD="[^"]*"' index.html preview/index.html 2>/dev/null || true
      # لا حاجة لتاريخ git ولا لتعريفات النشر ولا للاختبارات داخل القطعة المنشورة
      - name: Strip nested git metadata
        run: rm -rf preview/.git preview/.github preview/tests || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
