<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* فحص الإصدار. كان موجوداً منذ البداية لكنه ميت لسببين، وهما سبب بقاء هيا ٩٠ دقيقة على نسخة
   قديمة فلم يصلها أي إصلاح: (١) BUILD لم يُحدَّث منذ ٢٣ يوليو، فيقارن النص بنفسه ويطابق دائماً.
   (٢) الفحص مرة واحدة فقط لكل جلسة تصفّح، والصفحة تبقى مفتوحة ساعات فلا يُعاد.
   الحل: فحص عند التحميل بعلامة الإصدار، ثم فحص دوري وعند العودة للتبويب بمقارنة حجم الملف —
   وهذه تلقائية لا تحتاج تحديثاً يدوياً، فتصمد لو نسيتُ تحديث BUILD مرة أخرى. */
(function(){
  var BUILD="build-20260818-1215";
  try{window.__BUILD=BUILD}catch(e){}
  // يُصدَّر ليستعمله زرّ التحديث القسري في صفحة التشخيص (خارج هذا الغلاف)
  var url=function(){return location.pathname+"?_cb="+Date.now()};
  var baseLen=null, notified=false;
  function fetchHtml(){return fetch(url(),{cache:"no-store"}).then(function(r){return r.text()})}
  // النسخة التي يعرضها المتصفّح فعلاً (لا الحيّة): force-cache يُعيد ما في ذاكرته إن وُجد،
  // وإلا سقط إلى الشبكة فعاد مطابقاً للحيّ — أي لا إنذار كاذب في الحالة الأسوأ.
  // ويُطلب الرابط كاملاً بالاستعلام (location.href) لا المسار وحده، لأن مفتاح التخزين
  // هو الرابط كاملاً: صفحة محمد هي index.html?p=mohammed، فطلبُ المسار وحده يقرأ إدخالاً آخر.
  function fetchCached(){
    return fetch(location.href.split("#")[0],{cache:"force-cache"})
      .then(function(r){return r.text()}).catch(function(){return null});
  }
  // الهويّة من الرابط وحده (?p=mohammed) ولا تُحفَظ — فإعادة التحميل يجب أن تصون الاستعلام.
  // وكانت تُسقطه: location.pathname+"?_r=" يُعيد محمداً وإلياس إلى صفحة هيا بلا أن يشعرا.
  function reloadUrl(){
    var q=location.search.replace(/([?&])_r=\d+&?/,"$1").replace(/[?&]$/,"");
    return location.pathname+(q?q+"&":"?")+"_r="+Date.now();
  }
  try{window.__reloadUrl=reloadUrl}catch(e){}
  function banner(){
    if(notified)return; notified=true;
    var d=document.createElement("div");
    d.setAttribute("style","position:fixed;inset-inline:0;bottom:0;z-index:9999;background:#1D4ED8;color:#fff;"+
      "padding:14px 16px;font:700 15px system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.2)");
    d.textContent="🔄 يوجد تحديث جديد للتطبيق — اضغطي هنا للتحديث";
    d.onclick=function(){location.href=reloadUrl()};
    document.body.appendChild(d);
  }
  // عند التحميل: لو كان المتصفّح يعرض نسخة مخزّنة أقدم من الخادم، نُحدّث فوراً (لا عمل جارياً بعد)
  // حارس: إعادة تحميل واحدة لكل جلسة تصفّح لا أكثر. بلا هذا الحارس، اختلافُ نسخةٍ بين
  // عُقد الشبكة يُدخل الصفحة في حلقة إعادة تحميل تسرق كل لمسة فيبدو التطبيق ميتاً.
  var GUARD="mawhiba_reload_guard";
  function guardGet(){try{return parseInt(sessionStorage.getItem(GUARD)||"0",10)||0}catch(e){return 9}}
  function guardSet(n){try{sessionStorage.setItem(GUARD,String(n))}catch(e){}}
  // فحصان لا واحد، لأن الأوّل وحده أثبت أنه يفشل بصمت:
  //  (١) وسم البناء BUILD — صريحٌ لكنه معلّقٌ على أن يتذكّر إنسانٌ تحديثه كل شحنة. ونُسي
  //      فعلاً ثماني شحنات متتالية (١٧ أغسطس ١٤:٤٥ ⇐ ١٨ أغسطس)، فبقي محمد على نسخةٍ لا
  //      تصلها تدريباته: نسخته تحمل الوسم والصفحةُ الحيّة تحمله أيضاً، فيُطابق النصّ نفسه
  //      ويظنّ نفسه محدَّثاً. والعيب نفسه سبق أن أُصلح ثم عاد — فالتذكّر ليس آلية.
  //  (٢) طولُ النسخة المخزّنة مقابل الحيّة — تلقائيٌّ بالكامل، يتحرّك مع أيّ تعديل مهما
  //      صَغُر، فيصمد لو نُسي BUILD ثانيةً. واتجاه خطئه آمن: تعذّرُ قراءة المخزّنة يُعيد
  //      الحيّ فيتطابقان، فيفوت الإنذار ولا يقع كاذباً — والكاذب أسوأ لأنه حلقةُ تحميل.
  Promise.all([fetchHtml(),fetchCached()]).then(function(res){
    var live=res[0],cached=res[1];
    baseLen=live.length;
    var stale=(live.indexOf(BUILD)===-1)||(cached!==null&&cached.length!==live.length);
    if(stale){
      if(guardGet()>=1){banner();return}
      guardSet(1);
      location.href=reloadUrl();
    }else{try{sessionStorage.removeItem(GUARD)}catch(e){}}
  }).catch(function(){});
  // بعد ذلك: لا نُحدّث تلقائياً حتى لا نُضيّع إجابة جارية — نعرض شريطاً تضغطه هي
  function recheck(){
    if(baseLen===null||notified)return;
    fetchHtml().then(function(html){if(html.length!==baseLen)banner()}).catch(function(){});
  }
  setInterval(recheck,10*60*1000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)recheck()});
})();
</script>

<script>
// ===== ملفّات الإخوة =====
// جلسة أخيها سُجّلت باسم «بنتي» لأن الاسم كان واحداً ثابتاً — فاختلط صوته بسجلّها،
// وأي تقرير عن «أصوات هيا» بعدها يقرأ صوتين ويحسبهما واحداً. والقياس هو الأصل الذي
// بُني عليه كل تحسين هنا، فخلطه ليس تفصيلاً.
//
// الفصل في موضعين: اسم السجلّ على الخادم، ومفاتيح التخزين المحلّي (التباعد والأخطاء
// والإتقان). وهيا تبقى بلا بادئة عمداً — فبياناتها كلها محفوظة تحت المفاتيح القديمة،
// وتغييرها كان سيُضيّع شهر عمل.
// العمر والمستوى في الملفّ لا في الشيفرة: كان النموذج يُخاطب الجميع بعمر إحدى عشرة
// سنة، فبينما يتحدّث محمد (١٩) عن الجامعة ومصروفها يُعرض عليه «I want new shoes».
const PROFILES=[
  // A1 لا A2: قياس ١٥ أغسطس — إنتاجها المنطوق شظايا ونسخٌ حرفيّ («I want beach.»،
  // «I eat a sandwich.»)، ودقّة قواعدها على تراكيب فوق الأساسي ٦٦/١٨٩ (٣٥٪).
  {id:"haya",name:"هيا",alias:"بنتي",emoji:"🌸",color:"#DB2777",g:"f",age:11,level:"A1"},
  {id:"mohammed",name:"محمد",alias:"محمد",emoji:"⚽",color:"#0E7490",g:"m",only:"coach",age:19,level:"B1"},
  {id:"elias",name:"إلياس",alias:"إلياس",emoji:"🚀",color:"#7C3AED",g:"m",only:"coach",age:18,level:"A2"},
];
// الهويّة من الرابط وحده، ولا تُحفَظ. لكلٍّ صفحته: mohammed.html و elias.html،
// وهيا في الرئيسية. ولو حُفظت الهويّة لكان آخر من فتح الجهاز يُدخِل الآخرين في صفحته.
function profileId(){
  try{
    const m=/[?&]p=([A-Za-z]+)/.exec(location.search||"");
    const id=m?m[1].toLowerCase():"";
    return PROFILES.some(function(p){return p.id===id})?id:"haya";
  }catch(e){return "haya"}
}
function profileOf(){const id=profileId();return PROFILES.filter(function(p){return p.id===id})[0]||PROFILES[0]}
// هيا بلا بادئة: مفاتيحها القديمة هي مفاتيحها الحالية، فلا تفقد شيئاً
function pkey(k){const id=profileId();return id==="haya"?k:id+"::"+k}
function lsGet(k){try{return localStorage.getItem(pkey(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(pkey(k),v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(pkey(k))}catch(e){}}

// ===== إظهار الأخطاء بدل ابتلاعها =====
// خطأ واحد في المستوى الأعلى كان كفيلاً بإيقاف تعريف بقية الملف، فتموت كل الأزرار في كل
// الأقسام بلا أي أثر مرئي. الآن يُعرض الخطأ باسمه وموضعه على الشاشة، فيُرى بدل أن يُخمَّن.
window.__ERRS=[];
function appError(where,e){
  try{
    var msg=(e&&(e.message||e.reason&&e.reason.message))||String(e&&e.reason||e||"");
    var line=(e&&e.lineno)?(" سطر "+e.lineno):"";
    window.__ERRS.push({where:where,msg:msg,line:line});
    var id="appErrBar",old=document.getElementById(id);
    if(old)old.parentNode.removeChild(old);
    var d=document.createElement("div");
    d.id=id;
    d.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:99999;background:#7F1D1D;color:#fff;"+
      "padding:10px 40px 10px 12px;font:700 12px system-ui,sans-serif;text-align:start;direction:rtl;"+
      "max-height:34vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.3)");
    d.innerHTML='<div style="font-size:13px;margin-bottom:4px">⚠️ حدث خطأ في التطبيق — أرسلي هذه الرسالة</div>'+
      window.__ERRS.slice(-4).map(function(x){
        return '<div style="font-weight:400;font-size:11.5px;line-height:1.7;direction:ltr;text-align:left">'+
          x.where+': '+String(x.msg).slice(0,220)+x.line+'</div>'}).join("");
    var b=document.createElement("button");
    b.textContent="✕";
    b.setAttribute("style","position:absolute;top:6px;inset-inline-end:8px;right:8px;background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 8px");
    b.onclick=function(){d.parentNode&&d.parentNode.removeChild(d)};
    d.appendChild(b);
    (document.body||document.documentElement).appendChild(d);
  }catch(_){}
}
// ===== جلب بمهلة =====
// طلبٌ بلا مهلة يُبقي علم "جارٍ التحقّق" مرفوعاً إلى الأبد، فيُرسَم زرّ التسجيل معطّلاً
// ولا يستجيب للمس إطلاقاً — وهو عطلٌ يبدو للمستعملة كأن الزرّ نفسه مكسور.
const NET_TIMEOUT_MS=25000;
function fetchTimeout(url,opts,ms){
  ms=ms||NET_TIMEOUT_MS;
  if(typeof AbortController==="undefined"){
    return Promise.race([fetch(url,opts),
      new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},ms)})]);
  }
  var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);
  var o={};for(var k in opts)o[k]=opts[k];o.signal=c.signal;
  return fetch(url,o).then(function(r){clearTimeout(t);return r},
                           function(e){clearTimeout(t);throw (e&&e.name==="AbortError")?new Error("timeout"):e});
}
window.addEventListener("error",function(ev){appError("خطأ",ev)});
window.addEventListener("unhandledrejection",function(ev){appError("وعد",ev)});

// ===== إعدادات =====
const SB_URL="https://yzznkerweqkmhrtbidrl.supabase.co";
const SB_KEY="sb_publishable_W9ijdHn1vHj3-rUDCx2U5Q_yq6ebbsI";
const FN_URL=SB_URL+"/functions/v1/generate-question";
const TBL="mawhiba_attempts";
const TBL_LOG="mawhiba_answer_log";
const DOMAINS={
  verbal:{name:"الاستدلال اللغوي",color:"#2563EB",soft:"#DBEAFE"},
  quant:{name:"الرياضي والمكاني",color:"#0D9488",soft:"#CCFBF1"},
  science:{name:"الاستدلال العلمي",color:"#7C3AED",soft:"#EDE9FE"},
  flex:{name:"المرونة والأنماط",color:"#D97706",soft:"#FEF3C7"},
};
const L=["أ","ب","ج","د"];
const PER=12;
const DAILY_CAP=80; // حد أقصى لطلبات الذكاء الاصطناعي يومياً (تحكّم بالتكلفة)

// ===== أدوات =====
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// أيّ تدريبٍ غير مقاليّ لا يقلّ عن N (طلب صاحب المشروع، ١٨ أغسطس) — كانت جلساتٌ حيّة

function topUpPlan(out,POOL,N){

}
const toAr=n=>String(n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function arSeq(a){return a.map(toAr).join(" ، ")}
function mcNum(correct,cands){const opts=[correct];(cands||[]).forEach(x=>{x=Math.round(x);if(opts.length<4&&Number.isFinite(x)&&x>=0&&!opts.includes(x))opts.push(x)});let p=1;while(opts.length<4){[correct+p,correct-p].forEach(x=>{if(opts.length<4&&x>=0&&!opts.includes(x))opts.push(x)});p++;if(p>300)break}const sh=shuffle(opts);return{choices:sh.map(x=>Number.isInteger(x)?toAr(x):arDec(x)),answer:sh.indexOf(correct)}}
function arDec(x){return toAr(String(round2(x))).replace(".","٫")}
// خيارات عشرية: mcNum يقرّب للأعداد الصحيحة فيمحو الفاصلة — وهي بيت القصيد هنا
function mcNumDec(correct,cands){
  const opts=[round2(correct)];
  (cands||[]).forEach(x=>{x=round2(x);if(opts.length<4&&Number.isFinite(x)&&x>0&&opts.indexOf(x)<0)opts.push(x)});
  let p=1;
  while(opts.length<4){[round2(correct+p),round2(correct-p)].forEach(x=>{if(opts.length<4&&x>0&&opts.indexOf(x)<0)opts.push(x)});p++;if(p>300)break}
  const sh=shuffle(opts);return{choices:sh.map(arDec),answer:sh.indexOf(round2(correct))};
}
function qz(d,q,correct,cands,w){const m=mcNum(correct,cands);return{d,q,c:m.choices,a:m.answer,w}}

// نقطة على بعد r من V باتجاه الزاوية phi (٠=يمين، ٩٠=أعلى)
function vAngleDeg(V,r,phi){const rad=phi*Math.PI/180;return{x:V.x+r*Math.cos(rad),y:V.y-r*Math.sin(rad)}}
function uDir(phi){const rad=phi*Math.PI/180;return{x:Math.cos(rad),y:-Math.sin(rad)}}
function unitTo(V,P){const dx=P.x-V.x,dy=P.y-V.y;const m=Math.hypot(dx,dy)||1;return{x:dx/m,y:dy/m}}
// نقطة منتصف الزاوية (منصّف) بين اتجاهين عند رأس V، تُستخدم لوضع رقم الزاوية داخلها
function bisectorPoint(V,u1,u2,r){let bx=u1.x+u2.x,by=u1.y+u2.y,bm=Math.hypot(bx,by);if(bm<1e-6){bx=-u1.y;by=u1.x;bm=1}return{x:V.x+(bx/bm)*r,y:V.y+(by/bm)*r}}
function arcPathBetween(V,u1,u2,r){const p1={x:V.x+u1.x*r,y:V.y+u1.y*r},p2={x:V.x+u2.x*r,y:V.y+u2.y*r};const cross=u1.x*u2.y-u1.y*u2.x;const sweep=cross>0?1:0;return`M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`}
// يرسم مروحة زوايا حول رأس O بدءاً من startPhi، بقيم values المتتابعة، مع تمييز الزاوية المجهولة برقم unknownIdx
function renderSectorFan(O,startPhi,values,unknownIdx,extraSVG){
  const rayLen=68,arcR=24,labR=38;
  let phis=[startPhi];values.forEach(v=>phis.push(phis[phis.length-1]+v));
  let rays="",arcs="",labels="";
  phis.forEach(p=>{const pt=vAngleDeg(O,rayLen,p);rays+=`<line x1="${O.x}" y1="${O.y}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#1E293B" stroke-width="2.5"/>`});
  for(let i=0;i<values.length;i++){
    const u1=uDir(phis[i]),u2=uDir(phis[i+1]),isUnk=i===unknownIdx;
    arcs+=`<path d="${arcPathBetween(O,u1,u2,arcR)}" fill="none" stroke="${isUnk?'#D97706':'#0D9488'}" stroke-width="2"/>`;
    const lp=bisectorPoint(O,u1,u2,labR);
    labels+=`<text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="${isUnk?'#D97706':'#0D9488'}">${isUnk?'ص':toAr(values[i])+'°'}</text>`;
  }
  return`<svg viewBox="0 0 200 200" width="200" height="200">${extraSVG||""}${rays}<circle cx="${O.x}" cy="${O.y}" r="3" fill="#1E293B"/>${arcs}${labels}</svg>`;
}

  // كلّما كان p=٢ بالضبط — فأخطأتها هيا مرّتين في نفس اليوم وp=٢ في الاثنتين، ولم
  // نستطع الحكم: أخمّنت +٢ عشوائياً أم توقّفت فعلاً عند bAge؟ فصار bAge نفسه هو
  // المموّه (لا رقماً ثابتاً)، فيصير اختياره دليلاً لا صدفة: قياسٌ أدقّ قبل أي علاج.

// لغز الساعة: مربع (س÷أ) = مكعب (س÷٢أ) ← الحل س = ٨أ

const rotDown=a=>[a[2],a[0],a[1]];
function gShapeAnalogy(){
  const perms=[['f','e','g'],['f','g','e'],['e','f','g'],['e','g','f'],['g','f','e'],['g','e','f']];
  const A=pick(perms),B=rotDown(A);

  const C=pick(perms.filter(z=>!cyc.includes(key(z))));
  const ans=rotDown(C);
  const cands=[rotDown(ans),[...C].reverse(),A,B,C];
  const dis=[];
  for(const z of cands){if(dis.length<3&&key(z)!==key(ans)&&!dis.some(w=>key(w)===key(z)))dis.push(z)}
  const all=shuffle([ans,...dis]);

// ===== محرّك الذكاء الاصطناعي (Gemini) + التحكّم بالتكلفة =====
function todayKey(){return new Date().toISOString().slice(0,10)}
function geminiUsage(){try{const u=JSON.parse(lsGet("gemini_day")||"{}");if(u.date!==todayKey())return{date:todayKey(),count:0};return u}catch(e){return{date:todayKey(),count:0}}}
function bumpUsage(n){const u=geminiUsage();u.count+=n;lsSet("gemini_day",JSON.stringify(u))}
function cacheGet(type){try{const c=JSON.parse(lsGet("gemini_cache")||"{}");return c[type]||[]}catch(e){return[]}}
function cachePut(type,arr){try{const c=JSON.parse(lsGet("gemini_cache")||"{}");c[type]=((c[type]||[]).concat(arr)).slice(-40);lsSet("gemini_cache",JSON.stringify(c))}catch(e){}}

// يجلب أسئلة من المحرّك، مع تخزين الفائض وإعادة الاستخدام، واحترام الحد اليومي
async function fetchGemini(type,need){
  const out=[];
  // 1) استهلك من الكاش أولاً
  let cache=cacheGet(type);
  while(out.length<need && cache.length){out.push(cache.shift())}
  cachePutReplace(type,cache);
  if(out.length>=need)return out.map(tagAI(type));
  // 2) تحقّق من الحد اليومي
  if(geminiUsage().count>=DAILY_CAP)return out.map(tagAI(type)); // نكتفي بالمتاح
  // 3) اطلب دفعة (3) لتقليل عدد النداءات
  try{
    const res=await fetch(FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({type,count:3})});
    if(res.ok){const data=await res.json();bumpUsage(1);const qs=(data.questions||[]).map(normAI(type));const take=qs.slice(0,need-out.length);out.push(...take);cachePut(type,qs.slice(take.length))}
  }catch(e){}
  return out.map(tagAI(type));
}
function cachePutReplace(type,arr){try{const c=JSON.parse(lsGet("gemini_cache")||"{}");c[type]=arr;lsSet("gemini_cache",JSON.stringify(c))}catch(e){}}
function normAI(type){return q=>({d:aiDomain(type),q:q.q,c:q.choices,a:q.answer,w:q.why||"",qtype:type})}
function tagAI(type){return q=>q}
function aiDomain(type){return (type==="science")?"science":"verbal"}

// أنواع لفظية وعلمية من المحرّك
const AI_VERBAL=["reading","logic","analogy","vocabulary"];
const AI_SCIENCE=["science"];

// ===== منع تكرار نص السؤال داخل الجلسة الحالية =====
// يتذكّر نصوص الأسئلة التي عُرضت فعلاً منذ فتح الصفحة (كل الأوضاع)، ويتجنّب إعادتها
const sessionSeenQuestions=new Set();
function markSeen(q){if(q&&q.q)sessionSeenQuestions.add(q.q);return q}
function isSeen(q){return !!(q&&sessionSeenQuestions.has(q.q))}
// يولّد من قائمة مولّدات عشوائياً حتى يجد نصاً لم يُعرض من قبل (بحد أقصى من المحاولات تفادياً لحلقة لا نهائية)
function uniqueFromGens(gens,maxTries){
  maxTries=maxTries||50;
  for(let i=0;i<maxTries;i++){const q=pick(gens)();if(!isSeen(q))return markSeen(q)}
  return markSeen(pick(gens)()); // البنك التوليدي نفد تنويعاً؛ نقبل الأحدث كحل أخير
}
// يفلتر قائمة أسئلة (من الذكاء الاصطناعي أو البنك) مبقياً على غير المعروض فقط
function dedupeList(arr){const out=[];(arr||[]).forEach(q=>{if(!isSeen(q)){out.push(q);markSeen(q)}});return out}
// يأخذ أول "need" سؤالاً غير معروض من قائمة (تُستخدم لتعبئة النقص من البنك الاحتياطي)
function takeUniqueFrom(arr,need){const out=[];for(const q of (arr||[])){if(out.length>=need)break;if(!isSeen(q)){out.push(q);markSeen(q)}}return out}
// حل أخير عند نفاد البنك عالمياً: يكمل من pool متفادياً تكرار نص موجود مسبقاً في نفس الدفعة (existing)،
// حتى لو تجاوزنا حدود التتبّع العالمي لهذه الجلسة
function fillAvoidingBatchDupes(existing,pool,need){
  const seenQ=new Set(existing.map(q=>q.q));
  const out=[];
  for(const item of shuffle(pool)){
    if(out.length>=need)break;
    if(!seenQ.has(item.q)){out.push(item);seenQ.add(item.q)}
  }
  return out;
}

// يبني مجموعة أسئلة لمجال، ممزوجة (محرّك + كود) مع احتياط، وبلا تكرار لنص سبق عرضه في هذه الجلسة
// ===== لا قالبان متطابقان متتاليان =====
// سؤالان متتاليان بالقالب نفسه («العلوي = حاصل ضرب السفليين»، ٢٠ و٤ ثم ١٢ و٤): أصابت
// الأول بـ٥ ثم أعادت ٥ في الثاني وصوابه ٣. القالب المتكرّر يدعو إلى إعادة الجواب لا
// إلى إعادة الحلّ. والقالب يُعرَف بنصّ السؤال بعد نزع أرقامه — بلا وسم يدويّ في البنك.
function tmplKey(it){
  return String((it&&it.q)||"").replace(/[0-9٠-٩٫.,]+/g,"#").replace(/\s+/g," ").trim().slice(0,80);
}
// ===== ذاكرة أخطاء بنك موهبة =====
// خطة الإنجليزية تحفظ كل خطأ وتُعيد العنصر وتفتح بوّابة تصحيح. والبنك لا يحفظ شيئاً:
// «دفع سالم ٥٠٪ من راتبه…» عُرض ثلاث مرّات في أسبوع، وصفر صواب في الثلاث. والسؤال
// نفسه يعود أسبوعاً بعد أسبوع بلا علاج. الذاكرة على القالب (بنزع الأرقام) لا على نصّ
// السؤال، فمسألة الراتب بأرقام جديدة هي هي.
const QZ_ERR_KEY="mawhiba_quiz_err_v1";
const QZ_DUE_WRONG=2;    // قالبان خطأ ⇒ يستحقّ الإعادة والتنبيه
const QZ_DUE_MAX=2;      // لا نُثقل الاختبار: قالبان مستحقّان في الجولة الواحدة
const QZ_CARD_MAX=2;     // وبطاقتا تنبيه على الأكثر — التنبيه الدائم يصير خلفية
function qzErrLoad(){try{return JSON.parse(lsGet(QZ_ERR_KEY)||"{}")}catch(e){return{}}}
function qzErrSave(o){try{lsSet(QZ_ERR_KEY,JSON.stringify(o))}catch(e){}}
function qzErrOf(k){return qzErrLoad()[k]||null}
function qzErrRecord(it,ok,ansTxt){
  const k=tmplKey(it);if(!k)return;
  const m=qzErrLoad(),e=m[k]||{wrong:0,seen:0,last:"",same:0,at:0};
  e.seen=(e.seen||0)+1;e.at=Date.now();
  if(ok){e.wrong=Math.max(0,(e.wrong||0)-1);e.same=0}
  else{
    e.same=(ansTxt&&e.last===ansTxt)?(e.same||0)+1:0;
    e.wrong=(e.wrong||0)+1;e.last=ansTxt||e.last;
  }
  m[k]=e;qzErrSave(m);
}
function qzDueKeys(){
  const m=qzErrLoad();
  return Object.keys(m).filter(function(k){return (m[k].wrong||0)>=QZ_DUE_WRONG})
    .sort(function(a,b){return (m[b].wrong||0)-(m[a].wrong||0)}).slice(0,QZ_DUE_MAX);
}
// المستحقّ يُقحَم في الجولة: يُولَّد من مولّداته إن أمكن، أو يُلتقط من البنك الثابت
function qzInjectDue(list,gens,pool){
  const due=qzDueKeys();if(!due.length||!list.length)return list;
  const out=list.slice();
  due.forEach(function(k){
    if(out.some(function(x){return tmplKey(x)===k}))return;
    let found=null;
    // المحاولات كثيرة عمداً: القوالب النادرة في البنك لا تُصادَف في ثلاثين سحبة،
    // فتضيع الإعادة نصف الجولات — وهي أهمّ من السرعة هنا (سحبٌ محلّي بلا شبكة).
    if(gens){for(let t=0;t<160&&!found;t++){const c=uniqueFromGens(gens);if(c&&tmplKey(c)===k)found=c}}
    if(!found&&pool){const c=pool.filter(function(x){return tmplKey(x)===k});if(c.length)found=pick(c)}
    if(!found)return;
    // نستبدل عنصراً غير مستحقّ، ولا نُطيل الاختبار
    let at=-1;
    for(let i=out.length-1;i>=0;i--){if(due.indexOf(tmplKey(out[i]))<0){at=i;break}}
    if(at>=0)out[at]=found;
  });
  return spreadTemplates(out);
}
function spreadTemplates(list){
  const n=list.length;
  if(n<3)return list.slice();
  // الأخذُ من أوّل ما يختلف يُنجح الصدر ويُكتّل العجز: القوالب الكثيرة تتبقّى في الآخر

function equalAnglesSVG(total,k){
  // الهندسة محسوبة لا ثابتة: بأنصاف أقطار ثابتة كانت العلامات تتلاصق في ٧٥٪ من الحالات
  // (أقلها ٦ بكسل) فيصير الرسم كتلة واحدة لا زوايا مميّزة — وهذا جزء من إرباك الشرح.
  const thetaRad=(total/k)*Math.PI/180;
  const arcR=Math.max(24,Math.min(80,18/thetaRad));   // تباعد العلامات ١٨ بكسل على الأقل
  const rayLen=arcR+32,outerR=rayLen+16,labR=arcR+17;
  const halfRad=(total/2)*Math.PI/180;
  const W=Math.max(210,Math.round(2*(outerR*Math.sin(halfRad)+56)));
  const H=Math.round(outerR+74);

  let phis=[startPhi];for(let i=0;i<k;i++)phis.push(phis[phis.length-1]+total/k);
  let rays="",arcs="",labels="";
  phis.forEach(p=>{const pt=vAngleDeg(O,rayLen,p);rays+=`<line x1="${O.x}" y1="${O.y}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#1E293B" stroke-width="2.5"/>`});
  for(let i=0;i<k;i++){
    const u1=uDir(phis[i]),u2=uDir(phis[i+1]),isUnk=i===0,col=isUnk?"#D97706":"#0D9488";
    arcs+=`<path d="${arcPathBetween(O,u1,u2,arcR)}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    // علامة التساوي: شرطة تقطع القوس، متطابقة على كل الزوايا بما فيها المطلوبة لأنها كلها متساوية فعلاً
    const bp=bisectorPoint(O,u1,u2,arcR),dx=(bp.x-O.x)/arcR,dy=(bp.y-O.y)/arcR;
    arcs+=`<line x1="${(bp.x-dx*5).toFixed(1)}" y1="${(bp.y-dy*5).toFixed(1)}" x2="${(bp.x+dx*5).toFixed(1)}" y2="${(bp.y+dy*5).toFixed(1)}" stroke="${col}" stroke-width="2.5"/>`;
    // لا نكتب "=" على كل زاوية: الشرطات تكفي، والكتابة كانت تتراكم في الزوايا الضيّقة
    if(isUnk){const lp=bisectorPoint(O,u1,u2,labR);
      labels+=`<text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" font-size="16" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#D97706">؟</text>`}
  }
  const uO1=uDir(phis[0]),uO2=uDir(phis[k]);
  const outerLabel=bisectorPoint(O,uO1,uO2,outerR);
  const outerArc=`<path d="${arcPathBetween(O,uO1,uO2,outerR-14)}" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const outerText=`<text x="${outerLabel.x.toFixed(1)}" y="${Math.max(14,outerLabel.y).toFixed(1)}" font-size="12.5" font-weight="700" text-anchor="middle" fill="#334155">المجموع ${toAr(total)}°</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${rays}<circle cx="${O.x}" cy="${O.y}" r="3.5" fill="#1E293B"/>${arcs}${labels}${outerArc}${outerText}</svg>`;
}

const LOGIC_NAMES=["سارة","نورة","ليلى","مها","هند","ريم"];
const LOGIC_RELS=[
  {more:"أطول",less:"أقصر",most:"الأطول",least:"الأقصر"},
  {more:"أكبر",less:"أصغر",most:"الأكبر",least:"الأصغر"},
  {more:"أسرع",less:"أبطأ",most:"الأسرع",least:"الأبطأ"},
  {more:"أثقل",less:"أخفّ",most:"الأثقل",least:"الأخفّ"},
];
const LOGIC_UNKNOWN="لا يمكن معرفة ذلك";
// المولّد القديم كان معطوباً: العبارات دائماً بترتيب السلسلة، والسؤال دائماً عن الطرف الأعلى،
// فالإجابة الصحيحة هي الاسم الأول في النص كل مرة بلا استثناء. من يلاحظ ذلك يأخذ ١٠٠٪ بلا استدلال —
// وهذا ما حدث فعلاً: "أتقنت" المنطق هنا بـ ٥/٥ وأخذت ٢٢٪ في المحاكاة.
// أربعة كسور للاختصار: ترتيب العبارات مخلوط، والمقارنة تُعكس عشوائياً، والسؤال قد يكون عن الطرف
// الأدنى، وقد تكون السلسلة مقطوعة فتكون الإجابة "لا يمكن معرفة ذلك".
function fadeMakeLogicOrder(){
  const r=pick(LOGIC_RELS);
  const stmt=(hi,lo)=>pick([`${hi} ${r.more} من ${lo}.`,`${lo} ${r.less} من ${hi}.`]);
  const askMost=pick([true,false]);
  const broken=Math.random()<0.25;
  let names,lines,ans,steps;
  if(broken){
    // سلسلتان منفصلتان: لا رابط بين المجموعتين فلا يمكن تحديد الطرف — والانتباه لذلك هو المهارة
    const [a,b,c,d]=shuffle(LOGIC_NAMES).slice(0,4);
    lines=shuffle([stmt(a,b),stmt(c,d)]);
    names=[a,b,c,d];ans=LOGIC_UNKNOWN;
    steps=[`العبارة الأولى تقارن بين مجموعة، والثانية تقارن بين مجموعة أخرى`,
           `لا توجد أي عبارة تربط المجموعتين ببعضهما`,
           `فلا نستطيع ترتيب الجميع في سلسلة واحدة — إذن ${LOGIC_UNKNOWN}`];
  }else{
    const n=pick([3,3,4]);
    const chain=shuffle(LOGIC_NAMES).slice(0,n); // chain[0] هو الأعلى وآخرها الأدنى
    const pairs=[];for(let i=0;i<n-1;i++)pairs.push(stmt(chain[i],chain[i+1]));
    lines=shuffle(pairs); // خلط ترتيب العبارات يكسر اختصار "الاسم الأول"
    names=chain.slice();ans=askMost?chain[0]:chain[n-1];
    steps=[`رتّبي كل مقارنة على حدة، ولا تعتمدي على ترتيب ظهور الأسماء في النص`,
           `بربط المقارنات تصير السلسلة: ${chain.join(" ثم ")}`,
           `المطلوب ${askMost?r.most:r.least}، وهو ${askMost?"أول":"آخر"} السلسلة — إذن ${ans}`];
  }
  // الخيارات: الإجابة + اسمان آخران + "لا يمكن معرفة ذلك" (فهي خيار دائم لا يكشف شيئاً بوجوده)
  const others=names.filter(x=>x!==ans);
  const opts=shuffle([ans,...shuffle(others).slice(0,ans===LOGIC_UNKNOWN?3:2),...(ans===LOGIC_UNKNOWN?[]:[LOGIC_UNKNOWN])]);
  const askTxt=askMost?r.most:r.least;
  return{kind:"logic",choiceKind:"text",opts,ai:opts.indexOf(ans),prompt:`من ${askTxt}؟`,
    steps,
    ruleTxt:`اربطي المقارنات في سلسلة واحدة ثم اقرئي الطرف المطلوب. وانتبهي: ترتيب العبارات لا يعني الترتيب، وإذا لم ترتبط المجموعات ببعضها فالجواب «${LOGIC_UNKNOWN}»`,
    passage:lines.join("<br>"),
    q:`بناءً على العبارات أعلاه، من ${askTxt}؟`};
}

// ===== القياس: محيط الدائرة، مساحة متوازي الأضلاع، مساحة المثلث، حجم ومساحة سطح المنشور الرباعي =====
// مبنيّة على حقيبة STEM "القياس: المحيط والمساحة والحجم" للصف السادس الابتدائي
function circleSVG(label,isDiameter){
  const line=isDiameter
    ?`<line x1="35" y1="70" x2="145" y2="70" stroke="#0D9488" stroke-width="2.5"/>`
    :`<line x1="90" y1="70" x2="145" y2="70" stroke="#0D9488" stroke-width="2.5"/>`;
  // النصف الآخر متقطّعاً حين يكون المعطى نصف القطر: "٢ × نصف القطر" تصير مرئية بدل أن تُتخيَّل
  const mirrorHalf=isDiameter?"":`<line x1="35" y1="70" x2="90" y2="70" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="62" y="88" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">مثله</text>`;
  const labelX=isDiameter?90:118;
  // "القطر = ٢ × نق" تحت الشكل لا داخله: بداخله كانت تتجاوز حافة الدائرة وتتداخل مع خطّها
  const foot=isDiameter?"":`<text x="90" y="146" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">القطر = ٢ × نق</text>`;
  return `<svg viewBox="0 0 180 ${isDiameter?140:156}" width="180" height="${isDiameter?140:156}">
    <circle cx="90" cy="70" r="55" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
    ${mirrorHalf}${line}<circle cx="90" cy="70" r="3" fill="#1E293B"/>
    <text x="${labelX}" y="58" font-size="14" font-weight="800" fill="#0D9488" text-anchor="middle">${label}</text>
    ${foot}
  </svg>`;
}
// نستعمل π ≈ ٣٫١٤ حصراً (لا ٢٢/٧) لأنه التقريب اللي تتعلّمه الطالبة بمدرستها؛
// استعمال تقريب مختلف كان يجعل حسابها الصحيح لا يطابق أي خيار أبداً
const PI_APPROX=3.14;
function round2(x){return Math.round(x*100)/100}
function fadeMakeCircle(){
  const isDiameter=Math.random()<0.5,r=rand(2,20),d=2*r;
  const ans=round2(PI_APPROX*d);
  if(isDiameter){
    const usedAsRadius=round2(PI_APPROX*(d/2)); // مموّه: تعاملت مع القطر كأنه نصف القطر (نسيت ×٢)
    return{kind:"circle",ans,prompt:"ما محيط الدائرة؟",lab:d,
      steps:[`محيط الدائرة = π × القطر`,`باستعمال π ≈ ٣٫١٤: المحيط = ٣٫١٤ × ${toAr(d)} = ${arDec(ans)} سم`],
      ruleTxt:`محيط الدائرة = π × القطر (π ≈ ٣٫١٤)`,
      distractors:[usedAsRadius,round2(ans+d),round2(ans-d)],
      svg:circleSVG(`قطر = ${toAr(d)} سم`,true),
      caption:`الخط الأخضر هو قطر الدائرة (يمرّ بالمركز)`,
      q:`دائرة قطرها ${toAr(d)} سم. ما محيطها؟ (π ≈ ٣٫١٤)`};
  }
  const usedAsIsRadius=round2(PI_APPROX*r); // مموّه: ضربت π في نصف القطر مباشرة بدل القطر (نسيت ×٢)
  return{kind:"circle",ans,prompt:"ما محيط الدائرة؟",lab:d,
    steps:[`في الرسم: الخط الأخضر نصف القطر (${toAr(r)})، والمتقطّع مثله تماماً — ومعاً يصنعان القطر`,`فالقطر = ٢ × ${toAr(r)} = ${toAr(d)} سم`,`ومحيط الدائرة = π × القطر ≈ ٣٫١٤ × ${toAr(d)} = ${arDec(ans)} سم`],
    ruleTxt:`محيط الدائرة = π × القطر = π × (٢ × نصف القطر)`,
    distractors:[usedAsIsRadius,round2(ans+r),round2(ans-r)],
    svg:circleSVG(`نق = ${toAr(r)} سم`,false),
    caption:`الأخضر نصف القطر، والمتقطّع مثله — مجموعهما القطر`,
    q:`دائرة نصف قطرها ${toAr(r)} سم. ما محيطها؟ (π ≈ ٣٫١٤)`};
}
// ===== مختبر الأشكال: الشكل يستجيب ليدها والأرقام تتغيّر معه لحظياً =====
// القاعدة تتحوّل من جملة تُحفظ إلى علاقة تُشاهَد وهي تتغيّر. ولا نُعيد بناء المزلاج نفسه
// عند كل حركة — نُحدّث الرسم والأرقام فقط — وإلا انقطع السحب على الجوال في منتصفه.
const LAB_D_MIN=6,LAB_D_MAX=30;          // مدى القطر داخل المختبر
const LAB_S=290/(PI_APPROX*LAB_D_MAX);   // مقياس ثابت: أكبر محيط يملأ العرض بالضبط
let labKind=null,labD=12,labB=8,labH=6;
// قياس التجريب: كم قيمة مختلفة جرّبت فعلاً، وكم حركة، وأيّ مقبض لمست.
// الثابت لا يُرى إلا عبر تغييرين على الأقل — قيمة واحدة تُري رقماً لا علاقة.
const LAB_MIN_TRIES=3;   // القيمة الأولى + تغييران
let labMoves=0,labSeen=null,labTouchB=false,labTouchH=false;
function labKey(){return labKind==="circle"?String(labD):labB+"×"+labH}
function labArm(kind,a,b){
  labKind=kind;
  if(kind==="circle"){labD=Math.min(LAB_D_MAX,Math.max(LAB_D_MIN,2*Math.round(a/2)))}
  else{labB=Math.min(14,Math.max(2,a));labH=Math.min(12,Math.max(2,b))}
  labMoves=0;labSeen=[labKey()];labTouchB=false;labTouchH=false;
}
function labNote(){const k=labKey();labMoves++;if(labSeen.indexOf(k)<0)labSeen.push(k)}
function labSetD(v){
  const nv=Math.min(LAB_D_MAX,Math.max(LAB_D_MIN,parseInt(v,10)||LAB_D_MIN));
  if(nv!==labD){labD=nv;labNote()}
  labPaint();
}
function labSetB(v){
  const nv=Math.min(14,Math.max(2,parseInt(v,10)||2));
  if(nv!==labB){labB=nv;labTouchB=true;labNote()}
  labPaint();
}
function labSetH(v){
  const nv=Math.min(12,Math.max(2,parseInt(v,10)||2));
  if(nv!==labH){labH=nv;labTouchH=true;labNote()}
  labPaint();
}
// الدائرة: ثلاث قيم مختلفة على الأقل. المثلث: كلا المقبضين، فالعلاقة ذات بُعدين.
function labExplored(){
  if(!labKind||!labSeen)return true;
  return labKind==="circle"?labSeen.length>=LAB_MIN_TRIES:(labTouchB&&labTouchH);
}
// البوّابة على المثال الأول فقط: كسر عادة التخطّي لا عقوبة متكرّرة

  if(g)g.innerHTML=labGateHTML();

// الدائرة: نفرد المحيط شريطاً مقسّماً بأقطار، فيُرى أن المحيط ثلاثة أقطار وزيادة صغيرة مهما تغيّر القطر

  // الشريط موسّط تحت الدائرة تماماً: لو ثُبّت من الحافة انفصل بصرياً عنها كلما صغر القطر

function fadeDedupe(correct,dist){const out=[];for(const d of dist){if(d!==correct&&!out.includes(d))out.push(d)}let p=1;while(out.length<3){[correct+p,correct-p].forEach(x=>{if(out.length<3&&x>0&&x!==correct&&!out.includes(x))out.push(x)});p++}return out.slice(0,3)}
function fadePrep(){
  if(fadeStage===1){fadeCur.opts=null;fadeCur.ai=-1;return}
  if(fadeCur.choiceKind)return; // الخيارات (رسومات أو نصوص) والإجابة الصحيحة جاهزة من المولّد نفسه
  let d;
  if(fadeCur.kind==="ratio"){d=[fadeCur.ans+fadeCur.per,fadeCur.ans-fadeCur.per,fadeCur.ans+fadeStage];}
  else if(fadeCur.kind==="seq"){d=fadeCur.type==="add"?[fadeCur.ans+fadeCur.rule,fadeCur.ans-fadeCur.rule,fadeCur.ans+fadeStage]:[fadeCur.ans-fadeCur.seq[4],fadeCur.seq[4]+fadeCur.rule,fadeCur.ans+fadeCur.rule];}
  else{d=fadeCur.distractors;} // الوسيط/النسبة المئوية/المكعّب/الهرم: مموّهات محسوبة عند الإنشاء
  const opts=shuffle([fadeCur.ans,...fadeDedupe(fadeCur.ans,d)]);fadeCur.opts=opts;fadeCur.ai=opts.indexOf(fadeCur.ans);

// ===== بوّابة التسرّع =====
// عشرة أسئلة في ٢٨ ثانية ليست محاولة. والبوّابة لا تُنصَّب على الجميع: تُسلَّح بعد
// إجابتين متتاليتين تحت ثانيتين، وتنحلّ حين تُبطئ — فمن يتأنّى لا ينتظر شيئاً أبداً.
// ولا تُنصَّب في المنطق والفهم المقروء: قراءتها فيهما بطيئة أصلاً، وسرعتها فيهما

const FADE_RUSH_MS=2000, FADE_RUSH_N=2, FADE_GATE_SEC=6, FADE_GATE_SVG_SEC=8;

function fadeGateStart(){
  fadeGateStop();

  fadeGateOn=true;fadeGateLeft=(fadeCur&&fadeCur.svg)?FADE_GATE_SVG_SEC:FADE_GATE_SEC;
  fadeGateTimer=setInterval(function(){
    fadeGateLeft--;
    if(fadeGateLeft<=0){fadeGateStop();fadeShownAt=Date.now()} // الزمن يبدأ مع الخيارات
    render();

// يقال «سبعة أخطاء من عشرة في النسبة المئوية» ولا يُعرف أي سؤال ولا ماذا اختارت — وهو
// القسم المبنيّ أصلاً لعلاج ضعفها. الآن يُسجَّل السؤال والاختيار كبقيّة الأقسام.
function fadeQText(c){

  if(c.kind==="seq"&&Array.isArray(c.seq))return c.seq.join(" , ")+" , ?";
  const q=String(c.q||c.prompt||"");
  // النصّ المقروء: السؤال وحده لا يكفي لتمييز الفقرة، فنُلحق بدايتها
  if(c.passage)return (String(c.passage).slice(0,120)+" ⟵ "+q).slice(0,300);

function fadeAnsText(c,i){

  if(c.choiceKind==="shape")return "موضع "+toAr(i+1)+" · الصواب موضع "+toAr((c.ai|0)+1);

  const f=function(v){return typeof v==="number"?(Number.isInteger(v)?toAr(v):arDec(v)):String(v).slice(0,60)};
  return f(mine)+" · الصواب "+f(right);

function fadeChoose(i){

  if(fadeStage===4){

    if(!ok){fadeMasteryStreak=0;fadeStage4Support=true;fadeRecoveryStreak=0;fadeMasteryBreak(fadeTopic)}
    else if(fadeStage4Support){fadeRecoveryStreak++;if(fadeRecoveryStreak>=RECOVERY_REQ){fadeStage4Support=false;fadeRecoveryStreak=0}}
    else{fadeMasteryStreak++}
    if(fadeMasteryStreak>fadeBestStreak)fadeBestStreak=fadeMasteryStreak; // أطول سلسلة لا الحالية: الشاشة الختامية تعرضها
    fadeStage4Count++;

  logAnswer("fade_"+fadeTopic,"stage"+fadeStage,ok,fadeAnsText(fadeCur,i),null,elapsed,
    {q_text:fadeQText(fadeCur)});

  if(elapsed!=null&&fadeStage===4){

  if(elapsed!=null){

// سلّم المراجعة بالأيام: أول إتقان ← بعد ٧ أيام، ثم ١٤، ثم ٣٠ (كل مراجعة ناجحة تباعد الموعد أكثر).

// ترحيل لمرة واحدة: قبل وضع السقف كانت المرحلة الرابعة لا تنتهي إلا بخمس متتالية، فسجّل النظام

// فالشهادة غير مستحقة وتُسحب. الأنواع الخمسة الأخرى تحقّقنا من سجلّها: كلٌّ منها ٥/٥ من أول خمسة.
const FADE_AUDIT_KEY="mawhiba_fade_audit_v1";

const FADE_AUDIT2_KEY="mawhiba_fade_audit_v2_logic";
function fadeAuditOnce(){
  try{
    if(!lsGet(FADE_AUDIT_KEY)){
      const st=fadeMasteryLoad();
      if(st.mirror&&st.mirror.q===undefined){delete st.mirror;fadeMasterySave(st)}
      lsSet(FADE_AUDIT_KEY,"1");
    }
    if(!lsGet(FADE_AUDIT2_KEY)){
      const st=fadeMasteryLoad();
      if(st.logic){delete st.logic;fadeMasterySave(st)}
      lsSet(FADE_AUDIT2_KEY,"1");
    }
  }catch(e){}
}
try{fadeAuditOnce()}catch(e){appError('fadeAuditOnce',e)}

function fadeMasteryBreak(topic){
  const st=fadeMasteryLoad();
  if(st[topic]){delete st[topic];fadeMasterySave(st)}
}
// صياغة عربية سليمة للعدد مع "يوم" (تمييز المفرد/المثنى/الجمع)
function arSecs(n){return n===1?"ثانية واحدة":n===2?"ثانيتين":n<=10?`${toAr(n)} ثوانٍ`:`${toAr(n)} ثانية`}
function arDays(n){return n===0?"اليوم":n===1?"يوم واحد":n===2?"يومين":n<=10?`${toAr(n)} أيام`:`${toAr(n)} يوماً`}
function fadeMasteryState(topic){
  const r=fadeMasteryLoad()[topic];
  if(!r)return{mastered:false,due:false};
  return{mastered:true,due:srsToday()>=r.due,level:r.level,daysLeft:Math.max(0,r.due-srsToday())};
}
function fadeStage4Next(){
  if(fadeMasteryStreak>=MASTERY_REQ){fadeNotYet=false;fadeGateStop();fadeMarkMastered(fadeTopic);mode="fadeDone";window.scrollTo(0,0);render();return}

  if(fadeStage4Count>=MASTERY_MAX_Q){fadeNotYet=true;fadeGateStop();mode="fadeDone";window.scrollTo(0,0);render();return}
  fadeNew();
}

// ===== تدريب الأساسيات: عائلات الحقائق (ضرب/قسمة) + الجمع بالحمل + الطرح بالاستلاف (عشرات/مئات) =====
// نهج CRA (محسوس ← مرتبط بالرسم ← مجرّد بقاعدة ← مستقل)، نفس فلسفة وضع التقوية أعلاه
const BASICS_REQ=2;
// ===== النزول: ما كان موجوداً أصلاً =====
// جلسة ١٣ أغسطس: خمس عشرة إجابة في الطرح، صفر صواب، كلّها في المرحلة الثانية — والمرحلة
// لا تهبط أبداً في هذا الوضع (basicsStage++ وحدها كانت موجودة)، والمرحلتان ٢ و٣ بلا دعم.
// فجلست خمس عشرة مرّة على الدرجة نفسها بلا مثالٍ محلول ولا هبوط. والإملاء عنده هذا
// النزول منذ شهر (DICT_BACK) والأساسيات لا — والسلّم الذي يصعد ولا يهبط ليس سلّماً.
const BASICS_BACK=2;   // خطآن متتاليان ⇒ درجة إلى الوراء (والمرحلة ٢ تعود للمثال المحلول)
// ===== التشابك (interleaving) =====
// تدريبنا كان مكتّلاً: جلسةُ طرحٍ كاملة ثم جلسةُ جمعٍ كاملة. والمكتّل يُتقن **التنفيذ**
// ولا يُعلّم **اختيار الطريقة** — تخرج تعرف كيف تطرح ولا تعرف متى تطرح. والمتشابك
// (Rohrer وزملاؤه، ومكرَّرٌ كثيراً) يتفوّق عليه في الاختبار المؤجَّل تفوّقاً كبيراً،
// ويبدو **أسوأ** في أثناء التدريب نفسه — وهذا متوقَّع فلا يُفزِع: الصعوبة هنا مطلوبة.
//
// والتنفيذ بلا وضعٍ جديد: basicsSub نفسه يُبدَّل قبل كل سؤال، فكل ما بُني عليه
// (القاعدة، والرسم، والمثال المحلول، والمموّهات، وبوّابات الشكل) يعمل كما هو.
const BASICS_MIX=["multdiv","addcarry","subborrow"];
let basicsMix=false;
const BASICS_SUBS={
  mixed:{label:"متشابك: الأربع عمليات معاً",short:"المتشابك"},
  multdiv:{label:"عائلات الضرب والقسمة",short:"عائلات الضرب والقسمة"},

// ===== مكتبة الأخطاء المنهجية: الفهرس المنشور بدل استنباطي في كل جلسة =====
// ثلاث آليات «اكتشفتُها» في الطرح يوم ١٣ أغسطس موصوفةٌ ومسمّاة منذ Brown & Burton
// عام ١٩٧٨ (وBUGGY/DEBUGGY وRepair Theory بعدها): فهرسٌ لأكثر من مئة خطأ منهجيّ
// مستخرَجٍ من آلاف الأطفال، لكلٍّ اسمه. فلا نستنبط من جديد في كل مرّة.
//
// والفرق الجوهري عن قياس الفرق وحده: **الخطأ إجراءٌ يُحاكى لا فرقٌ يُطابَق**. فرقُ +١٠

// تُنفّذ الإجراء المكسور، ونقارن ناتجها بجوابها بالضبط.

    {id:"count_all_not_gaps",ar:"عددتِ الأعداد لا الفجوات بينها",f:(a,b)=>a-b+1},
    // قرّبت المطروح منه إلى العشرة ونسيت أن تُعيد الآحاد — عائلة −١، وكلّها ينتهي بـ١

// يُعيد الخطأ المسمّى إن طابق أحد الإجراءات المكسورة جوابَها بالضبط، وإلا فارغاً.
// والترتيب مقصود: الأخصّ أوّلاً، فلا يبتلع «قلب الأرقام» ما هو حملٌ منسيّ.
function bugOf(op,a,b,given){
  const list=MATH_BUGS[op];
  if(!list||!Number.isFinite(given)||!Number.isFinite(a)||!Number.isFinite(b))return null;
  const right=op==="sub"?a-b:op==="add"?a+b:op==="mul"?a*b:(b?a/b:NaN);
  if(given===right)return null;
  for(const bug of list){
    let v=null;try{v=bug.f(a,b)}catch(e){v=null}
    if(v!=null&&Number.isFinite(v)&&v===given&&v!==right)return bug;
  }
  return null;
}

// ===== طابور إعادة محلّي لتسجيلٍ فشل — القياس هنا يُفقَد لا يغيب =====
// logAnswer كانت "أرسِل وانسَ": فشل الشبكة يُهمَل نهائياً بلا أثر. وقد وقع فعلاً:
// جلسة استماع لهيا (٦ من ٨ حقيقية، رأتها على شاشتها) وصل منها سطرٌ واحد فقط —
// سبعة سطور ضاعت بصمتٍ تامّ، بلا أي دليل لاحقاً أن هذا وقع. فالقياس الحقيقي وصل
// إليها هي، وضاع منّا نحن. الحلّ موصولٌ لا مبنيّ من جديد: نفس دالّة logAnswer
// المشتركة بين كل قسم في التطبيق، فإصلاحها هنا يُصلح الأقسام كلّها بتغييرٍ واحد.
const LOG_QUEUE_KEY="mawhiba_log_queue_v1";

function logQueueLoad(){try{const a=JSON.parse(lsGet(LOG_QUEUE_KEY)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function logQueueSave(a){try{lsSet(LOG_QUEUE_KEY,JSON.stringify(a))}catch(e){}}
function logQueuePush(row){
  const q=logQueueLoad();q.push(row);
  if(q.length>LOG_QUEUE_MAX)q.splice(0,q.length-LOG_QUEUE_MAX);   // الأحدث يُبقى لا الأقدم
  logQueueSave(q);

// يُستدعى عند بدء التطبيق، وعند عودة الاتصال، وبعد كل تسجيل ناجح — فرصة اتصال حقيقية
async function logQueueFlush(){
  if(logFlushBusy)return;
  logFlushBusy=true;
  try{
    let q=logQueueLoad();
    while(q.length){
      let r;
      try{r=await logPost(q[0])}catch(e){break}   // الشبكة نفسها معطّلة — نحاول لاحقاً، الطابور يبقى كما هو
      if(!r||!r.ok)break;   // رفضٌ من الخادم (لا الشبكة) — لا نُلحّ الآن، نحاول لاحقاً أيضاً
      q.shift();logQueueSave(q);
    }
  }finally{logFlushBusy=false}
}

async function logSend(full,base){
  const same=JSON.stringify(full)===JSON.stringify(base);   // بلا إضافيّات: محاولة واحدة لا تكرار مطابق
  try{const r=await logPost(full);if(r&&r.ok){logQueueFlush();return}}catch(e){}
  if(!same){
    try{const r2=await logPost(base);if(r2&&r2.ok){logQueueFlush();return}}catch(e){}
  }

}

  }else{

      :basicsSub==="pimul"

    const typed=basicsTypedStage();
    const tOk=typed&&basicsLocked&&Math.abs(parseArNum(basicsTyped)-basicsCur.ansVal)<1e-6;

    const field=typed?`<div style="text-align:center;margin:16px 0">

        style="width:170px;padding:14px;border-radius:12px;border:2px solid ${basicsLocked?(tOk?'#10B981':'#EF4444'):'#E2E8F0'};font-size:26px;text-align:center;font-weight:800"

      ${pctWarn?`<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:#92400E;line-height:1.8;text-align:start">⚖️ ${pctWarn}</div>`:""}

    </div>`:"";
    const okNow=typed?tOk:basicsPicked===basicsCur.ai;
    // تسمية الخطأ بعينه: «ضربتِ ٥٠ × ١٠٠٠ ونسيتِ ÷١٠٠» تُصلح ما لا تُصلحه إعادة القاعدة نفسها
    const diag=(!okNow&&basicsLocked&&basicsSub==="percent")
      ?percentDiagnose(f.a,f.b,f.c,typed?basicsTyped:(basicsCur.opts?basicsCur.opts[basicsPicked]:null)):"";
    const diagBox=diag?`<div style="background:#FEF2F2;border-inline-start:4px solid #EF4444;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.8;color:#991B1B"><b>أين اختلّت:</b> ${diag}</div>`:"";
    const divGate=basicsDivGated()||quotGated();
    // المرحلة ≥٤ تُعرض المصفوفة على كل خطأ قسمة (كما كانت)؛ وquotGated تُضيف المرحلتين
    // ٢ و٣ حين يتكرّر خطأ quot_off_one — نفس الأداة، تُستدعى في مكانٍ لم تكن تصله.
    const divBox=(basicsSub==="multdiv"&&basicsLocked&&basicsCur.op==="div"&&!okNow&&(basicsStage>=4||quotGated()))
      ?`<div style="background:#FEF2F2;border-inline-start:4px solid #EF4444;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.8;color:#991B1B">
          <b>لنراها بدل أن نحفظها:</b> كوّني الصفوف حتى تنتهي النقاط — العدد الذي تصلين إليه هو الجواب.
         </div>${divArrayHTML()}<div style="height:12px"></div>`:"";
    // بوّابتا شكل الخطأ: تُرسَمان مكان زرّ الانتقال، فلا يمرّ الخطأ المنهجيّ بلا علاج
    const shapeBox=ob1On?ob1BoxHTML():(btOn?btBoxHTML():"");
    const shapeGate=basicsOb1Gated()||basicsBtGated();
    const gateNote=divGate?"أكملي المصفوفة أعلاه للانتقال"
      :basicsOb1Gated()?"اقفزي على خطّ الأعداد أعلاه للانتقال"
      :basicsBtGated()?"استلفي العشرة أعلاه للانتقال":"";
    const why=basicsLocked?`${diagBox}${divBox}${shapeBox}<div class="why" style="margin-bottom:10px">${okNow?"✓ "+(basicsStage===5?"حللتِها وحدك! 🌟":"أحسنتِ"):(typed?"لا بأس — راجعي الطريقة ثم أعيدي":"الصحيحة بالأخضر")}.</div>${(divGate||shapeGate)?`<div style="text-align:center;font-size:13px;color:#B45309;font-weight:800;margin-top:8px">${gateNote}</div>`:`<button class="btn" style="background:${basicsStage===5?'#059669':'#0D9488'}" onclick="${basicsStage===5?'basicsFinalNext()':'basicsAdvance()'}">${basicsDropPending?'راجعي المثال ←':(basicsStage===5?'سؤال جديد ←':'التالي ←')}</button>`}`:"";
    const mtr=basicsStage<4?`<div style="font-size:13px;color:#64748B;text-align:center;margin-top:10px">جاوبي صح مرتين متتاليتين للانتقال (${toAr(basicsStreak)}/${toAr(BASICS_REQ)})</div>`
      :basicsStage===4?(basicsMidSupport?`<div style="font-size:13px;color:#854D0E;text-align:center;margin-top:10px">🌱 مراجعة: (${toAr(basicsMidRecoveryStreak)}/${toAr(RECOVERY_REQ)}) لإخفاء التذكير</div>`:`<div style="font-size:13px;color:#64748B;text-align:center;margin-top:10px">تدريب شبه مستقل — جاوبي صح مرتين متتاليتين للوصول للاستقلال الكامل (${toAr(basicsStreak)}/${toAr(BASICS_REQ)})</div>`)
      :basicsFinalSupport?`<div style="font-size:13px;color:#854D0E;text-align:center;margin-top:10px">🌱 مراجعة: (${toAr(basicsFinalRecoveryStreak)}/${toAr(RECOVERY_REQ)}) لإخفاء التذكير مرة أخرى</div>`
      :`<div style="font-size:13px;color:#64748B;text-align:center;margin-top:10px">🎓 حل مستقل — (${toAr(basicsMasteryStreak)}/${toAr(MASTERY_REQ)}) متتالية لإتقان هذا النوع</div>`;
    // الخيارات/الحقل لا تُرسَم إطلاقاً قبل تحديد النطاق — كبوّابة مصفوفة القسمة تماماً
    const pctBox=pctGateOn()?pctBandBoxHTML():(piGateOn()?piBandBoxHTML():"");
    const ansArea=(pctGated()||piGated())?"":(typed?field:`<div class="choices">${ch}</div>`);
    body=`${hint}${visualBox}<div class="q" style="text-align:center">${basicsCur.qText}</div>${pctBox}${ansArea}${why}${mtr}`;
  }
  const subLabel=(basicsMix?"🔀 متشابك · ":"")+BASICS_SUBS[basicsSub].label;
  const switchBtns=Object.keys(BASICS_SUBS)
    .filter(k=>basicsMix?k!=="mixed":k!==basicsSub)
    .map(k=>`<button class="link-btn" onclick="startBasics('${k}')">🔁 بدّلي إلى ${BASICS_SUBS[k].short}</button>`).join("");
  app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div style="display:flex;gap:6px;margin-bottom:12px">${bar}</div>

  <div class="card"><span class="tag" style="background:#CCFBF1;color:#0D9488">تدريب الأساسيات · ${subLabel} · ${info.tag}</span>${termsChipsHtml(BASICS_TERMS[basicsSub])}${body}</div>

// ===== نطق إنجليزي بصوت أمريكي عبر خاصية المتصفح المدمجة (بلا أي خدمة خارجية) =====
// onDone (اختياري): يبلغ بنتيجة فعلية {ok,voicesCount,hasEnVoice,voiceName} أو {ok:false,reason,errorType} — يُستخدم في تشخيص الصوت
// فتح قفل الصوت: iOS (وبعض متصفحات أندرويد) لا تسمح بالنطق إطلاقاً حتى يحدث أول نطق داخل لمسة حقيقية.
// ننطق نصاً صامتاً عند أول لمسة في الصفحة حتى يصير محرّك الصوت مفتوحاً لما تضغط أي زر 🔊 بعدها.
let _ttsUnlocked=false;
function unlockTTS(){
  if(_ttsUnlocked||!('speechSynthesis' in window))return;
  _ttsUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;window.speechSynthesis.speak(u)}catch(e){}
}
document.addEventListener("touchend",unlockTTS,{capture:true,once:true});
document.addEventListener("click",unlockTTS,{capture:true,once:true});
// أصوات المتصفح المدمجة تتفاوت: القديمة المحلّية (localService:true) آلية الوقع،
// والسحابية (localService:false) وما يحمل اسماً كـNatural/Neural/Enhanced/Premium/Online
// أقرب لصوتٍ بشري — بلا خدمة خارجية ولا اشتراك، الاختيار وحده يتغيّر من نفس القائمة المتاحة.
function pickEnglishVoice(voices){
  // بعض محرّكات النطق (أندرويد خاصةً) تُسمّي اللهجة بشرطة سفلية en_US لا شرطة en-US —
  // فالمطابقة الحرفية en-US كانت تفشل بصمت على تلك الأجهزة، فيقع الاختيار على أوّل صوتٍ
  // في القائمة (أستراليا مثلاً) لا الأمريكي المقصود. توحيدُ الفاصل يُصلحها للجهازين معاً.
  const norm=l=>String(l||'').toLowerCase().replace(/_/g,'-');
  const en=voices.filter(v=>norm(v.lang).startsWith('en'));
  if(!en.length)return null;
  const us=en.filter(v=>norm(v.lang)==='en-us');
  const pool=us.length?us:en;
  return pool.slice().sort((a,b)=>{
    const score=v=>(v.localService===false?2:0)+(/natural|neural|enhanced|premium|online/i.test(v.name)?2:0);
    return score(b)-score(a);
  })[0];
}
function speakEnglish(text,onDone){
  try{
    if(!text||!('speechSynthesis' in window)){ttsMark(false);if(onDone)onDone({ok:false,reason:'unsupported'});return}
    const synth=window.speechSynthesis;
    let triedFallback=false,started=false,retried=false;
    const attempt=(forceNoLang)=>{
      // إلغاء ما قبله فقط عند وجود نطق جارٍ فعلاً — استدعاء cancel() دائماً قبل speak() يبتلع النطق الجديد على iOS
      try{if(synth.speaking||synth.pending)synth.cancel()}catch(e){}
      const u=new SpeechSynthesisUtterance(text);
      const voices=synth.getVoices();
      const usVoice=pickEnglishVoice(voices);
      if(!forceNoLang){u.lang='en-US';u.rate=0.85;try{if(usVoice)u.voice=usVoice}catch(e){}}
      else{u.rate=0.85} // لا نفرض لغة/صوتاً غير متوفرين على الجهاز، نترك المتصفح يختار افتراضياً
      u.onstart=()=>{started=true;ttsMark(true);if(onDone)onDone({ok:true,voicesCount:voices.length,hasEnVoice:!!usVoice,voiceName:usVoice&&usVoice.name,fallback:!!forceNoLang})};
      u.onerror=(e)=>{
        if(!forceNoLang&&!triedFallback){triedFallback=true;attempt(true);return}
        ttsMark(false);if(onDone)onDone({ok:false,reason:'speak_error',errorType:e&&e.error,voicesCount:voices.length,hasEnVoice:!!usVoice});
      };
      synth.resume();
      synth.speak(u);
    };
    // ننطق فوراً وبشكل متزامن داخل لمسة المستخدم. التأجيل لانتظار قائمة الأصوات (voiceschanged/setTimeout)
    // يُخرج الاستدعاء من سياق اللمسة، فتتجاهله المتصفحات بصمت — وهذا سبب عدم خروج أي صوت على الجهاز.
    const voicesReady=synth.getVoices().length>0;
    attempt(false);
    // لو كانت قائمة الأصوات فارغة وقت اللمس ولم يبدأ النطق، نعيد المحاولة مرة واحدة بعد وصولها
    if(!voicesReady){
      setTimeout(()=>{if(!started&&!retried){retried=true;attempt(false)}},700);
    }
  }catch(e){ttsMark(false);if(onDone)onDone({ok:false,reason:'exception',message:String(e&&e.message||e)})}
}
// ===== راية عطل النطق =====
// حين يفشل تحويل النص إلى صوت على الجهاز، كانت أقسام الاستماع تصمت بلا تفسير.
// الآن تُرفع راية تُغيّر الشاشة نفسها: تُعرض الكلمة مكتوبة، ويُشرح السبب وعلاجه.
let ttsBroken=false,ttsChecked=false;
function ttsMark(ok){
  const was=ttsBroken;ttsBroken=!ok;ttsChecked=true;
  if(was!==ttsBroken&&(mode==="pron"||mode==="dictation"||mode==="speak"||mode==="engplan"))render();
}
function ttsNoticeHTML(){
  if(!ttsBroken)return "";
  return `<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#92400E;line-height:1.8;text-align:start">
    🔇 <b>الصوت لا يعمل على هذا الجهاز</b> — اقرئي الكلمة المكتوبة وانطقيها.
    <button class="link-btn" style="font-size:12px;margin:6px 0 0;padding:0" onclick="startAudioDiag()">لماذا؟ وكيف أُصلحه ←</button>
  </div>`;
}
// ===== تشخيص الصوت: أداة تساعد لو النطق ما يشتغل على جهاز معيّن =====
let audioDiagResult=null;
function startAudioDiag(){mode="audiodiag";audioDiagResult=null;micDiagResult=null;azDiag=null;window.scrollTo(0,0);render()}
// ===== تشخيص الميكروفون =====
// الضغطة التي "لا تفعل شيئاً" لها أسباب مختلفة تماماً وعلاجات مختلفة: إذن مرفوض سابقاً،
// أو صفحة داخل متصفح مدمج، أو مصدر غير آمن. المتصفح يعرف السبب ويُسمّيه — كنّا نبتلع الاسم.
let micDiagResult=null;
const MIC_ERR_HELP={
  no_api:{t:"واجهة الميكروفون غير موجودة أصلاً",f:"هذا يحدث حين تكون الصفحة داخل متصفح مدمج في تطبيق آخر (واتساب/تويتر)، أو على http بدل https. انسخي الرابط وافتحيه في Safari أو Chrome مباشرةً."},
  insecure:{t:"الصفحة ليست على اتصال آمن",f:"الميكروفون يعمل على https فقط. افتحي الرابط بصيغة https://"},
  iframe:{t:"الصفحة معروضة داخل إطار",f:"افتحي الرابط في تبويب مستقل لا داخل صفحة أخرى."},
  NotAllowedError:{t:"الإذن مرفوض",f:"في Safari: اضغطي ﺃﺍ في شريط العنوان ← إعدادات الموقع ← الميكروفون ← السماح. ثم الإعدادات ← Safari ← الميكروفون ← اسأل/السماح. وفي Chrome: أيقونة القفل ← أذونات."},
  SecurityError:{t:"الإذن محجوب لأسباب أمنية",f:"غالباً المصدر غير آمن أو داخل إطار. افتحي الرابط مباشرةً بصيغة https://"},
  NotFoundError:{t:"لا يوجد ميكروفون",f:"الجهاز لا يعرض ميكروفوناً للمتصفح. أعيدي تشغيل المتصفح، أو جرّبي جهازاً آخر."},
  NotReadableError:{t:"الميكروفون مشغول",f:"تطبيق آخر يستعمل الميكروفون (مكالمة أو تسجيل). أغلقيه ثم أعيدي المحاولة."},
  AbortError:{t:"انقطعت المحاولة",f:"أعيدي المحاولة مرة أخرى."},
  no_recorder:{t:"المتصفح لا يدعم تسجيل الصوت",f:"الإذن يعمل لكن MediaRecorder غير متاح. حدّثي المتصفح أو نظام الجهاز."}
};
async function runMicDiag(){
  micDiagResult={running:true};render();
  const o={proto:location.protocol,secure:!!window.isSecureContext,
    inFrame:(function(){try{return window.top!==window.self}catch(e){return true}})(),
    hasMD:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),
    hasMR:typeof window.MediaRecorder!=="undefined"};

function runAudioDiag(){

}
function renderAudioDiag(){
  const supported='speechSynthesis' in window;
  const voices=supported?window.speechSynthesis.getVoices():[];
  const enVoices=voices.filter(v=>v.lang&&v.lang.startsWith('en'));
  const picked=supported?pickEnglishVoice(voices):null;
  // هذا ما يُجيب فعلاً «كيف نتأكد من الصوت السحابي؟»: فتح هذه الصفحة على جهاز
  // الولد نفسه يُظهر كل صوتٍ متاح عليه بعينه — سحابي أو محلّي — وأيّها سيختاره التطبيق.
  const voiceRows=enVoices.length?enVoices.map(v=>{
    const cloud=v.localService===false;
    const natural=/natural|neural|enhanced|premium|online/i.test(v.name);
    const isPicked=picked&&v.name===picked.name&&v.lang===picked.lang;
    return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;border-bottom:1px solid #F1F5F9${isPicked?';font-weight:800':''}">
      <span>${v.name} <span style="color:#94A3B8">(${v.lang})</span>${isPicked?' ← المختار':''}</span>
      <span style="color:${cloud?'#059669':'#94A3B8'};white-space:nowrap">${cloud?'☁️ سحابي':'📴 محلّي'}${natural?' · اسمه طبيعي':''}</span>
    </div>`}).join(""):"";
  const pickedBox=picked
    ?`<div style="background:${picked.localService===false?'#ECFDF5':'#FFFBEB'};border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:${picked.localService===false?'#065F46':'#92400E'}">
        الصوت الذي سيختاره التطبيق تلقائياً على <b>هذا الجهاز بالذات</b>: <b>${picked.name}</b><br>
        ${picked.localService===false?'☁️ صوتٌ سحابي — أقرب لصوت بشري.':'📴 لا يوجد صوتٌ سحابي/طبيعي متاح على هذا الجهاز، فيُستخدم أفضل صوتٍ محلّي متوفّر.'}
      </div>`
    :(supported?`<div style="background:#FEF2F2;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#991B1B">لا صوت إنجليزي على هذا الجهاز إطلاقاً</div>`:"");
  let resultBox="";
  if(audioDiagResult){
    if(audioDiagResult.status)resultBox=`<div style="background:#F1F5F9;border-radius:12px;padding:14px;margin-top:14px;font-size:14px">${audioDiagResult.status}</div>`;
    else if(audioDiagResult.ok)resultBox=`<div style="background:#ECFDF5;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#065F46">✓ المتصفح نفّذ أمر النطق فعلاً${audioDiagResult.fallback?" (بصوت افتراضي، لأن الصوت الإنجليزي المحدد ما اشتغل)":""}. الصوت المستخدم: ${audioDiagResult.voiceName||"افتراضي الجهاز"}.<br>لو ما سمعتِ شيئاً رغم هذا، فالمشكلة في صوت الجهاز نفسه (كتم/مستوى الصوت) وليست في الموقع.</div>`;
    else resultBox=`<div style="background:#FEF2F2;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#991B1B">✗ فشل النطق فعلياً: ${audioDiagResult.reason}${audioDiagResult.errorType?" ("+audioDiagResult.errorType+")":""}.<br>هذا يعني الجهاز/المتصفح لا يقدر يشغّل تحويل النص لصوت حالياً.</div>`;
  }
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="card">
    <div style="font-weight:800;font-size:17px;margin-bottom:14px">🔊 تشخيص الصوت</div>
    <div style="font-size:14px;color:#475569;line-height:1.9;margin-bottom:14px">
      يدعم المتصفح تحويل النص لصوت: <b>${supported?"نعم":"لا"}</b><br>
      عدد الأصوات المتوفرة على الجهاز: <b>${toAr(voices.length)}</b><br>
      عدد الأصوات الإنجليزية: <b>${toAr(enVoices.length)}</b>
    </div>
    ${voiceRows?`<div style="margin-bottom:6px">${voiceRows}</div>`:""}
    ${pickedBox}
    <button class="btn" style="background:#0891B2;margin-top:14px" onclick="runAudioDiag()">🔊 جربي النطق الآن</button>
    ${resultBox}
    ${micDiagHTML()}
    <div style="font-size:13px;color:#94A3B8;margin-top:18px;line-height:1.8">لو ظهر "فشل النطق فعلياً"، أو ظهر "نجح" لكن ما سمعتِ صوتاً: تأكدي إن صوت الجهاز غير مكتوم وبمستوى عالٍ كافٍ، وافتحي إعدادات الهاتف ← إعدادات إضافية/تحويل النص إلى كلام ← تأكدي إن حزمة الصوت الإنجليزي منزّلة (قد تحتاجين تنزيلها لأول مرة)، ثم أعيدي المحاولة.</div>
  </div>`;
}

// ===== محرّك التباعد المتمدّد =====
const SRS_KEY="mawhiba_eng_srs";
const SRS_INTERVALS=[1,2,4,8,16,32]; // أيام
// تقديرات زمنية واقعية لطالبة سادس (قراءة السؤال بالعربي + الخيارات بالإنجليزي)
const ENG_SECS={lesson:90,vocab:25,grammar:35,reading:110,dict:35,build:45};
const PLAN_SECS=34*60;  // ٣٤ دقيقة تدريب مُصحَّح + ٦ دقائق نطق = ٤٠ دقيقة
const NEW_CAP=25;       // حد العناصر الجديدة يومياً (قريب من المعتمد في أنظمة التباعد) لكبح الحمل المعرفي
function srsLoad(){try{return JSON.parse(lsGet(SRS_KEY)||"{}")}catch(e){return{}}}
function srsSave(o){try{lsSet(SRS_KEY,JSON.stringify(o))}catch(e){}}
function srsToday(){return Math.floor(Date.now()/86400000)}
// ===== FSRS-6: جدولة مبنيّة على نموذج ذاكرة، لا على سلّم ثابت =====
// السلّم الثابت (١،٢،٤،٨…) يُعامل كل عنصر بالمثل: كلمة سهلة أتقنتها من أول مرّة تعود
// بعد يوم كالتي تعثّرت فيها ثلاثاً. وFSRS خوارزمية مفتوحة (MIT) مُدرَّبة على مليارات
// المراجعات الحقيقية: لكل عنصر ثباتٌ (stability) وصعوبةٌ (difficulty)، والموعد يُحسب
// ليقع عند احتمال تذكّر ٩٠٪. النسخة هنا FSRS-6 بأوزانها المرجعية، وقد قُوبلت مخرجاتها
// بمخرجات المكتبة الرسمية ts-fsrs في الاختبار (tests/test_fsrs.js).
const FSRS_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,
  0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_RETENTION=0.9, FSRS_MAX_IVL=180, FSRS_S_MIN=0.001;
function fsrsDecay(){return -FSRS_W[20]}
function fsrsFactor(){return Math.exp(Math.log(0.9)/fsrsDecay())-1}
function fsrsR(t,s){return Math.pow(1+fsrsFactor()*t/s,fsrsDecay())}
function fsrsIvl(s){
  const m=(Math.pow(FSRS_RETENTION,1/fsrsDecay())-1)/fsrsFactor();
  return Math.min(Math.max(1,Math.round(s*m)),FSRS_MAX_IVL);
}
function fsrsInitS(g){return Math.max(FSRS_W[g-1],0.1)}
// بلا حصر عمداً: المرجع يستعمل القيمة الخام داخل الارتداد إلى المتوسّط (mean reversion)،
// والحصر يقع على النتيجة النهائية لا على المدخل — وحصرُه هنا كان يُزيح كل الحسابات.
function fsrsInitD(g){return FSRS_W[4]-Math.exp((g-1)*FSRS_W[5])+1}
function fsrsClampD(d){return Math.min(Math.max(d,1),10)}
function fsrsNextD(d,g){
  const dd=-FSRS_W[6]*(g-3), next=d+dd*(10-d)/9;
  const rev=FSRS_W[7]*fsrsInitD(4)+(1-FSRS_W[7])*next;
  return Math.min(Math.max(rev,1),10);
}
function fsrsRecallS(d,s,r,g){
  const hard=(g===2)?FSRS_W[15]:1, easy=(g===4)?FSRS_W[16]:1;
  const v=s*(1+Math.exp(FSRS_W[8])*(11-d)*Math.pow(s,-FSRS_W[9])*(Math.exp((1-r)*FSRS_W[10])-1)*hard*easy);
  return Math.min(Math.max(v,FSRS_S_MIN),36500);
}
function fsrsForgetS(d,s,r){
  const v=FSRS_W[11]*Math.pow(d,-FSRS_W[12])*(Math.pow(s+1,FSRS_W[13])-1)*Math.exp((1-r)*FSRS_W[14]);
  return Math.min(Math.max(v,FSRS_S_MIN),36500);
}
// درجة واحدة من اثنتين: أصابت (good=3) أو أخطأت (again=1). لا نسأل «هل كان سهلاً؟»
// — سؤالٌ لا تُحسن طفلةٌ تقديره، وإجابته تُفسد الجدولة أكثر مما تُصلح.
function fsrsUpdate(rec,ok,today){
  const g=ok?3:1;
  if(!rec||!rec.s){ // أول مرّة
    const s=fsrsInitS(g),d=fsrsClampD(fsrsInitD(g));
    return{s:s,d:d,due:today+fsrsIvl(s),last:today,seen:((rec&&rec.seen)||0)+1,box:ok?1:0};
  }
  const t=Math.max(0,today-(rec.last||today));
  const r=fsrsR(t,rec.s);
  const d=fsrsNextD(rec.d||5,g);
  const s=ok?fsrsRecallS(d,rec.s,r,g):fsrsForgetS(d,rec.s,r);
  return{s:s,d:d,due:today+fsrsIvl(s),last:today,seen:(rec.seen||0)+1,
    box:ok?Math.min((rec.box||0)+1,SRS_INTERVALS.length-1):0}; // box يبقى للعرض والتحليل
}
function srsUpdate(id,ok){
  const st=srsLoad(),r=st[id]||{box:0,seen:0};
  st[id]=fsrsUpdate(r,ok,srsToday());
  srsSave(st);
}
function lessonSeen(id){try{return (JSON.parse(lsGet("mawhiba_eng_lessons")||"[]")).includes(id)}catch(e){return false}}
function lessonMark(id){try{const a=JSON.parse(lsGet("mawhiba_eng_lessons")||"[]");if(!a.includes(id)){a.push(id);lsSet("mawhiba_eng_lessons",JSON.stringify(a))}}catch(e){}}
// ===== إعادة تدريس القاعدة عند تكرار الفشل فيها =====
// كان الشرح يُعرض مرة واحدة في العمر، ثم يُوسم "شوهد" إلى الأبد ويكتفي النظام بإعادة الاختبار
// عبر التباعد. لكن التباعد أداة استرجاع لما تعلّمته لا أداة تعليم: فأخذت ٢/١٤ في القواعد،
// وتسعة من أصل أربعة عشر عنصراً كانت في الصندوق صفر — أي أخطأت فيها من قبل وأُعيدت بلا شرح.
// الآن نتابع دقة كل قاعدة، فإن هبطت أُلغي وسم "شوهد" وعاد الشرح قبل أسئلتها.
const LESSON_PERF_KEY="mawhiba_eng_lesson_perf";
const LESSON_WINDOW=6, LESSON_MIN=3, LESSON_WEAK_PCT=40, RETEACH_CAP=4, RETEACH_ITEMS=3;
function lessonPerfLoad(){try{return JSON.parse(lsGet(LESSON_PERF_KEY)||"{}")}catch(e){return{}}}
function lessonPerfSave(o){try{lsSet(LESSON_PERF_KEY,JSON.stringify(o))}catch(e){}}
function lessonRecord(lessonId,ok){
  if(!lessonId)return;
  const p=lessonPerfLoad(),r=p[lessonId]||{recent:[]};
  r.recent=(r.recent||[]).concat(ok?1:0).slice(-LESSON_WINDOW);
  p[lessonId]=r;lessonPerfSave(p);
}
function lessonWeak(id){
  const r=lessonPerfLoad()[id];
  if(!r)return false;
  // القواعد المبذورة موسومة صراحةً لا بعدد محاولات ملفَّق: الدليل عليها من سجلّ الخادم
  // (٩ من ١٤ عنصراً كانت في الصندوق صفر، أي فشل متكرّر سابق) لا من محاولتين فقط
  if(r.forceWeak)return true;
  if(!r.recent||r.recent.length<LESSON_MIN)return false;
  const pct=100*r.recent.reduce((a,b)=>a+b,0)/r.recent.length;
  return pct<=LESSON_WEAK_PCT;
}
// بعد إعادة التدريس نبدأ نافذة جديدة، وإلا عاد الشرح كل يوم على تاريخ قديم لا على أدائها بعده
function lessonResetWindow(id){const p=lessonPerfLoad();if(p[id]){p[id].recent=[];delete p[id].forceWeak;p[id].retaught=srsToday();lessonPerfSave(p)}}
function lessonNeeded(id){return !lessonSeen(id)||lessonWeak(id)}
// بذرة من بيانات حقيقية: جلسة ٥ أغسطس أعطت ٢/١٤ في القواعد موزّعة على سبع قواعد. بلا هذه البذرة
// لن يبدأ التتبّع إلا من الصفر، فتنتظر ثلاث محاولات فاشلة جديدة في كل قاعدة قبل أن يعود الشرح —
// وهي أخطأت فيها فعلاً أمامنا. نبذر ما حدث لا ما نظنّه: صحيح/خطأ كما سُجّل بالضبط.
const LESSON_SEED_KEY="mawhiba_eng_lesson_seed_v1";
const LESSON_SEED={l_cond:[0,0],l_few:[0,0],l_rel:[0,0],l_pastprog:[0,0],l_pp_q:[1,0,0],l_pp_vs:[0],l_passive:[0]};
function lessonSeedOnce(){
  try{
    if(profileId()!=="haya")return; // البذرة من سجلّ هيا وحدها
    if(lsGet(LESSON_SEED_KEY))return;
    const p=lessonPerfLoad();
    Object.keys(LESSON_SEED).forEach(k=>{if(!p[k])p[k]={recent:LESSON_SEED[k].slice(),forceWeak:true}});
    lessonPerfSave(p);lsSet(LESSON_SEED_KEY,"1");
  }catch(e){}
}
try{lessonSeedOnce()}catch(e){appError('lessonSeedOnce',e)}
// يبني خطة اليوم: المستحق أولاً (الأهم علمياً)، ثم جديد بحد أقصى، مع بطاقة شرح قبل أول تدريب على أي قاعدة
// المخزون = عناصر المنهج (تشمل عناصر إملاء حقيقية أصلاً)، بمعرّفات ثابتة.
// كل مستوًى يبدأ قواعد مستواه ودرجةً واحدة أعلى (i+1، Krashen) لا الكتاب كلّه دفعة واحدة —
// طلب صاحب المشروع (١٩ أغسطس) بعد أن ظهر المبني للمجهول والكلام المنقول (B1) لهيا (A1) في
// «أخطائي» و«خطتي»، رغم أن كل بنكٍ آخر بُني لاحقاً (الاستماع/المقروء/دقّة القواعد) مُقيَّدٌ
// بمستواها فعلاً. وهذا البنك تحديداً منسوخٌ من كتاب الصف السادس بترتيب وحداته لا بترتيب
// CEFR — المبني للمجهول في الوحدة الأولى! فموضع الدرس في الكتاب لا يدلّ على صعوبته إطلاقاً،
// والتصنيف هنا بمعيار English Profile نفسه المُعتمَد أصلاً في GRAM_BANK، وبنفس تبويبها حيث
// يشترك الدرسان (المبني للمجهول B1 في الاثنين معاً) — لا معياراً ثانياً يتعارض مع الأوّل.
//
// والقيد على "الجديد" (fresh) وحده لا على المخزون كلّه عمداً: عناصر ITEM_SEED (u1_g1،
// u1_g2...) بذرة قياسٍ حقيقي وقع فعلاً — أخطأتها ثلاثاً كما سُجّل — وبوّابة السؤال العالق
// (itemStuck/fixNeeded) مبنيّةٌ عليها خصّيصاً لتُعلّمها ما تعثّرت فيه فعلاً، لا لتمنعه. إخفاء
// هذه العناصر كان سيُعطّل علاجاً قائماً يعمل لأجل مشكلةٍ بعينها اسمها. القيد هنا يمنع فقط
// أن يُضاف إلى خطتها من الغد عنصرٌ جديدٌ لم تَرَه قط فوق مستواها بدرجتين — لا يمحو ماضياً.
const ENG_LV_RANK={A1:0,A2:1,B1:2};
const ENG_LESSON_LV={
  l_where:"A2",l_cond:"B1",l_few:"A2",l_pp_q:"B1",l_pp_vs:"B1",l_pastprog:"A2",
  l_rel:"B1",l_compadv:"A2",l_asas:"A2",l_future:"A2",l_maymight:"A2",
  l_reported:"B1",l_repq:"B1",l_pp_adv:"B1",l_modals:"A2",
};
// المفردات والبناء بلا تصنيف نحوي فلا تُقاس بهذا المعيار — القاعدة هي ما يحمل مستوًى حقيقياً
function engLevelOk(item,studentLv){
  if(item.t!=="grammar"||!item.lesson)return true;
  const lessonLv=ENG_LESSON_LV[item.lesson];if(!lessonLv)return true;
  return ENG_LV_RANK[lessonLv]<=ENG_LV_RANK[studentLv||"A1"]+1;
}
let _engPool=null;
function engPool(){
  if(_engPool)return _engPool;
  _engPool=[...ENG_ITEMS]; // ENG_ITEMS يضمّ عناصر dict الحقيقية أصلاً؛ DICTATION_A1 صار نفس الكلمات بالضبط (مصدر واحد) فلا داعي لدمجها مرتين
  // جمل البناء تدخل المخزون بمعرّفاتها، فتجدولها FSRS كسائر العناصر: التأليف مهارة
  // تُنسى كغيرها، وإخراجها من التباعد يعني تدريباً بلا استرجاع
  engBuildFor(profileOf().level).forEach(function(x){

function cxInterleave(list){

  const other=list.filter(function(x){return x.side!=="a"&&x.side!=="b"});

function editDist(a,b,cap){
  a=String(a||"");b=String(b||"");
  if(Math.abs(a.length-b.length)>cap)return cap+1;
  let prev=[],cur=[];
  for(let j=0;j<=b.length;j++)prev[j]=j;
  for(let i=1;i<=a.length;i++){
    cur[0]=i;let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      if(cur[j]<best)best=cur[j];
    }
    if(best>cap)return cap+1;
    prev=cur.slice();
  }
  return prev[b.length];
}
const SNAP_NORM=function(t){return String(t||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()};
const SNAP_MAX=3;        // ثلاثة أحرف: dust ⇐ toast حرفان، وجملتان مختلفتان أبعد بكثير
const SNAP_MIN_LEN=8;    // الجمل القصيرة جداً تتشابه بلا معنى («Yes.» و«No.»)
function snapToSuggestion(heard,says){
  const h=SNAP_NORM(heard);
  if(h.length<SNAP_MIN_LEN)return null;
  let best=null,bestD=SNAP_MAX+1;
  (says||[]).forEach(function(s){
    const n=SNAP_NORM(s);
    if(n.length<SNAP_MIN_LEN)return;
    // النسبة تُقيَّد كذلك: ثلاثة أحرف في جملة من ثمانية ليست خطأ سمع بل جملة أخرى
    const cap=Math.min(SNAP_MAX,Math.max(1,Math.round(n.length*0.25)));
    const d=editDist(h,n,cap);
    if(d<=cap&&d<bestD){bestD=d;best=s}
  });
  return (best&&best!==heard)?best:null;  // المطابق حرفياً لا يحتاج تثبيتاً
}

function coachParse(txt){
  let body=String(txt||""),tip="",says=[];
  const mS=/\n\s*SAY\s*:\s*([^\n]+)/i.exec(body);
  if(mS){says=mS[1].split("|").map(function(x){return x.trim()}).filter(Boolean).slice(0,3);
    body=body.replace(mS[0],"")}
  const mT=/\n\s*TIP\s*:\s*([^\n]+)/i.exec(body);
  if(mT){tip=mT[1].trim();body=body.replace(mT[0],"")}
  return {text:body.trim(),tip:tip,says:says};
}
function coachAskHelp(){
  if(coachHelpShown&&coachHelp==="suggest")return;
  coachHelpShown=true;coachHelp="suggest";  // وتبقى السهولة إلى آخر الجلسة
  logAnswer("coach","help",null,"asked",coachScene?coachScene.id:null,null,
    {lesson:coachScene?coachScene.id:null});
  render();
}
function coachFreeScene(topic){
  return {id:"free",ar:"موضوع من عندك ✍️",free:true,topic:topic,
    en:`You and the student are chatting about a topic the student chose: "${topic}". `+
       `Talk about it like two friends. If the topic is not suitable for an 11-year-old, `+
       `gently move to a safe, related topic instead.`,
    focus:"Model KEEPING A CONVERSATION GOING. Give your own short opinion with a reason, "+
       "then ask about the student's: 'What do you like about it?', 'Why?', 'Tell me more about...'.",
    opener:COACH_FREE_OPENER};
}
const COACH_MAX_TURNS=8; // جلسة قصيرة تنتهي بخلاصة، لا محادثة بلا نهاية
const COACH_TIP_EVERY=3; // نصيحة أسلوب كل ثالثة جملة
const COACH_OPEN_EVERY=3; // وسؤال مفتوح كل ثالث دور، فلا يصير الدعم عكازاً
let coachScene=null,coachMsgs=[],coachBusy=false,coachListening=false,coachElapsed=0,

// الموضوع الحرّ: يُقصّ ويُنظّف قبل أن يُرسَل — سطرٌ واحد بحدّ معلوم، لا نصّ مفتوح
function coachTopicClean(v){return String(v||"").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim().slice(0,COACH_TOPIC_MAX)}
async function coachTopicGo(){
  if(coachBusy)return;
  const el=document.getElementById("coachTopicIn");
  const topic=coachTopicClean(el?el.value:coachTopic);
  if(topic.length<2){coachTopicErr="اكتب موضوعاً أولاً — كلمة أو جملة قصيرة.";render();
    setTimeout(function(){const x=document.getElementById("coachTopicIn");if(x){x.value=topic;x.focus()}},60);return}
  coachTopic=topic;coachTopicErr="";coachTopicAsk=false;
  coachScene=coachFreeScene(topic);
  coachBusy=true;coachMsgs=[];render();
  // الافتتاح من النموذج نفسه: موضوعٌ لا نعرفه لا يصلح له افتتاحٌ مكتوب سلفاً
  let open="",openSays=[];
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"chat",learner:learnerInfo(),scene:coachScene.en,
        level:coachLevel(),easy:coachHelp==="suggest",suggest:true,
        focus:coachScene.focus,styleTip:false,question:coachScene.en,

    const d=await res.json();
    if(d&&d.reply){const p=coachParse(d.reply);open=p.text;openSays=p.says}
  }catch(e){}
  if(!open)open=COACH_FREE_OPENER;  // تعذّر الاتصال لا يمنع البدء
  coachBusy=false;
  coachMsgs=[{role:"model",text:open,says:openSays}];
  logAnswer("coach","open",null,topic,"free",null,{lesson:"free",q_text:"help:"+coachHelp});
  render();setTimeout(function(){speakEnglish(open)},400);
}
