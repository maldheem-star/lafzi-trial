      هذا طبيعي: العناصر لا تُعاد قبل موعد استحقاقها، فإن قلّت المراجعات اليوم قلّ الوقت. أكملي بما يفيد ولا يكرّر:

// ===== إملاء إنجليزي: تستمع للكلمة بصوت أمريكي ثم تكتبها (مستوى A1) =====
// كلمات حقيقية من منهج الصف السادس (نفس مفردات ENG_ITEMS)، لا كلمات عامة عشوائية
const DICTATION_A1=[
 {w:"taxi",m:"سيارة أجرة"},{w:"gate",m:"بوابة"},
 {w:"insect",m:"حشرة"},{w:"camel",m:"جمل"},{w:"eagle",m:"نسر"},
 {w:"medicine",m:"دواء"},{w:"bread",m:"خبز"},{w:"spoon",m:"ملعقة"},
 {w:"concert",m:"حفل موسيقي"},{w:"prize",m:"جائزة"},{w:"chess",m:"شطرنج"},
 {w:"space",m:"الفضاء"},{w:"planet",m:"كوكب"},{w:"business",m:"عمل تجاري"},
 {w:"team",m:"فريق"},{w:"match",m:"مباراة"},{w:"race",m:"سباق"},
 {w:"storm",m:"عاصفة"},{w:"hill",m:"تل"},{w:"stone",m:"حجر"},
 {w:"pocket",m:"جيب"},{w:"winter",m:"شتاء"},{w:"summer",m:"صيف"},
 {w:"exams",m:"اختبارات"},{w:"improve",m:"يُحسّن"},{w:"invent",m:"يخترع"},
];
// تدرّج الإملاء (نفس فلسفة التقوية/الأساسيات): الكتابة الحرة من الصفر أصعب بكثير من الاختيار من متعدد،
// فنبدأ بالنسخ (ربط الصوت بالحروف) ثم نسحب المساعدة تدريجياً. المرحلة محفوظة بين الجلسات ليستمر التقدّم.
const DICT_REQ=2;   // إجابتان صحيحتان متتاليتان للصعود لمرحلة أصعب
const DICT_BACK=2;  // خطآن متتاليان للنزول لمرحلة أسهل (دعم تلقائي)
const DICT_STAGES=[
  {label:"مرحلة ١: انسخي الكلمة (اربطي الصوت بالحروف)",tag:"انسخي"},
  {label:"مرحلة ٢: أول حرف معطى",tag:"أول حرف"},
  {label:"مرحلة ٣: عدد الحروف فقط",tag:"عدد الحروف"},
  {label:"مرحلة ٤: بلا مساعدة (مستقل)",tag:"مستقل"},
];
function dictStageGet(){try{const v=parseInt(localStorage.getItem("mawhiba_dict_stage")||"1");return(v>=1&&v<=4)?v:1}catch(e){return 1}}
function dictStageSet(v){try{localStorage.setItem("mawhiba_dict_stage",String(v))}catch(e){}}
// تلميح المرحلة: الكلمة كاملة ← أول حرف + شرطات ← شرطات فقط ← لا شيء
function dictHint(word,stage){
  if(stage>=4)return"";
  if(stage<=1)return word;
  return word.split("").map((c,i)=>(stage===2&&i===0)?c:"_").join(" ");
}
// مقارنة حرفاً بحرف: تُظهر لها أي الحروف أصابت وأيها أخطأت بدل مجرد "غلط"
function dictDiff(typed,correct){
  const t=(typed||"").split("");
  return correct.split("").map((ch,i)=>`<span style="color:${t[i]===ch?'#059669':'#DC2626'}">${ch}</span>`).join("");
}
let dictSession=[],dictIdx=0,dictInput="",dictLocked=false,dictScore=0,dictDone=false;
let dictStage=1,dictStreak=0,dictMiss=0;
function startDictation(){
  mode="dictation";dictSession=shuffle(DICTATION_A1).slice(0,10);dictIdx=0;dictInput="";dictLocked=false;dictScore=0;dictDone=false;
  dictStage=dictStageGet();dictStreak=0;dictMiss=0;
  window.scrollTo(0,0);render();
  setTimeout(()=>speakEnglish(dictSession[0].w),300);
}
function dictReplay(){speakEnglish(dictSession[dictIdx].w)}
function dictCheck(){
  if(dictLocked)return;
  const el=document.getElementById('dictIn');
  const val=(el?el.value:"").trim().toLowerCase();
  dictInput=val;dictLocked=true;
  const dictOk=val===dictSession[dictIdx].w.toLowerCase();
  if(dictOk)dictScore++;
  logAnswer("dictation_a1","stage"+dictStage,dictOk);
  // تدرّج المرحلة: صعود بإتقان متتالٍ، ونزول تلقائي عند تكرار الخطأ حتى لا تعلق على مستوى أصعب من قدرتها
  if(dictOk){
    dictMiss=0;dictStreak++;
    if(dictStreak>=DICT_REQ&&dictStage<4){dictStage++;dictStreak=0;dictStageSet(dictStage)}
  }else{
    dictStreak=0;dictMiss++;
    if(dictMiss>=DICT_BACK&&dictStage>1){dictStage--;dictMiss=0;dictStageSet(dictStage)}
  }
  render();
}
function dictNext(){
  if(dictIdx+1>=dictSession.length){dictDone=true;window.scrollTo(0,0);render();return}

}

  const meter=`<div style="font-size:12px;color:#64748B;text-align:center;margin-top:10px">${dictStage<4?`صحيحتان متتاليتان للانتقال للمرحلة التالية (${toAr(dictStreak)}/${toAr(DICT_REQ)})`:"🎓 كتابة مستقلة تماماً"}</div>`;
  const btn=dictLocked

    :`<button class="btn" style="background:#0E7490" onclick="dictCheck()">تحقّقي ←</button>`;
  app.innerHTML=`

    ${feedback}
    ${meter}
  </div>
  ${btn}`;
  if(!dictLocked){const el=document.getElementById('dictIn');if(el)el.focus()}

  const pct=Math.round(dictScore/dictSession.length*100);
  app.innerHTML=`

// ===== النطق: تحقّق أساسي عبر تسجيل الصوت + Groq Whisper (يعمل على كل الأجهزة، بما فيها آيفون؛ تحقّق كلمة لا تقييم دقّة اللهجة) =====
function micSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)}
const PRON_GROQ_FN_URL=SB_URL+"/functions/v1/assess-pronunciation-groq";
let pronSession=[],pronIdx=0,pronResult=null,pronListening=false,pronScore=0,pronDone=false,pronUnsupported=false;
function startPronunciation(){
  mode="pron";pronSession=shuffle(DICTATION_A1).slice(0,8);pronIdx=0;pronResult=null;pronListening=false;pronScore=0;pronDone=false;
  pronBusy=false;pronElapsed=0;if(pronTimer){clearInterval(pronTimer);pronTimer=null}
  pronUnsupported=!micSupported();
  azureResult=null;azureBusy=false;azureRecording=false;
  window.scrollTo(0,0);render();
  if(!pronUnsupported)setTimeout(()=>speakEnglish(pronSession[0].w),300);
}
// ===== تقييم دقيق تجريبي عبر Azure AI Speech (اختياري، يحتاج مفتاحاً مُعدّاً في المشروع) =====
const PRON_FN_URL=SB_URL+"/functions/v1/assess-pronunciation";
let azureRecording=false,azureBusy=false,azureResult=null;
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(String(reader.result).split(",")[1]||"");
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}
async function azureAssess(){
  if(azureBusy)return;
  azureResult=null;azureBusy=true;azureRecording=true;render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];
    const rec=new MediaRecorder(stream);
    rec.ondataavailable=(e)=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
    const stopped=new Promise(resolve=>{rec.onstop=resolve});
    rec.start();
    await new Promise(r=>setTimeout(r,2500));
    rec.stop();
    stream.getTracks().forEach(t=>t.stop());
    await stopped;
    azureRecording=false;render();
    const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetchTimeout(PRON_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:pronSession[pronIdx].w})});
    azureResult=await res.json();
  }catch(e){
    azureResult={error:"client_error",message:String(e&&e.message||e)};
  }
  azureBusy=false;azureRecording=false;render();
}
// ===== تقييم النطق كلمة بكلمة بدل المطابقة التامة =====
// المطابقة التامة تخطئ في الاتجاهين: Whisper مدرَّب على النسخ لا التقييم فيُصلح الكلام ويعطي "صح" كاذباً،
// وأتفه فرق شكلي (I'm مقابل I am، نقطة، أداة تعريف) يعطي "خطأ" كاذباً. فنوحّد الصيغة ثم نقارن الكلمات.
// Whisper كثيراً ما يكتب الاختصار بلا فاصلة عليا (wasnt / its / dont)، فنقبل الشكلين معاً.
// استثناء مقصود: لا نوحّد ما يصطدم بكلمة إنجليزية حقيقية بلا الفاصلة — were (we're) و ill (I'll)
// و id (I'd) و hell (he'll) و wed (we'd) و lets — لأن التوحيد هنا قد يغيّر ما قالته فعلاً.
const PRON_CONTRACTIONS=[
  [/\b(i'm|im)\b/g,"i am"],[/\b(it's|its)\b/g,"it is"],[/\b(that's|thats)\b/g,"that is"],
  [/\b(what's|whats)\b/g,"what is"],[/\b(there's|theres)\b/g,"there is"],[/\b(here's|heres)\b/g,"here is"],
  [/\blet's\b/g,"let us"],
  [/\b(can't|cant|cannot)\b/g,"can not"],[/\b(won't|wont)\b/g,"will not"],
  [/\b(don't|dont)\b/g,"do not"],[/\b(doesn't|doesnt)\b/g,"does not"],[/\b(didn't|didnt)\b/g,"did not"],
  [/\b(isn't|isnt)\b/g,"is not"],[/\b(aren't|arent)\b/g,"are not"],[/\b(wasn't|wasnt)\b/g,"was not"],
  [/\b(weren't|werent)\b/g,"were not"],[/\b(haven't|havent)\b/g,"have not"],[/\b(hasn't|hasnt)\b/g,"has not"],
  [/\b(wouldn't|wouldnt)\b/g,"would not"],[/\b(couldn't|couldnt)\b/g,"could not"],[/\b(shouldn't|shouldnt)\b/g,"should not"],
  [/\b(you're|youre)\b/g,"you are"],[/\bwe're\b/g,"we are"],[/\b(they're|theyre)\b/g,"they are"],
  [/\b(he's|hes)\b/g,"he is"],[/\b(she's|shes)\b/g,"she is"],
  [/\b(i've|ive)\b/g,"i have"],[/\b(you've|youve)\b/g,"you have"],[/\b(we've|weve)\b/g,"we have"],
  [/\bi'll\b/g,"i will"],[/\bi'd\b/g,"i would"],
  [/\bokay\b/g,"ok"], // Whisper يكتبها okay والكتاب يكتبها OK — نفس الكلمة
];
function pronWords(s){
  let t=String(s||"").toLowerCase().replace(/[‘’ʼ´`]/g,"'"); // الفاصلة المائلة في iOS ثم القواعد
  PRON_CONTRACTIONS.forEach(p=>{t=t.replace(p[0],p[1])});
  // ما بقي من فواصل عليا هو ملكية (teacher's) — نحذفها بلا فراغ حتى تطابق ما يكتبه Whisper بلا فاصلة
  return t.replace(/'/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
}
// Whisper يدخل في حلقة تكرار عند الصوت القصير أو غير الواضح ("no brown bear" ثلاث مرات) —
// نتيجة كهذه لا تصف نطقها، فنطلب الإعادة بدل احتساب درجة لا معنى لها.
const PRON_MIN_MS=800; // أقل من هذا: الزر أُغلق قبل أن تتكلّم
function pronHallucinated(target,heard){
  const t=pronWords(target),h=pronWords(heard);
  if(h.length<4||h.length<t.length*2)return false;
  for(let n=1;n<=3;n++){ // ثنائية أو ثلاثية مكرّرة ثلاث مرات متتالية = حلقة تكرار
    for(let i=0;i+3*n<=h.length;i++){
      const a=h.slice(i,i+n).join(" ");
      if(a===h.slice(i+n,i+2*n).join(" ")&&a===h.slice(i+2*n,i+3*n).join(" "))return true;
    }
  }
  return false;
}
// Whisper يضيف أو يُسقط السين الأخيرة كثيراً (insect ← "Insects" أخذت صفراً وهي نطقتها صحيحة).
// نقارن بجذر مبسّط ونعرض الكلمة الأصلية كما هي — والقاعدة متماثلة على الطرفين فلا تُنشئ تطابقاً كاذباً.
function pronStem(w){return(w.length>=4&&w.endsWith("s")&&!w.endsWith("ss"))?w.slice(0,-1):w}
// ترجيح الكلمات: التقييم المتساوي جعل "That wasn't very fair, certainly" تنجح بـ ٨٠٪ والكلمة
// المفقودة هي friendly — أي جوهر الجملة. وجعل إسقاط "not" (الذي يقلب المعنى) يكلّف كأي أداة.
const PRON_NEG=["not","no","never","none","nothing","nobody"];
const PRON_FUNC=["i","you","he","she","it","we","they","me","him","her","us","them","my","your","his","its","our","their",
  "a","an","the","this","that","these","those","of","to","in","on","at","for","from","with","by","as","and","or","but",
  "is","am","are","was","were","be","been","do","does","did","have","has","had","can","could","will","would","shall",
  "should","may","might","must","there","here","so","if","then","than","up","out"];
// n = عدد كلمات الجملة. ترجيح النفي إنما يصحّ في جملة تامة يقلب معناها؛ أما في عبارة
// قصيرة مثل "No problem!" فـ no ليست أداة نفي بل جزء من قالب ثابت، وترجيحها كان يجعل
// من تقول "no" وحدها تتفوّق على من تقول "problem" وحدها — وهذا مقلوب.
function pronWeight(w,n){
  const st=pronStem(w);
  if((n===undefined||n>=4)&&PRON_NEG.indexOf(st)>=0)return 3;
  if(PRON_FUNC.indexOf(st)>=0)return 1;
  return 2;                               // كلمات المعنى
}
// محاذاة بأطول سلسلة جزئية مشتركة: تتسامح مع كلمة زائدة أو ناقصة بدل إسقاط الجملة كلها
function pronAlign(t,h){
  t=t.map(pronStem);h=h.map(pronStem);
  const n=t.length,m=h.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=t[i]===h[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){
    if(t[i]===h[j]){hit[i]=true;i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;
  }
  return hit;
}
const PRON_PASS=80; // نسبة الكلمات المطلوبة لاعتبار المحاولة ناجحة
// judged (اختياري): حكم النموذج اللغوي كلمةً بكلمة. نقبله فقط إذا طابق طوله عدد كلمات الهدف،
// وإلا سقطت المحاذاة على الكلمة الخطأ. القسمة تبقى هنا دائماً فلا تتأرجح درجتها على نفس الأداء.
function pronScoreOf(target,heard,judged){
  const t=pronWords(target);
  if(!t.length)return{pct:0,hit:[],words:[],got:0,total:0,ok:false,by:"none"};
  const useJudge=Array.isArray(judged)&&judged.length===t.length;
  const hit=useJudge?judged.map(Boolean):pronAlign(t,pronWords(heard));
  const w=t.map(x=>pronWeight(x,t.length)),wTot=w.reduce((a,b)=>a+b,0);
  const wGot=hit.reduce((a,h,i)=>a+(h?w[i]:0),0);
  const got=hit.filter(Boolean).length,pct=Math.round(100*wGot/wTot);
  return{pct,hit,words:t,got,total:t.length,weights:w,ok:pct>=PRON_PASS,by:useJudge?"judge":"local"};
}

const PRON_MAX_MS=15000; // حدّ أمان فقط، لا نافذة إجبارية
let pronRec=null,pronStream=null,pronChunks=[],pronTimer=null,pronElapsed=0,pronBusy=false;
async function pronStart(){
  if(pronListening||pronBusy)return;
  if(!micSupported()){pronUnsupported=true;render();return}
  pronResult=null;
  try{
    pronStream=await navigator.mediaDevices.getUserMedia({audio:true});
    pronChunks=[];
    pronRec=new MediaRecorder(pronStream);
    pronRec.ondataavailable=(e)=>{if(e.data&&e.data.size>0)pronChunks.push(e.data)};
    pronRec.onstop=()=>{pronFinish()};
    pronRec.start();
    pronListening=true;pronElapsed=0;
    pronTimer=setInterval(()=>{pronElapsed+=0.25;if(pronElapsed*1000>=PRON_MAX_MS){pronStop();return}render()},250);
    render();
  }catch(e){pronListening=false;pronResult={heard:"",ok:false,error:true};render()}
}
function pronReset(){pronBusy=false;pronListening=false;if(pronTimer){clearInterval(pronTimer);pronTimer=null}
  if(pronStream){try{pronStream.getTracks().forEach(function(t){t.stop()})}catch(e){}pronStream=null}render()}
function speakReset(){speakBusy=false;speakListening=false;if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  if(speakStream){try{speakStream.getTracks().forEach(function(t){t.stop()})}catch(e){}speakStream=null}render()}
function pronStop(){
  if(!pronListening)return;
  pronListening=false;pronBusy=true;
  if(pronTimer){clearInterval(pronTimer);pronTimer=null}
  try{if(pronRec&&pronRec.state!=="inactive")pronRec.stop();else{pronBusy=false}}catch(e){pronBusy=false}
  render();
}
async function pronFinish(){
  const target=pronSession[pronIdx]?pronSession[pronIdx].w:"";
  if(pronStream){try{pronStream.getTracks().forEach(t=>t.stop())}catch(e){}pronStream=null}
  if(pronElapsed*1000<PRON_MIN_MS){ // أُغلق الزر قبل أن تتكلّم: لا نحتسبها خطأً
    pronResult={heard:"",ok:false,tooShort:true};pronBusy=false;
    logAnswer("pronunciation_a1","discarded",false,"[too_short]",target,Math.round(pronElapsed*1000));
    render();return;
  }
  try{
    const blob=new Blob(pronChunks,{type:(pronRec&&pronRec.mimeType)||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetchTimeout(PRON_GROQ_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:target,targetWords:pronWords(target)})});
    const data=await res.json();
    // الإهمال: إما ثقة Whisper نفسه منخفضة، أو حكم النموذج أنه ليس محاولة للجملة، أو كشفنا المحلّي
    const bad=data&&data.ok&&(data.lowConfidence||data.garbled||pronHallucinated(target,data.heard));

      pronResult={heard:data.heard||"",ok:false,noisy:true};
      logAnswer("pronunciation_a1","discarded",false,data.heard||"[low_confidence]",target,Math.round(pronElapsed*1000));
    }else if(data&&data.ok){
      const sc=pronScoreOf(target,data.heard,data.judged);
      pronResult={heard:data.heard,ok:sc.ok,sc,note:data.note||""};
      if(sc.ok)pronScore++;
      logAnswer("pronunciation_a1","word",sc.ok,data.heard,target,Math.round(pronElapsed*1000),{score_pct:sc.pct});
    }else if(data&&data.error==="not_configured"){
      pronResult={heard:"",ok:false,error:true,notConfigured:true};
      logAnswer("pronunciation_a1","word",false,"[not_configured]",target);
    }else{
      pronResult={heard:"",ok:false,error:true};
      logAnswer("pronunciation_a1","word",false,"[transcription_error]",target);
    }
  }catch(e){
    pronResult={heard:"",ok:false,error:true};
  }
  pronBusy=false;render();
}

function buildSpeakSession(){

  const due=SPEAK_ITEMS.filter(i=>st[i.id]&&st[i.id].due<=today);
  const fresh=SPEAK_ITEMS.filter(i=>!st[i.id]).sort((a,b)=>pronWords(a.en).length-pronWords(b.en).length);
  const out=shuffle(due).slice(0,SPEAK_LEN);
  for(const it of fresh){if(out.length>=SPEAK_LEN)break;if(out.filter(x=>!st[x.id]).length>=SPEAK_NEW_CAP)break;out.push(it)}
  if(!out.length)out.push(...shuffle(SPEAK_ITEMS).slice(0,SPEAK_LEN)); // لا شيء مستحق: مراجعة حرّة بدل شاشة فارغة

    speakRec.start();
    speakListening=true;speakElapsed=0;
    speakTimer=setInterval(()=>{speakElapsed+=0.25;if(speakElapsed*1000>=PRON_MAX_MS){speakStop();return}render()},250);
    render();
  }catch(e){speakListening=false;speakResult={heard:"",error:true};render()}
}
function speakStop(){
  if(!speakListening)return;
  speakListening=false;speakBusy=true;
  if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  try{if(speakRec&&speakRec.state!=="inactive")speakRec.stop();else{speakBusy=false}}catch(e){speakBusy=false}
  render();
}
async function speakFinish(){
  const it=speakCur();const target=it?it.en:"";
  if(speakStream){try{speakStream.getTracks().forEach(t=>t.stop())}catch(e){}speakStream=null}
  // محاولة مُهمَلة: لا تُحتسب خطأً ولا تُكتب في التباعد — الجملة تبقى كما هي لتعيدها
  if(speakElapsed*1000<PRON_MIN_MS){
    speakResult={heard:"",discarded:true,why:"short"};speakBusy=false;
    logAnswer("speaking","discarded",false,"[too_short]",it?it.id:null,Math.round(speakElapsed*1000),{is_new:!!(it&&it._isNew),srs_box:it?it._box:null});
    render();return;
  }
  try{
    const blob=new Blob(speakChunks,{type:(speakRec&&speakRec.mimeType)||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetchTimeout(PRON_GROQ_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:target,targetWords:pronWords(target)})});
    const data=await res.json();
    const bad=data&&data.ok&&(data.lowConfidence||data.garbled||pronHallucinated(target,data.heard));
    if(bad){
      speakResult={heard:data.heard||"",discarded:true,why:"noisy"};
      logAnswer("speaking","discarded",false,data.heard||"[low_confidence]",it.id,Math.round(speakElapsed*1000),{is_new:!!it._isNew,srs_box:it._box});
    }else if(data&&data.ok){
      const sc=pronScoreOf(target,data.heard,data.judged);
      speakTries++;
      speakResult={heard:data.heard,ok:sc.ok,sc,note:data.note||""};
      logAnswer("speaking","stage"+speakStage,sc.ok,data.heard,it.id,Math.round(speakElapsed*1000),{score_pct:sc.pct,is_new:!!it._isNew,srs_box:it._box,judged_by:sc.by});
    }else{
      speakResult={heard:"",error:true,notConfigured:!!(data&&data.error==="not_configured")};
      logAnswer("speaking","stage"+speakStage,false,"[transcription_error]",it.id);
    }
  }catch(e){speakResult={heard:"",error:true}}
  speakBusy=false;render();
}
// تُحسب النتيجة والتباعد مرة واحدة لكل جملة عند الانتقال — فالمحاولات المتكررة تدريب لا عقوبة
function speakNext(skip){
  const it=speakCur(),ok=!skip&&!!(speakResult&&speakResult.ok);
  // المحاولة المُهمَلة (صوت قصير أو مشوّش) تُتخطّى بلا تباعد ولا سلسلة ولا درجة — لأنها لا تصف نطقها
  if(skip){speakSkipped++}
  else{
    if(it){speakSrsUpdate(it.id,ok);if(ok)speakScore++}
    if(ok){speakStreak++;speakMiss=0}else{speakMiss++;speakStreak=0}
    if(speakStreak>=SPEAK_REQ&&speakStage<3){speakStage++;speakStageSet(speakStage);speakStreak=0}
    else if(speakMiss>=SPEAK_BACK&&speakStage>1){speakStage--;speakStageSet(speakStage);speakMiss=0}
  }
  if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  speakListening=false;speakBusy=false;speakTries=0;
  if(speakIdx+1>=speakSession.length){speakDone=true;window.scrollTo(0,0);render();return}
  speakIdx++;speakResult=null;render();
  if(speakStage!==2)setTimeout(()=>speakEnglish(speakSession[speakIdx].en),300);
}
function speakRetry(){speakResult=null;render()} // تكرار المهمة: تعيد الجملة نفسها بلا احتساب محاولة جديدة

      :(()=>{
        const pct=sc?sc.pct:0,col=pct>=PRON_PASS?'#059669':pct>=50?'#B45309':'#DC2626';

    const btns=speakResult
      ?(speakResult.discarded

         <div style="font-size:12px;color:#94A3B8;margin-top:8px">التكرار يرفع الطلاقة — أعيديها مرتين أو ثلاثاً قبل الانتقال${speakTries>1?` (حاولتِ ${toAr(speakTries)} مرات)`:""}</div>`)

    inner=`

      ${speakListening
        ? `<button type="button" onclick="speakStop()" style="background:#DC2626;color:#fff;border:none;border-radius:50%;width:72px;height:72px;font-size:26px;cursor:pointer;box-shadow:0 0 0 6px rgba(220,38,38,.18)">⏹️</button>`
        : `<button type="button" onclick="speakStart()" ${speakBusy?"disabled":""} style="background:${speakBusy?'#F9A8D4':'#DB2777'};color:#fff;border:none;border-radius:50%;width:72px;height:72px;font-size:26px;cursor:pointer">🎤</button>`}
    </div>
    <div style="font-size:13px;color:${speakListening?'#DC2626':'#64748B'};margin-bottom:12px;font-weight:${speakListening?'800':'400'}">${speakListening?`🔴 يسجّل… ${toAr(speakElapsed.toFixed(1)).replace('.','٫')} ث — اضغطي ⏹️ عند انتهائك`:speakBusy?"…جارٍ التحقّق":"اضغطي 🔊 لتسمعي، ثم 🎤 وقوليها كاملة"}</div>
    ${speakBusy?`<button class="link-btn" style="font-size:12px;margin:0 0 10px" onclick="speakReset()">✕ إلغاء والمحاولة ثانية</button>`:""}
    ${fb}${btns}`;
  }
  app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="bar">${prog}</div>
  <div class="meta"><span>جملة ${toAr(speakIdx+1)} من ${toAr(speakSession.length)}</span><span>تحدّث · Speaking</span></div>
  <div style="display:flex;gap:6px;margin:8px 0">${stageBar}</div>
  <div style="font-size:12px;font-weight:800;color:#DB2777;margin-bottom:12px">${info.label}</div>
  <div class="card" style="text-align:center">
    <span class="tag" style="background:#FCE7F3;color:#DB2777">🗣️ تحدّث · ${info.tag}</span>
    ${inner}
  </div>`;
}

      <span style="font-size:12px">المرحلة الحالية: ${SPEAK_STAGES[speakStage-1].tag} — تتقدّم تلقائياً بإجابتين صحيحتين متتاليتين.</span>

// ===== الحالة والتدفّق =====
function alias(){return (localStorage.getItem("mawhiba_alias")||"بنتي").trim()||"بنتي"}
function saveAlias(v){localStorage.setItem("mawhiba_alias",v)}
let mode="home",currentMode="full",filtered=[],idx=0,picked=null,locked=false,score=0,done=false,answered=[],attempts=[],loading=false;
const app=document.getElementById("app");

// ===== إدارة الحمل المعرفي: كشف الإجابات السريعة المتتالية واقتراح استراحة (بحسب الجلسة الحالية فقط) =====
let sessionAnswered=0,questionShownAt=0,recentAnswerTimes=[],rapidNudge=false,breakSuggest=false,breakShownFor=[];
const BREAK_EVERY=20,RAPID_MS=2500,RAPID_STREAK=4;
// بوّابة القراءة. البيانات كانت قاطعة: الفهم المقروء زمنه الوسيط ١٫٧ ثانية والدرجة ٢٨٪ —
// أي عند مستوى التخمين تماماً (٢٥٪ من أربعة خيارات)، بينما المفردات ٦٧٪ لأنها لا تحتاج قراءة نص.
// اللافتة التحذيرية لم تنفع لأنها تظهر بعد الإجابة. فالحل بنيوي: لا خيارات قبل أن يمرّ زمن القراءة.
// ٩٠ كلمة/دقيقة سرعة قراءة صامتة متحفّظة لسادس ابتدائي، والحدّ الأدنى ٨ ثوانٍ والأقصى ٤٥.
const GATE_MIN_WORDS=25,GATE_WPM=90,GATE_MIN_S=8,GATE_MAX_S=45;
function gateSecondsFor(text){
  const w=String(text||"").trim().split(/\s+/).filter(Boolean).length;
  if(w<GATE_MIN_WORDS)return 0;
  return Math.max(GATE_MIN_S,Math.min(GATE_MAX_S,Math.round(w/GATE_WPM*60)));
}
let gateSecs=0,gateLeft=0,gateTimer=null,gateSeen=false;
function gateStop(){if(gateTimer){clearInterval(gateTimer);gateTimer=null}}
function gateStart(text){
  gateStop();gateSecs=gateSecondsFor(text);gateLeft=gateSecs;
  if(!gateSecs)return;
  gateTimer=setInterval(()=>{gateLeft--;if(gateLeft<=0){gateLeft=0;gateStop()}render()},1000);
}
function gateOpen(){return gateSecs===0||gateLeft<=0}
function gateReveal(){gateLeft=0;gateStop();gateSeen=true;render()} // لا تتخطّى الزمن، تُستعمل بعده فقط
// أنواع تتطلّب قراءة/تفكيراً أطول من مجرّد الاسترجاع (نص، علاقة، استنتاج) — لها حدّ أدنى فوري خاص
// بدل انتظار ٤ إجابات متتالية سريعة؛ إجابة واحدة أسرع من الحدّ كافية لتنبيه الاستعجال
const RAPID_MIN_BY_TYPE={reading:6000,logic:4000,analogy:4000};

async function start(domKey){
  currentMode=domKey;mode="quiz";idx=0;picked=null;locked=false;score=0;done=false;answered=[];
  recentAnswerTimes=[];rapidNudge=false;breakSuggest=false;gateStop();gateSecs=0;gateLeft=0;gateSeen=false;
  const needsAI=(domKey==="verbal"||domKey==="science"||domKey==="full");
  if(needsAI){loading=true;render();}
  if(domKey==="full"){filtered=await buildFull()}
  else{filtered=await buildDomain(domKey,PER)}
  loading=false;questionShownAt=Date.now();if(filtered.length)gateStart(filtered[0].q);render();
}
async function home(){mode="home";gateStop();window.scrollTo(0,0);render();await loadWeakness();if(mode==="home")render()}
function choose(i){
  if(locked)return;
  picked=i;locked=true;
  const q=filtered[idx];
  const ok=i===q.a;
  if(ok)score++;
  answered[idx]=ok;
  const elapsed=Date.now()-questionShownAt;
  // أسئلة الذكاء الاصطناعي تُولَّد وقت الاختبار ولا توجد في الكود، فبلا حفظ نصّها يستحيل
  // مراجعة ما أخطأت فيه. نحفظ نصّها وإجابتها المختارة (لا الصحيحة) للتشخيص لاحقاً.
  logAnswer(q.d,q.qtype||"bank",ok,q.c&&q.c[i]!=null?String(q.c[i]):null,null,elapsed,
    q.qtype?{q_text:String(q.q).slice(0,1200)}:null);
  recentAnswerTimes.push(elapsed);
  if(recentAnswerTimes.length>RAPID_STREAK)recentAnswerTimes.shift();
  sessionAnswered++;
  const typeFloor=RAPID_MIN_BY_TYPE[q.qtype],singleTooFast=typeFloor&&elapsed<typeFloor;
  rapidNudge=singleTooFast||(recentAnswerTimes.length===RAPID_STREAK&&recentAnswerTimes.every(t=>t<RAPID_MS));
  if(rapidNudge)recentAnswerTimes=[];
  breakSuggest=!rapidNudge&&sessionAnswered%BREAK_EVERY===0&&!breakShownFor.includes(sessionAnswered);
  if(breakSuggest)breakShownFor.push(sessionAnswered);
  render();
}
function next(){if(idx+1>=filtered.length){done=true;gateStop();window.scrollTo(0,0);saveAttempt()}else{idx++;picked=null;locked=false;rapidNudge=false;breakSuggest=false;questionShownAt=Date.now();gateStart(filtered[idx].q)}render()}
function domainStats(){const acc={};Object.keys(DOMAINS).forEach(k=>acc[k]={r:0,t:0});filtered.forEach((q,i)=>{if(acc[q.d]){acc[q.d].t++;if(answered[i])acc[q.d].r++}});return acc}
function weakestOf(acc){let key=null,pct=101;Object.keys(DOMAINS).forEach(k=>{if(acc[k].t){const p=acc[k].r/acc[k].t*100;if(p<pct){pct=p;key=k}}});return{key,pct}}

async function saveAttempt(){
  const acc=domainStats();
  const row={student_alias:alias(),mode:currentMode,score,total:filtered.length,
    verbal_correct:acc.verbal.r,verbal_total:acc.verbal.t,quant_correct:acc.quant.r,quant_total:acc.quant.t,
    science_correct:acc.science.r,science_total:acc.science.t,flex_correct:acc.flex.r,flex_total:acc.flex.t};
  try{await fetch(`${SB_URL}/rest/v1/${TBL}`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json","Prefer":"return-minimal"},body:JSON.stringify(row)})}catch(e){}
}
async function loadProgress(){mode="progress";attempts=null;window.scrollTo(0,0);render();try{const res=await fetch(`${SB_URL}/rest/v1/${TBL}?student_alias=eq.${encodeURIComponent(alias())}&order=created_at.asc&select=*`,{headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}});attempts=res.ok?await res.json():[]}catch(e){attempts=[]}render()}




// ===== التوجيه الذكي: اقتراح التقوية للأضعف =====
let weakSuggestion=null; // {domKey, pct}
async function loadWeakness(){
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${TBL}?student_alias=eq.${encodeURIComponent(alias())}&order=created_at.desc&limit=12&select=*`,{headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}});
    if(!res.ok)return null;
    const rows=await res.json();
    const acc={verbal:{r:0,t:0},quant:{r:0,t:0},science:{r:0,t:0},flex:{r:0,t:0}};
    rows.forEach(a=>{acc.verbal.r+=a.verbal_correct||0;acc.verbal.t+=a.verbal_total||0;acc.quant.r+=a.quant_correct||0;acc.quant.t+=a.quant_total||0;acc.science.r+=a.science_correct||0;acc.science.t+=a.science_total||0;acc.flex.r+=a.flex_correct||0;acc.flex.t+=a.flex_total||0});
    let key=null,pct=101;
    Object.keys(acc).forEach(k=>{if(acc[k].t>=6){const p=Math.round(acc[k].r/acc[k].t*100);if(p<pct){pct=p;key=k}}});
    if(key&&pct<55){weakSuggestion={domKey:key,pct}}else{weakSuggestion=null}
  }catch(e){weakSuggestion=null}
}

// ===== طلاقة الحقائق الحسابية: استرجاع فوري لحقائق الجمع/الطرح/الضرب/القسمة بدل العدّ اليدوي =====
// السبب العلمي: العدّ بالأصابع عرَض لغياب "الاسترجاع الفوري"، لا مشكلة انضباط. الحل المثبت:
// (١) استرجاع نشِط (Retrieval Practice) بتباعد ذكي SRS بدل التكرار العشوائي (Roediger & Karpicke)
// (٢) تعليم استراتيجيات تفكيك صريحة (إكمال العشرة، المضاعفات القريبة) عند الخطأ بدل تصحيح بلا شرح (Baroody 2006)
// (٣) تشبيك العمليات الأربع بدل تجميعها (Rohrer & Taylor) — يمنع "التخمين حسب القسم"
const FACT_SRS_KEY="mawhiba_fact_srs";
const FACT_SECS=12;          // تقدير واقعي لثانية الاسترجاع الواحدة لطالبة سادس
const FACT_PLAN_SECS=10*60;  // ١٠ دقائق يومياً: جلسات قصيرة متكررة أفعل من جلسة طويلة متباعدة لبناء الطلاقة
const FACT_NEW_CAP=10;
const FACT_NEW_DIV_CAP=3;   // سقف الحقائق الجديدة في القسمة وحدها لكل جلسة
function factSrsLoad(){try{return JSON.parse(localStorage.getItem(FACT_SRS_KEY)||"{}")}catch(e){return{}}}
function factSrsSave(o){try{localStorage.setItem(FACT_SRS_KEY,JSON.stringify(o))}catch(e){}}
function factSrsUpdate(id,ok){
  const st=factSrsLoad(),r=st[id]||{box:0,seen:0};
  r.box=ok?Math.min(r.box+1,SRS_INTERVALS.length-1):0;
  r.due=srsToday()+SRS_INTERVALS[r.box];r.seen=(r.seen||0)+1;
  st[id]=r;factSrsSave(st);
}
// بنك الحقائق: جمع/طرح ١-٩ (مجاميع حتى ١٨)، وضرب/قسمة ٢-٩ (جداول الضرب الأساسية)
function buildFactBank(){
  const items=[];
  for(let a=1;a<=9;a++)for(let b=a;b<=9;b++){
    items.push({id:`add_${a}_${b}`,op:"add",a,b,ans:a+b});
    items.push({id:`sub_${a+b}_${b}`,op:"sub",a:a+b,b,ans:a});
    if(a!==b)items.push({id:`sub_${a+b}_${a}`,op:"sub",a:a+b,b:a,ans:b});
  }
  for(let a=2;a<=9;a++)for(let b=a;b<=9;b++){
    items.push({id:`mul_${a}_${b}`,op:"mul",a,b,ans:a*b});
    items.push({id:`div_${a*b}_${b}`,op:"div",a:a*b,b,ans:a});
    if(a!==b)items.push({id:`div_${a*b}_${a}`,op:"div",a:a*b,b:a,ans:b});
  }
  return items;

let _factBank=null;
function factBank(){if(!_factBank)_factBank=buildFactBank();return _factBank}
const FACT_OP_SYM={add:"+",sub:"−",mul:"×",div:"÷"};
const FACT_OP_TERMS={add:[{ar:"جمع",en:"addition"}],sub:[{ar:"طرح",en:"subtraction"}],mul:[{ar:"ضرب",en:"multiplication"}],div:[{ar:"قسمة",en:"division"}]};
// استراتيجية فورية عند الخطأ: تعليم صريح لطريقة أسرع من العدّ، لا مجرد إعطاء الجواب
function factStrategy(op,a,b,ans,noLadder){
  if(op==="add"){
    if(a===b)return `مضاعف: ${toAr(a)}+${toAr(a)}=${toAr(ans)} — احفظي المضاعفات فهي أسرع من العدّ`;
    if(Math.abs(a-b)===1){const s=Math.min(a,b);return `مضاعف قريب: ${toAr(s)}+${toAr(s)}=${toAr(2*s)}، والفرق واحد فقط، إذن الجواب ${toAr(2*s)}+١=${toAr(ans)}`;}
    if(a===9||b===9){const other=a===9?b:a;return `أكملي العشرة: ٩ يحتاج ١ ليكمل ١٠، فحوّلي ${toAr(other)} إلى (١+${toAr(other-1)}): ١٠+${toAr(other-1)}=${toAr(ans)}`;}
    if((a===8||b===8)&&Math.min(a,b)>=2){const other=a===8?b:a;return `أكملي العشرة: ٨ يحتاج ٢ ليكمل ١٠، فحوّلي ${toAr(other)} إلى (٢+${toAr(other-2)}): ١٠+${toAr(other-2)}=${toAr(ans)}`;}
    return `ابدئي من العدد الأكبر (${toAr(Math.max(a,b))}) وعدّي ${toAr(Math.min(a,b))} فوقه: <b>${toAr(ans)}</b> — لا تبدئي العدّ من واحد`;
  }
  if(op==="sub"){
    // الصعود عبر العشرة: أسرع وأدقّ من العدّ التنازلي لطالبة ما زالت تعدّ بأصابعها (Torbeyns et al. 2009)
    if(a>10&&b<10&&ans<10){const up=10-b,rest=a-10;
      return `اصعدي عبر العشرة: من ${toAr(b)} إلى ١٠ تحتاجين ${toAr(up)}، ومن ١٠ إلى ${toAr(a)} تحتاجين ${toAr(rest)}، إذن ${toAr(up)}+${toAr(rest)}=<b>${toAr(ans)}</b>`;}
    return `فكّري بها كجمع ناقص: ${toAr(b)}+؟=${toAr(a)} — الجواب <b>${toAr(ans)}</b>`;
  }
  if(op==="mul"){
    if(a===9||b===9){const other=a===9?b:a;return `الضرب في ٩: (${toAr(other)}×١٠)−${toAr(other)}=${toAr(10*other)}−${toAr(other)}=<b>${toAr(ans)}</b>`;}
    if(a===b)return `مربّع العدد: ${toAr(a)}×${toAr(a)}=<b>${toAr(ans)}</b>`;
    if(a===2||b===2)return `الضرب في ٢ = جمع العدد مع نفسه: <b>${toAr(ans)}</b>`;
    if(a===5||b===5)return `الضرب في ٥ = عدّي بالخمسات حتى ${toAr(a)} خطوة، أو (العدد×١٠)÷٢ = <b>${toAr(ans)}</b>`;
    const smaller=Math.min(a,b),bigger=Math.max(a,b);
    return `استعملي حقيقة أصغر تعرفينها: ${toAr(bigger)}×${toAr(smaller-1)}=${toAr(bigger*(smaller-1))} ثم أضيفي ${toAr(bigger)} أخرى = <b>${toAr(ans)}</b>`;
  }
  // القسمة أضعف عملياتها: نربطها صراحةً بجدول الضرب الذي تتقنه، ونُظهر سُلَّم العدّ بالقفزات كجسر مؤقّت
  // حين تُعرض المصفوفة التفاعلية تحته نُسقط السُّلَّم الساكن: تمثيلان لنفس الفكرة يزدحمان
  if(op==="div")return `القسمة ضرب معكوس: <b>${toAr(ans)}</b> × ${toAr(b)} = ${toAr(a)}، إذن ${toAr(a)} ÷ ${toAr(b)} = <b>${toAr(ans)}</b>${noLadder?"":factSkipLadder(b,ans)}`;
  return "";
}
// سُلَّم القفزات: يُظهر أن ٣٦÷٤ هي "كم أربعة حتى نصل ٣٦" — تمثيل ملموس يسبق الاسترجاع الفوري (Baroody 2006)
function factSkipLadder(b,ans){
  if(!(b>=2&&ans>=2&&ans<=9))return "";
  let s="";
  for(let k=1;k<=ans;k++){
    const last=k===ans;
    s+=`<span style="display:inline-block;min-width:34px;text-align:center;padding:3px 5px;margin:2px;border-radius:8px;font-weight:800;background:${last?'#0D9488':'#F1F5F9'};color:${last?'#fff':'#475569'}">${toAr(b*k)}</span>`;
  }
  return `<div style="margin-top:10px;direction:ltr">${s}</div><div style="font-size:13px;color:#0F766E;margin-top:4px">عدّي بالـ${toAr(b)}: وصلنا ${toAr(b*ans)} بعد <b>${toAr(ans)}</b> قفزات</div>`;
}
// تلميح قبل الإجابة بلا كشف الناتج: يظهر للحقيقة الجديدة أو التي أخطأت فيها آخر مرة،
// ويُسحب تلقائياً بمجرد أن تسترجعها صحيحة مرة واحدة (تلاشي الدعامة — Renkl & Atkinson)
function factCue(op,a,b){
  if(op==="div")return `اسألي نفسك: <b>كم ${toAr(b)} في ${toAr(a)}؟</b> أي ؟ × ${toAr(b)} = ${toAr(a)} — من جدول الضرب، لا بالعدّ`;
  if(op==="sub")return `اصعدي من ${toAr(b)} إلى ${toAr(a)}: <b>كم تحتاجين لتصلي؟</b> (الطرح جمعٌ ناقص)`;
  if(op==="mul")return `ابدئي من حقيقة قريبة تعرفينها ثم عدّلي — لا تجمعي واحدة واحدة`;
  return `ابدئي من العدد الأكبر (${toAr(Math.max(a,b))}) وأضيفي الباقي — لا تعدّي من واحد`;
}
function buildFactPlan(){
  const st=factSrsLoad(),today=srsToday(),POOL=factBank();
  const due=POOL.filter(i=>st[i.id]&&st[i.id].due<=today);
  const fresh=POOL.filter(i=>!st[i.id]);
  const chosen=[];let secs=0,newCount=0;
  const add=it=>{if(secs+FACT_SECS>FACT_PLAN_SECS)return false;chosen.push(it);secs+=FACT_SECS;return true};
  shuffle(due).forEach(add);
  // القسمة أضعف عملياتها: سبع حقائق قسمة جديدة متتالية في جلسة واحدة تدفع للتخمين لا للتعلّم.
  // المُراجَع منها لا يُقيَّد — هو ما تحتاجه فعلاً — والمقيَّد هو الجديد غير المألوف.
  // والسحب بالتناوب بين العمليات لا بالخلط الأعمى: الخلط وحده كان يُخرج أحياناً جلسة
  // بلا عملية كاملة، وهو نقيض التشبيك الذي بُني عليه القسم.
  let newDiv=0;
  const buckets={};["add","sub","mul","div"].forEach(o=>{buckets[o]=shuffle(fresh.filter(i=>i.op===o))});
  let drew=true;
  while(drew&&newCount<FACT_NEW_CAP){
    drew=false;
    for(const o of ["add","sub","mul","div"]){
      if(newCount>=FACT_NEW_CAP)break;
      if(o==="div"&&newDiv>=FACT_NEW_DIV_CAP)continue;
      const it=buckets[o].shift();
      if(!it)continue;
      drew=true;
      if(add(it)){newCount++;if(o==="div")newDiv++}
    }
  }
  const byOp={};chosen.forEach(i=>(byOp[i.op]=byOp[i.op]||[]).push(i));
  const order=["add","sub","mul","div"],woven=[];
  let any=true;while(any){any=false;order.forEach(op=>{const q=byOp[op];if(q&&q.length){woven.push(q.shift());any=true}})}
  return {items:woven,secs,due:due.length,fresh:newCount};
}
let factItems=[],factIdx=0,factInput="",factLocked=false,factScore=0,factTotal=0,factDone=false,factMeta=null;
let factShownAt=0,factCueOn=false,factLog=[],factRemedyAt=0,factRemedyId=null;
// بوّابة العلاج: بعد خطأ قسمة لا يظهر «التالي» حتى تُكمل المصفوفة.
// نصيحةٌ بأن تتأمّل لم تنفع — بقيت على شاشة العلاج ثانيتين وسبع مرات كتبت «٥».
// وإكمال المصفوفة ممكن دائماً: الزرّ يتوقّف عند المجموع بالضبط ولا يتجاوزه.
function factGated(){
  const it=factCur();
  if(!factLocked||!it||it.op!=="div")return false;
  if(parseInt(factInput,10)===it.ans)return false;
  return !divComplete();
}
// تُسلَّح الحقيقة قبل عرضها: نبدأ عدّ الزمن، ونقرّر إظهار التلميح من حالة التباعد *قبل* أن تُجيب
function factArm(){
  const it=factCur();
  factShownAt=Date.now();
  const r=it?factSrsLoad()[it.id]:null;
  factCueOn=!!it&&(!r||!r.box);   // جديدة أو أخطأت فيها آخر مرة (الصندوق ٠)
}
function startFactPlan(){
  const p=buildFactPlan();
  factItems=p.items;factMeta=p;factIdx=0;factInput="";factLocked=false;factScore=0;factDone=false;
  factTotal=factItems.length;factLog=[];
  factArm();

}
function factCur(){return factItems[factIdx]}
function factCheck(){
  if(factLocked)return;
  const el=document.getElementById('factIn');
  const val=(el?el.value:"").trim();
  const ms=factShownAt?Date.now()-factShownAt:null;
  factInput=val;factLocked=true;
  const it=factCur(),ok=parseInt(val,10)===it.ans;
  if(ok)factScore++;
  if(!ok&&it.op==="div"){divArmArray(it.a,it.b);factRemedyAt=Date.now();factRemedyId=it.id}
  factLog.push({op:it.op,ok,ms,cue:factCueOn});
  factSrsUpdate(it.id,ok);
  logAnswer("fact_fluency",it.op,ok,val,it.id,ms,{q_text:`${it.a} ${FACT_OP_SYM[it.op]} ${it.b}`});
  render();
}
// نقيس التفاعل مع المصفوفة بدل أن نستنتجه من فروق الأزمنة: كم ضغطة، وهل أُكملت، وكم مكثت
function factLogRemedy(){

function factNext(){

}
function renderFactPlan(){

  const cue=(!factLocked&&factCueOn)?`<div style="background:#FFFBEB;border-inline-start:4px solid #F59E0B;border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:14px;line-height:1.9;color:#92400E;text-align:start">💡 ${factCue(it.op,it.a,it.b)}</div>`:"";

  <div class="card" style="text-align:center">

    <div style="font-size:40px;font-weight:800;letter-spacing:4px;margin:24px 0;direction:ltr">${toAr(it.a)} ${FACT_OP_SYM[it.op]} ${toAr(it.b)} = ؟</div>
    <input id="factIn" ${factLocked?`disabled value="${String(factInput).replace(/[^0-9\-]/g,"").slice(0,8)}"`:""} type="tel" inputmode="numeric" style="width:140px;padding:14px;border-radius:12px;border:2px solid ${factLocked?(ok?'#10B981':'#EF4444'):'#E2E8F0'};font-size:26px;text-align:center;font-weight:800" autocomplete="off" onkeydown="if(event.key==='Enter')factCheck()">
    ${factLocked?`<div style="margin-top:10px;font-weight:800;color:${ok?'#059669':'#DC2626'}">${ok?"✓ صحيح":"الصحيح: "+toAr(it.ans)}</div>`:""}
    ${cue}${hint}
  </div>
  ${factLocked
    ?(factGated()
      ?`<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:14px;text-align:center;font-size:14px;color:#92400E;line-height:1.8">🔒 أكملي الصفوف أعلاه ليظهر زرّ التالي<br><span style="font-size:12px">اضغطي «+ صفّ» حتى تنتهي النقاط — هذه هي القسمة نفسها</span></div>`

const FACT_OP_LABEL={add:"جمع",sub:"طرح",mul:"ضرب",div:"قسمة"};
function factMedian(arr){if(!arr.length)return null;const s=arr.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)}

// ===== طبقة التشجيع (مبنية على إظهار النمو والكفاءة) =====
function todayStr(){return new Date().toISOString().slice(0,10)}
function getStreak(){try{return JSON.parse(localStorage.getItem("mawhiba_streak")||'{"days":0,"last":""}')}catch(e){return{days:0,last:""}}}
function bumpStreak(){const st=getStreak();const t=todayStr();if(st.last===t)return st;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);st.days=(st.last===y)?st.days+1:1;st.last=t;localStorage.setItem("mawhiba_streak",JSON.stringify(st));return st}
// رسالة نمو: تقارن بأفضل نتيجة سابقة لنفس الوضع
function growthMsg(modeKey,pct){try{const key="mawhiba_best_"+modeKey;const prev=parseInt(localStorage.getItem(key)||"-1");let msg="";if(prev<0){msg="أول محاولة في هذا القسم — انطلاقة موفّقة! 🌱"}else if(pct>prev){msg=`تحسّنتِ عن أفضل نتيجة سابقة (${toAr(prev)}%)! تقدّم رائع 📈`}else if(pct===prev){msg="ثبات على أفضل مستوى سابق 💪"}else{msg="واصلي، كل محاولة تبني مهارتك 🌟"}if(pct>prev)localStorage.setItem(key,String(pct));return msg}catch(e){return""}}

  const acc={verbal:{r:0,t:0},quant:{r:0,t:0},science:{r:0,t:0},flex:{r:0,t:0}};
  attempts.forEach(a=>{acc.verbal.r+=a.verbal_correct||0;acc.verbal.t+=a.verbal_total||0;acc.quant.r+=a.quant_correct||0;acc.quant.t+=a.quant_total||0;acc.science.r+=a.science_correct||0;acc.science.t+=a.science_total||0;acc.flex.r+=a.flex_correct||0;acc.flex.t+=a.flex_total||0});
  const doms=Object.keys(DOMAINS).filter(k=>acc[k].t).map(k=>{const d=DOMAINS[k];const p=Math.round(acc[k].r/acc[k].t*100);return `<div class="dom-row"><div class="dom-head"><span>${d.name}</span><span>${toAr(p)}%</span></div><div class="track"><div class="fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join("");
  const rows=attempts.slice().reverse().slice(0,12).map(a=>{const p=Math.round((a.score/a.total)*100);const mn=a.mode==="full"?"محاكاة شاملة":(DOMAINS[a.mode]?DOMAINS[a.mode].name:a.mode);return `<div class="attempt"><div><div class="att-mode">${mn}</div><div class="att-date">${fmtDate(a.created_at)}</div></div><div class="att-score" style="color:${p>=70?'#059669':p>=50?'#D97706':'#DC2626'}">${toAr(a.score)}/${toAr(a.total)} · ${toAr(p)}%</div></div>`}).join("");
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="section-title"><span>متابعة تقدّم ${alias()}</span></div>
  <div class="card"><div style="font-weight:800;margin-bottom:14px">متوسّط المستوى لكل مجال</div>${doms}</div>
  <div class="card"><div style="font-weight:800;margin-bottom:6px">آخر المحاولات</div>${rows}</div>`;
}

render();

</script>
</body>
</html>
