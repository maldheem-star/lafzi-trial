const app=document.getElementById("app");

// ===== إدارة الحمل المعرفي: كشف الإجابات السريعة المتتالية واقتراح استراحة (بحسب الجلسة الحالية فقط) =====
let sessionAnswered=0,questionShownAt=0,recentAnswerTimes=[],rapidNudge=false,breakSuggest=false,breakShownFor=[];
const BREAK_EVERY=20,RAPID_MS=2500,RAPID_STREAK=4;
// بوّابة القراءة. البيانات كانت قاطعة: الفهم المقروء زمنه الوسيط ١٫٧ ثانية والدرجة ٢٨٪ —
// أي عند مستوى التخمين تماماً (٢٥٪ من أربعة خيارات)، بينما المفردات ٦٧٪ لأنها لا تحتاج قراءة نص.
// اللافتة التحذيرية لم تنفع لأنها تظهر بعد الإجابة. فالحل بنيوي: لا خيارات قبل أن يمرّ زمن القراءة.
// ٩٠ كلمة/دقيقة سرعة قراءة صامتة متحفّظة لسادس ابتدائي، والحدّ الأدنى ٨ ثوانٍ والأقصى ٤٥.
const GATE_MIN_WORDS=25,GATE_WPM=90,GATE_MIN_S=8,GATE_MAX_S=45;
// حدّ أدنى بحسب نوع السؤال لا بطوله وحده. حدّ الـ٢٥ كلمة كان لا يُطلق على نصوص
// الفهم المقروء والاستدلال هنا (١٥–٢٠ كلمة)، فمرّت في ثانية ونصف. والدليل من بياناتها:
// النصّ الذي قرأته ٨٠ ثانية أصابته، واللذان مرّا في ١٫٦ و٢٫٤ ثانية أخطأتهما.
const GATE_FLOOR_BY_TYPE={reading:12,logic:10};
// الكمّي: ٢١ من ٧٦ صحيحة حين تُجيب في أقل من خمس ثوانٍ (٢٨٪)، و٦ من ٨ حين تتجاوزها (٧٥٪).
// أربعة وثمانون سؤالاً — فالفرق ليس صدفة، وهو نفس نمط الفهم المقروء قبل بوّابته.
// لكن ليس كل سؤال كمّي يحتاج تفكيراً: «٧ × ٨» استرجاع. فنُبوِّب متعدّد الخطوات وحده.
// الزمن من الدليل لا من التماثل مع القراءة: الفارق عندها عند خمس ثوانٍ (٢٨٪ تحتها،
// ٧٥٪ فوقها). فثمانٍ تضعها فوق العتبة بهامش، بلا انتظار زائد على اثني عشر سؤالاً.
// والرسم أطول لأنه يحتاج قراءة شكل قبل الحساب.
const QUANT_GATE_SEC=8, QUANT_GATE_SVG_SEC=12;
function quantMultiStep(it){
  if(!it)return false;
  if(it.svg)return true;                                  // رسم ⇒ قراءة شكل ثم حساب
  const q=String(it.q||"");
  const words=q.trim().split(/\s+/).filter(Boolean).length;
  const nums=(q.match(/[0-9٠-٩]+/g)||[]).length;
  // «٧ × ٨ = ؟» فيها رقمان وهي استرجاع محض، فعدّ الأرقام وحده يُبوِّب ما لا يستحقّ.
  // المسألة اللفظية تحتاج جملة: سبع كلمات فأكثر. والمتتاليات تُلتقط بكثرة أرقامها.
  return words>=7||nums>=4;
}
// المفردات لا تُبوَّب عمداً رغم ١/٣ في الجلسة: على عشرين سؤالاً كانت ٩/١٦ حين أسرعت
// و١/٤ حين أبطأت — أي أن البطء عندها علامة صعوبة لا تسرّع، فالبوّابة تؤخّرها بلا فائدة.
// الدليل عكس ما توقّعتُ، فاتّبعتُه.
let gateKind="";
// المرونة: ٤ من ١٢ بمتوسّط ٢٫٨ ثانية، وإحدى عشرة إجابة من اثنتي عشرة تحت خمس ثوانٍ.
// وأخطاؤها لم تكن جهلاً بل صدى لرقم في السؤال: «٤٢° مقسومة إلى ٣» فأجابت ٤٢° في
// ١٫٤ ثانية، و«★ + ● + ● = ٢٠ و● = ٦» فأجابت ٦. والدليل القاطع أنها تعرف الحلّ:
// السؤال نفسه بقسمة على اثنين أصابته في ١٫٧ ثانية. فالعائق اندفاع لا مفهوم.
//
// ما يُبوَّب: ما فيه رسم (يحتاج مسحاً بصرياً) أو رقمان فأكثر (يحتاج حساباً).
// وما لا يُبوَّب: استرجاع الكلمات («ما ضدّ كلمة…») — كالمفردات تماماً، بطؤها فيها
// علامة جهل لا تسرّع، فالبوّابة تُؤخّرها بلا فائدة.
const FLEX_GATE_SEC=8, FLEX_GATE_SVG_SEC=12;
function flexMultiStep(it){
  if(!it)return false;
  if(it.svg)return true;
  const q=String(it.q||"");
  return (q.match(/[0-9٠-٩]+/g)||[]).length>=2;
}
function gateSecondsFor(it,qtypeArg){
  // يقبل عنصر السؤال كاملاً (للرسم والمجال) أو نصّاً ونوعاً كما كان
  const item=(it&&typeof it==="object")?it:{q:it,qtype:qtypeArg};
  const text=String(item.q||""),qtype=item.qtype;
  const w=text.trim().split(/\s+/).filter(Boolean).length;
  const byLen=w>=GATE_MIN_WORDS?Math.max(GATE_MIN_S,Math.round(w/GATE_WPM*60)):0;
  let floor=GATE_FLOOR_BY_TYPE[qtype]||0;
  if(item.d==="quant"&&quantMultiStep(item))floor=Math.max(floor,item.svg?QUANT_GATE_SVG_SEC:QUANT_GATE_SEC);
  if(item.d==="flex"&&flexMultiStep(item))floor=Math.max(floor,item.svg?FLEX_GATE_SVG_SEC:FLEX_GATE_SEC);
  return Math.min(GATE_MAX_S,Math.max(byLen,floor));
}
let gateSecs=0,gateLeft=0,gateTimer=null,gateSeen=false;
function gateStop(){if(gateTimer){clearInterval(gateTimer);gateTimer=null}}
function gateStart(it,qtypeArg){
  const item=(it&&typeof it==="object")?it:{q:it,qtype:qtypeArg};
  gateKind=(item.d==="quant"&&quantMultiStep(item))?"quant"
    :(item.d==="flex"&&flexMultiStep(item))?"flex":(item.qtype||"");
  gateStop();gateSecs=gateSecondsFor(item);gateLeft=gateSecs;
  if(!gateSecs)return;
  gateTimer=setInterval(()=>{gateLeft--;if(gateLeft<=0){gateLeft=0;gateStop()}render()},1000);
}
function gateOpen(){return gateSecs===0||gateLeft<=0}
function gateReveal(){gateLeft=0;gateStop();gateSeen=true;render()} // لا تتخطّى الزمن، تُستعمل بعده فقط
// أنواع تتطلّب قراءة/تفكيراً أطول من مجرّد الاسترجاع (نص، علاقة، استنتاج) — لها حدّ أدنى فوري خاص
// بدل انتظار ٤ إجابات متتالية سريعة؛ إجابة واحدة أسرع من الحدّ كافية لتنبيه الاستعجال
const RAPID_MIN_BY_TYPE={reading:6000,logic:4000,analogy:4000};

function choose(i){
  if(locked)return;
  picked=i;locked=true;
  const q=filtered[idx];
  const ok=i===q.a;
  if(ok)score++;
  answered[idx]=ok;
  const elapsed=Date.now()-questionShownAt;
  // أسئلة الذكاء الاصطناعي تُولَّد وقت الاختبار ولا توجد في الكود، فبلا حفظ نصّها يستحيل
  // مراجعة ما أخطأت فيه. نحفظ نصّها وإجابتها المختارة (لا الصحيحة) للتشخيص لاحقاً.
  // كان النصّ يُحفظ لأسئلة الذكاء الاصطناعي وحدها (التي لها qtype)، فبقي الكمّي بلا نصّ —
  // ورأيتُ ١/١٢ ولم أستطع أن أعرف أي أسئلة كانت. النصّ يُحفظ الآن لكل سؤال.
  const ansTxt=q.c&&q.c[i]!=null?String(q.c[i]):null;
  // الخيارات كلّها مع نصّ السؤال: جلسة ١٣ أغسطس أجابت عن سؤالين منطقيين مختلفين
  // (أطبّاء/جامعة، وصيّادون/بحر) بالجواب نفسه «يذهبون إلى المستشفيات» — وهو لا معنى له
  // في سؤال الصيّادين أصلاً. ولم أستطع الحكم: أهو خللٌ في التوليد أم انحيازُ موضع؟

  const wasWrong=(qzErrOf(tmplKey(q))||{}).wrong||0;

// بنك الحقائق: جمع/طرح ١-٩ (مجاميع حتى ١٨)، وضرب/قسمة ٢-٩ (جداول الضرب الأساسية)
function buildFactBank(){
  const items=[];
  for(let a=1;a<=9;a++)for(let b=a;b<=9;b++){
    items.push({id:`add_${a}_${b}`,op:"add",a,b,ans:a+b});
    items.push({id:`sub_${a+b}_${b}`,op:"sub",a:a+b,b,ans:a});
    if(a!==b)items.push({id:`sub_${a+b}_${a}`,op:"sub",a:a+b,b:a,ans:b});
  }
  for(let a=2;a<=9;a++)for(let b=a;b<=9;b++){
    items.push({id:`mul_${a}_${b}`,op:"mul",a,b,ans:a*b});
    items.push({id:`div_${a*b}_${b}`,op:"div",a:a*b,b,ans:a});
    if(a!==b)items.push({id:`div_${a*b}_${a}`,op:"div",a:a*b,b:a,ans:b});

// استراتيجية فورية عند الخطأ: تعليم صريح لطريقة أسرع من العدّ، لا مجرد إعطاء الجواب
function factStrategy(op,a,b,ans,noLadder){
  if(op==="add"){
    if(a===b)return `مضاعف: ${toAr(a)}+${toAr(a)}=${toAr(ans)} — احفظي المضاعفات فهي أسرع من العدّ`;
    if(Math.abs(a-b)===1){const s=Math.min(a,b);return `مضاعف قريب: ${toAr(s)}+${toAr(s)}=${toAr(2*s)}، والفرق واحد فقط، إذن الجواب ${toAr(2*s)}+١=${toAr(ans)}`;}
    if(a===9||b===9){const other=a===9?b:a;return `أكملي العشرة: ٩ يحتاج ١ ليكمل ١٠، فحوّلي ${toAr(other)} إلى (١+${toAr(other-1)}): ١٠+${toAr(other-1)}=${toAr(ans)}`;}
    if((a===8||b===8)&&Math.min(a,b)>=2){const other=a===8?b:a;return `أكملي العشرة: ٨ يحتاج ٢ ليكمل ١٠، فحوّلي ${toAr(other)} إلى (٢+${toAr(other-2)}): ١٠+${toAr(other-2)}=${toAr(ans)}`;}
    return `ابدئي من العدد الأكبر (${toAr(Math.max(a,b))}) وعدّي ${toAr(Math.min(a,b))} فوقه: <b>${toAr(ans)}</b> — لا تبدئي العدّ من واحد`;
  }
  if(op==="sub"){
    // الصعود عبر العشرة: أسرع وأدقّ من العدّ التنازلي لطالبة ما زالت تعدّ بأصابعها (Torbeyns et al. 2009)
    if(a>10&&b<10&&ans<10){const up=10-b,rest=a-10;
      return `اصعدي عبر العشرة: من ${toAr(b)} إلى ١٠ تحتاجين ${toAr(up)}، ومن ١٠ إلى ${toAr(a)} تحتاجين ${toAr(rest)}، إذن ${toAr(up)}+${toAr(rest)}=<b>${toAr(ans)}</b>`;}
    return `فكّري بها كجمع ناقص: ${toAr(b)}+؟=${toAr(a)} — الجواب <b>${toAr(ans)}</b>`;
  }
  if(op==="mul"){
    if(a===9||b===9){const other=a===9?b:a;return `الضرب في ٩: (${toAr(other)}×١٠)−${toAr(other)}=${toAr(10*other)}−${toAr(other)}=<b>${toAr(ans)}</b>`;}
    if(a===b)return `مربّع العدد: ${toAr(a)}×${toAr(a)}=<b>${toAr(ans)}</b>`;
    if(a===2||b===2)return `الضرب في ٢ = جمع العدد مع نفسه: <b>${toAr(ans)}</b>`;
    if(a===5||b===5)return `الضرب في ٥ = عدّي بالخمسات حتى ${toAr(a)} خطوة، أو (العدد×١٠)÷٢ = <b>${toAr(ans)}</b>`;
    const smaller=Math.min(a,b),bigger=Math.max(a,b);
    return `استعملي حقيقة أصغر تعرفينها: ${toAr(bigger)}×${toAr(smaller-1)}=${toAr(bigger*(smaller-1))} ثم أضيفي ${toAr(bigger)} أخرى = <b>${toAr(ans)}</b>`;
  }
  // القسمة أضعف عملياتها: نربطها صراحةً بجدول الضرب الذي تتقنه، ونُظهر سُلَّم العدّ بالقفزات كجسر مؤقّت
  // حين تُعرض المصفوفة التفاعلية تحته نُسقط السُّلَّم الساكن: تمثيلان لنفس الفكرة يزدحمان
  if(op==="div")return `القسمة ضرب معكوس: <b>${toAr(ans)}</b> × ${toAr(b)} = ${toAr(a)}، إذن ${toAr(a)} ÷ ${toAr(b)} = <b>${toAr(ans)}</b>${noLadder?"":factSkipLadder(b,ans)}`;
  return "";
}
// سُلَّم القفزات: يُظهر أن ٣٦÷٤ هي "كم أربعة حتى نصل ٣٦" — تمثيل ملموس يسبق الاسترجاع الفوري (Baroody 2006)
function factSkipLadder(b,ans){
  if(!(b>=2&&ans>=2&&ans<=9))return "";
  let s="";
  for(let k=1;k<=ans;k++){
    const last=k===ans;
    s+=`<span style="display:inline-block;min-width:34px;text-align:center;padding:3px 5px;margin:2px;border-radius:8px;font-weight:800;background:${last?'#0D9488':'#F1F5F9'};color:${last?'#fff':'#475569'}">${toAr(b*k)}</span>`;
  }
  return `<div style="margin-top:10px;direction:ltr">${s}</div><div style="font-size:13px;color:#0F766E;margin-top:4px">عدّي بالـ${toAr(b)}: وصلنا ${toAr(b*ans)} بعد <b>${toAr(ans)}</b> قفزات</div>`;
}
// تلميح قبل الإجابة بلا كشف الناتج: يظهر للحقيقة الجديدة أو التي أخطأت فيها آخر مرة،
// ويُسحب تلقائياً بمجرد أن تسترجعها صحيحة مرة واحدة (تلاشي الدعامة — Renkl & Atkinson)
function factCue(op,a,b){
  if(op==="div")return `اسألي نفسك: <b>كم ${toAr(b)} في ${toAr(a)}؟</b> أي ؟ × ${toAr(b)} = ${toAr(a)} — من جدول الضرب، لا بالعدّ`;
  if(op==="sub")return `اصعدي من ${toAr(b)} إلى ${toAr(a)}: <b>كم تحتاجين لتصلي؟</b> (الطرح جمعٌ ناقص)`;
  if(op==="mul")return `ابدئي من حقيقة قريبة تعرفينها ثم عدّلي — لا تجمعي واحدة واحدة`;
  return `ابدئي من العدد الأكبر (${toAr(Math.max(a,b))}) وأضيفي الباقي — لا تعدّي من واحد`;
}
function buildFactPlan(){
  const st=factSrsLoad(),today=srsToday(),POOL=factBank();
  const due=POOL.filter(i=>st[i.id]&&st[i.id].due<=today);
  const fresh=POOL.filter(i=>!st[i.id]);
  const chosen=[];let secs=0,newCount=0;
  const add=it=>{if(secs+FACT_SECS>FACT_PLAN_SECS)return false;chosen.push(it);secs+=FACT_SECS;return true};
  shuffle(due).forEach(add);
  // القسمة أضعف عملياتها: سبع حقائق قسمة جديدة متتالية في جلسة واحدة تدفع للتخمين لا للتعلّم.
  // المُراجَع منها لا يُقيَّد — هو ما تحتاجه فعلاً — والمقيَّد هو الجديد غير المألوف.
  // والسحب بالتناوب بين العمليات لا بالخلط الأعمى: الخلط وحده كان يُخرج أحياناً جلسة
  // بلا عملية كاملة، وهو نقيض التشبيك الذي بُني عليه القسم.
  let newDiv=0;
  const buckets={};["add","sub","mul","div"].forEach(o=>{buckets[o]=shuffle(fresh.filter(i=>i.op===o))});
  let drew=true;
  while(drew&&newCount<FACT_NEW_CAP){
    drew=false;
    for(const o of ["add","sub","mul","div"]){
      if(newCount>=FACT_NEW_CAP)break;
      if(o==="div"&&newDiv>=FACT_NEW_DIV_CAP)continue;
      const it=buckets[o].shift();
      if(!it)continue;
      drew=true;
      if(add(it)){newCount++;if(o==="div")newDiv++}
    }
  }
  const byOp={};chosen.forEach(i=>(byOp[i.op]=byOp[i.op]||[]).push(i));
  const order=["add","sub","mul","div"],woven=[];
  let any=true;while(any){any=false;order.forEach(op=>{const q=byOp[op];if(q&&q.length){woven.push(q.shift());any=true}})}
  return {items:woven,secs,due:due.length,fresh:newCount};
}
let factItems=[],factIdx=0,factInput="",factLocked=false,factScore=0,factTotal=0,factDone=false,factMeta=null;

// فالطلاقة دقّةٌ **مع** سرعة، وطفلةٌ تُصيب عشراً من عشر في عشر دقائق ليست طليقة.
// وهذا يحسم سؤالاً لم نملك جواباً له: وسيط ٨٣٢ ملّي ثانية في جلسة و١٧ ألفاً في أخرى —

function digitsOf(n){return String(Math.abs(Math.round(Number(n)||0))).length}
function factDcpm(){
  const rows=factLog.filter(function(l){return !l.remedy&&Number.isFinite(l.ms)&&l.ms>0});
  if(!rows.length)return null;
  const ms=rows.reduce(function(s,l){return s+l.ms},0);
  const digits=rows.reduce(function(s,l){return s+(l.ok?(l.digits||1):0)},0);
  if(ms<1000)return null;
  return{dcpm:Math.round(digits/(ms/60000)),digits:digits,mins:ms/60000,n:rows.length};

function factCheck(){
  if(factLocked)return;
  const el=document.getElementById('factIn');
  const val=(el?el.value:"").trim();
  const ms=factShownAt?Date.now()-factShownAt:null;
  factInput=val;factLocked=true;
  const it=factCur(),ok=parseInt(val,10)===it.ans;
  if(ok)factScore++;
  if(!ok&&it.op==="div"){divArmArray(it.a,it.b);factRemedyAt=Date.now();factRemedyId=it.id}
  factLog.push({op:it.op,ok,ms,cue:factCueOn,digits:digitsOf(it.ans)});
  factSrsUpdate(it.id,ok);
  // اسم الخطأ من الفهرس هنا أيضاً: القسمة أضعف عملياتها، والفهرس يقول لماذا
  const fbug=ok?null:bugOf(it.op,it.a,it.b,parseInt(val,10));
  // بوّابتا الطرح (ob1/bt) موصولتان هنا: نفس شكل الخطأ الذي عولج في الأساسيات كان
  // يتكرّر هنا بلا علاج (count_all_not_gaps: ٤ مرّات). القسمة لا تحتاج وصلاً مماثلاً —
  // لها علاجها العامّ أعلاه أصلاً على كل خطأ، بلا شرط تكرار.
  if(!ok&&it.op==="sub"&&fbug&&BUG_GATES[fbug.id]){
    shapeRecord(fbug.id,true);
    if(shapeArmed(fbug.id))BUG_GATES[fbug.id](it.a,it.b);
  }else if(ok){
    shapeRecord("count_all_not_gaps",false);shapeRecord("borrow_no_decrement",false);
  }
  logAnswer("fact_fluency",it.op,ok,val+(fbug?" · "+fbug.id:""),it.id,ms,
    {q_text:`${it.a} ${FACT_OP_SYM[it.op]} ${it.b}`});
  render();
}
// نقيس التفاعل مع المصفوفة بدل أن نستنتجه من فروق الأزمنة: كم ضغطة، وهل أُكملت، وكم مكثت
function factLogRemedy(){
  if(factRemedyAt){
    const dwell=Date.now()-factRemedyAt,done=divComplete();
    factLog.push({op:"div",remedy:true,taps:divTaps,done,ms:dwell});
    logAnswer("fact_fluency","array",done,String(divTaps),factRemedyId,dwell,{q_text:`${divA} ÷ ${divB}`});
    factRemedyAt=0;factRemedyId=null;
  }
  shapeLogRemedy("fact_fluency");
}
function factNext(){

const FACT_OP_LABEL={add:"جمع",sub:"طرح",mul:"ضرب",div:"قسمة"};
function factMedian(arr){if(!arr.length)return null;const s=arr.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)}
// تفصيل حسب العملية: النسبة وحدها لا تكفي — الزمن يفرّق بين "خمّنت" و"حسبت ببطء"، والعلاج مختلف
function factOpBreakdown(){
  return ["add","sub","mul","div"].map(op=>{
    const rows=factLog.filter(l=>l.op===op&&!l.remedy);   // سطور العلاج ليست أسئلة فلا تدخل النسبة
    if(!rows.length)return null;
    const r=rows.filter(l=>l.ok).length;
    const med=factMedian(rows.filter(l=>l.ms!=null).map(l=>l.ms));
    const guessy=rows.filter(l=>!l.ok&&l.ms!=null&&l.ms<3000).length; // خطأ في أقل من ٣ ثوانٍ ⇒ تخمين لا حساب
    return{op,r,t:rows.length,pct:Math.round(100*r/rows.length),med,guessy};
  }).filter(Boolean);
}

function todayStr(){return new Date().toISOString().slice(0,10)}
function getStreak(){try{return JSON.parse(lsGet("mawhiba_streak")||'{"days":0,"last":""}')}catch(e){return{days:0,last:""}}}
function bumpStreak(){const st=getStreak();const t=todayStr();if(st.last===t)return st;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);st.days=(st.last===y)?st.days+1:1;st.last=t;lsSet("mawhiba_streak",JSON.stringify(st));return st}
// رسالة نمو: تقارن بأفضل نتيجة سابقة لنفس الوضع
function growthMsg(modeKey,pct){try{const key="mawhiba_best_"+modeKey;const prev=parseInt(lsGet(key)||"-1");let msg="";if(prev<0){msg="أول محاولة في هذا القسم — انطلاقة موفّقة! 🌱"}else if(pct>prev){msg=`تحسّنتِ عن أفضل نتيجة سابقة (${toAr(prev)}%)! تقدّم رائع 📈`}else if(pct===prev){msg="ثبات على أفضل مستوى سابق 💪"}else{msg="واصلي، كل محاولة تبني مهارتك 🌟"}if(pct>prev)lsSet(key,String(pct));return msg}catch(e){return""}}

    ${doms}
    ${remedy}
    <button class="btn" style="background:#1E293B;margin-top:18px" onclick="start('${currentMode==='full'?'full':currentMode}')">إعادة (أسئلة جديدة)</button>
    <button class="link-btn" onclick="loadProgress()">📈 متابعة التقدّم</button>
    <button class="link-btn" onclick="home()">→ الرئيسية</button>
  </div>`;
}

function fmtDate(s){const d=new Date(s);return d.toLocaleDateString('ar-SA',{month:'numeric',day:'numeric'})+' '+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})}
function renderProgress(){
  if(attempts===null){app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع</button><div class="card"><div class="empty">جارٍ تحميل النتائج…</div></div>`;return}
  if(!attempts.length){app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع</button><div class="card"><div class="empty">ما فيه نتائج بعد.<br>ابدئي أول تدريب وستظهر هنا. 🌱</div><button class="btn" style="background:#1E293B" onclick="home()">ابدئي الآن</button></div>`;return}
  const acc={verbal:{r:0,t:0},quant:{r:0,t:0},science:{r:0,t:0},flex:{r:0,t:0}};
  attempts.forEach(a=>{acc.verbal.r+=a.verbal_correct||0;acc.verbal.t+=a.verbal_total||0;acc.quant.r+=a.quant_correct||0;acc.quant.t+=a.quant_total||0;acc.science.r+=a.science_correct||0;acc.science.t+=a.science_total||0;acc.flex.r+=a.flex_correct||0;acc.flex.t+=a.flex_total||0});
  const doms=Object.keys(DOMAINS).filter(k=>acc[k].t).map(k=>{const d=DOMAINS[k];const p=Math.round(acc[k].r/acc[k].t*100);return `<div class="dom-row"><div class="dom-head"><span>${d.name}</span><span>${toAr(p)}%</span></div><div class="track"><div class="fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join("");
  const rows=attempts.slice().reverse().slice(0,12).map(a=>{const p=Math.round((a.score/a.total)*100);const mn=a.mode==="full"?"محاكاة شاملة":(DOMAINS[a.mode]?DOMAINS[a.mode].name:a.mode);return `<div class="attempt"><div><div class="att-mode">${mn}</div><div class="att-date">${fmtDate(a.created_at)}</div></div><div class="att-score" style="color:${p>=70?'#059669':p>=50?'#D97706':'#DC2626'}">${toAr(a.score)}/${toAr(a.total)} · ${toAr(p)}%</div></div>`}).join("");
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="section-title"><span>متابعة تقدّم ${alias()}</span></div>
  <div class="card"><div style="font-weight:800;margin-bottom:14px">متوسّط المستوى لكل مجال</div>${doms}</div>
  <div class="card"><div style="font-weight:800;margin-bottom:6px">آخر المحاولات</div>${rows}</div>`;
}

genderizeInit();
logQueueFlush();
render();

</script>
</body>
</html>
