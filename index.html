<script>
/* فحص الإصدار. كان موجوداً منذ البداية لكنه ميت لسببين، وهما سبب بقاء هيا ٩٠ دقيقة على نسخة
   قديمة فلم يصلها أي إصلاح: (١) BUILD لم يُحدَّث منذ ٢٣ يوليو، فيقارن النص بنفسه ويطابق دائماً.
   (٢) الفحص مرة واحدة فقط لكل جلسة تصفّح، والصفحة تبقى مفتوحة ساعات فلا يُعاد.
   الحل: فحص عند التحميل بعلامة الإصدار، ثم فحص دوري وعند العودة للتبويب بمقارنة حجم الملف —
   وهذه تلقائية لا تحتاج تحديثاً يدوياً، فتصمد لو نسيتُ تحديث BUILD مرة أخرى. */
(function(){
  var BUILD="build-20260807-1705";
  try{window.__BUILD=BUILD}catch(e){}
  var url=function(){return location.pathname+"?_cb="+Date.now()};
  var baseLen=null, notified=false;
  function fetchHtml(){return fetch(url(),{cache:"no-store"}).then(function(r){return r.text()})}
  function banner(){
    if(notified)return; notified=true;
    var d=document.createElement("div");
    d.setAttribute("style","position:fixed;inset-inline:0;bottom:0;z-index:9999;background:#1D4ED8;color:#fff;"+
      "padding:14px 16px;font:700 15px system-ui,sans-serif;text-align:center;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.2)");
    d.textContent="🔄 يوجد تحديث جديد للتطبيق — اضغطي هنا للتحديث";
    d.onclick=function(){location.href=location.pathname+"?_r="+Date.now()};
    document.body.appendChild(d);
  }
  // عند التحميل: لو كان المتصفّح يعرض نسخة مخزّنة أقدم من الخادم، نُحدّث فوراً (لا عمل جارياً بعد)
  // حارس: إعادة تحميل واحدة لكل جلسة تصفّح لا أكثر. بلا هذا الحارس، اختلافُ نسخةٍ بين
  // عُقد الشبكة يُدخل الصفحة في حلقة إعادة تحميل تسرق كل لمسة فيبدو التطبيق ميتاً.
  var GUARD="mawhiba_reload_guard";
  function guardGet(){try{return parseInt(sessionStorage.getItem(GUARD)||"0",10)||0}catch(e){return 9}}
  function guardSet(n){try{sessionStorage.setItem(GUARD,String(n))}catch(e){}}
  fetchHtml().then(function(html){
    baseLen=html.length;
    if(html.indexOf(BUILD)===-1){
      if(guardGet()>=1){banner();return}
      guardSet(1);
      location.href=location.pathname+"?_r="+Date.now();
    }else{try{sessionStorage.removeItem(GUARD)}catch(e){}}
  }).catch(function(){});
  // بعد ذلك: لا نُحدّث تلقائياً حتى لا نُضيّع إجابة جارية — نعرض شريطاً تضغطه هي
  function recheck(){
    if(baseLen===null||notified)return;
    fetchHtml().then(function(html){if(html.length!==baseLen)banner()}).catch(function(){});
  }
  setInterval(recheck,10*60*1000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)recheck()});
})();
</script>

<script>
// ===== إظهار الأخطاء بدل ابتلاعها =====
// خطأ واحد في المستوى الأعلى كان كفيلاً بإيقاف تعريف بقية الملف، فتموت كل الأزرار في كل
// الأقسام بلا أي أثر مرئي. الآن يُعرض الخطأ باسمه وموضعه على الشاشة، فيُرى بدل أن يُخمَّن.
window.__ERRS=[];
function appError(where,e){
  try{
    var msg=(e&&(e.message||e.reason&&e.reason.message))||String(e&&e.reason||e||"");
    var line=(e&&e.lineno)?(" سطر "+e.lineno):"";
    window.__ERRS.push({where:where,msg:msg,line:line});
    var id="appErrBar",old=document.getElementById(id);
    if(old)old.parentNode.removeChild(old);
    var d=document.createElement("div");
    d.id=id;
    d.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:99999;background:#7F1D1D;color:#fff;"+
      "padding:10px 40px 10px 12px;font:700 12px system-ui,sans-serif;text-align:start;direction:rtl;"+
      "max-height:34vh;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.3)");
    d.innerHTML='<div style="font-size:13px;margin-bottom:4px">⚠️ حدث خطأ في التطبيق — أرسلي هذه الرسالة</div>'+
      window.__ERRS.slice(-4).map(function(x){
        return '<div style="font-weight:400;font-size:11.5px;line-height:1.7;direction:ltr;text-align:left">'+
          x.where+': '+String(x.msg).slice(0,220)+x.line+'</div>'}).join("");
    var b=document.createElement("button");
    b.textContent="✕";
    b.setAttribute("style","position:absolute;top:6px;inset-inline-end:8px;right:8px;background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;padding:2px 8px");
    b.onclick=function(){d.parentNode&&d.parentNode.removeChild(d)};
    d.appendChild(b);
    (document.body||document.documentElement).appendChild(d);
  }catch(_){}
}
// ===== جلب بمهلة =====
// طلبٌ بلا مهلة يُبقي علم "جارٍ التحقّق" مرفوعاً إلى الأبد، فيُرسَم زرّ التسجيل معطّلاً
// ولا يستجيب للمس إطلاقاً — وهو عطلٌ يبدو للمستعملة كأن الزرّ نفسه مكسور.
const NET_TIMEOUT_MS=25000;
function fetchTimeout(url,opts,ms){
  ms=ms||NET_TIMEOUT_MS;
  if(typeof AbortController==="undefined"){
    return Promise.race([fetch(url,opts),
      new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},ms)})]);
  }
  var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);
  var o={};for(var k in opts)o[k]=opts[k];o.signal=c.signal;
  return fetch(url,o).then(function(r){clearTimeout(t);return r},
                           function(e){clearTimeout(t);throw (e&&e.name==="AbortError")?new Error("timeout"):e});
}
window.addEventListener("error",function(ev){appError("خطأ",ev)});
window.addEventListener("unhandledrejection",function(ev){appError("وعد",ev)});

// ===== إعدادات =====
const SB_URL="https://yzznkerweqkmhrtbidrl.supabase.co";
const SB_KEY="sb_publishable_W9ijdHn1vHj3-rUDCx2U5Q_yq6ebbsI";
const FN_URL=SB_URL+"/functions/v1/generate-question";
const TBL="mawhiba_attempts";
const TBL_LOG="mawhiba_answer_log";
const DOMAINS={
  verbal:{name:"الاستدلال اللغوي",color:"#2563EB",soft:"#DBEAFE"},
  quant:{name:"الرياضي والمكاني",color:"#0D9488",soft:"#CCFBF1"},
  science:{name:"الاستدلال العلمي",color:"#7C3AED",soft:"#EDE9FE"},
  flex:{name:"المرونة والأنماط",color:"#D97706",soft:"#FEF3C7"},
};
const L=["أ","ب","ج","د"];
const PER=12;
const DAILY_CAP=80; // حد أقصى لطلبات الذكاء الاصطناعي يومياً (تحكّم بالتكلفة)

// ===== أدوات =====
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const toAr=n=>String(n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function arSeq(a){return a.map(toAr).join(" ، ")}
function mcNum(correct,cands){const opts=[correct];(cands||[]).forEach(x=>{x=Math.round(x);if(opts.length<4&&Number.isFinite(x)&&x>=0&&!opts.includes(x))opts.push(x)});let p=1;while(opts.length<4){[correct+p,correct-p].forEach(x=>{if(opts.length<4&&x>=0&&!opts.includes(x))opts.push(x)});p++;if(p>300)break}const sh=shuffle(opts);return{choices:sh.map(x=>Number.isInteger(x)?toAr(x):arDec(x)),answer:sh.indexOf(correct)}}
function arDec(x){return toAr(String(round2(x))).replace(".","٫")}
// خيارات عشرية: mcNum يقرّب للأعداد الصحيحة فيمحو الفاصلة — وهي بيت القصيد هنا
function mcNumDec(correct,cands){
  const opts=[round2(correct)];
  (cands||[]).forEach(x=>{x=round2(x);if(opts.length<4&&Number.isFinite(x)&&x>0&&opts.indexOf(x)<0)opts.push(x)});
  let p=1;
  while(opts.length<4){[round2(correct+p),round2(correct-p)].forEach(x=>{if(opts.length<4&&x>0&&opts.indexOf(x)<0)opts.push(x)});p++;if(p>300)break}
  const sh=shuffle(opts);return{choices:sh.map(arDec),answer:sh.indexOf(round2(correct))};
}
function qz(d,q,correct,cands,w){const m=mcNum(correct,cands);return{d,q,c:m.choices,a:m.answer,w}}

// ===== مولّدات الرياضي =====
function gArith(){const s=rand(2,9),a=rand(1,9);const q=[a];for(let i=0;i<3;i++)q.push(q[i]+s);const ans=q[3]+s;return qz("quant",`أكمل المتتالية: ${arSeq(q)} ، ...`,ans,[ans+s,ans-s,q[3]+1],`يزيد العدد ${toAr(s)} في كل مرة: ${toAr(q[3])} + ${toAr(s)} = ${toAr(ans)}.`)}
function gGeo(){const r=pick([2,3]),a=rand(2,5);const q=[a];for(let i=0;i<3;i++)q.push(q[i]*r);const ans=q[3]*r;return qz("quant",`أكمل المتتالية: ${arSeq(q)} ، ...`,ans,[ans-a,q[3]+r,ans+a],`كل عدد = الذي قبله × ${toAr(r)}: ${toAr(q[3])} × ${toAr(r)} = ${toAr(ans)}.`)}
function gPrice(){const per=rand(2,6),k=rand(2,4),m=rand(5,8);const ck=per*k;return qz("quant",`إذا كان ثمن ${toAr(k)} أقلام ${toAr(ck)} ريالاً، فكم ثمن ${toAr(m)} أقلام؟`,per*m,[per*m+per,per*m-per,per*(m+1)],`سعر القلم = ${toAr(ck)} ÷ ${toAr(k)} = ${toAr(per)}، إذن ${toAr(m)} × ${toAr(per)} = ${toAr(per*m)} ريالاً.`)}
function gPerim(){if(pick([0,1])){const side=rand(3,12);return qz("quant",`محيط مربع طول ضلعه ${toAr(side)} سم. كم محيطه؟`,4*side,[4*side+4,4*side-4,side*3],`محيط المربع = ٤ × الضلع = ${toAr(4*side)} سم.`)}const per=4*rand(3,12);return qz("quant",`محيط مربع يساوي ${toAr(per)} سم. كم طول ضلعه؟`,per/4,[per/4+1,per/4-1,per/2],`الضلع = المحيط ÷ ٤ = ${toAr(per/4)} سم.`)}
function gClock(){const names=["","الواحدة","الثانية","الثالثة","الرابعة","الخامسة","السادسة"];const h=rand(1,6),ang=30*h;return qz("quant",`عندما تشير الساعة إلى ${names[h]} تماماً، كم الزاوية بين عقربَيها؟`,ang,[ang+30,ang-30,ang+15],`كل ساعة = ٣٠°، وعند ${toAr(h)}:٠٠ الزاوية = ${toAr(ang)}°.`)}
function gSides(){const sh=pick([["المثلث",3],["المربع",4],["الشكل الخماسي",5],["الشكل السداسي",6],["الشكل الثماني",8]]);return qz("quant",`كم عدد أضلاع ${sh[0]}؟`,sh[1],[sh[1]+1,sh[1]-1,sh[1]+2],`${sh[0]} له ${toAr(sh[1])} أضلاع.`)}
// متقدّمة
function gWorkers(){const w1=rand(3,6),f=rand(2,4),d2=rand(3,6);const total=w1*d2*f;const d1=total/w1;const w2=total/d2;return qz("quant",`يستطيع ${toAr(w1)} عمّال دهن بيت في ${toAr(d1)} يوماً. كم عاملاً يدهنون نفس البيت في ${toAr(d2)} أيام؟`,w2,[w2+1,w2-1,w1+d2],`العمل ثابت: العمّال × الأيام = ${toAr(total)}. العمّال = ${toAr(total)} ÷ ${toAr(d2)} = ${toAr(w2)}.`)}
function gMedian(){const mid=rand(4,20),sum=5*mid;return qz("quant",`مجموع خمسة أعداد صحيحة متتالية يساوي ${toAr(sum)}. أوجد وسيطها.`,mid,[mid+1,mid-1,Math.round(sum/4)],`الوسيط = المجموع ÷ العدد = ${toAr(sum)} ÷ ٥ = ${toAr(mid)}.`)}
function gCube(){const s=rand(2,5),v=s*s*s,nv=(2*s)**3;return qz("quant",`مكعّب حجمه ${toAr(v)} سم³. إذا ضاعفنا طول ضلعه، فما حجمه الجديد؟`,nv,[v*2,v*4,v*6],`مضاعفة الضلع تضاعف الحجم ٨ مرّات: ${toAr(v)} × ٨ = ${toAr(nv)} سم³.`)}
function gPercent(){const rentP=pick([30,40,50]),expP=pick([20,30]),leftP=100-rentP-expP;if(leftP<=0)return gPercent();const salary=pick([6000,8000,9000,10000,12000]);const left=salary*leftP/100;if(!Number.isInteger(left))return gPercent();const onePercent=left/leftP;return qz("quant",`دفع سالم ${toAr(rentP)}% من راتبه إيجاراً و${toAr(expP)}% مصروفات، وتبقّى له ${toAr(left)} ريال. كم راتبه؟`,salary,[salary+1000,salary-1000,left*2],`المتبقّي = ${toAr(leftP)}% من الراتب = ${toAr(left)} ريال. قيمة ١% واحد = ${toAr(left)} ÷ ${toAr(leftP)} = ${toAr(onePercent)} ريال. الراتب الكامل = ${toAr(onePercent)} × ١٠٠ = ${toAr(salary)} ريال.`)}

// نقطة على بعد r من V باتجاه الزاوية phi (٠=يمين، ٩٠=أعلى)
function vAngleDeg(V,r,phi){const rad=phi*Math.PI/180;return{x:V.x+r*Math.cos(rad),y:V.y-r*Math.sin(rad)}}
function uDir(phi){const rad=phi*Math.PI/180;return{x:Math.cos(rad),y:-Math.sin(rad)}}
function unitTo(V,P){const dx=P.x-V.x,dy=P.y-V.y;const m=Math.hypot(dx,dy)||1;return{x:dx/m,y:dy/m}}
// نقطة منتصف الزاوية (منصّف) بين اتجاهين عند رأس V، تُستخدم لوضع رقم الزاوية داخلها
function bisectorPoint(V,u1,u2,r){let bx=u1.x+u2.x,by=u1.y+u2.y,bm=Math.hypot(bx,by);if(bm<1e-6){bx=-u1.y;by=u1.x;bm=1}return{x:V.x+(bx/bm)*r,y:V.y+(by/bm)*r}}
function arcPathBetween(V,u1,u2,r){const p1={x:V.x+u1.x*r,y:V.y+u1.y*r},p2={x:V.x+u2.x*r,y:V.y+u2.y*r};const cross=u1.x*u2.y-u1.y*u2.x;const sweep=cross>0?1:0;return`M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`}
// يرسم مروحة زوايا حول رأس O بدءاً من startPhi، بقيم values المتتابعة، مع تمييز الزاوية المجهولة برقم unknownIdx
function renderSectorFan(O,startPhi,values,unknownIdx,extraSVG){
  const rayLen=68,arcR=24,labR=38;
  let phis=[startPhi];values.forEach(v=>phis.push(phis[phis.length-1]+v));
  let rays="",arcs="",labels="";
  phis.forEach(p=>{const pt=vAngleDeg(O,rayLen,p);rays+=`<line x1="${O.x}" y1="${O.y}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#1E293B" stroke-width="2.5"/>`});
  for(let i=0;i<values.length;i++){
    const u1=uDir(phis[i]),u2=uDir(phis[i+1]),isUnk=i===unknownIdx;
    arcs+=`<path d="${arcPathBetween(O,u1,u2,arcR)}" fill="none" stroke="${isUnk?'#D97706':'#0D9488'}" stroke-width="2"/>`;
    const lp=bisectorPoint(O,u1,u2,labR);
    labels+=`<text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="${isUnk?'#D97706':'#0D9488'}">${isUnk?'ص':toAr(values[i])+'°'}</text>`;
  }
  return`<svg viewBox="0 0 200 200" width="200" height="200">${extraSVG||""}${rays}<circle cx="${O.x}" cy="${O.y}" r="3" fill="#1E293B"/>${arcs}${labels}</svg>`;
}

    <text x="${lB.x.toFixed(1)}" y="${lB.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#0D9488">${toAr(b)}°</text>

}

function dotsMarkup(n){const pos=[[10,10],[25,10],[40,10],[10,25],[25,25],[40,25],[10,40],[25,40],[40,40]];let s="";for(let i=0;i<n&&i<9;i++)s+=`<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="5" fill="#1E293B"/>`;return s}
function miniDots(n){return`<svg viewBox="0 0 50 50" width="50" height="50">${dotsMarkup(n)}</svg>`}
function gridCell(x,y,inner){return`<rect x="${x}" y="${y}" width="55" height="55" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><g transform="translate(${x+2.5},${y+2.5})">${inner}</g>`}
function gridQCell(x,y){return`<rect x="${x}" y="${y}" width="55" height="55" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+27}" y="${y+35}" font-size="26" font-weight="800" fill="#D97706" text-anchor="middle">؟</text>`}
function gRavenCount(){
  let cells="";
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const i=r*3+c,x=c*65+5,y=r*65+5;cells+=(i===8)?gridQCell(x,y):gridCell(x,y,dotsMarkup(i+1))}
  const svg=`<svg viewBox="0 0 200 200" width="200" height="200">${cells}</svg>`;
  const ans=9,distract=shuffle([6,7,8]);
  const choiceVals=shuffle([ans,...distract]);
  const c=choiceVals.map(n=>miniDots(n));
  return{d:"flex",q:"لاحظي عدد النقاط في كل خلية من الشبكة، ما الشكل المناسب لمكان علامة الاستفهام؟",c,a:choiceVals.indexOf(ans),w:`عدد النقاط يزيد بمقدار واحد من خلية لأخرى (١ إلى ٩)؛ الخلية الأخيرة = ${toAr(ans)} نقاط.`,svg};
}
const RAVEN_COLORS=["#0D9488","#7C3AED","#D97706"];
function triMarkup(color,rot){return`<g transform="rotate(${rot} 25 25)"><polygon points="25,10 38,38 12,38" fill="${color}"/></g>`}
function triSVG(color,rot){return`<svg viewBox="0 0 50 50" width="50" height="50">${triMarkup(color,rot)}</svg>`}
function gRavenRotate(){
  const rots=[0,90,180];
  let cells="";
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=c*65+5,y=r*65+5;if(r===2&&c===2){cells+=gridQCell(x,y)}else{cells+=gridCell(x,y,triMarkup(RAVEN_COLORS[r],rots[c]))}}
  const svg=`<svg viewBox="0 0 200 200" width="200" height="200">${cells}</svg>`;
  const correct={color:RAVEN_COLORS[2],rot:rots[2]};
  const distract=[{color:RAVEN_COLORS[2],rot:rots[0]},{color:RAVEN_COLORS[0],rot:rots[2]},{color:RAVEN_COLORS[1],rot:rots[1]}];
  const all=shuffle([correct,...distract]);
  const c=all.map(o=>triSVG(o.color,o.rot));
  return{d:"flex",q:"لاحظي أن اللون يتحدّد حسب الصف واتجاه المثلث يتحدّد حسب العمود، ما الشكل المناسب لمكان علامة الاستفهام؟",c,a:all.indexOf(correct),w:"اللون من الصف الثالث، والاتجاه من العمود الثالث (مثلث بلون الصف مُداراً ١٨٠°).",svg};
}

// ===== الرسوم البيانية (سرعة/زمن) =====
function curveSVG(kind){
  let path;
  if(kind==="accel")path="M10,50 L80,10";else if(kind==="const")path="M10,30 L80,30";else if(kind==="decel")path="M10,10 L80,50";else path="M10,50 L80,50";
  return`<svg viewBox="0 0 90 60" width="90" height="60"><line x1="10" y1="50" x2="85" y2="50" stroke="#94A3B8" stroke-width="1.5"/><line x1="10" y1="5" x2="10" y2="50" stroke="#94A3B8" stroke-width="1.5"/><path d="${path}" fill="none" stroke="#334155" stroke-width="3"/><text x="45" y="59" font-size="7" fill="#64748B" text-anchor="middle">الزمن</text><text x="3" y="11" font-size="7" fill="#64748B">السرعة</text></svg>`;
}
function gSpeedGraph(){
  const kinds=[
    {key:"accel",desc:"تنطلق السيارة من السكون وتزداد سرعتها باستمرار",exp:"خط مستقيم صاعد (السرعة تزداد بثبات)."},
    {key:"const",desc:"تسير السيارة بسرعة ثابتة طوال الطريق",exp:"خط أفقي (السرعة لا تتغيّر)."},
    {key:"decel",desc:"تتباطأ السيارة تدريجياً حتى تتوقف تماماً",exp:"خط مستقيم هابط حتى الصفر (السرعة تقل حتى التوقف)."},
    {key:"stop",desc:"تبقى السيارة متوقفة في مكانها طوال الوقت",exp:"خط أفقي عند الصفر (لا حركة)."}
  ];
  const chosen=pick(kinds),order=shuffle(kinds);
  const c=order.map(k=>curveSVG(k.key));
  return{d:"quant",q:`أيّ الرسوم البيانية التالية (السرعة/الزمن) يمثّل الوصف: «${chosen.desc}»؟`,c,a:order.findIndex(k=>k.key===chosen.key),w:`الوصف يطابق النمط: ${chosen.exp}`};
}

// ===== سلسلة أشكال هندسية (زيادة الأضلاع) =====
function regularPolygon(n,color){
  const cx=25,cy=27,r=18;let pts=[];
  for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;pts.push(`${(cx+r*Math.cos(ang)).toFixed(1)},${(cy+r*Math.sin(ang)).toFixed(1)}`)}
  return`<svg viewBox="0 0 50 50" width="50" height="50"><polygon points="${pts.join(" ")}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2.5"/></svg>`;
}
function gShapeSeries(){
  const start=rand(3,4),seq=[start,start+1,start+2,start+3],ans=start+4;
  if(ans>9)return gShapeSeries();
  const svg=`<div style="display:flex;gap:10px;align-items:center;justify-content:center">${seq.map(n=>regularPolygon(n,"#0D9488")).join("")}<span style="font-size:26px;font-weight:800;color:#D97706">؟</span></div>`;
  let distract=[ans-1,ans+1,ans-2].filter(x=>x>=3&&x!==ans);
  while(distract.length<3){const x=rand(3,9);if(x!==ans&&!distract.includes(x))distract.push(x)}

  const c=optsVals.map(n=>regularPolygon(n,"#7C3AED"));
  return{d:"flex",q:"لاحظي عدد أضلاع الأشكال في السلسلة، ما الشكل التالي؟",c,a:optsVals.indexOf(ans),w:`عدد الأضلاع يزيد بمقدار واحد في كل مرة: بعد شكل بـ ${toAr(seq[3])} أضلاع يأتي شكل بـ ${toAr(ans)} أضلاع.`,svg};
}

// ===== خط الأعداد (بصري) =====
function gNumberLine(){
  const start=rand(0,20),step=pick([1,2,5,10]),ticksCount=6;
  const markIdx=rand(1,ticksCount-2);
  const values=Array.from({length:ticksCount},(_,i)=>start+i*step);
  const ans=values[markIdx];
  const width=260,marginL=20,marginR=20,innerW=width-marginL-marginR;
  const xAt=i=>marginL+i*(innerW/(ticksCount-1));
  let ticks="",labels="";
  for(let i=0;i<ticksCount;i++){
    const x=xAt(i);
    ticks+=`<line x1="${x.toFixed(1)}" y1="34" x2="${x.toFixed(1)}" y2="46" stroke="#334155" stroke-width="2"/>`;
    if(i!==markIdx)labels+=`<text x="${x.toFixed(1)}" y="66" font-size="13" text-anchor="middle" fill="#334155">${toAr(values[i])}</text>`;
  }
  const mx=xAt(markIdx);
  const marker=`<circle cx="${mx.toFixed(1)}" cy="40" r="6" fill="#D97706"/><text x="${mx.toFixed(1)}" y="66" font-size="15" font-weight="800" text-anchor="middle" fill="#D97706">؟</text>`;
  const svg=`<svg viewBox="0 0 ${width} 80" width="${width}" height="80"><line x1="${marginL}" y1="40" x2="${width-marginR}" y2="40" stroke="#94A3B8" stroke-width="2"/>${ticks}${labels}${marker}</svg>`;
  const m=mcNum(ans,[ans+step,ans-step,ans+2*step]);
  return{d:"quant",q:"خط الأعداد مقسوم إلى أجزاء متساوية. ما العدد الذي تشير إليه النقطة؟",c:m.choices,a:m.answer,w:`الفرق بين كل علامتين متتاليتين ثابت = ${toAr(step)}. النقطة = ${toAr(ans)}.`,svg};
}

// ===== أنواع مأخوذة من كراسة تدريب قدرات فعلية (لم تكن موجودة في التطبيق) =====
const frTxt=(n,d)=>`${toAr(n)}/${toAr(d)}`;
// كسر يقع بين كسرين — كل المموّهات أصغر من الحدّ الأدنى فعلياً (تحقّقنا عددياً)
const FRAC_BETWEEN=[
  {lo:[1,4],hi:[1,2],ans:[1,3],dis:[[1,8],[1,6],[1,5]]},
  {lo:[1,6],hi:[1,3],ans:[1,4],dis:[[1,8],[1,10],[1,12]]},
  {lo:[1,8],hi:[1,4],ans:[1,6],dis:[[1,10],[1,12],[1,16]]},
  {lo:[1,5],hi:[1,2],ans:[1,3],dis:[[1,6],[1,8],[1,10]]},
  {lo:[1,10],hi:[1,5],ans:[1,8],dis:[[1,12],[1,16],[1,20]]},
];
function gFractionBetween(){
  const s=pick(FRAC_BETWEEN),f=a=>frTxt(a[0],a[1]);
  const correct=f(s.ans),all=shuffle([correct,...s.dis.map(f)]);
  return{d:"quant",q:`أي من الكسور الآتية يقع بين الكسرين ${f(s.lo)} و ${f(s.hi)}؟`,c:all,a:all.indexOf(correct),
    w:`في كسور البسط واحد: كلما كبر المقام صغرت قيمة الكسر. مقام ${correct} يقع بين مقامَي ${f(s.hi)} و${f(s.lo)}، فقيمته بينهما. أما بقية الخيارات فمقاماتها أكبر، أي قيمها أصغر من ${f(s.lo)}.`};
}
const FRAC_WORD={2:"نصف",3:"ثلث",4:"ربع",6:"سُدس"};
function gFractionOfNumber(){
  const parts=[2,3,4,6],p1=pick(parts),p2=pick(parts.filter(x=>x!==p1));
  const gcd=(a,b)=>b?gcd(b,a%b):a, L=p1*p2/gcd(p1,p2);
  const N=L*rand(2,8),v=N/p1,ans=N/p2;
  return qz("quant",`إذا كان ${FRAC_WORD[p1]} عدد ما يساوي (${toAr(v)})، فما ${FRAC_WORD[p2]} هذا العدد؟`,ans,[ans+1,ans-1,v],
    `${FRAC_WORD[p1]} العدد = ${toAr(v)}، إذن العدد كاملاً = ${toAr(v)} × ${toAr(p1)} = ${toAr(N)}. و${FRAC_WORD[p2]} العدد = ${toAr(N)} ÷ ${toAr(p2)} = ${toAr(ans)}.`);
}
// الأوراق النقدية من فئتين — نوع متكرّر في قدرات
const BILL_PAIRS=[[200,500],[50,100],[100,500],[10,50],[20,50],[5,10]];
function gBills(){
  const [a,b]=pick(BILL_PAIRS),T=rand(3,8),x=rand(1,T-1),y=T-x,S=a*x+b*y;
  return qz("quant",`إذا كان مع محمد ${toAr(S)} ريالاً من فئة ${toAr(a)} و${toAr(b)} ريال، وكان عدد الأوراق النقدية ${toAr(T)} أوراق، فكم ورقة معه من فئة ${toAr(a)} ريالاً؟`,x,[y,x+1,x-1],
    `لو كانت الأوراق ${toAr(T)} كلها من فئة ${toAr(b)} لصار المجموع ${toAr(b*T)} ريالاً. الفرق عن الحقيقي = ${toAr(b*T)} − ${toAr(S)} = ${toAr(b*T-S)}. وكل ورقة من فئة ${toAr(a)} تُنقص المجموع ${toAr(b-a)} ريالاً، إذن عددها = ${toAr(b*T-S)} ÷ ${toAr(b-a)} = ${toAr(x)} ورقة.`);
}
// سلسلة مقارنات أعمار متتابعة — نبدأ من المعلوم ونعود للخلف
const AGE_NAMES=["مهند","أحمد","أحلام","هند","سارة","خالد","نورة","فيصل","ريم","بدر"];
function gAgeChain(){
  const [A,B,C,D]=shuffle(AGE_NAMES).slice(0,4);
  const p=rand(2,5),q=rand(2,6),r=rand(3,8),dAge=rand(18,30);
  const cAge=dAge-r,bAge=cAge+q,aAge=bAge-p;
  if(aAge<5||cAge<5)return gAgeChain();
  return qz("quant",`إذا كان ${A} أصغر من ${B} بـ(${toAr(p)}) سنوات، و${B} أكبر من ${C} بـ(${toAr(q)}) سنوات، و${C} أصغر من ${D} بـ(${toAr(r)}) سنوات. إذا كان عُمر ${D} (${toAr(dAge)}) سنة، فما عُمر ${A}؟`,aAge,[aAge+2,aAge-2,dAge-p],
    `نبدأ من المعلوم: ${D} = ${toAr(dAge)}. ${C} أصغر منه بـ${toAr(r)} → ${toAr(cAge)}. ${B} أكبر من ${C} بـ${toAr(q)} → ${toAr(bAge)}. ${A} أصغر من ${B} بـ${toAr(p)} → ${toAr(aAge)} سنة.`);
}
// لغز الساعة: مربع (س÷أ) = مكعب (س÷٢أ) ← الحل س = ٨أ
function gClockPuzzle(){
  const a=pick([2,3]),x=8*a;
  const W1={2:"نصفها",3:"ثلثها"},W2={2:"ربعها",3:"سدسها"};
  const lab=h=>h===24?"١٢ منتصف الليل":(h>12?toAr(h-12)+" مساءً":toAr(h)+" مساءً");
  const correct=lab(x);
  const pool=["٨ مساءً","٩ مساءً","١٠ مساءً","١١ مساءً","٤ مساءً","٦ مساءً","١٢ منتصف الليل","٤ صباحًا"];
  const all=shuffle([correct,...shuffle(pool.filter(t=>t!==correct)).slice(0,3)]);
  return{d:"quant",q:`قيل لحسن: متى تنام ليلاً؟ قال: في الساعة التي مربّع ${W1[a]} يساوي مكعّب ${W2[a]}. متى ينام حسن؟`,c:all,a:all.indexOf(correct),
    w:`نرمز للساعة بـ(س): مربّع (س÷${toAr(a)}) = س²÷${toAr(a*a)}، ومكعّب (س÷${toAr(2*a)}) = س³÷${toAr(Math.pow(2*a,3))}. بمساواتهما: س = ${toAr(Math.pow(2*a,3))} ÷ ${toAr(a*a)} = ${toAr(x)}، أي الساعة ${correct}.`};
}
// التناظر الشكلي (أ : ب  ::  ج : ؟) — القاعدة: كل خانة تنزل مكاناً واحداً لأسفل
function analogyStrip(cells){

    return `<rect x="8" y="${y}" width="26" height="26" fill="#fff" stroke="#1E293B" stroke-width="1.5"/>`;
  };
  return `<svg viewBox="0 0 42 92" width="42" height="92"><rect x="3" y="2" width="36" height="88" fill="none" stroke="#BE185D" stroke-width="1.5"/>${cell(cells[0],6)}${cell(cells[1],34)}${cell(cells[2],62)}</svg>`;
}
const rotDown=a=>[a[2],a[0],a[1]];
function gShapeAnalogy(){
  const perms=[['f','e','g'],['f','g','e'],['e','f','g'],['e','g','f'],['g','f','e'],['g','e','f']];
  const A=pick(perms),B=rotDown(A);
  const key=z=>z.join("");
  const cyc=[key(A),key(B),key(rotDown(B))];
  const C=pick(perms.filter(z=>!cyc.includes(key(z))));
  const ans=rotDown(C);
  const cands=[rotDown(ans),[...C].reverse(),A,B,C];
  const dis=[];
  for(const z of cands){if(dis.length<3&&key(z)!==key(ans)&&!dis.some(w=>key(w)===key(z)))dis.push(z)}
  const all=shuffle([ans,...dis]);
  const svg=`<div style="display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap">${analogyStrip(A)}<span style="font-size:20px;font-weight:800;color:#334155">:</span>${analogyStrip(B)}<span style="font-size:18px;font-weight:800;color:#334155">::</span>${analogyStrip(C)}<span style="font-size:18px;font-weight:800;color:#334155">:</span><span style="font-size:26px;font-weight:800;color:#D97706">؟</span></div>`;
  return{d:"flex",q:"لاحظي العلاقة بين الشكلين الأولين، ثم طبّقي القاعدة نفسها. ما الشكل الذي يجب وضعه مكان علامة الاستفهام؟",c:all.map(z=>analogyStrip(z)),a:all.findIndex(z=>key(z)===key(ans)),
    w:"القاعدة: كل خانة تنزل مكاناً واحداً لأسفل، والخانة السفلية تلتفّ إلى الأعلى — نطبّقها على الشكل الثالث.",svg};
}

// مستطيل مقسوم إلى ثلاثة أجزاء رأسية: يسار مساحته معلومة، وسط مظلّل (المطلوب)، يمين مساحته معلومة.
// سهم علوي يقيس (اليسار + المظلّل)، وسهم سفلي يقيس (المظلّل + اليمين) — والسهمان يبدآن من حافتين مختلفتين.
// طريق الحل: الارتفاع = (مساحة اليمين − مساحة اليسار) ÷ (السهم السفلي − السهم العلوي)
function gShadedThreeParts(){
  const h=pick([4,5,6,8,10]),a=rand(2,6),c=a+rand(1,6),b=rand(3,8);
  const leftA=a*h,rightA=c*h,ans=b*h,topSpan=a+b,botSpan=b+c;
  const total=a+b+c,X0=20,W=200;
  const x1=X0+W*a/total,x2=x1+W*b/total,X1=X0+W;
  const arrow=(xa,xb,y,lab)=>`<line x1="${xa.toFixed(1)}" y1="${y}" x2="${xb.toFixed(1)}" y2="${y}" stroke="#334155" stroke-width="1.5"/>
    <polygon points="${xa.toFixed(1)},${y} ${(xa+6).toFixed(1)},${y-3} ${(xa+6).toFixed(1)},${y+3}" fill="#334155"/>
    <polygon points="${xb.toFixed(1)},${y} ${(xb-6).toFixed(1)},${y-3} ${(xb-6).toFixed(1)},${y+3}" fill="#334155"/>
    <text x="${((xa+xb)/2).toFixed(1)}" y="${y-6}" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">${lab}</text>`;
  const svg=`<svg viewBox="0 0 240 150" width="240" height="150">
    <rect x="${X0}" y="40" width="${W}" height="70" fill="none" stroke="#BE185D" stroke-width="1.8"/>
    <rect x="${x1.toFixed(1)}" y="40" width="${(x2-x1).toFixed(1)}" height="70" fill="#BFDBFE" stroke="#BE185D" stroke-width="1.5"/>
    <line x1="${x1.toFixed(1)}" y1="40" x2="${x1.toFixed(1)}" y2="110" stroke="#BE185D" stroke-width="1.5"/>
    <line x1="${x2.toFixed(1)}" y1="40" x2="${x2.toFixed(1)}" y2="110" stroke="#BE185D" stroke-width="1.5"/>
    <text x="${((X0+x1)/2).toFixed(1)}" y="79" font-size="11" font-weight="700" fill="#BE185D" text-anchor="middle">${toAr(leftA)}سم²</text>
    <text x="${((x2+X1)/2).toFixed(1)}" y="79" font-size="11" font-weight="700" fill="#BE185D" text-anchor="middle">${toAr(rightA)}سم²</text>
    ${arrow(X0,x2,30,toAr(topSpan)+"سم")}
    ${arrow(x1,X1,132,toAr(botSpan)+"سم")}
  </svg>`;
  return{d:"quant",q:"في الشكل المجاور، أوجد مساحة الجزء المظلّل.",svg,
    ...(()=>{const m=mcNum(ans,[ans+h,ans-h,leftA+rightA-ans]);return{c:m.choices.map(x=>x+" سم²"),a:m.answer}})(),
    w:shadedStepsHtml(a,b,c,h,leftA,rightA,topSpan,botSpan,ans)};
}
// شرح مرئي متدرّج: كل خطوة برسمها الخاص. الفكرة الصعبة (لماذا فرق السهمين = فرق العرضين)
// تُشرح برسم السهمين فوق بعضهما بحيث يقع الجزء المظلّل المشترك في العمود نفسه، فيظهر الفرق بالعين.
function shadedStepsHtml(a,b,c,h,leftA,rightA,topSpan,botSpan,ans){
  const s=230/(a+b+c),BH=30,GRAY="#F1F5F9",BLUE="#BFDBFE",AMB="#FDE68A",ST="#BE185D";
  const step=(n,title,body,svg)=>`<div style="background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:12px;margin-top:10px">
    <div style="font-weight:800;color:#0F766E;font-size:14px;margin-bottom:6px">${toAr(n)}) ${title}</div>
    <div style="font-size:14px;line-height:1.9;color:#334155">${body}</div>
    <div style="display:flex;justify-content:center;margin-top:8px">${svg}</div></div>`;
  const box=(x,w,fill,lab,y)=>`<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${BH}" fill="${fill}" stroke="${ST}" stroke-width="1.4"/>`+
    (lab?`<text x="${(x+w/2).toFixed(1)}" y="${y+BH/2+4}" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">${lab}</text>`:"");
  const arw=(xa,xb,y,lab,col)=>`<line x1="${xa.toFixed(1)}" y1="${y}" x2="${xb.toFixed(1)}" y2="${y}" stroke="${col}" stroke-width="1.5"/>
    <polygon points="${xa.toFixed(1)},${y} ${(xa+5).toFixed(1)},${y-3} ${(xa+5).toFixed(1)},${y+3}" fill="${col}"/>
    <polygon points="${xb.toFixed(1)},${y} ${(xb-5).toFixed(1)},${y-3} ${(xb-5).toFixed(1)},${y+3}" fill="${col}"/>
    <text x="${((xa+xb)/2).toFixed(1)}" y="${y-5}" font-size="10" font-weight="800" fill="${col}" text-anchor="middle">${lab}</text>`;

  // ١) الارتفاع مشترك
  const s1=`<svg viewBox="0 0 250 70" width="250" height="70">
    ${box(10,a*s,GRAY,"",18)}${box(10+a*s,b*s,BLUE,"",18)}${box(10+(a+b)*s,c*s,GRAY,"",18)}
    <line x1="6" y1="18" x2="6" y2="48" stroke="#0F766E" stroke-width="1.5"/>
    <polygon points="6,18 3,23 9,23" fill="#0F766E"/><polygon points="6,48 3,43 9,43" fill="#0F766E"/>
    <text x="${(10+(a+b+c)*s/2).toFixed(1)}" y="62" font-size="10" font-weight="700" fill="#0F766E" text-anchor="middle">الارتفاع نفسه للأجزاء الثلاثة = (ن)</text></svg>`;

  // ٢) السهمان يشتركان في المظلّل — نرصفهما بحيث يتطابق المظلّل عمودياً
  const xShadeL=10+a*s, xShadeR=10+(a+b)*s;
  const s2=`<svg viewBox="0 0 250 140" width="250" height="140">
    ${arw(10,xShadeR,16,toAr(topSpan)+" سم","#334155")}
    ${box(10,a*s,AMB,"الأيسر",24)}${box(xShadeL,b*s,BLUE,"المظلّل",24)}
    <line x1="${xShadeL.toFixed(1)}" y1="54" x2="${xShadeL.toFixed(1)}" y2="70" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="${xShadeR.toFixed(1)}" y1="54" x2="${xShadeR.toFixed(1)}" y2="70" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 2"/>
    ${box(xShadeL,b*s,BLUE,"المظلّل",70)}${box(xShadeR,c*s,AMB,"الأيمن",70)}
    ${arw(xShadeL,10+(a+b+c)*s,114,toAr(botSpan)+" سم","#334155")}
    <text x="125" y="132" font-size="10" font-weight="800" fill="#B45309" text-anchor="middle">الأزرق مشترك ← الفرق بينهما = الأيمن − الأيسر</text></svg>`;

  // ٣) فرق المساحتين ناتج فقط عن الشريط الزائد
  const xR=10+a*s+18;
  const s3=`<svg viewBox="0 0 250 96" width="250" height="96">
    ${box(10,a*s,GRAY,toAr(leftA),14)}
    ${box(xR,a*s,GRAY,toAr(leftA),14)}${box(xR+a*s,(c-a)*s,AMB,toAr(rightA-leftA),14)}
    <text x="${(10+a*s/2).toFixed(1)}" y="58" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">الأيسر = ${toAr(leftA)}</text>
    <text x="${(xR+c*s/2).toFixed(1)}" y="58" font-size="9" font-weight="700" fill="#334155" text-anchor="middle">الأيمن = ${toAr(rightA)}</text>
    <text x="125" y="76" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">الأيمن = جزء يساوي الأيسر (${toAr(leftA)}) + شريط زائد (${toAr(rightA-leftA)})</text>
    <text x="125" y="90" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">الشريط الأصفر عرضه ${toAr(c-a)} وارتفاعه (ن)</text></svg>`;

  // ٤) الخلاصة على الشكل الأصلي بعد معرفة كل الأعراض
  const s4=`<svg viewBox="0 0 250 76" width="250" height="76">
    ${box(10,a*s,GRAY,toAr(a),14)}${box(10+a*s,b*s,BLUE,toAr(b),14)}${box(10+(a+b)*s,c*s,GRAY,toAr(c),14)}
    <text x="125" y="60" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">العرض بالسم — والارتفاع (ن) = ${toAr(h)} سم</text>
    <text x="125" y="72" font-size="11" font-weight="800" fill="#059669" text-anchor="middle">المظلّل = ${toAr(b)} × ${toAr(h)} = ${toAr(ans)} سم²</text></svg>`;

  return `<div style="font-size:14px">
    ${step(1,"الارتفاع واحد","الأجزاء الثلاثة داخل مستطيل واحد، فارتفاعها واحد. نسمّيه <b>(ن)</b>.",s1)}
    ${step(2,"لماذا فرق السهمين = فرق العرضين؟",`السهم العلوي يغطّي <b>الأيسر + المظلّل</b>، والسفلي يغطّي <b>المظلّل + الأيمن</b>. المظلّل موجود في الاثنين، فإذا حذفناه بقي: الأيسر من العلوي، والأيمن من السفلي.<br>إذن: عرض الأيمن − عرض الأيسر = ${toAr(botSpan)} − ${toAr(topSpan)} = <b>${toAr(c-a)} سم</b>.`,s2)}
    ${step(3,"نستخرج الارتفاع (ن)",`الجزءان غير المظلّلين لهما الارتفاع نفسه، ففرق مساحتيهما سببه فرق العرض فقط.<br>${toAr(rightA)} − ${toAr(leftA)} = <b>${toAr(rightA-leftA)} سم²</b> وهي مساحة شريط عرضه ${toAr(c-a)}.<br>إذن: ${toAr(c-a)} × ن = ${toAr(rightA-leftA)} ← <b>ن = ${toAr(rightA-leftA)} ÷ ${toAr(c-a)} = ${toAr(h)} سم</b>.`,s3)}
    ${step(4,"نوجد عرض المظلّل ثم مساحته",`عرض الأيسر = ${toAr(leftA)} ÷ ${toAr(h)} = <b>${toAr(a)} سم</b>.<br>عرض المظلّل = ${toAr(topSpan)} − ${toAr(a)} = <b>${toAr(b)} سم</b>.<br>المساحة = ${toAr(b)} × ${toAr(h)} = <b style="color:#059669">${toAr(ans)} سم²</b>.`,s4)}
  </div>`;
}

// ===== محرّك الذكاء الاصطناعي (Gemini) + التحكّم بالتكلفة =====
function todayKey(){return new Date().toISOString().slice(0,10)}
function geminiUsage(){try{const u=JSON.parse(localStorage.getItem("gemini_day")||"{}");if(u.date!==todayKey())return{date:todayKey(),count:0};return u}catch(e){return{date:todayKey(),count:0}}}
function bumpUsage(n){const u=geminiUsage();u.count+=n;localStorage.setItem("gemini_day",JSON.stringify(u))}
function cacheGet(type){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");return c[type]||[]}catch(e){return[]}}
function cachePut(type,arr){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");c[type]=((c[type]||[]).concat(arr)).slice(-40);localStorage.setItem("gemini_cache",JSON.stringify(c))}catch(e){}}

// يجلب أسئلة من المحرّك، مع تخزين الفائض وإعادة الاستخدام، واحترام الحد اليومي
async function fetchGemini(type,need){
  const out=[];
  // 1) استهلك من الكاش أولاً
  let cache=cacheGet(type);
  while(out.length<need && cache.length){out.push(cache.shift())}
  cachePutReplace(type,cache);
  if(out.length>=need)return out.map(tagAI(type));
  // 2) تحقّق من الحد اليومي
  if(geminiUsage().count>=DAILY_CAP)return out.map(tagAI(type)); // نكتفي بالمتاح
  // 3) اطلب دفعة (3) لتقليل عدد النداءات
  try{
    const res=await fetch(FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({type,count:3})});
    if(res.ok){const data=await res.json();bumpUsage(1);const qs=(data.questions||[]).map(normAI(type));const take=qs.slice(0,need-out.length);out.push(...take);cachePut(type,qs.slice(take.length))}
  }catch(e){}
  return out.map(tagAI(type));
}
function cachePutReplace(type,arr){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");c[type]=arr;localStorage.setItem("gemini_cache",JSON.stringify(c))}catch(e){}}
function normAI(type){return q=>({d:aiDomain(type),q:q.q,c:q.choices,a:q.answer,w:q.why||"",qtype:type})}
function tagAI(type){return q=>q}
function aiDomain(type){return (type==="science")?"science":"verbal"}

// أنواع لفظية وعلمية من المحرّك
const AI_VERBAL=["reading","logic","analogy","vocabulary"];
const AI_SCIENCE=["science"];

// ===== منع تكرار نص السؤال داخل الجلسة الحالية =====
// يتذكّر نصوص الأسئلة التي عُرضت فعلاً منذ فتح الصفحة (كل الأوضاع)، ويتجنّب إعادتها
const sessionSeenQuestions=new Set();
function markSeen(q){if(q&&q.q)sessionSeenQuestions.add(q.q);return q}
function isSeen(q){return !!(q&&sessionSeenQuestions.has(q.q))}
// يولّد من قائمة مولّدات عشوائياً حتى يجد نصاً لم يُعرض من قبل (بحد أقصى من المحاولات تفادياً لحلقة لا نهائية)
function uniqueFromGens(gens,maxTries){
  maxTries=maxTries||50;
  for(let i=0;i<maxTries;i++){const q=pick(gens)();if(!isSeen(q))return markSeen(q)}
  return markSeen(pick(gens)()); // البنك التوليدي نفد تنويعاً؛ نقبل الأحدث كحل أخير
}
// يفلتر قائمة أسئلة (من الذكاء الاصطناعي أو البنك) مبقياً على غير المعروض فقط
function dedupeList(arr){const out=[];(arr||[]).forEach(q=>{if(!isSeen(q)){out.push(q);markSeen(q)}});return out}
// يأخذ أول "need" سؤالاً غير معروض من قائمة (تُستخدم لتعبئة النقص من البنك الاحتياطي)
function takeUniqueFrom(arr,need){const out=[];for(const q of (arr||[])){if(out.length>=need)break;if(!isSeen(q)){out.push(q);markSeen(q)}}return out}
// حل أخير عند نفاد البنك عالمياً: يكمل من pool متفادياً تكرار نص موجود مسبقاً في نفس الدفعة (existing)،
// حتى لو تجاوزنا حدود التتبّع العالمي لهذه الجلسة
function fillAvoidingBatchDupes(existing,pool,need){
  const seenQ=new Set(existing.map(q=>q.q));
  const out=[];
  for(const item of shuffle(pool)){
    if(out.length>=need)break;
    if(!seenQ.has(item.q)){out.push(item);seenQ.add(item.q)}
  }
  return out;
}

// يبني مجموعة أسئلة لمجال، ممزوجة (محرّك + كود) مع احتياط، وبلا تكرار لنص سبق عرضه في هذه الجلسة
async function buildDomain(domKey,n){
  if(domKey==="quant")return Array.from({length:n},()=>uniqueFromGens(QUANT_GENS));
  if(domKey==="flex")return Array.from({length:n},()=>uniqueFromGens(FLEX_GENS));
  if(domKey==="verbal"){
    const types=shuffle(AI_VERBAL);let qs=[];
    for(const t of types){if(qs.length>=n)break;const got=await fetchGemini(t,Math.ceil(n/2));qs=qs.concat(dedupeList(got))}
    // احتياط من البنك لو نقص، مع تفادي تكرار ما سبق عرضه
    if(qs.length<n){qs=qs.concat(takeUniqueFrom(shuffle(VERBAL),n-qs.length).map(q=>({...q,qtype:"bank"})))}
    if(qs.length<n){qs=qs.concat(fillAvoidingBatchDupes(qs,VERBAL,n-qs.length).map(q=>({...q,qtype:"bank"})))} // البنك نفد تنويعاً؛ حل أخير
    return shuffle(qs).slice(0,n);
  }
  if(domKey==="science"){
    let qs=dedupeList(await fetchGemini("science",n));
    if(qs.length<n){qs=qs.concat(takeUniqueFrom(shuffle(SCIENCE),n-qs.length))}
    if(qs.length<n){qs=qs.concat(fillAvoidingBatchDupes(qs,SCIENCE,n-qs.length))} // البنك نفد تنويعاً؛ حل أخير
    return shuffle(qs).slice(0,n);
  }
  return [];
}
async function buildFull(){
  const per=12;
  const [v,q,s,f]=await Promise.all([buildDomain("verbal",per),Promise.resolve(buildDomain("quant",per)),buildDomain("science",per),Promise.resolve(buildDomain("flex",per))]);
  const qq=await Promise.resolve(q),ff=await Promise.resolve(f);
  return shuffle([...(await v),...qq,...(await s),...ff]);
}

function equalAnglesSVG(total,k){
  // الهندسة محسوبة لا ثابتة: بأنصاف أقطار ثابتة كانت العلامات تتلاصق في ٧٥٪ من الحالات
  // (أقلها ٦ بكسل) فيصير الرسم كتلة واحدة لا زوايا مميّزة — وهذا جزء من إرباك الشرح.
  const thetaRad=(total/k)*Math.PI/180;
  const arcR=Math.max(24,Math.min(80,18/thetaRad));   // تباعد العلامات ١٨ بكسل على الأقل
  const rayLen=arcR+32,outerR=rayLen+16,labR=arcR+17;
  const halfRad=(total/2)*Math.PI/180;
  const W=Math.max(210,Math.round(2*(outerR*Math.sin(halfRad)+56)));
  const H=Math.round(outerR+74);

  let phis=[startPhi];for(let i=0;i<k;i++)phis.push(phis[phis.length-1]+total/k);
  let rays="",arcs="",labels="";
  phis.forEach(p=>{const pt=vAngleDeg(O,rayLen,p);rays+=`<line x1="${O.x}" y1="${O.y}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#1E293B" stroke-width="2.5"/>`});
  for(let i=0;i<k;i++){
    const u1=uDir(phis[i]),u2=uDir(phis[i+1]),isUnk=i===0,col=isUnk?"#D97706":"#0D9488";
    arcs+=`<path d="${arcPathBetween(O,u1,u2,arcR)}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    // علامة التساوي: شرطة تقطع القوس، متطابقة على كل الزوايا بما فيها المطلوبة لأنها كلها متساوية فعلاً
    const bp=bisectorPoint(O,u1,u2,arcR),dx=(bp.x-O.x)/arcR,dy=(bp.y-O.y)/arcR;
    arcs+=`<line x1="${(bp.x-dx*5).toFixed(1)}" y1="${(bp.y-dy*5).toFixed(1)}" x2="${(bp.x+dx*5).toFixed(1)}" y2="${(bp.y+dy*5).toFixed(1)}" stroke="${col}" stroke-width="2.5"/>`;
    // لا نكتب "=" على كل زاوية: الشرطات تكفي، والكتابة كانت تتراكم في الزوايا الضيّقة
    if(isUnk){const lp=bisectorPoint(O,u1,u2,labR);

  }
  const uO1=uDir(phis[0]),uO2=uDir(phis[k]);
  const outerLabel=bisectorPoint(O,uO1,uO2,outerR);

  const outerText=`<text x="${outerLabel.x.toFixed(1)}" y="${Math.max(14,outerLabel.y).toFixed(1)}" font-size="12.5" font-weight="700" text-anchor="middle" fill="#334155">المجموع ${toAr(total)}°</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${rays}<circle cx="${O.x}" cy="${O.y}" r="3.5" fill="#1E293B"/>${arcs}${labels}${outerArc}${outerText}</svg>`;
}

const LOGIC_UNKNOWN="لا يمكن معرفة ذلك";
// المولّد القديم كان معطوباً: العبارات دائماً بترتيب السلسلة، والسؤال دائماً عن الطرف الأعلى،
// فالإجابة الصحيحة هي الاسم الأول في النص كل مرة بلا استثناء. من يلاحظ ذلك يأخذ ١٠٠٪ بلا استدلال —
// وهذا ما حدث فعلاً: "أتقنت" المنطق هنا بـ ٥/٥ وأخذت ٢٢٪ في المحاكاة.
// أربعة كسور للاختصار: ترتيب العبارات مخلوط، والمقارنة تُعكس عشوائياً، والسؤال قد يكون عن الطرف
// الأدنى، وقد تكون السلسلة مقطوعة فتكون الإجابة "لا يمكن معرفة ذلك".
function fadeMakeLogicOrder(){
  const r=pick(LOGIC_RELS);
  const stmt=(hi,lo)=>pick([`${hi} ${r.more} من ${lo}.`,`${lo} ${r.less} من ${hi}.`]);
  const askMost=pick([true,false]);
  const broken=Math.random()<0.25;
  let names,lines,ans,steps;
  if(broken){
    // سلسلتان منفصلتان: لا رابط بين المجموعتين فلا يمكن تحديد الطرف — والانتباه لذلك هو المهارة
    const [a,b,c,d]=shuffle(LOGIC_NAMES).slice(0,4);
    lines=shuffle([stmt(a,b),stmt(c,d)]);
    names=[a,b,c,d];ans=LOGIC_UNKNOWN;
    steps=[`العبارة الأولى تقارن بين مجموعة، والثانية تقارن بين مجموعة أخرى`,
           `لا توجد أي عبارة تربط المجموعتين ببعضهما`,
           `فلا نستطيع ترتيب الجميع في سلسلة واحدة — إذن ${LOGIC_UNKNOWN}`];
  }else{
    const n=pick([3,3,4]);
    const chain=shuffle(LOGIC_NAMES).slice(0,n); // chain[0] هو الأعلى وآخرها الأدنى
    const pairs=[];for(let i=0;i<n-1;i++)pairs.push(stmt(chain[i],chain[i+1]));
    lines=shuffle(pairs); // خلط ترتيب العبارات يكسر اختصار "الاسم الأول"
    names=chain.slice();ans=askMost?chain[0]:chain[n-1];
    steps=[`رتّبي كل مقارنة على حدة، ولا تعتمدي على ترتيب ظهور الأسماء في النص`,
           `بربط المقارنات تصير السلسلة: ${chain.join(" ثم ")}`,
           `المطلوب ${askMost?r.most:r.least}، وهو ${askMost?"أول":"آخر"} السلسلة — إذن ${ans}`];
  }
  // الخيارات: الإجابة + اسمان آخران + "لا يمكن معرفة ذلك" (فهي خيار دائم لا يكشف شيئاً بوجوده)
  const others=names.filter(x=>x!==ans);
  const opts=shuffle([ans,...shuffle(others).slice(0,ans===LOGIC_UNKNOWN?3:2),...(ans===LOGIC_UNKNOWN?[]:[LOGIC_UNKNOWN])]);
  const askTxt=askMost?r.most:r.least;
  return{kind:"logic",choiceKind:"text",opts,ai:opts.indexOf(ans),prompt:`من ${askTxt}؟`,
    steps,
    ruleTxt:`اربطي المقارنات في سلسلة واحدة ثم اقرئي الطرف المطلوب. وانتبهي: ترتيب العبارات لا يعني الترتيب، وإذا لم ترتبط المجموعات ببعضها فالجواب «${LOGIC_UNKNOWN}»`,
    passage:lines.join("<br>"),
    q:`بناءً على العبارات أعلاه، من ${askTxt}؟`};
}
function fadeMakeLogic(){return pick([fadeMakeLogicSyll,fadeMakeLogicOrder,fadeMakeLogicOrder])()}

// ===== القياس: محيط الدائرة، مساحة متوازي الأضلاع، مساحة المثلث، حجم ومساحة سطح المنشور الرباعي =====
// مبنيّة على حقيبة STEM "القياس: المحيط والمساحة والحجم" للصف السادس الابتدائي
function circleSVG(label,isDiameter){
  const line=isDiameter
    ?`<line x1="35" y1="70" x2="145" y2="70" stroke="#0D9488" stroke-width="2.5"/>`
    :`<line x1="90" y1="70" x2="145" y2="70" stroke="#0D9488" stroke-width="2.5"/>`;
  // النصف الآخر متقطّعاً حين يكون المعطى نصف القطر: "٢ × نصف القطر" تصير مرئية بدل أن تُتخيَّل
  const mirrorHalf=isDiameter?"":`<line x1="35" y1="70" x2="90" y2="70" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="62" y="88" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">مثله</text>`;
  const labelX=isDiameter?90:118;
  // "القطر = ٢ × نق" تحت الشكل لا داخله: بداخله كانت تتجاوز حافة الدائرة وتتداخل مع خطّها
  const foot=isDiameter?"":`<text x="90" y="146" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">القطر = ٢ × نق</text>`;
  return `<svg viewBox="0 0 180 ${isDiameter?140:156}" width="180" height="${isDiameter?140:156}">
    <circle cx="90" cy="70" r="55" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
    ${mirrorHalf}${line}<circle cx="90" cy="70" r="3" fill="#1E293B"/>
    <text x="${labelX}" y="58" font-size="14" font-weight="800" fill="#0D9488" text-anchor="middle">${label}</text>
    ${foot}
  </svg>`;
}
// نستعمل π ≈ ٣٫١٤ حصراً (لا ٢٢/٧) لأنه التقريب اللي تتعلّمه الطالبة بمدرستها؛
// استعمال تقريب مختلف كان يجعل حسابها الصحيح لا يطابق أي خيار أبداً
const PI_APPROX=3.14;
function round2(x){return Math.round(x*100)/100}
function fadeMakeCircle(){
  const isDiameter=Math.random()<0.5,r=rand(2,20),d=2*r;
  const ans=round2(PI_APPROX*d);
  if(isDiameter){
    const usedAsRadius=round2(PI_APPROX*(d/2)); // مموّه: تعاملت مع القطر كأنه نصف القطر (نسيت ×٢)
    return{kind:"circle",ans,prompt:"ما محيط الدائرة؟",lab:d,
      steps:[`محيط الدائرة = π × القطر`,`باستعمال π ≈ ٣٫١٤: المحيط = ٣٫١٤ × ${toAr(d)} = ${arDec(ans)} سم`],
      ruleTxt:`محيط الدائرة = π × القطر (π ≈ ٣٫١٤)`,
      distractors:[usedAsRadius,round2(ans+d),round2(ans-d)],
      svg:circleSVG(`قطر = ${toAr(d)} سم`,true),
      caption:`الخط الأخضر هو قطر الدائرة (يمرّ بالمركز)`,
      q:`دائرة قطرها ${toAr(d)} سم. ما محيطها؟ (π ≈ ٣٫١٤)`};
  }
  const usedAsIsRadius=round2(PI_APPROX*r); // مموّه: ضربت π في نصف القطر مباشرة بدل القطر (نسيت ×٢)
  return{kind:"circle",ans,prompt:"ما محيط الدائرة؟",lab:d,
    steps:[`في الرسم: الخط الأخضر نصف القطر (${toAr(r)})، والمتقطّع مثله تماماً — ومعاً يصنعان القطر`,`فالقطر = ٢ × ${toAr(r)} = ${toAr(d)} سم`,`ومحيط الدائرة = π × القطر ≈ ٣٫١٤ × ${toAr(d)} = ${arDec(ans)} سم`],
    ruleTxt:`محيط الدائرة = π × القطر = π × (٢ × نصف القطر)`,
    distractors:[usedAsIsRadius,round2(ans+r),round2(ans-r)],
    svg:circleSVG(`نق = ${toAr(r)} سم`,false),
    caption:`الأخضر نصف القطر، والمتقطّع مثله — مجموعهما القطر`,
    q:`دائرة نصف قطرها ${toAr(r)} سم. ما محيطها؟ (π ≈ ٣٫١٤)`};
}
// ===== مختبر الأشكال: الشكل يستجيب ليدها والأرقام تتغيّر معه لحظياً =====
// القاعدة تتحوّل من جملة تُحفظ إلى علاقة تُشاهَد وهي تتغيّر. ولا نُعيد بناء المزلاج نفسه
// عند كل حركة — نُحدّث الرسم والأرقام فقط — وإلا انقطع السحب على الجوال في منتصفه.
const LAB_D_MIN=6,LAB_D_MAX=30;          // مدى القطر داخل المختبر
const LAB_S=290/(PI_APPROX*LAB_D_MAX);   // مقياس ثابت: أكبر محيط يملأ العرض بالضبط
let labKind=null,labD=12,labB=8,labH=6;
// قياس التجريب: كم قيمة مختلفة جرّبت فعلاً، وكم حركة، وأيّ مقبض لمست.
// الثابت لا يُرى إلا عبر تغييرين على الأقل — قيمة واحدة تُري رقماً لا علاقة.
const LAB_MIN_TRIES=3;   // القيمة الأولى + تغييران
let labMoves=0,labSeen=null,labTouchB=false,labTouchH=false;
function labKey(){return labKind==="circle"?String(labD):labB+"×"+labH}
function labArm(kind,a,b){
  labKind=kind;
  if(kind==="circle"){labD=Math.min(LAB_D_MAX,Math.max(LAB_D_MIN,2*Math.round(a/2)))}
  else{labB=Math.min(14,Math.max(2,a));labH=Math.min(12,Math.max(2,b))}
  labMoves=0;labSeen=[labKey()];labTouchB=false;labTouchH=false;
}
function labNote(){const k=labKey();labMoves++;if(labSeen.indexOf(k)<0)labSeen.push(k)}
function labSetD(v){
  const nv=Math.min(LAB_D_MAX,Math.max(LAB_D_MIN,parseInt(v,10)||LAB_D_MIN));
  if(nv!==labD){labD=nv;labNote()}
  labPaint();
}
function labSetB(v){
  const nv=Math.min(14,Math.max(2,parseInt(v,10)||2));
  if(nv!==labB){labB=nv;labTouchB=true;labNote()}
  labPaint();
}
function labSetH(v){
  const nv=Math.min(12,Math.max(2,parseInt(v,10)||2));
  if(nv!==labH){labH=nv;labTouchH=true;labNote()}
  labPaint();
}
// الدائرة: ثلاث قيم مختلفة على الأقل. المثلث: كلا المقبضين، فالعلاقة ذات بُعدين.
function labExplored(){
  if(!labKind||!labSeen)return true;
  return labKind==="circle"?labSeen.length>=LAB_MIN_TRIES:(labTouchB&&labTouchH);
}
// البوّابة على المثال الأول فقط: كسر عادة التخطّي لا عقوبة متكرّرة
function labGated(){return mode==="fade"&&fadeStage===1&&!!labKind&&fadeStreak===0&&!labExplored()}
function labPaint(){
  const f=document.getElementById('labFig'),o=document.getElementById('labOut'),g=document.getElementById('labGateBox');

// الدائرة: نفرد المحيط شريطاً مقسّماً بأقطار، فيُرى أن المحيط ثلاثة أقطار وزيادة صغيرة مهما تغيّر القطر
function labCircleSVG(){
  // كل النصوص موسّطة: المحاذاة من الحافة تنقلب في سياق العربية فتُقصّ خارج الإطار
  // الشريط موسّط تحت الدائرة تماماً: لو ثُبّت من الحافة انفصل بصرياً عنها كلما صغر القطر
  const d=labD,r=d*LAB_S/2,cx=160,cy=56,bar=PI_APPROX*d*LAB_S,seg=d*LAB_S,x0=cx-bar/2,by=142;
  let segs="";
  for(let i=0;i<3;i++)segs+=`<rect x="${x0+i*seg}" y="${by}" width="${seg-1.5}" height="20" rx="3" fill="#0D9488" opacity="${0.55+i*0.15}"/>`;
  const rest=bar-3*seg,restW=Math.max(2,rest-1);
  segs+=`<rect x="${x0+3*seg}" y="${by}" width="${restW}" height="20" rx="2" fill="#F59E0B"/>`;
  // الأقطار الصغيرة لا تتّسع لثلاث كلمات تحتها فتتراكب — نكتب وصفاً واحداً موسّطاً بدلها
  const roomy=seg>=30;
  let ticks=roomy
    ?[0,1,2].map(i=>`<text x="${x0+i*seg+seg/2}" y="${by+33}" font-size="10" font-weight="800" fill="#0F766E" text-anchor="middle">قطر</text>`).join("")
      +`<text x="${x0+3*seg+restW/2}" y="${by+33}" font-size="10" font-weight="800" fill="#B45309" text-anchor="middle">+</text>`
    :`<text x="${cx}" y="${by+33}" font-size="10" font-weight="800" fill="#0F766E" text-anchor="middle">٣ أقطار <tspan fill="#B45309">+ زيادة</tspan></text>`;
  return `<svg viewBox="0 0 320 186" width="100%" style="max-width:320px">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="#0D9488" stroke-width="2.5"/>
    <circle cx="${cx}" cy="${cy}" r="2.5" fill="#1E293B"/>
    <text x="${cx}" y="120" font-size="12" font-weight="800" fill="#0D9488" text-anchor="middle">القطر = ${toAr(d)}</text>
    <text x="${cx}" y="136" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">المحيط مفروداً:</text>
    ${segs}${ticks}
  </svg>`;
}

function fadeMakePrismSurf(){
  const l=rand(2,8),w=rand(2,7),h=rand(2,6);

      `اجمعي الثلاثة: ${toAr(a1)}+${toAr(a2)}+${toAr(a3)}=${toAr(sum)}`,
      `كل وجهين متقابلين متساويان، فنضرب المجموع × ٢: ${toAr(sum)} × ٢ = ${toAr(ans)} سم²`],
    ruleTxt:`ثلاث خطوات بالترتيب: (١) احسبي مساحة كل وجه مختلف على حدة (ل×ع، ل×ن، ع×ن) (٢) اجمعي الثلاثة (٣) اضربي المجموع × ٢`,

function fadeMakeQuestion(){
  if(fadeTopic==="median")return fadeMakeMedian();
  if(fadeTopic==="percent")return fadeMakePercent();
  if(fadeTopic==="cube")return fadeMakeCube();
  if(fadeTopic==="angles")return fadeMakeAngles();
  if(fadeTopic==="pyramid")return fadeMakePyramid();
  if(fadeTopic==="mirror")return fadeMakeMirror();
  if(fadeTopic==="rotate")return fadeMakeRotate();
  if(fadeTopic==="logic")return fadeMakeLogic();
  if(fadeTopic==="reading")return fadeMakeReading();
  if(fadeTopic==="circle")return fadeMakeCircle();
  if(fadeTopic==="parallelogram")return fadeMakeParallelogram();
  if(fadeTopic==="triangle")return fadeMakeTriangle();
  if(fadeTopic==="prismvol")return fadeMakePrismVol();
  if(fadeTopic==="prismsurf")return fadeMakePrismSurf();

function fadeDedupe(correct,dist){const out=[];for(const d of dist){if(d!==correct&&!out.includes(d))out.push(d)}let p=1;while(out.length<3){[correct+p,correct-p].forEach(x=>{if(out.length<3&&x>0&&x!==correct&&!out.includes(x))out.push(x)});p++}return out.slice(0,3)}
function fadePrep(){
  if(fadeStage===1){fadeCur.opts=null;fadeCur.ai=-1;return}
  if(fadeCur.choiceKind)return; // الخيارات (رسومات أو نصوص) والإجابة الصحيحة جاهزة من المولّد نفسه
  let d;
  if(fadeCur.kind==="ratio"){d=[fadeCur.ans+fadeCur.per,fadeCur.ans-fadeCur.per,fadeCur.ans+fadeStage];}
  else if(fadeCur.kind==="seq"){d=fadeCur.type==="add"?[fadeCur.ans+fadeCur.rule,fadeCur.ans-fadeCur.rule,fadeCur.ans+fadeStage]:[fadeCur.ans-fadeCur.seq[4],fadeCur.seq[4]+fadeCur.rule,fadeCur.ans+fadeCur.rule];}
  else{d=fadeCur.distractors;} // الوسيط/النسبة المئوية/المكعّب/الهرم: مموّهات محسوبة عند الإنشاء
  const opts=shuffle([fadeCur.ans,...fadeDedupe(fadeCur.ans,d)]);fadeCur.opts=opts;fadeCur.ai=opts.indexOf(fadeCur.ans);
}
function fadeNew(){
  fadeCur=fadeMakeQuestion();fadeLocked=false;fadePicked=-1;fadePrep();fadeShownAt=Date.now();
  // المختبر يبدأ من أرقام المسألة التي أمامها، فلا ينفصل التجريب عن السؤال
  if(fadeCur.kind==="circle")labArm("circle",fadeCur.lab||12);
  else if(fadeCur.kind==="triangle"||fadeCur.kind==="parallelogram")labArm(fadeCur.kind,fadeCur.labB||8,fadeCur.labH||6);
  else labKind=null;
  render();
}
function fadeChoose(i){
  if(fadeLocked)return;fadeLocked=true;fadePicked=i;
  const ok=i===fadeCur.ai;
  if(ok){fadeStreak++;fadeWrongStreak=0}else{fadeStreak=0;fadeWrongStreak++}
  if(fadeStage===4){
    // الخطأ في مرحلة الاستقلال يُسقط الإتقان المحفوظ: النوع يرجع لأول القائمة بلا شارة حتى تتقنه من جديد
    if(!ok){fadeMasteryStreak=0;fadeStage4Support=true;fadeRecoveryStreak=0;fadeMasteryBreak(fadeTopic)}
    else if(fadeStage4Support){fadeRecoveryStreak++;if(fadeRecoveryStreak>=RECOVERY_REQ){fadeStage4Support=false;fadeRecoveryStreak=0}}
    else{fadeMasteryStreak++}
    if(fadeMasteryStreak>fadeBestStreak)fadeBestStreak=fadeMasteryStreak; // أطول سلسلة لا الحالية: الشاشة الختامية تعرضها
    fadeStage4Count++;
  }
  const elapsed=fadeShownAt?Date.now()-fadeShownAt:null;
  logAnswer("fade_"+fadeTopic,"stage"+fadeStage,ok,null,null,elapsed);
  // نفس كاشف التسرّع المستعمل في الاختبار — لم يكن يعمل في التقوية لأنها لا تسجّل الزمن
  if(elapsed!=null){
    recentAnswerTimes.push(elapsed);if(recentAnswerTimes.length>RAPID_STREAK)recentAnswerTimes.shift();
    rapidNudge=recentAnswerTimes.length===RAPID_STREAK&&recentAnswerTimes.every(t=>t<RAPID_MS);
  }
  render();
}
// المرحلة الأولى كانت عمياء تماماً: لا سجلّ لها إطلاقاً، فلا أعرف كم مكثت في المثال المحلول
// ولا هل جرّبت المختبر. الآن لكل مثال محلول سطره، ومعه ما جرّبته بالفعل.
function fadeStage1Next(){
  if(labGated())return;
  const dwell=fadeShownAt?Date.now()-fadeShownAt:null;
  logAnswer("fade_"+fadeTopic,"stage1",labKind?labExplored():null,labKind?String(labMoves):null,null,dwell,
    {q_text:labKind?`${labKind}: ${labSeen.join(" · ")}`:null});
  fadeStreak++;
  if(fadeStreak>=FADE_REQ){fadeStage=2;fadeStreak=0;fadeWrongStreak=0;fadeDroppedBack=false}
  fadeNew();
}
function fadeAdvance(){
  if(fadeStreak>=FADE_REQ&&fadeStage<4){fadeStage++;fadeStreak=0;fadeWrongStreak=0}
  else if(fadeWrongStreak>=FADE_STUCK&&fadeStage>1){fadeStage--;fadeStreak=0;fadeWrongStreak=0;fadeDroppedBack=true}
  fadeNew();
}
// ===== حفظ إتقان التقوية + إعادته للمراجعة بتباعد =====
// الإتقان بجلسة واحدة يتلاشى بلا مراجعة (Ebbinghaus)، فنحفظه ونعيده بعد فترة متزايدة بدل حذف النوع نهائياً.
// سلّم المراجعة بالأيام: أول إتقان ← بعد ٧ أيام، ثم ١٤، ثم ٣٠ (كل مراجعة ناجحة تباعد الموعد أكثر).
const FADE_MASTERY_KEY="mawhiba_fade_mastery";
const FADE_REVIEW_DAYS=[7,14,30];
function fadeMasteryLoad(){try{return JSON.parse(localStorage.getItem(FADE_MASTERY_KEY)||"{}")}catch(e){return{}}}
function fadeMasterySave(o){try{localStorage.setItem(FADE_MASTERY_KEY,JSON.stringify(o))}catch(e){}}
function fadeMarkMastered(topic){
  const st=fadeMasteryLoad(),r=st[topic]||{level:0};
  r.level=Math.min((r.level||0)+1,FADE_REVIEW_DAYS.length);
  r.due=srsToday()+FADE_REVIEW_DAYS[r.level-1];
  r.at=srsToday();
  r.q=fadeStage4Count; // عدد الأسئلة المستقلة التي لزمت — سجلّ للتحقّق أن الإتقان لم يُصادَف
  st[topic]=r;fadeMasterySave(st);
}
// ترحيل لمرة واحدة: قبل وضع السقف كانت المرحلة الرابعة لا تنتهي إلا بخمس متتالية، فسجّل النظام
// إتقان "المرآة" بعد ١٠٠ سؤال بدقة ٥٣٪ — عند هذه الدقة تُتوقَّع أربع سلاسل خماسية بالمصادفة وحدها،
// فالشهادة غير مستحقة وتُسحب. الأنواع الخمسة الأخرى تحقّقنا من سجلّها: كلٌّ منها ٥/٥ من أول خمسة.
const FADE_AUDIT_KEY="mawhiba_fade_audit_v1";
// ترحيل ثانٍ: شهادة "الاستدلال المنطقي" أيضاً غير مستحقّة. ثلثا أسئلة المنطق كانت من مولّد
// معطوب: العبارات دائماً بترتيب السلسلة والسؤال دائماً عن الطرف الأعلى، فالإجابة هي الاسم
// الأول في النص كل مرة. من يلاحظ النمط يأخذ ٥/٥ بلا استدلال — ودرجتها ٢٢٪ في المحاكاة تؤكد
// أن الشهادة لم تعكس مهارة. أُصلح المولّد، وتُسحب الشهادة لتُعاد على الأسئلة السليمة.
const FADE_AUDIT2_KEY="mawhiba_fade_audit_v2_logic";
function fadeAuditOnce(){
  try{
    if(!localStorage.getItem(FADE_AUDIT_KEY)){
      const st=fadeMasteryLoad();
      if(st.mirror&&st.mirror.q===undefined){delete st.mirror;fadeMasterySave(st)}
      localStorage.setItem(FADE_AUDIT_KEY,"1");
    }
    if(!localStorage.getItem(FADE_AUDIT2_KEY)){
      const st=fadeMasteryLoad();
      if(st.logic){delete st.logic;fadeMasterySave(st)}
      localStorage.setItem(FADE_AUDIT2_KEY,"1");
    }
  }catch(e){}
}
try{fadeAuditOnce()}catch(e){appError('fadeAuditOnce',e)}
// الخطأ في نوع متقن يُسقط الإتقان — يرجع النوع لقائمة التدريب العادية
function fadeMasteryBreak(topic){
  const st=fadeMasteryLoad();
  if(st[topic]){delete st[topic];fadeMasterySave(st)}
}
// صياغة عربية سليمة للعدد مع "يوم" (تمييز المفرد/المثنى/الجمع)
function arSecs(n){return n===1?"ثانية واحدة":n===2?"ثانيتين":n<=10?`${toAr(n)} ثوانٍ`:`${toAr(n)} ثانية`}
function arDays(n){return n===0?"اليوم":n===1?"يوم واحد":n===2?"يومين":n<=10?`${toAr(n)} أيام`:`${toAr(n)} يوماً`}
function fadeMasteryState(topic){
  const r=fadeMasteryLoad()[topic];
  if(!r)return{mastered:false,due:false};
  return{mastered:true,due:srsToday()>=r.due,level:r.level,daysLeft:Math.max(0,r.due-srsToday())};
}
function fadeStage4Next(){
  if(fadeMasteryStreak>=MASTERY_REQ){fadeNotYet=false;fadeMarkMastered(fadeTopic);mode="fadeDone";window.scrollTo(0,0);render();return}
  // بلغت السقف بلا إتقان: نُنهي بصدق ونعيدها غداً بدل إبقائها تخمّن حتى تصادف خمساً متتالية
  if(fadeStage4Count>=MASTERY_MAX_Q){fadeNotYet=true;mode="fadeDone";window.scrollTo(0,0);render();return}
  fadeNew();
}
function startFade(topic){mode="fade";fadeTopic=topic||fadeTopic||"seq";fadeStage=1;fadeStreak=0;fadeWrongStreak=0;fadeDroppedBack=false;fadeMasteryStreak=0;fadeStage4Support=false;fadeRecoveryStreak=0;fadeStage4Count=0;fadeNotYet=false;fadeBestStreak=0;recentAnswerTimes=[];rapidNudge=false;window.scrollTo(0,0);fadeNew()}
function goFadeMenu(){mode="fadeMenu";window.scrollTo(0,0);render()}
function renderFadeMenu(){
  // نرتّب: غير المتقن أولاً، ثم المتقن المستحقّ للمراجعة، ثم المتقن الذي لم يحن موعده — فتتوجّه تلقائياً للأضعف
  const rank=t=>{const m=fadeMasteryState(t.key);return !m.mastered?0:(m.due?1:2)};
  const sorted=FADE_TOPICS.map((t,i)=>({t,i})).sort((a,b)=>rank(a.t)-rank(b.t)||a.i-b.i).map(x=>x.t);
  const card=t=>{
    const m=fadeMasteryState(t.key);
    const badge=!m.mastered?""
      :m.due?`<div style="font-size:11px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:99px;padding:2px 8px;display:inline-block;margin-top:5px">🔁 حان وقت المراجعة</div>`
      :`<div style="font-size:11px;font-weight:800;color:#059669;background:#ECFDF5;border-radius:99px;padding:2px 8px;display:inline-block;margin-top:5px">✓ متقن · مراجعة بعد ${arDays(m.daysLeft)}</div>`;
    const dim=m.mastered&&!m.due?'opacity:.62;':'';
    return `<button class="mode" style="text-align:center;${dim}" onclick="startFade('${t.key}')"><div style="font-size:26px;margin-bottom:6px">${t.icon}</div><div class="m-name">${t.label}</div><div class="m-sub">${t.sub}</div>${badge}</button>`;
  };
  const st=fadeMasteryLoad();
  const nMast=Object.keys(st).length,nDue=FADE_TOPICS.filter(t=>fadeMasteryState(t.key).due).length;
  const summary=nMast?`<div style="background:#F0FDF4;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#065F46;line-height:1.8">🏆 أتقنتِ <b>${toAr(nMast)}</b> من ${toAr(FADE_TOPICS.length)} أنواع.${nDue?` ومنها <b>${toAr(nDue)}</b> حان وقت مراجعتها اليوم.`:" الأنواع المتقنة تنزل لآخر القائمة وتعود للمراجعة في موعدها."}</div>`:"";
  app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="section-title"><span>🎓 اختاري نوع التقوية</span></div>
  ${summary}
  <div class="modes">${sorted.map(card).join("")}</div>`;
}
function renderFadeDone(){
  const topicLabel=FADE_TOPICS.find(t=>t.key===fadeTopic).label;
  const m=fadeMasteryState(fadeTopic);
  const days=m.mastered?FADE_REVIEW_DAYS[m.level-1]:FADE_REVIEW_DAYS[0];
  if(fadeNotYet){
    const got=fadeBestStreak;
    app.innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:44px;margin-bottom:6px">🌱</div>
      <div style="font-weight:800;font-size:19px;margin-bottom:8px">${topicLabel} — لم يكتمل الإتقان بعد</div>
      <div style="color:#64748B;font-size:14px;line-height:1.8;margin-bottom:12px">
        حللتِ ${toAr(fadeStage4Count)} أسئلة مستقلة، وأطول سلسلة صحيحة متتالية بلغت ${toAr(got)} من ${toAr(MASTERY_REQ)}.
        نتوقّف هنا عمداً: الاستمرار بعد هذا الحدّ يحوّل الحل إلى تخمين، والتخمين يدرّب على التخمين لا على القاعدة.
      </div>
      <div style="background:#FEF3C7;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#92400E;line-height:1.9">
        📅 هذا النوع يبقى في مقدّمة قائمتك ويعود <b>غداً</b>.<br>
        <span style="font-size:12px">راجعي شرح القاعدة في المرحلة الأولى قبل أن تعيديه — العودة بعد راحة أنفع من مئة محاولة متتالية.</span>
      </div>
      <button class="btn" style="background:#D97706" onclick="startFade(fadeTopic)">🔁 أعيدي من البداية (بالشرح)</button>
      <button class="btn" style="background:#0891B2" onclick="goFadeMenu()">↔️ نوع آخر</button>
      <button class="link-btn" onclick="home()">→ الرئيسية</button>
    </div>`;
    return;
  }
  app.innerHTML=`<div class="card" style="text-align:center">
    <div style="font-size:44px;margin-bottom:6px">🏆</div>
    <div style="font-weight:800;font-size:19px;margin-bottom:8px">أتقنتِ ${topicLabel}!</div>
    <div style="color:#64748B;font-size:14px;line-height:1.8;margin-bottom:12px">جاوبتِ ${toAr(MASTERY_REQ)} أسئلة صحيحة متتالية بدون أي مساعدة — هذا يعني إتقاناً حقيقياً لهذا النوع.</div>
    <div style="background:#EFF6FF;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#1E40AF;line-height:1.9">📅 سيعود هذا النوع للمراجعة بعد <b>${arDays(days)}</b>.<br><span style="font-size:12px">الإتقان في جلسة واحدة يتلاشى بلا مراجعة، فنعيده مرة واحدة عند حافة النسيان بدل تكراره كل يوم.</span></div>
    <button class="btn" style="background:#059669" onclick="goFadeMenu()">🔁 تدريب نوع آخر</button>
    <button class="link-btn" onclick="home()">→ الرئيسية</button>
  </div>`;
}

  {label:"مرحلة ١: مثال محلول كامل (شاهدي الحل)",tag:"شاهدي"},
  {label:"مرحلة ٢: احذف آخر خطوة (طبّقي القاعدة)",tag:"طبّقي"},

  {label:"مرحلة ٤: حلّ مستقل (بلا مساعدة)",tag:"مستقل"},
][fadeStage-1]}

// ===== تدريب الأساسيات: عائلات الحقائق (ضرب/قسمة) + الجمع بالحمل + الطرح بالاستلاف (عشرات/مئات) =====
// نهج CRA (محسوس ← مرتبط بالرسم ← مجرّد بقاعدة ← مستقل)، نفس فلسفة وضع التقوية أعلاه
const BASICS_REQ=2;
const BASICS_SUBS={
  multdiv:{label:"عائلات الضرب والقسمة",short:"عائلات الضرب والقسمة"},
  addcarry:{label:"الجمع (عشرات/مئات)",short:"الجمع"},
  subborrow:{label:"الطرح (عشرات/مئات)",short:"الطرح"},
  percent:{label:"أساسيات النسبة المئوية",short:"النسبة المئوية"},
  pimul:{label:"الضرب في ٣٫١٤ (بلا آلة حاسبة)",short:"الضرب في ٣٫١٤"},
  pimul3:{label:"٣٫١٤ بين عددين (٤ × ٣٫١٤ × ٣)",short:"٣٫١٤ بين عددين"}
};
const BASICS_TERMS={
  multdiv:[{ar:"ضرب",en:"multiplication"},{ar:"قسمة",en:"division"}],
  addcarry:[{ar:"جمع",en:"addition"},{ar:"عشرات",en:"tens"}],
  subborrow:[{ar:"طرح",en:"subtraction"},{ar:"فرق",en:"difference"}],
  percent:[{ar:"نسبة مئوية",en:"percentage"}],
  pimul3:[{ar:"الخاصية التبديلية",en:"commutative property"}],

function subtractionSteps(a,b){
  const ad=String(a).split("").reverse().map(Number),bd=String(b).split("").reverse().map(Number);
  const len=Math.max(ad.length,bd.length),placeNames=["الآحاد","العشرات","المئات"];
  let borrow=0,steps=[];
  for(let i=0;i<len;i++){
    const rawA=ad[i]||0,db=bd[i]||0,da=rawA-borrow;
    const borrowedNote=borrow?` (بعد الاستلاف: ${toAr(rawA)}-١=${toAr(da)})`:"";
    if(da<db){
      steps.push(`${placeNames[i]||("خانة "+toAr(i+1))}: ${toAr(da)}${borrowedNote} أصغر من ${toAr(db)}، فنستلف ١ من الخانة التالية: ${toAr(da+10)} - ${toAr(db)} = ${toAr(da+10-db)}`);
      borrow=1;
    }else{
      steps.push(`${placeNames[i]||("خانة "+toAr(i+1))}: ${toAr(da)}${borrowedNote} - ${toAr(db)} = ${toAr(da-db)}`);
      borrow=0;
    }
  }
  return steps;
}
function basicsMakeFamily(){const a=rand(2,9),b=rand(2,9);return{a,b,c:a*b}}
function basicsMakeAddCarry(){const o1=rand(5,9),o2=rand(5,9),t1=rand(1,8),t2=rand(1,8);const a=t1*10+o1,b=t2*10+o2;return{a,b,c:a+b}}
function basicsMakeSubBorrow(){const o2=rand(2,9),o1=rand(0,o2-1),t2=rand(1,7),t1=rand(t2+1,9);const a=t1*10+o1,b=t2*10+o2;return{a,b,c:a-b}}

function basicsMakePercent(){const a=pick([100,200,300,400,500,600,800,1000]),b=pick([10,20,25,30,40,50,60,70,75,80,90]);const onePercent=a/100,c=onePercent*b;return{a,b,c,onePercent}}
function basicsFamilyQ(f){
  const kind=pick(["mul1","mul2","div1","div2"]);
  if(kind==="mul1")return{text:`${toAr(f.a)} × ${toAr(f.b)} = ؟`,ans:f.c};
  if(kind==="mul2")return{text:`${toAr(f.b)} × ${toAr(f.a)} = ؟`,ans:f.c};
  if(kind==="div1")return{text:`${toAr(f.c)} ÷ ${toAr(f.a)} = ؟`,ans:f.b};
  return{text:`${toAr(f.c)} ÷ ${toAr(f.b)} = ؟`,ans:f.a};
}

function basicsPrep(){

  else if(basicsSub==="addcarry"){ans=f.c;basicsCur.qText=`${toAr(f.a)} + ${toAr(f.b)} = ؟`}
  else if(basicsSub==="subborrow"){ans=f.c;basicsCur.qText=`${toAr(f.a)} - ${toAr(f.b)} = ؟`}
  else if(basicsSub==="pimul"){ans=f.c;basicsCur.qText=`٣٫١٤ × ${toAr(f.a)} = ؟`}
  else if(basicsSub==="pimul3"){ans=f.c;basicsCur.qText=`${toAr(f.a)} × ٣٫١٤ × ${toAr(f.k)} = ؟`}
  else{ans=f.c;basicsCur.qText=`${toAr(f.b)}% من ${toAr(f.a)} = ؟`}
  // مموّهات ٣٫١٤: الفاصلة في الموضع الخطأ (الخطأ الكلاسيكي)، ونسيان جزء من التفكيك
  const m=basicsSub==="percent"?mcNum(ans,[ans+f.onePercent,ans-f.onePercent,f.a*f.b])

    :basicsSub==="pimul3"?mcNumDec(ans,[round2(PI_APPROX*Math.max(f.a,f.k)),f.d,round2(ans/10)])
    :mcNum(ans,[ans+1,ans-1,ans+10]);

function basicsRecord(ok,resp){
  if(basicsStage===5){basicsFinalCount++;if(basicsMasteryStreak+(ok?1:0)>basicsBestStreak)basicsBestStreak=basicsMasteryStreak+(ok?1:0)}
  if(ok)basicsStreak++;else basicsStreak=0;
  if(basicsStage===4){
    if(!ok){basicsMidSupport=true;basicsMidRecoveryStreak=0}
    else if(basicsMidSupport){basicsMidRecoveryStreak++;if(basicsMidRecoveryStreak>=RECOVERY_REQ){basicsMidSupport=false;basicsMidRecoveryStreak=0}}
  } else if(basicsStage===5){
    if(!ok){basicsMasteryStreak=0;basicsFinalSupport=true;basicsFinalRecoveryStreak=0}
    else if(basicsFinalSupport){basicsFinalRecoveryStreak++;if(basicsFinalRecoveryStreak>=RECOVERY_REQ){basicsFinalSupport=false;basicsFinalRecoveryStreak=0}}
    else{basicsMasteryStreak++}
  }
  const elapsed=basicsShownAt?Date.now()-basicsShownAt:null;
  // الرقم الذي أنتجته فعلاً: بدونه أعرف أنها أخطأت ولا أعرف نوع الخطأ (نسيت الحمل؟ أخطأت موضع الفاصلة؟)
  logAnswer("basics_"+basicsSub,"stage"+basicsStage,ok,resp,null,elapsed,{q_text:basicsCur.qText||null});
  if(elapsed!=null){
    recentAnswerTimes.push(elapsed);if(recentAnswerTimes.length>RAPID_STREAK)recentAnswerTimes.shift();

}

// ===== نطق إنجليزي بصوت أمريكي عبر خاصية المتصفح المدمجة (بلا أي خدمة خارجية) =====
// onDone (اختياري): يبلغ بنتيجة فعلية {ok,voicesCount,hasEnVoice,voiceName} أو {ok:false,reason,errorType} — يُستخدم في تشخيص الصوت

// ننطق نصاً صامتاً عند أول لمسة في الصفحة حتى يصير محرّك الصوت مفتوحاً لما تضغط أي زر 🔊 بعدها.
let _ttsUnlocked=false;
function unlockTTS(){
  if(_ttsUnlocked||!('speechSynthesis' in window))return;

  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;window.speechSynthesis.speak(u)}catch(e){}
}

function speakEnglish(text,onDone){
  try{
    if(!text||!('speechSynthesis' in window)){ttsMark(false);if(onDone)onDone({ok:false,reason:'unsupported'});return}
    const synth=window.speechSynthesis;
    let triedFallback=false,started=false,retried=false;
    const attempt=(forceNoLang)=>{
      // إلغاء ما قبله فقط عند وجود نطق جارٍ فعلاً — استدعاء cancel() دائماً قبل speak() يبتلع النطق الجديد على iOS
      try{if(synth.speaking||synth.pending)synth.cancel()}catch(e){}
      const u=new SpeechSynthesisUtterance(text);
      const voices=synth.getVoices();
      const usVoice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'));
      if(!forceNoLang){u.lang='en-US';u.rate=0.85;try{if(usVoice)u.voice=usVoice}catch(e){}}
      else{u.rate=0.85} // لا نفرض لغة/صوتاً غير متوفرين على الجهاز، نترك المتصفح يختار افتراضياً
      u.onstart=()=>{started=true;ttsMark(true);if(onDone)onDone({ok:true,voicesCount:voices.length,hasEnVoice:!!usVoice,voiceName:usVoice&&usVoice.name,fallback:!!forceNoLang})};
      u.onerror=(e)=>{
        if(!forceNoLang&&!triedFallback){triedFallback=true;attempt(true);return}
        ttsMark(false);if(onDone)onDone({ok:false,reason:'speak_error',errorType:e&&e.error,voicesCount:voices.length,hasEnVoice:!!usVoice});
      };
      synth.resume();
      synth.speak(u);
    };
    // ننطق فوراً وبشكل متزامن داخل لمسة المستخدم. التأجيل لانتظار قائمة الأصوات (voiceschanged/setTimeout)
    // يُخرج الاستدعاء من سياق اللمسة، فتتجاهله المتصفحات بصمت — وهذا سبب عدم خروج أي صوت على الجهاز.
    const voicesReady=synth.getVoices().length>0;
    attempt(false);
    // لو كانت قائمة الأصوات فارغة وقت اللمس ولم يبدأ النطق، نعيد المحاولة مرة واحدة بعد وصولها
    if(!voicesReady){
      setTimeout(()=>{if(!started&&!retried){retried=true;attempt(false)}},700);
    }
  }catch(e){ttsMark(false);if(onDone)onDone({ok:false,reason:'exception',message:String(e&&e.message||e)})}
}

async function runMicDiag(){

  if(!micTrace.length)return "";

async function traceRecord(){
  micTrace=[];traceAdd("١) وصلت الضغطة إلى الكود ✓");
  if(typeof pronStart!=="function"){traceAdd("✗ <b>pronStart غير معرَّفة</b> — هنا العطل: الزرّ سليم والدالة غير موجودة.");return}
  traceAdd("٢) دالة التسجيل موجودة ✓");
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){traceAdd("✗ واجهة الميكروفون غير متاحة");return}
  let stream=null;
  try{
    traceAdd("٣) نطلب الميكروفون…");
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    traceAdd("٤) فُتح الميكروفون ✓");
  }catch(e){traceAdd("✗ رُفض الميكروفون: "+((e&&e.name)||e));return}
  try{
    if(typeof MediaRecorder==="undefined"){traceAdd("✗ MediaRecorder غير مدعوم");stream.getTracks().forEach(t=>t.stop());return}
    const chunks=[];
    const rec=new MediaRecorder(stream);
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(function(res){rec.onstop=res});
    rec.start();traceAdd("٥) بدأ التسجيل — تكلّمي الآن ثلاث ثوانٍ…");
    await new Promise(function(r){setTimeout(r,3000)});
    rec.stop();await stopped;
    stream.getTracks().forEach(t=>t.stop());
    const size=chunks.reduce(function(s,c){return s+c.size},0);
    traceAdd("٦) توقّف التسجيل ✓ — حجم الصوت: <b>"+toAr(size)+"</b> بايت");
    traceAdd(size>500?"✓ <b>التسجيل يعمل تماماً.</b> فإن بقي زرّ 🎤 صامتاً فالعطل في الزرّ نفسه لا في الميكروفون — أخبريني."

  }catch(e){traceAdd("✗ فشل التسجيل: "+((e&&e.name)||e)+" — "+((e&&e.message)||""))}

function runAudioDiag(){
  audioDiagResult={status:"⏳ جارٍ التجربة..."};render();
  speakEnglish("Hello, can you hear this?",(r)=>{audioDiagResult=r;render()});
}
function renderAudioDiag(){
  const supported='speechSynthesis' in window;
  const voices=supported?window.speechSynthesis.getVoices():[];
  const enVoices=voices.filter(v=>v.lang&&v.lang.startsWith('en'));
  let resultBox="";
  if(audioDiagResult){
    if(audioDiagResult.status)resultBox=`<div style="background:#F1F5F9;border-radius:12px;padding:14px;margin-top:14px;font-size:14px">${audioDiagResult.status}</div>`;
    else if(audioDiagResult.ok)resultBox=`<div style="background:#ECFDF5;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#065F46">✓ المتصفح نفّذ أمر النطق فعلاً${audioDiagResult.fallback?" (بصوت افتراضي، لأن الصوت الإنجليزي المحدد ما اشتغل)":""}. الصوت المستخدم: ${audioDiagResult.voiceName||"افتراضي الجهاز"}.<br>لو ما سمعتِ شيئاً رغم هذا، فالمشكلة في صوت الجهاز نفسه (كتم/مستوى الصوت) وليست في الموقع.</div>`;
    else resultBox=`<div style="background:#FEF2F2;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#991B1B">✗ فشل النطق فعلياً: ${audioDiagResult.reason}${audioDiagResult.errorType?" ("+audioDiagResult.errorType+")":""}.<br>هذا يعني الجهاز/المتصفح لا يقدر يشغّل تحويل النص لصوت حالياً.</div>`;
  }
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="card">
    <div style="font-weight:800;font-size:17px;margin-bottom:14px">🔊 تشخيص الصوت</div>
    <div style="font-size:14px;color:#475569;line-height:1.9;margin-bottom:14px">
      يدعم المتصفح تحويل النص لصوت: <b>${supported?"نعم":"لا"}</b><br>
      عدد الأصوات المتوفرة على الجهاز: <b>${toAr(voices.length)}</b><br>
      عدد الأصوات الإنجليزية: <b>${toAr(enVoices.length)}</b>${enVoices.length?" ("+enVoices.map(v=>v.name).join("، ")+")":""}
    </div>
    <button class="btn" style="background:#0891B2" onclick="runAudioDiag()">🔊 جربي النطق الآن</button>
    ${resultBox}
    ${micDiagHTML()}
    <div style="font-size:13px;color:#94A3B8;margin-top:18px;line-height:1.8">لو ظهر "فشل النطق فعلياً"، أو ظهر "نجح" لكن ما سمعتِ صوتاً: تأكدي إن صوت الجهاز غير مكتوم وبمستوى عالٍ كافٍ، وافتحي إعدادات الهاتف ← إعدادات إضافية/تحويل النص إلى كلام ← تأكدي إن حزمة الصوت الإنجليزي منزّلة (قد تحتاجين تنزيلها لأول مرة)، ثم أعيدي المحاولة.</div>
  </div>`;
}

// ===== محرّك التباعد المتمدّد =====
const SRS_KEY="mawhiba_eng_srs";
const SRS_INTERVALS=[1,2,4,8,16,32]; // أيام
// تقديرات زمنية واقعية لطالبة سادس (قراءة السؤال بالعربي + الخيارات بالإنجليزي)
const ENG_SECS={lesson:90,vocab:25,grammar:35,reading:110,dict:35};
const PLAN_SECS=34*60;  // ٣٤ دقيقة تدريب مُصحَّح + ٦ دقائق نطق = ٤٠ دقيقة
const NEW_CAP=25;       // حد العناصر الجديدة يومياً (قريب من المعتمد في أنظمة التباعد) لكبح الحمل المعرفي
function srsLoad(){try{return JSON.parse(localStorage.getItem(SRS_KEY)||"{}")}catch(e){return{}}}
function srsSave(o){try{localStorage.setItem(SRS_KEY,JSON.stringify(o))}catch(e){}}
function srsToday(){return Math.floor(Date.now()/86400000)}
function srsUpdate(id,ok){
  const st=srsLoad(),r=st[id]||{box:0,seen:0};
  r.box=ok?Math.min(r.box+1,SRS_INTERVALS.length-1):0; // الخطأ يُعيد العنصر لبداية السلّم
  r.due=srsToday()+SRS_INTERVALS[r.box];r.seen=(r.seen||0)+1;
  st[id]=r;srsSave(st);
}
function lessonSeen(id){try{return (JSON.parse(localStorage.getItem("mawhiba_eng_lessons")||"[]")).includes(id)}catch(e){return false}}
function lessonMark(id){try{const a=JSON.parse(localStorage.getItem("mawhiba_eng_lessons")||"[]");if(!a.includes(id)){a.push(id);localStorage.setItem("mawhiba_eng_lessons",JSON.stringify(a))}}catch(e){}}
// ===== إعادة تدريس القاعدة عند تكرار الفشل فيها =====
// كان الشرح يُعرض مرة واحدة في العمر، ثم يُوسم "شوهد" إلى الأبد ويكتفي النظام بإعادة الاختبار
// عبر التباعد. لكن التباعد أداة استرجاع لما تعلّمته لا أداة تعليم: فأخذت ٢/١٤ في القواعد،
// وتسعة من أصل أربعة عشر عنصراً كانت في الصندوق صفر — أي أخطأت فيها من قبل وأُعيدت بلا شرح.
// الآن نتابع دقة كل قاعدة، فإن هبطت أُلغي وسم "شوهد" وعاد الشرح قبل أسئلتها.
const LESSON_PERF_KEY="mawhiba_eng_lesson_perf";
const LESSON_WINDOW=6, LESSON_MIN=3, LESSON_WEAK_PCT=40, RETEACH_CAP=2, RETEACH_ITEMS=3;
function lessonPerfLoad(){try{return JSON.parse(localStorage.getItem(LESSON_PERF_KEY)||"{}")}catch(e){return{}}}
function lessonPerfSave(o){try{localStorage.setItem(LESSON_PERF_KEY,JSON.stringify(o))}catch(e){}}
function lessonRecord(lessonId,ok){
  if(!lessonId)return;
  const p=lessonPerfLoad(),r=p[lessonId]||{recent:[]};
  r.recent=(r.recent||[]).concat(ok?1:0).slice(-LESSON_WINDOW);
  p[lessonId]=r;lessonPerfSave(p);
}
function lessonWeak(id){
  const r=lessonPerfLoad()[id];
  if(!r)return false;
  // القواعد المبذورة موسومة صراحةً لا بعدد محاولات ملفَّق: الدليل عليها من سجلّ الخادم
  // (٩ من ١٤ عنصراً كانت في الصندوق صفر، أي فشل متكرّر سابق) لا من محاولتين فقط
  if(r.forceWeak)return true;
  if(!r.recent||r.recent.length<LESSON_MIN)return false;
  const pct=100*r.recent.reduce((a,b)=>a+b,0)/r.recent.length;
  return pct<=LESSON_WEAK_PCT;
}
// بعد إعادة التدريس نبدأ نافذة جديدة، وإلا عاد الشرح كل يوم على تاريخ قديم لا على أدائها بعده
function lessonResetWindow(id){const p=lessonPerfLoad();if(p[id]){p[id].recent=[];delete p[id].forceWeak;p[id].retaught=srsToday();lessonPerfSave(p)}}
function lessonNeeded(id){return !lessonSeen(id)||lessonWeak(id)}
// بذرة من بيانات حقيقية: جلسة ٥ أغسطس أعطت ٢/١٤ في القواعد موزّعة على سبع قواعد. بلا هذه البذرة
// لن يبدأ التتبّع إلا من الصفر، فتنتظر ثلاث محاولات فاشلة جديدة في كل قاعدة قبل أن يعود الشرح —
// وهي أخطأت فيها فعلاً أمامنا. نبذر ما حدث لا ما نظنّه: صحيح/خطأ كما سُجّل بالضبط.
const LESSON_SEED_KEY="mawhiba_eng_lesson_seed_v1";
const LESSON_SEED={l_cond:[0,0],l_few:[0,0],l_rel:[0,0],l_pastprog:[0,0],l_pp_q:[1,0,0],l_pp_vs:[0],l_passive:[0]};
function lessonSeedOnce(){
  try{
    if(localStorage.getItem(LESSON_SEED_KEY))return;
    const p=lessonPerfLoad();
    Object.keys(LESSON_SEED).forEach(k=>{if(!p[k])p[k]={recent:LESSON_SEED[k].slice(),forceWeak:true}});
    lessonPerfSave(p);localStorage.setItem(LESSON_SEED_KEY,"1");
  }catch(e){}
}
try{lessonSeedOnce()}catch(e){appError('lessonSeedOnce',e)}
// يبني خطة اليوم: المستحق أولاً (الأهم علمياً)، ثم جديد بحد أقصى، مع بطاقة شرح قبل أول تدريب على أي قاعدة
// المخزون = عناصر المنهج (تشمل عناصر إملاء حقيقية أصلاً)، بمعرّفات ثابتة.
let _engPool=null;
function engPool(){
  if(_engPool)return _engPool;
  _engPool=[...ENG_ITEMS]; // ENG_ITEMS يضمّ عناصر dict الحقيقية أصلاً؛ DICTATION_A1 صار نفس الكلمات بالضبط (مصدر واحد) فلا داعي لدمجها مرتين
  return _engPool;
}
// بنك المنهج مكتوب بالإجابة الصحيحة أولاً دائماً؛ بلا خلط ستتعلّم موضع الإجابة لا محتواها
function engShuffleChoices(it){
  if(!it.c||it.c.length!==4)return it;
  const order=shuffle([0,1,2,3]);
  return {...it,c:order.map(i=>it.c[i]),a:order.indexOf(it.a)};
}
function buildDailyPlan(){
  const st=srsLoad(),today=srsToday(),POOL=engPool();
  const due=POOL.filter(i=>st[i.id]&&st[i.id].due<=today);
  const fresh=POOL.filter(i=>!st[i.id]);
  const chosen=[];let secs=0,newCount=0;
  const fits=it=>secs+(ENG_SECS[it.t]||30)<=PLAN_SECS;
  // نلتقط حالة العنصر وقت اختياره (جديد؟ وأي درجة على سلّم التباعد) قبل أن يغيّرها srsUpdate بعد الإجابة —
  // بدونها لا يمكن التمييز بين "عنصر جديد فطبيعي أن تخطئ فيه" و"عنصر سبق أن أتقنته فتراجعت فيه"
  const add=it=>{if(!fits(it))return false;const r=st[it.id];chosen.push(Object.assign({},it,{_isNew:!r,_box:r?r.box:null}));secs+=ENG_SECS[it.t]||30;return true};
  shuffle(due).forEach(add);
  // القاعدة الضعيفة لا تُصلَح بانتظار موعد عناصرها. عناصر قاعدة أتقنتها قديماً تكون في صندوق
  // عالٍ وموعدها بعد أسبوعين، فتبقى موسومة "ضعيفة" ولا يظهر شرحها أبداً — وهذا ما حدث فعلاً:
  // سبع قواعد ضعيفة وبطاقة إعادة واحدة تظهر. فنسحب عناصرها إلى خطة اليوم استثناءً مقصوداً من
  // قاعدة "لا تكرار قبل الاستحقاق"، لأن الغرض هنا تعليم لا استرجاع.
  const weakRank=[...new Set(POOL.map(i=>i.lesson).filter(Boolean))].filter(lessonWeak)
    .map(L=>{const r=lessonPerfLoad()[L]||{},rec=r.recent||[];
      return{L,acc:rec.length?rec.reduce((a,b)=>a+b,0)/rec.length:0}})
    .sort((a,b)=>a.acc-b.acc).slice(0,RETEACH_CAP).map(x=>x.L);
  weakRank.forEach(L=>{
    POOL.filter(i=>i.lesson===L&&!chosen.some(c=>c.id===i.id)).slice(0,RETEACH_ITEMS).forEach(add);
  });
  for(const it of fresh){if(newCount>=NEW_CAP)break;if(chosen.some(c=>c.id===it.id))continue;if(add(it))newCount++}
  // تشبيك: توزيع الأنواع بالتناوب بدل تجميع كل نوع معاً
  const byType={};chosen.forEach(i=>(byType[i.t]=byType[i.t]||[]).push(i));
  const order=["vocab","grammar","dict","reading"],woven=[];
  let any=true;while(any){any=false;order.forEach(t=>{const q=byType[t];if(q&&q.length){woven.push(q.shift());any=true}})}
  // إدراج بطاقة الشرح مرة واحدة قبل أول عنصر يعتمد عليها
  const out=[],taught={};let reteach=0;
  woven.forEach(it=>{
    if(it.lesson&&!taught[it.lesson]&&lessonNeeded(it.lesson)){
      const again=lessonSeen(it.lesson);
      // الشرح الجديد لا سقف له (محكوم بسقف الجديد أصلاً)، أما إعادة التدريس فاثنتان في اليوم:
      // الأضعف أولاً حسب ترتيب التشبيك، والباقي يعود غداً — تعلُّم قاعدتين خير من سبع محاضرات
      if(!again||reteach<RETEACH_CAP){
        if(again)reteach++;
        out.push({t:"lesson",id:it.lesson,again});taught[it.lesson]=1;
      }
    }
    out.push(engShuffleChoices(it));
  });
  return {items:out,secs,due:due.length,fresh:newCount};
}
