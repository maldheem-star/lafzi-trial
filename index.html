// ===== تحيّز الأذن بكلمات الموقف =====
// وهذا **غير** ما رفضناه في تمرين النطق: هناك نمرّر الجملة المستهدفة فينسخ Whisper ما
// كان يُفترض أن تقوله لا ما قالته — «نجاح كاذب» يهدم القياس. وهنا لا جملة مستهدفة ولا
// درجةَ نجاح على كلمة بعينها؛ الكلمات مجالُ الحديث لا جوابُه. والموقف الحرّ موضوعه
// كلمته الوحيدة. ويبقى الاحتمال قائماً أن يُحيّز خطأً — ولذلك يُسجَّل ليُقاس.
// ===== فشل المحادثة يُسجَّل =====
// جلسة إلياس صباح ١٣ أغسطس: فتح الموقف، ضغط «ساعدني» بعد تسع ثوانٍ، ثم لم ينطق حرفاً.
// ولم أستطع أن أقول لماذا — أميكروفون أم تفريغ أم تركها؟ لأن حالات الفشل تُعرض على
// الشاشة ولا تُسجَّل. وما لا يُسجَّل الآن لا يُشخَّص لاحقاً.
function coachSetFail(kind,detail,ms){
  coachFail=kind;
  const d=detail==null?"":String(detail&&detail.message||detail).slice(0,140);
  logAnswer("coach","fail",false,kind+(d?" · "+d:""),coachScene?coachScene.id:null,ms||null,
    {lesson:coachScene?coachScene.id:null,
     q_text:"said:"+coachMsgs.filter(function(m){return m.role==="user"}).length});
}
const COACH_HINT_MAX=220;
function coachHintNow(){
  if(!coachScene)return "";
  if(coachScene.free)return String(coachScene.topic||"").slice(0,COACH_HINT_MAX);
  return String(coachScene.words||"").slice(0,COACH_HINT_MAX);
}
function coachReset(){coachBusy=false;coachListening=false;
  if(coachTimer){clearInterval(coachTimer);coachTimer=null}
  if(coachStream){try{coachStream.getTracks().forEach(function(t){t.stop()})}catch(e){}coachStream=null}
  wavTapStop();render()}
async function coachStart(){
  if(coachListening||coachBusy||coachDone)return;
  if(!micSupported()){coachUnsupported=true;render();return}
  coachFail="";
  try{
    coachStream=await navigator.mediaDevices.getUserMedia({audio:true});
    coachChunks=[];
    coachRec=new MediaRecorder(coachStream);
    coachRec.ondataavailable=function(e){if(e.data&&e.data.size>0)coachChunks.push(e.data)};
    coachRec.onstop=function(){coachFinish()};
    wavTapStart(coachStream); // مأخذ Azure الموازي — فشله لا يمنع المحادثة
    coachRec.start();
    coachListening=true;coachElapsed=0;
    coachTimer=setInterval(function(){coachElapsed+=0.25;
      if(coachElapsed*1000>=COACH_MAX_MS){coachStop();return}render()},250);
    render();
  }catch(e){coachListening=false;coachSetFail("mic",e);render()}
}
const COACH_MAX_MS=20000, COACH_MIN_MS=700;
function coachStop(){
  if(!coachListening)return;
  coachListening=false;coachBusy=true;
  if(coachTimer){clearInterval(coachTimer);coachTimer=null}
  try{if(coachRec&&coachRec.state!=="inactive")coachRec.stop();else{coachBusy=false}}catch(e){coachBusy=false}
  render();
}
async function coachFinish(){
  // لقطة محلّية عند الدخول: لو أعاد الطالب اختيار موضوع (أو خرج) بينما التفريغ والتقييم
  // الصوتي غير المتزامنَين لا يزالان يعملان من الدور السابق، يُصفَّر coachScene العامّ
  // قبل أن يصل هذا الدور إلى إرسال الردّ — وقرأتُه وقتها فانهار: reply · null is not
  // an object (evaluating 'coachScene.en'). اللقطة تُبقي هذا الدور على مشهده هو.
  const scene=coachScene;
  if(coachStream){try{coachStream.getTracks().forEach(function(t){t.stop()})}catch(e){}coachStream=null}
  wavTapStop();
  const ms=Math.round(coachElapsed*1000);
  if(ms<COACH_MIN_MS){coachBusy=false;coachSetFail("short",null,ms);render();return}
  // ١) ماذا قالت؟ نصّ Whisper هو مصدر الحقيقة، ولا مرجع مكتوب في الحديث الحرّ
  let heard="";
  try{
    const blob=new Blob(coachChunks,{type:(coachRec&&coachRec.mimeType)||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetchTimeout(PRON_GROQ_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      // الدالّة تشترط مرجعاً غير فارغ ولا تستعمله في التفريغ، فنُمرّر وسماً بلا كلمات هدف.
      // ومعه كلماتُ الموقف تحيّزاً للأذن (hint): قال إلياس في المتجر ما سُمع
      // «I need an address for my sister» فبنى الشريك أربع دقائق على بطاقات المعايدة،
      // والأرجح أنه قال «a dress». والتصحيح بعد السمع لا يُمسك هذه: address كلمة
      // إنجليزية سليمة، فلا يجوز أن نستبدلها بالحدس. فالعلاج قبل السمع لا بعده.
      body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:"conversation",targetWords:[],
        hint:coachHintNow()})});
    const d=await res.json();
    if(!d||d.error){coachBusy=false;
      coachSetFail(d&&d.error==="not_configured"?"nokey":"stt",(d&&d.error)||null,ms);render();return}
    if(d.lowConfidence||!String(d.heard||"").trim()){coachBusy=false;
      coachSetFail("unclear",d&&d.conf?("noSpeech:"+d.conf.noSpeech):null,ms);render();return}
    heard=String(d.heard).trim();
  }catch(e){coachBusy=false;coachSetFail("stt",e,ms);render();return}
  // ٢) هل هي إحدى الجملتين المعروضتين عليها؟ اقتُرح عليها «I had toast.» فقالتها،
  // فسمعها Whisper «I had dust» فردّ الشريك «I don't think dust is food» — جملتها
  // صحيحة، والخطأ في السمع، والتصحيح وقع عليها. والجملتان في يدنا، فنُقابل بهما.
  const snapped=snapToSuggestion(heard,coachSaysNow());
  const rawHeard=heard;
  if(snapped){heard=snapped}
  // الصدى يُقاس على ما عُرض فعلاً: إن لم تُعرض جمل فلا حكم، لا صدى ولا تأليف
  if(coachShowSays())echoRecord(heard,coachSaysNow());
  // ٢) كيف كان نطقها؟ مرجع Azure هو نصّها نفسه
  let pct=null,weak=[];
  try{
    const az=await azureTry(heard);
    if(az.data){const sc=azureToScore(heard,az.data);pct=sc.pct;weak=sc.weak||[]}
  }catch(e){}
  coachMsgs.push({role:"user",text:heard,pct:pct,weak:weak});
  const said=coachMsgs.filter(function(m){return m.role==="user"}).length;
  logAnswer("coach","say",null,heard.slice(0,600),scene?scene.id:null,ms,
    {lesson:scene?scene.id:null,score_pct:num0(pct),weak_phonemes:weakPhonemeStr(weak),
     // الخام يبقى في السجلّ حين يختلف: التثبيت على العرض لا على البيانات
     q_text:snapped?("سُمع: "+rawHeard).slice(0,200):null});
  render();
  if(!scene){coachSetFail("reply","scene_gone");coachBusy=false;render();return}
  // ٣) ماذا يردّ الشريك؟
  try{
    const hist=coachMsgs.map(function(m){return{role:m.role,text:m.text}});
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      // نصيحة الأسلوب بطلب من التطبيق لا بمزاج النموذج: كل ثالثة جملة لا أكثر،
      // فالتصحيح في كل دور يقطع الحديث ويُشعرها أنها تُمتحَن لا تتحدّث
      // والمستوى يتبع اختيارها: مع الجمل الجاهزة يهبط إلى A1 بأسئلة مغلقة أو باختيارين،
      // فالسؤال المفتوح («What kind of…») هو ما أغرقها في جلستها الأولى.
      body:JSON.stringify({mode:"chat",learner:learnerInfo(),scene:scene.en,
        level:coachLevel(),easy:coachHelp==="suggest",suggest:true,
        // سؤال مفتوح كل ثالث دور حتى في الوضع السهل: ثماني جمل كلها «هذا أم ذاك»
        // تُنتج ثماني إجابات نصفها صدى للسؤال، فلا تؤلّف جملة واحدة في الجلسة
        openTurn:(said%COACH_OPEN_EVERY===0),
        focus:scene.focus||"",styleTip:(said%COACH_TIP_EVERY===0),
        question:scene.en,studentAnswer:heard,history:hist})});
    const d=await res.json();
    if(d&&d.reply){
      // النصيحة تُعرض مستقلّة ولا تُنطق مع الردّ: صوتها يكسر الموقف
      const p=coachParse(d.reply);
      const say=p.text,tip=p.tip;
      coachMsgs.push({role:"model",text:say,tip:tip||null,says:p.says});
      logAnswer("coach","reply",null,String(d.reply).slice(0,600),scene.id,null,{lesson:scene.id});
      coachBusy=false;
      const nSaid=coachMsgs.filter(function(m){return m.role==="user"}).length;
      if(nSaid>=COACH_MAX_TURNS){coachDone=true;setTimeout(coachReview,50)}
      // المراجعة الصامتة عند الرابعة: تُخزَّن البطاقات فلا يضيع ما قيل إن خرج قبل النهاية
      else if(nSaid>=COACH_REVIEW_AT)setTimeout(coachAutoReview,50);
      render();setTimeout(function(){speakEnglish(say)},300);
      return;
    }
    // كانت تُسجَّل بشيفرة الخطأ وحدها («tutor_bad_model») لا تفصيلها — فوصل خطأٌ حيٌّ
    // (١٧ أغسطس، إلياس ومحمد معاً) ولم أستطع معرفة السبب: الاسم الحقيقي للنموذج
    // المرفوض كان موجوداً في ردّ الخادم نفسه (d.detail/d.model/d.provider) ويُهمَل هنا.
    coachSetFail((d&&d.error)==="not_configured"?"nokey":"reply",
      d&&(String(d.error||"")+(d.provider?" · "+d.provider+"/"+(d.model||""):"")+(d.detail?" · "+d.detail:"")+(d.finishReason?" · finish:"+d.finishReason:"")));
  }catch(e){coachSetFail("reply",e)}
  coachBusy=false;render();
}
// خلاصة الجلسة: أكثر الأصوات تكراراً في قائمة الضعف — وهو السؤال الذي لم يكن له جواب قبل اليوم
// ===== تنظيف قياس النطق قبل عرضه =====
// جملة محمد سجّلت ١٠٠٪ ومعها أصوات بدرجة صفر في السطر نفسه. السبب: حين يُخطئ Whisper
// التفريغ يقيس Azure النطق على نصّ لم يُقَل، فتخرج أصفارٌ لأصوات سليمة. والبناء على
// هذا يعني أن نقول لمحمد «صوت الـt عندك ضعيف» وهو لم ينطقها — ومصحّحٌ يُخطئ أسوأ من
// غيابه. فالتصفية على العرض لا على التسجيل: الخام يبقى في قاعدة البيانات كما هو.
const WEAK_CONTRA_PCT=90;   // درجة عالية مع صوتٍ بصفر = تناقض، لا ضعف
const WEAK_MIN_WORDS=2;     // لا يُسمّى صوتٌ ضعيفاً حتى يضعف في كلمتين مختلفتين
function weakClean(list,pct){
  return (list||[]).filter(function(x){
    if(!x||!x.p)return false;
    const sc=Number(x.score||0);
    if(pct!=null&&pct>=WEAK_CONTRA_PCT&&sc<=0)return false; // متناقض: يُهمَل
    return true;
  });
}
function coachWeakSummary(){
  const tally={};
  coachMsgs.forEach(function(m){
    weakClean(m.weak,m.pct).forEach(function(x){
      const k=String(x.p||"");if(!k)return;
      if(!tally[k])tally[k]={n:0,sum:0,words:{}};
      tally[k].n++;tally[k].sum+=Number(x.score||0);
      if(x.w)tally[k].words[String(x.w).toLowerCase()]=1;
    });
  });
  return Object.keys(tally)
    .map(function(k){const t=tally[k];const ws=Object.keys(t.words);
      return{p:k,n:t.n,avg:Math.round(t.sum/t.n),words:ws}})
    // شرط الكلمتين: صوتٌ ضعف في كلمة واحدة قد يكون الكلمة لا الصوت
    .filter(function(x){return x.words.length>=WEAK_MIN_WORDS||x.n>=WEAK_MIN_WORDS+1})
    .sort(function(a,b){return b.n-a.n||a.avg-b.avg}).slice(0,3);
}
// ===== صفحة التصحيح: بعد الجلسة لا في أثنائها =====
// المقاطعة تقتل الكلام — جرّبناه. لكن الجلسة كانت تنتهي بلا شيء بيده: محمد قال
// «I have a work that I haven't worked to do» ولم يُصحَّح له شيء. فالتصحيح يُجمَع
// ويُعرض مرّة واحدة في الخلاصة، بطلب واحد من النموذج.
let coachFix=[],coachFixBusy=false,coachFixFail="",ltDropped=0,ltJudged=0;
function coachFixParse(txt){
  const out=[];
  String(txt||"").split(/\n+/).forEach(function(ln){
    const m=/^\s*FIX\s*:\s*(.+)$/i.exec(ln);if(!m)return;
    const p=m[1].split("|").map(function(x){return x.trim()});
    if(p.length>=2&&p[0]&&p[1])out.push({said:p[0],fix:p[1],why:p[2]||""});
  });
  return out.slice(0,4);
}
async function coachReview(){
  const said=coachMsgs.filter(function(m){return m.role==="user"&&m.text});
  coachFix=[];coachFixFail="";ltDropped=0;ltJudged=0;
  if(!said.length)return;
  coachFixBusy=true;render();
  try{
    const lines=said.map(function(m,i){return (i+1)+". "+m.text}).join("\n");
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"review",learner:learnerInfo(),level:coachLevel(),
        scene:coachScene?coachScene.en:"",question:"review",studentAnswer:lines})});
    const d=await res.json();
    if(d&&d.reply){coachFix=coachFixParse(d.reply);ltDropped=d.ltDropped|0;ltJudged=d.ltJudged|0}
    else coachFixFail=(d&&d.error)||"reply";
  }catch(e){coachFixFail="network"}
  coachFixBusy=false;
  // نتيجة المراجعة تُسجَّل دائماً: بلا هذا لا يُفرَّق «لا خطأ عندها» من «فشل الطلب»،
  // وقد وقعتُ فيها فعلاً — رأيتُ جلسةً بلا تصحيحات ولم أعرف أيّ الحالتين هي.
  // ومعها حكم LanguageTool: كم تصحيحاً عُرض عليه وكم أسقط — فيُعرف كم مرّة كان
  // النموذج سيُصحّح لها بجملة مكسورة لولا الحَكَم
  logAnswer("coach","review",!coachFixFail,
    coachFixFail?("fail:"+coachFixFail):(coachFix.length?("fixes:"+coachFix.length):"none"),
    coachScene?coachScene.id:null,null,{lesson:coachScene?coachScene.id:null,
      srs_box:coachFix.length,q_text:"said:"+said.length+" · lt:"+ltJudged+"/"+ltDropped});

// ثماني جمل، وهو لم يفعل أيّهما — يخرج من الجلسة كما هي. فبطاقات «أخطائي» فارغة عنده،
// والشيء الذي بُني له لم يصله. فترياقان:
//   أ) بعد أربع جمل تجري المراجعة صامتةً وتُحفَظ بطاقاتها — فلا يضيع ما قيل بالخروج.
//   ب) والرجوع للرئيسية من جلسةٍ فيها كلامٌ يمرّ على الخلاصة أوّلاً لا على الباب.
const COACH_REVIEW_AT=4;

async function coachAutoReview(){
  if(coachAutoReviewed)return;
  coachAutoReviewed=true;
  const said=coachMsgs.filter(function(m){return m.role==="user"&&m.text});
  if(said.length<COACH_REVIEW_AT)return;
  try{
    const lines=said.map(function(m,i){return (i+1)+". "+m.text}).join("\n");
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"review",learner:learnerInfo(),level:coachLevel(),
        scene:coachScene?coachScene.en:"",question:"review",studentAnswer:lines})});
    const d=await res.json();
    const fx=(d&&d.reply)?coachFixParse(d.reply):[];
    fx.forEach(function(f){fixCardSave(f)});
    logAnswer("coach","autoreview",!!(d&&d.reply),fx.length?("fixes:"+fx.length):((d&&d.error)||"none"),
      coachScene?coachScene.id:null,null,{lesson:coachScene?coachScene.id:null,srs_box:fx.length,
        q_text:"said:"+said.length+" · lt:"+((d&&d.ltJudged)|0)+"/"+((d&&d.ltDropped)|0)});
  }catch(e){
    logAnswer("coach","autoreview",false,"network",coachScene?coachScene.id:null,null,
      {lesson:coachScene?coachScene.id:null});
  }
}

  // («طلاقة ممتازة»، «جمل جاهزة»)، وتذكيرهما يُفسد الجملة.

const AR_TOK=/[ء-يً-ْٰـ]+/g;
function toMasc(w){
  if(MASC_W[w])return MASC_W[w];
  // بادئة الواو أو الفاء: «وقولي» ⇒ «وقل»
  const c=w.charAt(0);
  if((c==="و"||c==="ف")&&MASC_W[w.slice(1)])return c+MASC_W[w.slice(1)];
  // الماضي للمخاطبة: «أتقنتِ» ⇒ «أتقنتَ» — والكسرة آخرَ الكلمة لا تأتي إلا للمؤنّث هنا
  if(w.length>3&&w.slice(-2)==="تِ")return w.slice(0,-1)+"َ";
  if(w.length>2&&w.slice(-2)==="كِ")return w.slice(0,-1);
  return w;
}
function genderizeText(t){
  if(!t||!/[ء-ي]/.test(t))return t;
  return t.replace(AR_TOK,toMasc);
}
function genderizeNode(root){
  if(!root)return 0;
  let n,ch=0;
  // نصّ البرنامج نفسه داخل <script> في الجسم: تجاوُزه واجب — فيه عربيّةٌ كثيرة،
  // والمرور عليه في كل تغيير يعني مسحاً لمئات الكيلوبايتات عند كل ضغطة زرّ.
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(x){
    const t=x.parentNode&&x.parentNode.nodeName;
    return (t==="SCRIPT"||t==="STYLE"||t==="NOSCRIPT")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;
  }});
  while((n=w.nextNode())){
    const v=n.nodeValue;if(!v)continue;
    const g=genderizeText(v);
    if(g!==v){n.nodeValue=g;ch++}
  }
  const ph=root.querySelectorAll?root.querySelectorAll("[placeholder]"):[];
  for(let i=0;i<ph.length;i++){
    const v=ph[i].getAttribute("placeholder")||"",g=genderizeText(v);
    if(g!==v)ph[i].setAttribute("placeholder",g);
  }
  return ch;
}
let gzOn=false,gzBusy=false;
function genderizeInit(){
  if(gzOn||profileOf().g!=="m")return;
  gzOn=true;
  try{genderizeNode(document.body)}catch(e){appError("genderize",e)}
  // الشاشات تُعاد بناءً كثيراً، وبعض التحديثات جزئيّة لا تمرّ بـ render، فالمراقب أضمن
  try{
    new MutationObserver(function(){
      if(gzBusy)return;gzBusy=true;
      try{genderizeNode(document.body)}catch(e){}
      gzBusy=false;
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }catch(e){appError("genderizeObserve",e)}
}

// ===== بنك الكلمات: الدرجة المفقودة بين النسخ والتأليف =====
// القياس الذي أوجب هذا: متوسّط طول جملة هيا في المحادثة أربعة عشر حرفاً، و٢١ من ٢٤
// جملة أربع كلمات فأقلّ، و٤ من ١٥ دورٍ نسخٌ حرفيّ للجملة المعروضة عليها. وأخواها
// فوق ذلك (صفر نسخ لكليهما) — فالعلاج لها هي، والبوّابة مشروطة بالعَرَض لا مفروضة.
//
// وبين «خذي جملةً كاملة فقوليها» (⇒ صدى) و«ألّفي من الفراغ» (⇒ ثلاث كلمات) لم يكن
// شيء. فبنك الكلمات: تُعطى كلمات الجملة مبعثرةً فترتّبها — تأليفٌ بلا حِمل الاستحضار.
//
// وله خطّة تخفيف، وهو شرطنا لكل دعم منذ درس «الدعم الذي لا يتلاشى يصير عكازاً»:
// كلماتٌ بالعدد بالضبط ⇐ كلماتٌ زائدة دخيلة ⇐ بلا بنك. والنزول تلقائي عند تكرار
// الخطأ كما في الإملاء، فلا تعلق على درجة أصعب من قدرتها.
const WB_KEY="mawhiba_wb_stage";
const WB_REQ=3;   // ثلاث صحيحات متتالية للصعود — أكثر من الإملاء لأن الترتيب يُصاب بالحظّ
const WB_BACK=2;  // خطآن متتاليان للنزول
const WB_STAGES=[
  {label:"رتّبي الكلمات — العدد بالضبط",tag:"رتّبي",extra:0},
  {label:"رتّبي واحذري: بعض الكلمات زائدة",tag:"زائدة",extra:3},
  {label:"بلا بنك — اكتبيها بنفسك",tag:"مستقلّة",extra:-1},
];
// الدخيلة كلماتٌ وظيفية شائعة: تُشبه ما في الجملة فتُميَّز بالقاعدة لا بالشكل. ولا
// تُقال أبداً — تُرفض فحسب — فلا يسري عليها شرط «كل جملة تُعرض لتُقال تكون سليمة».
const WB_FILLERS=["the","a","an","is","are","was","were","to","in","on","at","of","and","or",
  "do","does","did","very","my","his","her","it","they","he","she","not","for","with","have","has"];
function wbStageGet(){try{const v=parseInt(lsGet(WB_KEY)||"1");return(v>=1&&v<=WB_STAGES.length)?v:1}catch(e){return 1}}
function wbStageSet(v){try{lsSet(WB_KEY,String(v))}catch(e){}}
function wbSplit(s){return String(s||"").trim().split(/\s+/).filter(Boolean)}
// المقارنة بلا ترقيم ولا حالة أحرف: الغرض ترتيب الكلمات، والنقطة ليست تأليفاً
function wbNorm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function wbDistract(tokens,n){
  if(n<=0)return[];
  const have={};tokens.forEach(function(t){have[wbNorm(t)]=1});
  return shuffle(WB_FILLERS.filter(function(w){return !have[w]})).slice(0,n);
}
let wbOn=false,wbTarget="",wbTok=[],wbPool=[],wbPicked=[],wbLocked=false,wbOk=false;
let wbStage=1,wbStreak=0,wbMiss=0,wbTyped="";
function wbStart(sentence,stage){
  wbTarget=String(sentence||"");wbTok=wbSplit(wbTarget);
  wbStage=stage||wbStageGet();
  const extra=(WB_STAGES[wbStage-1]||WB_STAGES[0]).extra;
  wbPool=extra<0?[]:shuffle(wbTok.concat(wbDistract(wbTok,extra)));
  wbPicked=[];wbLocked=false;wbOk=false;wbTyped="";wbOn=true;
}
function wbReset(){wbOn=false;wbTarget="";wbTok=[];wbPool=[];wbPicked=[];wbLocked=false;wbOk=false;wbTyped=""}
function wbPick(i){if(wbLocked||wbPicked.indexOf(i)>=0)return;wbPicked.push(i);render()}
function wbUnpick(k){if(wbLocked)return;wbPicked.splice(k,1);render()}
function wbBuilt(){return wbPicked.map(function(i){return wbPool[i]}).join(" ")}
function wbTypedNow(){const el=document.getElementById('wbIn');return el?el.value:wbTyped}
function wbReady(){return wbStage>=WB_STAGES.length?!!wbTypedNow().trim():wbPicked.length>0}
function wbGrade(ok){
  if(ok){wbMiss=0;wbStreak++;if(wbStreak>=WB_REQ&&wbStage<WB_STAGES.length){wbStage++;wbStreak=0;wbStageSet(wbStage)}}
  else{wbStreak=0;wbMiss++;if(wbMiss>=WB_BACK&&wbStage>1){wbStage--;wbMiss=0;wbStageSet(wbStage)}}
}
// يُرجع نتيجة الفحص ولا يرسم: المُستدعي هو من يعرف ماذا يفعل بها (يُسجّل، يتقدّم…)
function wbCheck(){
  if(wbLocked)return wbOk;
  const got=wbStage>=WB_STAGES.length?wbTypedNow():wbBuilt();
  wbTyped=got;wbOk=wbNorm(got)===wbNorm(wbTarget);wbLocked=true;wbGrade(wbOk);
  return wbOk;
}
function wbSay(){if(wbTarget)speakEnglish(wbTarget)}
function wbHTML(){
  if(!wbOn)return"";
  const st=WB_STAGES[wbStage-1]||WB_STAGES[0];
  const bar=WB_STAGES.map(function(_,x){return `<div class="seg" style="flex:1;height:8px;border-radius:99px;background:${x+1<wbStage?'#10B981':x+1===wbStage?'#0E7490':'#E2E8F0'}"></div>`}).join("");
  if(wbStage>=WB_STAGES.length){
    return `<div style="display:flex;gap:6px;margin-bottom:8px">${bar}</div>
    <div style="font-size:12px;font-weight:800;color:#0E7490;margin-bottom:10px">${st.label}</div>
    <input id="wbIn" ${wbLocked?"disabled":""} value="${esc(wbTyped)}" style="width:100%;padding:14px;border-radius:12px;border:2px solid #E2E8F0;font-size:17px;direction:ltr;font-family:Georgia,serif" placeholder="type the sentence" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  }
  const line=wbPicked.length
    ? wbPicked.map(function(i,k){return `<button type="button" ${wbLocked?"disabled":""} onclick="wbUnpick(${k})"
        style="background:#0E7490;color:#fff;border:none;border-radius:10px;padding:8px 12px;margin:0 4px 6px 0;
        font-family:Georgia,serif;font-size:16px;cursor:${wbLocked?'default':'pointer'}">${esc(wbPool[i])}</button>`}).join("")
    : `<span style="color:#94A3B8;font-size:14px">اضغطي الكلمات بالترتيب…</span>`;
  const tiles=wbPool.map(function(w,i){
    const used=wbPicked.indexOf(i)>=0;
    return `<button type="button" ${(used||wbLocked)?"disabled":""} onclick="wbPick(${i})"
      style="background:${used?'#F1F5F9':'#fff'};color:${used?'#CBD5E1':'#0F172A'};border:1.5px solid ${used?'#E2E8F0':'#A5F3FC'};
      border-radius:10px;padding:8px 12px;margin:0 4px 6px 0;font-family:Georgia,serif;font-size:16px;
      cursor:${(used||wbLocked)?'default':'pointer'}">${esc(w)}</button>`}).join("");
  return `<div style="display:flex;gap:6px;margin-bottom:8px">${bar}</div>
  <div style="font-size:12px;font-weight:800;color:#0E7490;margin-bottom:10px">${st.label}</div>
  <div style="direction:ltr;text-align:left;min-height:52px;background:#F8FAFC;border:2px dashed #CBD5E1;
    border-radius:12px;padding:10px;margin-bottom:12px">${line}</div>
  <div style="direction:ltr;text-align:left">${tiles}</div>`;
}

// تدرّج الإملاء (نفس فلسفة التقوية/الأساسيات): الكتابة الحرة من الصفر أصعب بكثير من الاختيار من متعدد،
// فنبدأ بالنسخ (ربط الصوت بالحروف) ثم نسحب المساعدة تدريجياً. المرحلة محفوظة بين الجلسات ليستمر التقدّم.
const DICT_REQ=2;   // إجابتان صحيحتان متتاليتان للصعود لمرحلة أصعب
const DICT_BACK=2;  // خطآن متتاليان للنزول لمرحلة أسهل (دعم تلقائي)
const DICT_STAGES=[
  {label:"مرحلة ١: انسخي الكلمة (اربطي الصوت بالحروف)",tag:"انسخي"},
  {label:"مرحلة ٢: أول حرف معطى",tag:"أول حرف"},
  {label:"مرحلة ٣: عدد الحروف فقط",tag:"عدد الحروف"},
  {label:"مرحلة ٤: بلا مساعدة (مستقل)",tag:"مستقل"},
];
function dictStageGet(){try{const v=parseInt(lsGet("mawhiba_dict_stage")||"1");return(v>=1&&v<=4)?v:1}catch(e){return 1}}
function dictStageSet(v){try{lsSet("mawhiba_dict_stage",String(v))}catch(e){}}
// تلميح المرحلة: الكلمة كاملة ← أول حرف + شرطات ← شرطات فقط ← لا شيء
function dictHint(word,stage){
  if(stage>=4)return"";
  if(stage<=1)return word;
  return word.split("").map((c,i)=>(stage===2&&i===0)?c:"_").join(" ");
}
// مقارنة حرفاً بحرف: تُظهر لها أي الحروف أصابت وأيها أخطأت بدل مجرد "غلط"
function dictDiff(typed,correct){
  const t=(typed||"").split("");
  return correct.split("").map((ch,i)=>`<span style="color:${t[i]===ch?'#059669':'#DC2626'}">${ch}</span>`).join("");
}
// ذاكرة أخطاء الإملاء محلّياً: ما يُسجَّل في الخادم يصلح للتشخيص لا للعلاج الفوري،
// ووضع «أخطائي» يحتاج أن يعرف الآن أيّ كلمة عثرت فيها. والصواب يمحو الأثر.
const DICT_ERR_KEY="mawhiba_dict_err_v1";
function dictErrLoad(){try{return JSON.parse(lsGet(DICT_ERR_KEY)||"{}")}catch(e){return{}}}
function dictErrSave(o){try{lsSet(DICT_ERR_KEY,JSON.stringify(o))}catch(e){}}
function dictErrRecord(word,ok,typed){
  if(!word)return;
  const m=dictErrLoad(),k=String(word).toLowerCase();
  if(ok){delete m[k]}
  else{const r=m[k]||{wrong:0,last:""};r.wrong=(r.wrong||0)+1;r.last=String(typed||"");m[k]=r}
  dictErrSave(m);
}
let dictSession=[],dictIdx=0,dictInput="",dictLocked=false,dictScore=0,dictDone=false;
let dictStage=1,dictStreak=0,dictMiss=0,dictShownAt=0;
function dictCur(){return dictSession[dictIdx]||{}}

function startDictation(){

  // وهي الاستماع والبناء معاً — أنفع من كلٍّ وحده، وبلا شاشة جديدة.
  const words=shuffle(DICTATION_A1).slice(0,8);
  const sents=shuffle(engBuildFor(profileOf().level)).slice(0,4)
    .map(function(x){return{s:x.s,m:x.m,id:x.id,build:true}});
  mode="dictation";dictSession=words.concat(sents);dictIdx=0;dictInput="";dictLocked=false;dictScore=0;dictDone=false;
  dictStage=dictStageGet();dictStreak=0;dictMiss=0;dictShownAt=Date.now();wbReset();

}
function dictReplay(){speakEnglish(dictText())}
function dictCheck(){
  if(dictLocked)return;
  // جملة: الحكم من بنك الكلمات، وسلّمه مستقلّ عن سلّم الإملاء — مهارتان مختلفتان
  if(dictIsBuild()){
    const it=dictCur(),ok=wbCheck();
    dictLocked=true;if(ok)dictScore++;
    logAnswer("dictation_a1","build"+wbStage,ok,String(wbTyped||wbBuilt()).slice(0,300),it.id||null,
      dictShownAt?Date.now()-dictShownAt:null,{q_text:String(it.s||"")});
    srsUpdate(it.id,ok);
    render();return;
  }
  const el=document.getElementById('dictIn');
  const val=(el?el.value:"").trim().toLowerCase();
  dictInput=val;dictLocked=true;
  const dictOk=val===dictSession[dictIdx].w.toLowerCase();
  if(dictOk)dictScore++;
  dictErrRecord(dictSession[dictIdx].w,dictOk,val);
  // الكلمة وما كتبته: بدونهما أعرف أنها أخطأت ولا أعرف كيف — حرف ناقص؟ حرف متحرّك خطأ؟
  logAnswer("dictation_a1","stage"+dictStage,dictOk,val,dictSession[dictIdx].w,
    dictShownAt?Date.now()-dictShownAt:null,{q_text:dictSession[dictIdx].w});
  // تدرّج المرحلة: صعود بإتقان متتالٍ، ونزول تلقائي عند تكرار الخطأ حتى لا تعلق على مستوى أصعب من قدرتها
  if(dictOk){
    dictMiss=0;dictStreak++;
    if(dictStreak>=DICT_REQ&&dictStage<4){dictStage++;dictStreak=0;dictStageSet(dictStage)}
  }else{
    dictStreak=0;dictMiss++;
    if(dictMiss>=DICT_BACK&&dictStage>1){dictStage--;dictMiss=0;dictStageSet(dictStage)}
  }
  render();
}

// ===== وضع «أخطائي»: مكانٌ واحد لكل ما عثرتَ فيه =====
// كان الخطأ يُعاد داخل قسمه وحده: خطأ موهبة يعود في اختبار موهبة، وخطأ الإنجليزية في
// خطتها، وتصحيح المحادثة يُعرض في الخلاصة ثم يزول. فلا مكان يقول: «هذا ما عثرتَ فيه،
// وهذا موعده اليوم». وهذا الوضع يجمعها، ويُجدولها بـFSRS، ويُدرّب جمل المحادثة بالبناء
// لا بالقراءة — فالتصحيح الذي يُقرأ لا يُغيّر عادةً في اللسان.
//
// وهو الباب الوحيد الذي ينفع الثلاثة بالقدر نفسه: محمد وإلياس لا يريان إلا المحادثة،
// وبطاقات تصحيحها مصدرهما.
const FIXCARD_KEY="mawhiba_coach_fix_v1";
function fixCardLoad(){try{return JSON.parse(lsGet(FIXCARD_KEY)||"{}")}catch(e){return{}}}
function fixCardSave1(o){try{lsSet(FIXCARD_KEY,JSON.stringify(o))}catch(e){}}
function fixCardKey(f){return wbNorm(f&&f.fix||"").slice(0,120)}
function fixCardSave(f){
  const k=fixCardKey(f);if(!k||!f.said)return;
  const m=fixCardLoad(),old=m[k];
  // البطاقة الجديدة تدخل بدرجة «أخطأتُ»: هي خطأٌ وقع فعلاً، لا عنصرٌ جديد يُختبر
  const rec=fsrsUpdate(old||null,false,srsToday());
  m[k]=Object.assign({},old||{},rec,{said:String(f.said).slice(0,200),fix:String(f.fix).slice(0,200),
    why:String(f.why||"").slice(0,200)});
  fixCardSave1(m);
}
function fixCardGrade(k,ok){
  const m=fixCardLoad(),r=m[k];if(!r)return;
  const rec=fsrsUpdate(r,ok,srsToday());
  // بطاقةٌ أُتقنت ثلاث مرّات متتالية لم تعد خطأً — تُحذف بدل أن تُثقل القائمة أبداً
  if(ok&&(rec.box||0)>=3){delete m[k]}else{m[k]=Object.assign({},r,rec)}
  fixCardSave1(m);
}
// جمع المستحقّ من كل المصادر. كلٌّ منها ذاكرةٌ قائمة أصلاً — لا جدول جديد ولا تسجيل جديد.
function errCollect(){
  const today=srsToday(),out=[];
  const fc=fixCardLoad();
  Object.keys(fc).forEach(function(k){
    const r=fc[k];if((r.due||0)>today)return;
    out.push({kind:"fix",key:k,target:r.fix,said:r.said,why:r.why||""});
  });
  const de=dictErrLoad();
  Object.keys(de).forEach(function(w){
    const meta=DICTATION_A1.filter(function(x){return x.w.toLowerCase()===w})[0];
    out.push({kind:"word",key:w,w:(meta?meta.w:w),m:(meta?meta.m:""),last:de[w].last||""});
  });
  const ie=itemErrLoad(),POOL=engPool();
  Object.keys(ie).forEach(function(id){
    const it=POOL.filter(function(x){return x.id===id})[0];
    if(!it||!it.c)return;   // عناصر البناء والإملاء لها بابها، فلا تُكرَّر هنا
    out.push({kind:"item",key:id,it:engShuffleChoices(it)});
  });
  return out;
}

// وتكرار الآلة في مكانين يُنتج بابين يتنازعان على العدّاد نفسه.

// ===== توليد بنكَي الاستماع/القراءة بالمحرّك — لا يدوياً وحده =====
// نفس ما فُعل للفظي/العلمي عند هيا (fetchGemini): البنك المؤلَّف يبقى الأساس والقاع
// الفوري بلا انتظار شبكة، لكنه صغيرٌ ثابت (٥-١٠/مستوى) يُستنفَد ويتكرّر — وقد ظهر هذا
// فعلاً عند محمد (١٦ أغسطس): بنك B1 الخماسي أُعيد مرّتين خلال دقيقة، بأزمنة إجابة
// ٢-٩ ثوانٍ لا تكفي لتشغيل مقطعٍ صوتي — الأرجح حفظ موضع الخيار لا فهمٌ متكرّر.
// فالمحرّك (وضع "gen" الجديد في دالّة tutor نفسها — لا دالّة ثانية) يُنشئ عنصراً
// جديداً في الخلفية بعد كل جلسة، يُخزَّن محلّياً وينضمّ للبنك القائم — ينمو حتى سقفٍ
// معقول (GEN_BANK_MAX) ثم يتوقّف. لا تحميل ولا شاشة انتظار: الجلسة تُعرض فوراً من
// المتاح كما كانت، والتوليد يُخصّب الجلسة القادمة لا الحالية.
const GEN_BANK_MAX=15;
function genBankLoad(key){try{const a=JSON.parse(lsGet(key)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}
function genBankSave(key,arr){try{lsSet(key,JSON.stringify(arr))}catch(e){}}
function genBankAdd(key,item){
  const arr=genBankLoad(key);
  if(arr.some(function(x){return x.id===item.id}))return arr;
  arr.push(item);genBankSave(key,arr);return arr;
}
// يفكّك ردّ المحرّك بصيغة TEXT/Q/A/B/C/CORRECT — أسطرٌ موسومة كما SAY:/FIX: القائمتين،
// لا JSON مطلوبٌ من نموذج (أكثر عرضة للكسر). عنصرٌ ناقصٌ يعني null — لا تخمين لحقلٍ غائب.
// النصّ الإنجليزي (TEXT) يُتلى بصوتٍ إنجليزي (listenPlay⇐speakEnglish) — فإن تسرّب إليه
// عربي (النموذج أسقط وسم "Q:" فابتلع سطر السؤال العربي ضمن استمرار TEXT، أو خلطه على
// السطر نفسه) سُمع عربي وإنجليزي معاً، كما اشتكى إلياس فعلاً (١٦ أغسطس). فسطر الاستمرار
// يرفض أي سطرٍ فيه عربي، والتحقّق النهائي يرفض العنصر كلّه إن تسرّب عربي رغم ذلك.
const AR_CHARS=/[\u0600-\u06FF]/;
function parseGenBlock(text,domain){
  const lines=String(text||"").split(/\r?\n/).map(function(l){return l.trim()});
  let passage="",q="",a1="",a2="",a3="",correct="",inText=false;
  lines.forEach(function(l){
    let m;
    if(m=/^TEXT:\s*(.*)$/i.exec(l)){passage=m[1];inText=true}
    else if(m=/^Q:\s*(.+)$/i.exec(l)){q=m[1];inText=false}
    else if(m=/^A:\s*(.+)$/i.exec(l)){a1=m[1];inText=false}
    else if(m=/^B:\s*(.+)$/i.exec(l)){a2=m[1];inText=false}
    else if(m=/^C:\s*(.+)$/i.exec(l)){a3=m[1];inText=false}
    else if(m=/^CORRECT:\s*([ABC])/i.exec(l)){correct=m[1].toUpperCase();inText=false}
    else if(inText&&l&&!AR_CHARS.test(l))passage+=(passage?" ":"")+l;   // TEXT قد يمتدّ سطرين
  });
  passage=passage.trim();
  if(!passage||!q||!a1||!a2||!a3||!correct)return null;
  // العنصر كلّه إنجليزي الآن (١٦ أغسطس) — تلوّثٌ عربي في أيّ حقل يُرفض العنصر كلّه
  if(AR_CHARS.test(passage)||AR_CHARS.test(q)||AR_CHARS.test(a1)||AR_CHARS.test(a2)||AR_CHARS.test(a3))return null;
  const idx={A:0,B:1,C:2}[correct];
  const item={id:"ai_"+domain+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),
    q:q,c:[a1,a2,a3],a:idx,ai:true};
  if(domain==="listen")item.audio=passage;else item.passage=passage;
  return item;
}
// نداءٌ واحدٌ صامت — يفشل بهدوء (شبكة/مفتاح غائب) كما تفعل كل نداءات tutor الأخرى هنا،
// فغياب التوليد ليس عطلاً: يبقى البنك المؤلَّف يعمل وحده كما كان قبل هذه الميزة.
async function fetchTutorGen(domain,level){
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"gen",domain,level})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    const item=parseGenBlock(data.reply,domain);
    if(item)item.lv=level;
    return item;
  }catch(e){return null}
}
// كم نداء توليدٍ صامت بعد جلسة؟ لا واحدٌ ثابت للجميع — درس ٢٠ أغسطس (شكوى إلياس
// عن تكرار gram/read/minpair): بنكٌ تستهلك منه الجلسة أكثر من نصفه يحتاج نموّاً أسرع
// من نداءٍ واحد، وإلا استُنفد أسرع مما ينمو. سقفٌ ٣ يمنع إغراق الطلبات في كل جلسة.
function genCallsFor(poolLen,N){
  if(poolLen>=GEN_BANK_MAX)return 0;
  const room=GEN_BANK_MAX-poolLen;
  if(!poolLen)return Math.min(3,room);
  if(N>=poolLen*0.5)return Math.min(3,room);
  return Math.min(1,room);
}
// تُستدعى بلا انتظار (fire-and-forget) بعد بدء الجلسة — لا تُبطئ العرض الحالي أبداً
function genTopUp(domain,key,level){
  const pool=(domain==="listen"?listenBankFor(level):readBankFor(level));
  const calls=genCallsFor(pool.length,domain==="listen"?LISTEN_N:READ_N);
  for(let i=0;i<calls;i++){
    fetchTutorGen(domain,level).then(function(item){
      if(!item)return;
      genBankAdd(key,item);
    });
  }
}
// الخيارات كلّها مع موضع الصواب — نفس عُرف تسجيل أسئلة الذكاء الاصطناعي في اللفظي/العلمي
// (`«١) … | ٢) … ✓»`)، فبلا هذا لا يُعرف ماذا وُلِّد أصلاً ولا أين وقع الخيار الصحيح.
function genLogText(it){
  if(!it.ai)return it.q;
  const opts=it.c.map(function(c,i){return (i+1)+") "+c+(i===it.a?" ✓":"")}).join(" | ");
  const src=it.audio||it.passage||"";
  return `[مولَّد] ${it.q} — النصّ: ${src} — الخيارات: ${opts}`;
}
// يفكّك ردّ "قواعد GJT" (S1..S4/OK/WHY، وTAG اختياري لِSTEP) إلى شكل GRAM_BANK/
// STEP_BANK(type:"pick") الثابت تماماً: {c:[{t,ok,why}×٤]}. لا صيغة جديدة، والتحقّق
// بنفس انضباط parseGenBlock: تلوّثٌ عربي في أيّ جملة (S1..S4) يُسقط العنصر كلّه —
// لكن حقل الشرح (WHY) عربيٌّ أصلاً في البنك الثابت فلا يُفحَص هنا لغةً، بل حضوراً فقط.
// وصحّة السؤال نفسه محكومة بنيوياً لا بالثقة: صواب واحد بالضبط بين الأربعة، وأربع
// جملٍ متمايزة — عنصرٌ يخالف هذا (صفر صواب أو أكثر من واحد) يُسقَط قبل أن يُخزَّن.
const STEP_TAGS=["ترتيب الكلمات","الحروف الكبيرة","علامات الترقيم"];
function parseGenPickBlock(text,domain,wantTag){
  const lines=String(text||"").split(/\r?\n/);
  const s={},ok={},why={};let tag="";
  lines.forEach(function(l){
    let m;
    if(m=/^S([1-4]):\s*(.+)$/i.exec(l))s[m[1]]=m[2].trim();
    else if(m=/^S([1-4])_OK:\s*(yes|no)/i.exec(l))ok[m[1]]=/yes/i.test(m[2]);
    else if(m=/^S([1-4])_WHY:\s*(.+)$/i.exec(l))why[m[1]]=m[2].trim();
    else if(m=/^TAG:\s*(.+)$/i.exec(l))tag=m[1].trim();
  });
  const idx=["1","2","3","4"];
  if(idx.some(function(i){return !s[i]||!why[i]||typeof ok[i]!=="boolean"}))return null;
  const texts=idx.map(function(i){return s[i]});
  if(texts.some(function(t){return AR_CHARS.test(t)}))return null;
  if(new Set(texts).size!==4)return null;
  if(idx.filter(function(i){return ok[i]}).length!==1)return null;
  const c=idx.map(function(i){return{t:s[i],ok:ok[i],why:why[i]}});
  const item={id:"ai_"+domain+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),c:c,ai:true};
  if(wantTag){item.type="pick";item.tag=STEP_TAGS.indexOf(tag)>=0?tag:STEP_TAGS[0]}
  return item;
}
// يفكّك ردّ الفيديو المولَّد (TITLE/SCENEn_EMOJI/SCENEn_TEXT×٣-٤/Q/A/B/C/CORRECT) إلى
// شكل VIDEO_BANK نفسه بالضبط: {t,sc:[[رمز,جملة]],q,c,a}. مشاهد أقلّ من ثلاثة أو
// مرقّمة بفجوة (SCENE1 ثم SCENE3 بلا SCENE2) تُسقط العنصر — نفس انضباط parseGenBlock.
function parseGenVideoBlock(text){
  const lines=String(text||"").split(/\r?\n/);
  let title="",q="",a1="",a2="",a3="",correct="";const scenes={};
  lines.forEach(function(l){
    let m;
    if(m=/^TITLE:\s*(.+)$/i.exec(l))title=m[1].trim();
    else if(m=/^SCENE(\d)_EMOJI:\s*(.+)$/i.exec(l)){scenes[m[1]]=scenes[m[1]]||{};scenes[m[1]].e=m[2].trim()}
    else if(m=/^SCENE(\d)_TEXT:\s*(.+)$/i.exec(l)){scenes[m[1]]=scenes[m[1]]||{};scenes[m[1]].t=m[2].trim()}
    else if(m=/^Q:\s*(.+)$/i.exec(l))q=m[1].trim();
    else if(m=/^A:\s*(.+)$/i.exec(l))a1=m[1].trim();
    else if(m=/^B:\s*(.+)$/i.exec(l))a2=m[1].trim();
    else if(m=/^C:\s*(.+)$/i.exec(l))a3=m[1].trim();
    else if(m=/^CORRECT:\s*([ABC])/i.exec(l))correct=m[1].toUpperCase();
  });
  const idx=Object.keys(scenes).map(Number).sort(function(a,b){return a-b});
  if(idx.length<3)return null;
  for(let i=0;i<idx.length;i++)if(idx[i]!==i+1)return null;   // متتابعة بلا فجوة من ١
  const sc=idx.map(function(i){return scenes[i]});
  if(sc.some(function(x){return !x.e||!x.t||x.e.length>8}))return null;
  if(!title||!q||!a1||!a2||!a3||!correct)return null;
  if([title,q,a1,a2,a3].concat(sc.map(function(x){return x.t})).some(function(t){return AR_CHARS.test(t)}))return null;
  return{id:"ai_video_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),
    t:title,sc:sc.map(function(x){return[x.e,x.t]}),q:q,c:[a1,a2,a3],a:{A:0,B:1,C:2}[correct],ai:true};
}

// ===== الاستماع: فهم مسموع، لا إملاء =====
// طُلب تصنيف مستوى الثلاثة (١٥ أغسطس)، وكشف أن هيا A1 لا A2 — وبقيت ثغرة: لا قسم
// يقيس **الفهم** المسموع أصلاً. الإملاء يقيس التفريغ الحرفي (تكتب ما سُمع)، والمحادثة
// تقيس الإنتاج. وبينهما فجوة: أن تفهم معنى ما يُقال بلا أن تُنتجه أو تكتبه حرفاً حرفاً.
//
// والصيغة معياريّة لا مخترعة: نظام Cambridge (YLE/KET/PET) وTOEFL Junior يستعملان
// جميعاً الصيغة نفسها — مقطعٌ قصير يُسمع، فسؤال اختيار من متعدد عن معناه، والسؤال
// يُعرض قبل الاستماع ليُصغى بانتقائية (وليس بعده كبوّابة). وكل مستوياتها — YLE وA2
// Key وB1 Preliminary سواءً — تُسمِع كل مقطعٍ مرّتين («You hear each recording
// twice»، بنصّها الحرفي من دليل كل مستوى)؛ ما كتبناه سابقاً هنا («B1 مرّة واحدة كما
// IELTS») كان قياساً على اختبارٍ مختلف تماماً (IELTS)، لا على B1 Preliminary
// الحقيقي — صُحِّح ١٦ أغسطس بعد نصٍّ حرفي جلبه صاحب المشروع. والزرّ 🔊 لا يُقفَل
// عدد ضغطاته تقنياً لأيّ مستوى (لا فائدة تشخيصية من منعه) — يُسجَّل عدده فحسب.
//
// ووصفُ كل مستوى من CEFR نفسه (لا حدسي): A1 «كلمات وعبارات مألوفة عن نفسها وأسرتها
// ومحيطها، بكلامٍ بطيء واضح». A2 «العبارات الأكثر شيوعاً في ما يخصّها مباشرة، وتلتقط
// الفكرة في رسائل قصيرة واضحة». B1 «الفكرة الرئيسية في كلامٍ معياريّ واضح عن أمور
// مألوفة». والمحتوى نفسه (النصوص) يبقى مؤلَّفاً بالضرورة — لا بنك مسموعات مفتوحة

// _v2: تكرارٌ وتلوّثٌ عربي-إنجليزي حقيقي وصلا للبنك v1 قبل بذرة الموضوع وحارس التلوّث
// (١٦ أغسطس، شكوى إلياس) — مفتاحٌ جديد يهجر المخزَّن الملوَّث بدل مسحه يدوياً، كما
// فعلت بطاقات تصحيح المحادثة (`mawhiba_coach_fix_v1`) من قبل.
// _v3: نفس الدرس يتكرّر (١٦ أغسطس، ساعات لاحقة) — حُوِّل Q/A/B/C إلى الإنجليزية في
// systemGen، لكن بنكَي إلياس ومحمد المحليَّين كانا عند GEN_BANK_MAX=15 بالفعل، فبقيا
// يُقدّمان عناصر [مولَّد] عربية القديمة إلى ما لا نهاية — genTopUp لا يطلب توليداً
// جديداً أصلاً وقد بلغ البنك سقفه. مفتاحٌ ثالث يهجر المخزَّن العربي القديم بالآلية نفسها.
const GEN_BANK_KEY_LISTEN="mawhiba_listen_aibank_v3";
function listenBankFor(level){
  const L=String(level||"A2");
  const ai=genBankLoad(GEN_BANK_KEY_LISTEN).filter(function(x){return x.lv===L});
  const exact=LISTEN_BANK.filter(function(x){return x.lv===L}).concat(ai);
  return exact.length?exact:LISTEN_BANK.filter(function(x){return x.lv==="A1"});
}
const LISTEN_SRS_KEY="mawhiba_listen_srs";
function listenSrsLoad(){try{return JSON.parse(lsGet(LISTEN_SRS_KEY)||"{}")}catch(e){return{}}}
function listenSrsSave(o){try{lsSet(LISTEN_SRS_KEY,JSON.stringify(o))}catch(e){}}
function listenSrsUpdate(id,ok){
  const st=listenSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;listenSrsSave(st);
}
const LISTEN_N=8;   // جلسة قصيرة — بنك المستوى الواحد عشرة عناصر، فلا تُستنفَد كل جلسة
function buildListenPlan(){
  const st=listenSrsLoad(),today=srsToday(),POOL=listenBankFor(profileOf().level);
  const due=shuffle(POOL.filter(function(i){return st[i.id]&&st[i.id].due<=today}));
  const fresh=shuffle(POOL.filter(function(i){return !st[i.id]}));
  let out=due.concat(fresh).slice(0,LISTEN_N);
  // بنكٌ ثابتٌ صغير (١٠/مستوى) يُستنفَد بجلسةٍ أو جلستين فتُقفَل «الاستماع» بلا سبب —
  // نفس ما تحلّه buildSpeakSession أصلاً: مراجعة حرّة من البنك كلّه بدل شاشة فارغة.
  // ونقصٌ لا خواءٌ تامّ (سؤالٌ واحد مستحقّ) يُكمَّل كذلك — topUpPlan لا حالة خاصّة.
  return topUpPlan(out,POOL,LISTEN_N);
}
// مرّتان معياريٌّ للمستويات الثلاثة سواءً — YLE وA2 Key وB1 Preliminary كلّها تنصّ
// حرفياً «You hear each recording twice» (دليل كل مستوى). كانت هذه الدالّة تُفرّق B1
// بمرّة واحدة قياساً على IELTS خطأً — IELTS اختبارٌ مختلف، لا B1 Preliminary
// الحقيقي — صُحِّح ١٦ أغسطس. إرشادٌ نصّي لا قفل تقني: الزرّ لا يُمنع لأيّ مستوى.
function listenPlaysHint(lv){return "استمعي مرّتين، ثم اختاري"}
let listenItems=[],listenIdx=0,listenPicked=-1,listenLocked=false,listenScore=0,listenPlays=0,listenShownAt=0,listenDone=false;
function startListen(){
  listenItems=buildListenPlan();listenIdx=0;listenPicked=-1;listenLocked=false;listenScore=0;listenPlays=0;listenDone=false;
  mode="listen";listenShownAt=Date.now();window.scrollTo(0,0);render();
  genTopUp("listen",GEN_BANK_KEY_LISTEN,profileOf().level||"A2");
}
function listenCur(){return listenItems[listenIdx]}
function listenPlay(){const it=listenCur();if(!it)return;listenPlays++;speakEnglish(it.audio)}
function listenChoose(i){
  if(listenLocked)return;
  const it=listenCur();listenLocked=true;listenPicked=i;
  const ok=i===it.a;if(ok)listenScore++;
  listenSrsUpdate(it.id,ok);
  logAnswer("listen",it.lv,ok,it.c[i],it.id,listenShownAt?Date.now()-listenShownAt:null,
    {q_text:(genLogText(it)+" · plays:"+listenPlays).slice(0,1200)});
  render();
}
function listenNext(){
  if(listenIdx+1>=listenItems.length){listenDone=true;window.scrollTo(0,0);render();return}
  listenIdx++;listenPicked=-1;listenLocked=false;listenPlays=0;listenShownAt=Date.now();render();
  setTimeout(function(){listenPlay()},300);
}
function renderListen(){
  if(!listenItems.length){app.innerHTML=`<div class="card" style="text-align:center">لا شيء مستحقّ اليوم — عودي غداً 🌱</div><button class="link-btn" onclick="home()">→ الرئيسية</button>`;return}
  if(listenDone)return renderListenResult();
  const it=listenCur();
  const prog=`<div class="bar">${listenItems.map(function(_,i){return `<div class="seg" style="background:${i<=listenIdx?'#0284C7':'#E2E8F0'};opacity:${i<=listenIdx?1:.5}"></div>`}).join("")}</div>`;
  const choices=it.c.map(function(c,i){
    let bg="#fff",bd="#E2E8F0",col="#334155";
    if(listenLocked){if(i===it.a){bg="#ECFDF5";bd="#10B981";col="#065F46"}else if(i===listenPicked){bg="#FEF2F2";bd="#EF4444";col="#991B1B"}}
    return `<button class="choice" style="background:${bg};border-color:${bd};color:${col};direction:ltr;text-align:left;font-family:Georgia,serif" onclick="listenChoose(${i})" ${listenLocked?"disabled":""}><span class="letter">${L[i]}</span>${c}</button>`}).join("");
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  ${prog}
  <div class="meta"><span>${toAr(listenIdx+1)} من ${toAr(listenItems.length)}</span><span>الاستماع · ${it.lv}</span></div>
  <div class="card" style="text-align:center">
    <span class="tag" style="background:#E0F2FE;color:#0369A1">🎧 استماع</span>
    <div class="q" style="margin-top:10px;direction:ltr;text-align:center;font-family:Georgia,serif">${it.q}</div>
    <div style="margin:16px 0"><button type="button" onclick="listenPlay()" style="background:#0284C7;color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:26px;cursor:pointer">🔊</button></div>
    <div style="font-size:12px;color:#64748B;margin-bottom:14px">${listenPlaysHint(it.lv)}${listenPlays?` · استمعتَ ${toAr(listenPlays)} ${listenPlays===1?"مرّة":"مرّات"}`:""}</div>
    <div class="choices">${choices}</div>
    ${listenLocked?`<div class="explain"><div class="explain-title" style="color:${listenPicked===it.a?'#059669':'#B45309'}">${listenPicked===it.a?"✓ فهمتَ صحيحاً":"الصحيحة بالأخضر"}</div></div>`:""}
  </div>
  ${listenLocked?`<button class="btn" style="background:#0284C7" onclick="listenNext()">${listenIdx+1>=listenItems.length?"إنهاء ومشاهدة النتيجة":"التالي ←"}</button>`:""}`;
  if(!listenLocked&&listenPlays===0)setTimeout(function(){listenPlay()},300);
}
function renderListenResult(){
  const pct=listenItems.length?Math.round(listenScore/listenItems.length*100):0;
  app.innerHTML=`
  <div class="card">
    <div class="score-row"><span class="score-big" style="color:${pct>=70?'#059669':pct>=50?'#D97706':'#DC2626'}">${toAr(listenScore)}</span><span class="score-total">/ ${toAr(listenItems.length)}</span><span class="score-pct">${toAr(pct)}%</span></div>
    <div style="color:#64748B;font-size:15px;margin-bottom:14px">${pct>=85?"فهمٌ ممتاز! 🌟":pct>=60?"جيّد جداً، واصل 💪":"لا بأس — هذه المقاطع تعود للمراجعة 🌱"}</div>
    <button class="btn" style="background:#0284C7" onclick="startListen()">🔁 جلسة أخرى</button>
    <button class="link-btn" onclick="home()">→ الرئيسية</button>
  </div>`;
}

// بعلامة \n حرفية بدل سطرٍ فعلي (كما TEXT في parseGenBlock يبقى سطراً واحداً) — تُفكّ هنا
function parseGenWriteBlock(text){
  const lines=String(text||"").split(/\r?\n/);
  let prompt="",min=0;
  lines.forEach(function(l){
    let m;
    if(m=/^PROMPT:\s*(.*)$/i.exec(l))prompt=m[1];
    else if(m=/^MIN:\s*(\d+)/i.exec(l))min=parseInt(m[1],10);
  });
  prompt=prompt.replace(/\\n/g,"\n").trim();
  if(!prompt||!min||min<5||AR_CHARS.test(prompt))return null;
  return{id:"ai_write_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),
    prompt:prompt,min:min,ai:true};
}

      body:JSON.stringify({mode:"gen",domain:"write",level})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    const item=parseGenWriteBlock(data.reply);
    if(item)item.lv=level;

  }catch(e){return null}

}

// فالنموذج مُدرَّب على "You will receive their sentences, numbered" لا فقرةً واحدة خام
function writeSentences(t){
  const parts=String(t||"").split(/([.!?]+)/),out=[];
  for(let i=0;i<parts.length;i+=2){
    const s=(parts[i]||"").trim(),p=parts[i+1]||"";
    if(s)out.push((s+p).trim());
  }
  return out.length?out.slice(0,10):(String(t||"").trim()?[String(t).trim()]:[]);
}

// مولَّد GRAM ينضمّ لبنك المستوى المؤلَّف — ١٥٪ تمايز فقط عند إلياس (٢٠ أغسطس، ٣٣
// إجابة على ٥ جملٍ ثابتة) لأن هذا القسم وحده بلا توليدٍ إطلاقاً خلافاً لبقية الأقسام
const GEN_BANK_KEY_GRAM="mawhiba_gram_aibank_v1";
function gramBankFor(level){
  const L=String(level||"A2");
  let exact=GRAM_BANK.filter(function(x){return x.lv===L});
  // B1+ ليس مستوًى قائماً بذاته في التطبيق (لا بنك استماع/قراءة B2) — بل تمديدٌ
  // يُضاف إلى بنك من مستواه B1 تحديداً، بعد تحليل إنتاجٍ حرّ أظهر تراكيب فوق B1
  // بدأ يحاولها بنجاحٍ جزئي (٧٧٪ على تراكيب فوق الأساسي) — لا استبدال تصنيفه المقيس
  if(L==="B1")exact=exact.concat(GRAM_BANK.filter(function(x){return x.lv==="B1+"}));
  const ai=genBankLoad(GEN_BANK_KEY_GRAM).filter(function(x){return x.lv===L});
  exact=exact.concat(ai);
  return exact.length?exact:GRAM_BANK.filter(function(x){return x.lv==="A1"});
}
const GRAM_SRS_KEY="mawhiba_gram_srs";
function gramSrsLoad(){try{return JSON.parse(lsGet(GRAM_SRS_KEY)||"{}")}catch(e){return{}}}
function gramSrsSave(o){try{lsSet(GRAM_SRS_KEY,JSON.stringify(o))}catch(e){}}
function gramSrsUpdate(id,ok){
  const st=gramSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;gramSrsSave(st);
}
async function fetchTutorGenGram(level){
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"gen",domain:"gram",level})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    const item=parseGenPickBlock(data.reply,"gram",false);
    if(item)item.lv=level;
    return item;
  }catch(e){return null}
}
function gramGenTopUp(level){
  const pool=gramBankFor(level),calls=genCallsFor(pool.length,GRAM_N);
  for(let i=0;i<calls;i++){
    fetchTutorGenGram(level).then(function(item){if(item)genBankAdd(GEN_BANK_KEY_GRAM,item)});
  }
}
const GRAM_N=5;
function buildGramPlan(){
  const st=gramSrsLoad(),today=srsToday(),POOL=gramBankFor(profileOf().level);
  const due=shuffle(POOL.filter(function(i){return st[i.id]&&st[i.id].due<=today}));
  const fresh=shuffle(POOL.filter(function(i){return !st[i.id]}));
  let out=due.concat(fresh).slice(0,GRAM_N);
  return topUpPlan(out,POOL,GRAM_N);
}
let gramItems=[],gramIdx=0,gramOrder=[0,1,2,3],gramPicked=-1,gramLocked=false,gramScore=0,gramShownAt=0,gramDone=false;
function startGram(){
  gramItems=buildGramPlan();gramIdx=0;gramScore=0;gramDone=false;
  mode="gram";gramSetupRound();window.scrollTo(0,0);render();
  gramGenTopUp(profileOf().level||"A2");
}
function gramSetupRound(){gramOrder=shuffle([0,1,2,3]);gramPicked=-1;gramLocked=false;gramShownAt=Date.now()}
function gramCur(){return gramItems[gramIdx]}
function gramChoose(i){
  if(gramLocked)return;
  gramPicked=i;gramLocked=true;
  const it=gramCur(),ok=!!it.c[i].ok;
  if(ok)gramScore++;
  const elapsed=Date.now()-gramShownAt;
  gramSrsUpdate(it.id,ok);
  logAnswer("gram","sentence",ok,it.c[i].t,it.id,elapsed,
    {q_text:it.c.map(function(x,k){return (k+1)+") "+x.t+(x.ok?" ✓":"")}).join(" | ")});
  render();
}
function gramNext(){
  if(gramIdx+1>=gramItems.length){gramDone=true;render();return}
  gramIdx++;gramSetupRound();render();
}
function renderGram(){
  if(!gramItems.length){app.innerHTML=`<div class="card" style="text-align:center">لا شيء مستحقّ اليوم — عودي غداً 🌱</div><button class="link-btn" onclick="home()">→ الرئيسية</button>`;return}
  if(gramDone)return renderGramResult();
  const it=gramCur();
  const prog=`<div class="bar">${gramItems.map(function(_,i){return `<div class="seg" style="background:${i<=gramIdx?'#0E7490':'#E2E8F0'};opacity:${i<=gramIdx?1:.5}"></div>`}).join("")}</div>`;
  const choices=gramOrder.map(function(wi){
    const opt=it.c[wi];
    let bg="#fff",bd="#E2E8F0",col="#0F172A";
    if(gramLocked){if(opt.ok){bg="#ECFDF5";bd="#10B981";col="#065F46"}else if(wi===gramPicked){bg="#FEF2F2";bd="#EF4444";col="#991B1B"}}
    const why=gramLocked?`<div style="margin-top:5px;font-size:12px;color:${opt.ok?'#059669':'#B45309'}">${opt.ok?"✓ ":"✗ "}${esc(opt.why)}</div>`:"";
    return `<button class="choice" style="background:${bg};border-color:${bd};color:${col};direction:ltr;text-align:left;font-family:Georgia,serif;display:block" onclick="gramChoose(${wi})" ${gramLocked?"disabled":""}>${esc(opt.t)}${why}</button>`;
  }).join("");
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  ${prog}
  <div class="meta"><span>${toAr(gramIdx+1)} من ${toAr(gramItems.length)}</span><span>دقّة القواعد · ${it.lv}</span></div>
  <div class="card">
    <span class="tag" style="background:#CFFAFE;color:#0E7490">✍️ أيّ جملةٍ صحيحة؟</span>
    <div class="choices" style="margin-top:12px">${choices}</div>
  </div>
  ${gramLocked?`<button class="btn" style="background:#0E7490" onclick="gramNext()">${gramIdx+1>=gramItems.length?"إنهاء ومشاهدة النتيجة":"التالي ←"}</button>`:""}`;
}
function renderGramResult(){
  const pct=gramItems.length?Math.round(gramScore/gramItems.length*100):0;
  app.innerHTML=`
  <div class="card">
    <div class="score-row"><span class="score-big" style="color:${pct>=70?'#059669':pct>=50?'#D97706':'#DC2626'}">${toAr(gramScore)}</span><span class="score-total">/ ${toAr(gramItems.length)}</span><span class="score-pct">${toAr(pct)}%</span></div>
    <div style="color:#64748B;font-size:15px;margin-bottom:14px">${pct>=85?"دقّةٌ ممتازة! 🌟":pct>=60?"جيّد جداً، واصلي 💪":"لا بأس — هذه القواعد تعود للمراجعة 🌱"}</div>
    <button class="btn" style="background:#0E7490" onclick="startGram()">🔁 جلسة أخرى</button>
    <button class="link-btn" onclick="home()">→ الرئيسية</button>
  </div>`;
}

// مولَّد STEP يقتصر على نوع pick وحده — مطابقٌ عمداً لشكل GRAM (الرقابة الآلية على
// gap/order أصعب من التحقّق من GJT بسيطة، نفس مبدأ "الرقابة بحسب الخطر")
const GEN_BANK_KEY_STEP="mawhiba_step_aibank_v1";
function stepBankFor(level){
  const L=String(level||"A2");
  const ai=genBankLoad(GEN_BANK_KEY_STEP).filter(function(x){return x.lv===L});
  const exact=STEP_BANK.filter(function(x){return x.lv===L}).concat(ai);
  return exact.length?exact:STEP_BANK.filter(function(x){return x.lv==="A1"});
}
const STEP_SRS_KEY="mawhiba_step_srs";
function stepSrsLoad(){try{return JSON.parse(lsGet(STEP_SRS_KEY)||"{}")}catch(e){return{}}}
function stepSrsSave(o){try{lsSet(STEP_SRS_KEY,JSON.stringify(o))}catch(e){}}
function stepSrsUpdate(id,ok){
  const st=stepSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;stepSrsSave(st);
}
async function fetchTutorGenStep(level){
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"gen",domain:"step",level})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    const item=parseGenPickBlock(data.reply,"step",true);
    if(item)item.lv=level;
    return item;
  }catch(e){return null}
}
function stepGenTopUp(level){
  const pool=stepBankFor(level),calls=genCallsFor(pool.length,STEP_N);
  for(let i=0;i<calls;i++){
    fetchTutorGenStep(level).then(function(item){if(item)genBankAdd(GEN_BANK_KEY_STEP,item)});
  }
}
const STEP_N=6;
// الجلسة تخلط الأنواع كما يخلطها الاختبار نفسه، ولا تُبقي الترتيب فتُحفَظ المواضع.
// وضمانُ عنصر ترتيبٍ واحد على الأقلّ مقصود: هو أثقل الأنواع وأقلّها عدداً في البنك،
// فلولا الضمان لغاب عن أكثر الجلسات بحكم الاحتمال وحده.
// تنسيقٌ بين جلستين (١٨ أغسطس): هذه بانيةٌ سادسة بنفس نمط الخمس الأخرى
// (listen/read/write/gram/minpair)، فوُصلت بمساعدها المشترك topUpPlan حين وصل —
// دليلٌ ميداني أثبت العيب نفسه فيها (جلسة قواعد لمحمد ٠٩:٠٩ أعطت عنصرين لا خمسة).
function buildStepPlan(){
  const st=stepSrsLoad(),today=srsToday(),POOL=stepBankFor(profileOf().level);
  const due=shuffle(POOL.filter(function(i){return st[i.id]&&st[i.id].due<=today}));
  const fresh=shuffle(POOL.filter(function(i){return !st[i.id]}));
  let out=due.concat(fresh).slice(0,STEP_N);
  out=topUpPlan(out,POOL,STEP_N);   // البنك مستنفَد أو ناقصٌ: مراجعة حرّة لا جلسةٌ منقوصة
  if(out.length>1&&!out.some(function(i){return i.type==="order"})){
    const ord=shuffle(POOL.filter(function(i){return i.type==="order"}))[0];
    if(ord)out[out.length-1]=ord;
  }
  return shuffle(out);
}
let stepItems=[],stepIdx=0,stepOrder=[0,1,2,3],stepPicked=-1,stepLocked=false,stepScore=0,
  stepShownAt=0,stepDone=false,stepSeq=[],stepSeqPicked=[];
function startStep(){
  stepItems=buildStepPlan();stepIdx=0;stepScore=0;stepDone=false;
  mode="step";stepSetupRound();window.scrollTo(0,0);render();
  stepGenTopUp(profileOf().level||"A2");
}
function stepSetupRound(){
  const it=stepCur();
  stepPicked=-1;stepLocked=false;stepShownAt=Date.now();stepSeqPicked=[];
  stepOrder=shuffle([0,1,2,3]);
  // ترتيبُ عرضٍ مخلوط لعناصر الترتيب — وإلا ظهرت الجمل مرتّبةً أصلاً فلا سؤال
  stepSeq=it&&it.type==="order"?shuffle(it.s.map(function(_,i){return i})):[];
}
function stepCur(){return stepItems[stepIdx]}
function stepChoose(i){
  if(stepLocked)return;
  const it=stepCur();if(!it||it.type==="order")return;
  stepPicked=i;stepLocked=true;
  const ok=!!it.c[i].ok;
  if(ok)stepScore++;
  stepSrsUpdate(it.id,ok);
  logAnswer("step",it.type,ok,it.c[i].t,it.id,Date.now()-stepShownAt,
    {q_text:((it.tag?"["+it.tag+"] ":"")+(it.q?it.q+" · ":"")
      +it.c.map(function(x,k){return (k+1)+") "+x.t+(x.ok?" ✓":"")}).join(" | ")).slice(0,1200)});
  render();
}
function stepSeqPick(i){if(stepLocked||stepSeqPicked.indexOf(i)>=0)return;stepSeqPicked.push(i);render()}
function stepSeqUnpick(k){if(stepLocked)return;stepSeqPicked.splice(k,1);render()}
function stepSeqSubmit(){
  if(stepLocked)return;
  const it=stepCur();if(!it||it.type!=="order")return;
  if(stepSeqPicked.length<it.s.length)return;   // ناقصٌ: لا يُحرق العنصر
  stepLocked=true;
  const ok=stepSeqPicked.every(function(v,k){return v===k});
  if(ok)stepScore++;
  stepSrsUpdate(it.id,ok);
  logAnswer("step","order",ok,stepSeqPicked.map(function(v){return v+1}).join("-"),it.id,
    Date.now()-stepShownAt,
    {q_text:("[ترتيب] الصواب "+it.s.map(function(_,k){return k+1}).join("-")+" · "
      +it.s.map(function(t,k){return (k+1)+") "+t}).join(" | ")).slice(0,1200)});
  render();
}
function stepNext(){
  if(stepIdx+1>=stepItems.length){stepDone=true;render();return}
  stepIdx++;stepSetupRound();render();
}
function renderStep(){
  if(!stepItems.length){app.innerHTML=`<div class="card" style="text-align:center">لا شيء مستحقّ اليوم — عودي غداً 🌱</div><button class="link-btn" onclick="home()">→ الرئيسية</button>`;return}
  if(stepDone)return renderStepResult();
  const it=stepCur(),p=profileOf(),m=p.g==="m";
  const prog=`<div class="bar">${stepItems.map(function(_,i){return `<div class="seg" style="background:${i<=stepIdx?'#B45309':'#E2E8F0'};opacity:${i<=stepIdx?1:.5}"></div>`}).join("")}</div>`;
  let body="";
  if(it.type==="order"){
    const chosen=stepSeqPicked.length
      ? stepSeqPicked.map(function(i,k){return `<button type="button" ${stepLocked?"disabled":""} onclick="stepSeqUnpick(${k})"
          style="display:block;width:100%;text-align:left;direction:ltr;background:#B45309;color:#fff;border:none;border-radius:10px;
          padding:10px 12px;margin-bottom:6px;font-family:Georgia,serif;font-size:15px;cursor:${stepLocked?'default':'pointer'}">
          <b>${toAr(k+1)}.</b> ${esc(it.s[i])}</button>`}).join("")
      : `<span style="color:#94A3B8;font-size:14px">${m?"اضغط الجمل بالترتيب الصحيح…":"اضغطي الجمل بالترتيب الصحيح…"}</span>`;
    const tiles=stepSeq.map(function(i){
      const used=stepSeqPicked.indexOf(i)>=0;
      return `<button type="button" ${(used||stepLocked)?"disabled":""} onclick="stepSeqPick(${i})"
        style="display:block;width:100%;text-align:left;direction:ltr;background:${used?'#F1F5F9':'#fff'};
        color:${used?'#CBD5E1':'#0F172A'};border:1.5px solid ${used?'#E2E8F0':'#FDE68A'};border-radius:10px;
        padding:10px 12px;margin-bottom:6px;font-family:Georgia,serif;font-size:15px;
        cursor:${(used||stepLocked)?'default':'pointer'}">${esc(it.s[i])}</button>`}).join("");
    const okAll=stepLocked&&stepSeqPicked.every(function(v,k){return v===k});
    const fix=stepLocked?`<div style="margin-top:12px;background:${okAll?'#ECFDF5':'#FEF2F2'};border-radius:12px;padding:12px">
        <div style="font-weight:800;color:${okAll?'#065F46':'#991B1B'};margin-bottom:8px">${okAll?"✓ الترتيب صحيح":"✗ الترتيب الصحيح:"}</div>
        ${okAll?"":it.s.map(function(t,k){return `<div style="direction:ltr;text-align:left;font-family:Georgia,serif;font-size:14px;color:#0F172A;margin-bottom:4px"><b>${k+1}.</b> ${esc(t)}</div>`}).join("")}
        <div style="margin-top:8px;font-size:13px;color:#78350F;line-height:1.9">💡 ${esc(it.why)}</div>
      </div>`:"";
    body=`<div style="font-size:13px;color:#64748B;margin-bottom:10px">${m?"رتّب الجمل لتصير فقرةً مترابطة":"رتّبي الجمل لتصير فقرةً مترابطة"}</div>
      <div style="background:#FFFBEB;border:2px dashed #FCD34D;border-radius:12px;padding:10px;min-height:56px;margin-bottom:12px">${chosen}</div>
      ${stepLocked?"":tiles}
      ${(!stepLocked&&stepSeqPicked.length>=it.s.length)?`<button class="btn" style="background:#B45309;margin-top:6px" onclick="stepSeqSubmit()">تحقّق من الترتيب</button>`:""}
      ${fix}`;
  }else{
    const choices=stepOrder.map(function(wi){
      const opt=it.c[wi];
      let bg="#fff",bd="#E2E8F0",col="#0F172A";

      const why=stepLocked?`<div style="margin-top:5px;font-size:12px;color:${opt.ok?'#059669':'#B45309'}">${opt.ok?"✓ ":"✗ "}${esc(opt.why)}</div>`:"";
      return `<button class="choice" style="background:${bg};border-color:${bd};color:${col};direction:ltr;text-align:left;font-family:Georgia,serif;display:block" onclick="stepChoose(${wi})" ${stepLocked?"disabled":""}>${esc(opt.t)}${why}</button>`;
    }).join("");
    const stem=it.q?`<div style="direction:ltr;text-align:left;font-family:Georgia,serif;font-size:17px;color:#0F172A;margin-bottom:12px">${esc(it.q)}</div>`

    <div style="margin-top:12px">${body}</div>

function minpairBankFor(level){
  const L=String(level||"A2");
  const exact=MINPAIR_BANK.filter(function(x){return x.lv===L});
  return exact.length?exact:MINPAIR_BANK.filter(function(x){return x.lv==="A1"});
}
const MINPAIR_SRS_KEY="mawhiba_minpair_srs";
function minpairSrsLoad(){try{return JSON.parse(lsGet(MINPAIR_SRS_KEY)||"{}")}catch(e){return{}}}
function minpairSrsSave(o){try{lsSet(MINPAIR_SRS_KEY,JSON.stringify(o))}catch(e){}}
function minpairSrsUpdate(id,ok){
  const st=minpairSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;minpairSrsSave(st);
}
// ===== توليد جملٍ إضافية لكلماتٍ ثابتة — لا أزواج جديدة =====
// الفرق عن توليد الاستماع/القراءة/الكتابة مقصود: صحّة الزوج نفسه (أن bit/beat تباعدهما
// فعلاً حركة طويلة/قصيرة لا خطأً فونيتيكياً) لا يمكن التحقّق منها آلياً بلا صوت — فبناء
// أزواج جديدة بالتوليد كان سيُخاطر بتعليم تقابلٍ صوتيٍّ خاطئ. فالأزواج تبقى مؤلَّفةً
// ومُراجَعة يدوياً (MINPAIR_BANK)، والمحرّك يُنشئ فقط جملة تعليمية إضافية لكلمةٍ صحّتها
// مضمونة سلفاً — خطرٌ أدنى بكثير، وقابلٌ للتحقّق آلياً (هل الكلمة نفسها داخل الجملة).
const MINPAIR_EXTRA_KEY="mawhiba_minpair_extra_v1";
const MINPAIR_EXTRA_MAX=3; // ثلاث جملٍ إضافية على الأكثر لكل كلمة — تنويعٌ لا إغراق طلبات
function minpairExtraLoad(){try{return JSON.parse(lsGet(MINPAIR_EXTRA_KEY)||"{}")}catch(e){return{}}}
function minpairExtraSave(o){try{lsSet(MINPAIR_EXTRA_KEY,JSON.stringify(o))}catch(e){}}
function minpairExtraKey(pairId,wordIdx){return pairId+"_"+wordIdx}
function minpairExtraAdd(pairId,wordIdx,sentence){
  const m=minpairExtraLoad(),k=minpairExtraKey(pairId,wordIdx),arr=m[k]||[];
  if(arr.length>=MINPAIR_EXTRA_MAX||arr.indexOf(sentence)>=0)return;
  arr.push(sentence);m[k]=arr;minpairExtraSave(m);
}
// الجملة الثابتة تبقى أوّل مرشّح دائماً — التوليد يُضيف تنويعاً لا يستبدل المؤلَّف
function minpairSentencesFor(it,wordIdx){
  const m=minpairExtraLoad();
  return [it.s[wordIdx]].concat(m[minpairExtraKey(it.id,wordIdx)]||[]);
}
// يفكّك ردّ المحرّك بصيغة SENT: ويتحقّق أن الكلمة نفسها داخل الجملة فعلاً — لا يُصدَّق نصٌّ
// بلا هذا التحقّق، ولا يُقبل تلوّثٌ عربي، كما في parseGenBlock تماماً
function parseMinpairSentBlock(text,word){
  const m=/^SENT:\s*(.+)$/im.exec(String(text||""));
  if(!m)return null;
  const sent=m[1].trim();
  if(!sent||sent.length>150||AR_CHARS.test(sent))return null;
  const wb=new RegExp("\\b"+word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");
  return wb.test(sent)?sent:null;
}
async function fetchTutorGenMinpair(level,word){
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"gen",domain:"minpair",level,word})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    return parseMinpairSentBlock(data.reply,word);
  }catch(e){return null}
}
// نداءان صامتان بعد بدء الجلسة (كانا واحداً — درس ٢٠ أغسطس، ٥١٪ تكرار عند إلياس رغم
// وجود توليد: معدّله أبطأ من استهلاكه). كلٌّ يختار كلمة عشوائية من بنك المستوى ويُخصّب
// جملها — minpairExtraAdd نفسها تمنع تجاوز MINPAIR_EXTRA_MAX لكل كلمة، فلا إغراق
function minpairGenTopUp(level){
  const POOL=minpairBankFor(level);
  if(!POOL.length)return;
  for(let i=0;i<2;i++){
    const it=pick(POOL),wordIdx=Math.random()<0.5?0:1;
    const m=minpairExtraLoad();
    if((m[minpairExtraKey(it.id,wordIdx)]||[]).length>=MINPAIR_EXTRA_MAX)continue;
    fetchTutorGenMinpair(level,it.w[wordIdx]).then(function(sent){
      if(sent)minpairExtraAdd(it.id,wordIdx,sent);
    });
  }
}
const MINPAIR_N=8;
function buildMinpairPlan(){
  const st=minpairSrsLoad(),today=srsToday(),POOL=minpairBankFor(profileOf().level);
  const due=shuffle(POOL.filter(function(i){return st[i.id]&&st[i.id].due<=today}));
  const fresh=shuffle(POOL.filter(function(i){return !st[i.id]}));
  let out=due.concat(fresh).slice(0,MINPAIR_N);
  return topUpPlan(out,POOL,MINPAIR_N);
}

  const cands=minpairSentencesFor(it,minpairTarget);

  const L=String(level||"A2");

function videoSrsSave(o){try{lsSet(VIDEO_SRS_KEY,JSON.stringify(o))}catch(e){}}
function videoSrsUpdate(id,ok){
  const st=videoSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;videoSrsSave(st);
}
async function fetchTutorGenVideo(level){
  try{
    const res=await fetchTimeout(TUTOR_FN_URL,{method:"POST",
      headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({mode:"gen",domain:"video",level})},15000);
    if(!res||!res.ok)return null;
    const data=await res.json();
    if(!data||!data.ok||!data.reply)return null;
    const item=parseGenVideoBlock(data.reply);
    if(item)item.lv=level;
    return item;
  }catch(e){return null}
}
function videoGenTopUp(level){
  const pool=videoBankFor(level),calls=genCallsFor(pool.length,VIDEO_N);
  for(let i=0;i<calls;i++){
    fetchTutorGenVideo(level).then(function(item){if(item)genBankAdd(GEN_BANK_KEY_VIDEO,item)});
  }
}
const VIDEO_N=5;   // لا يقلّ عن خمسة (طلب صاحب المشروع ١٨ أغسطس) — بنكٌ ستّة/مستوى فلا يُستنفَد بجلسةٍ واحدة
function buildVideoPlan(){
  const st=videoSrsLoad(),today=srsToday(),POOL=videoBankFor(profileOf().level);
  const due=shuffle(POOL.filter(function(i){return st[i.id]&&st[i.id].due<=today}));
  const fresh=shuffle(POOL.filter(function(i){return !st[i.id]}));
  let out=due.concat(fresh).slice(0,VIDEO_N);
  return topUpPlan(out,POOL,VIDEO_N);   // مراجعة حرّة عند استنفاد المستحقّ+الجديد — نفس درس بنك الاستماع (١٥ أغسطس)
}
let videoItems=[],videoIdx=0,videoScene=0,videoQOn=false,videoPicked=-1,videoLocked=false,videoScore=0,videoPlays=0,videoShownAt=0,videoDone=false;

function videoSceneCur(){const it=videoCur();return it?it.sc[videoScene]:null}

  const it=videoCur();if(!it)return;

function videoChoose(i){
  if(videoLocked)return;
  const it=videoCur();videoLocked=true;videoPicked=i;

    {q_text:`${it.t} · ${it.q} · مشاهد:${it.sc.length}`.slice(0,1200)});

  videoIdx++;videoScene=0;videoQOn=false;videoPicked=-1;videoLocked=false;videoPlays=0;videoShownAt=Date.now();render();

function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(String(reader.result).split(",")[1]||"");
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}
// ===== تقييم النطق كلمة بكلمة بدل المطابقة التامة =====
// المطابقة التامة تخطئ في الاتجاهين: Whisper مدرَّب على النسخ لا التقييم فيُصلح الكلام ويعطي "صح" كاذباً،
// وأتفه فرق شكلي (I'm مقابل I am، نقطة، أداة تعريف) يعطي "خطأ" كاذباً. فنوحّد الصيغة ثم نقارن الكلمات.
// Whisper كثيراً ما يكتب الاختصار بلا فاصلة عليا (wasnt / its / dont)، فنقبل الشكلين معاً.
// استثناء مقصود: لا نوحّد ما يصطدم بكلمة إنجليزية حقيقية بلا الفاصلة — were (we're) و ill (I'll)
// و id (I'd) و hell (he'll) و wed (we'd) و lets — لأن التوحيد هنا قد يغيّر ما قالته فعلاً.
const PRON_CONTRACTIONS=[
  [/\b(i'm|im)\b/g,"i am"],[/\b(it's|its)\b/g,"it is"],[/\b(that's|thats)\b/g,"that is"],
  [/\b(what's|whats)\b/g,"what is"],[/\b(there's|theres)\b/g,"there is"],[/\b(here's|heres)\b/g,"here is"],
  [/\blet's\b/g,"let us"],
  [/\b(can't|cant|cannot)\b/g,"can not"],[/\b(won't|wont)\b/g,"will not"],
  [/\b(don't|dont)\b/g,"do not"],[/\b(doesn't|doesnt)\b/g,"does not"],[/\b(didn't|didnt)\b/g,"did not"],
  [/\b(isn't|isnt)\b/g,"is not"],[/\b(aren't|arent)\b/g,"are not"],[/\b(wasn't|wasnt)\b/g,"was not"],
  [/\b(weren't|werent)\b/g,"were not"],[/\b(haven't|havent)\b/g,"have not"],[/\b(hasn't|hasnt)\b/g,"has not"],
  [/\b(wouldn't|wouldnt)\b/g,"would not"],[/\b(couldn't|couldnt)\b/g,"could not"],[/\b(shouldn't|shouldnt)\b/g,"should not"],
  [/\b(you're|youre)\b/g,"you are"],[/\bwe're\b/g,"we are"],[/\b(they're|theyre)\b/g,"they are"],
  [/\b(he's|hes)\b/g,"he is"],[/\b(she's|shes)\b/g,"she is"],
  [/\b(i've|ive)\b/g,"i have"],[/\b(you've|youve)\b/g,"you have"],[/\b(we've|weve)\b/g,"we have"],
  [/\bi'll\b/g,"i will"],[/\bi'd\b/g,"i would"],
  [/\bokay\b/g,"ok"], // Whisper يكتبها okay والكتاب يكتبها OK — نفس الكلمة
];
function pronWords(s){
  let t=String(s||"").toLowerCase().replace(/[‘’ʼ´`]/g,"'"); // الفاصلة المائلة في iOS ثم القواعد
  PRON_CONTRACTIONS.forEach(p=>{t=t.replace(p[0],p[1])});
  // ما بقي من فواصل عليا هو ملكية (teacher's) — نحذفها بلا فراغ حتى تطابق ما يكتبه Whisper بلا فاصلة
  return t.replace(/'/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
}
// Whisper يدخل في حلقة تكرار عند الصوت القصير أو غير الواضح ("no brown bear" ثلاث مرات) —
// نتيجة كهذه لا تصف نطقها، فنطلب الإعادة بدل احتساب درجة لا معنى لها.
const PRON_MIN_MS=800; // أقل من هذا: الزر أُغلق قبل أن تتكلّم
function pronHallucinated(target,heard){
  const t=pronWords(target),h=pronWords(heard);
  if(h.length<4||h.length<t.length*2)return false;
  for(let n=1;n<=3;n++){ // ثنائية أو ثلاثية مكرّرة ثلاث مرات متتالية = حلقة تكرار
    for(let i=0;i+3*n<=h.length;i++){
      const a=h.slice(i,i+n).join(" ");
      if(a===h.slice(i+n,i+2*n).join(" ")&&a===h.slice(i+2*n,i+3*n).join(" "))return true;
    }
  }
  return false;
}

      logAnswer("pronunciation_a1","word",sc.ok,data.heard,target,Math.round(pronElapsed*1000),{score_pct:sc.pct,engine:"groq",azure_fail:azureLastFail||null});
    }else if(data&&data.error==="not_configured"){
      pronResult={heard:"",ok:false,error:true,notConfigured:true};
      logAnswer("pronunciation_a1","word",false,"[not_configured]",target);
    }else{
      pronResult={heard:"",ok:false,error:true};
      logAnswer("pronunciation_a1","word",false,"[transcription_error]",target);
    }
  }catch(e){
    pronResult={heard:"",ok:false,error:true};
  }

}
function pronNext(){
  if(pronTimer){clearInterval(pronTimer);pronTimer=null}

  pronIdx++;pronResult=null;render();
  setTimeout(()=>speakEnglish(pronSession[pronIdx].w),300);
}

const SPEAK_SRS_KEY="mawhiba_speak_srs",SPEAK_STAGE_KEY="mawhiba_speak_stage";
const SPEAK_REQ=2,SPEAK_BACK=2,SPEAK_NEW_CAP=6,SPEAK_LEN=8;
const SPEAK_STAGES=[
  {label:"مرحلة ١: استمعي ثم كرّري (النص أمامك)",tag:"ظلّ صوتي"},
  {label:"مرحلة ٢: اقرئيها بصوتك (بلا نموذج مسبق)",tag:"اقرئي"},
  {label:"مرحلة ٣: بالسمع فقط (النص مخفي)",tag:"مستقل"},
];
function speakSrsLoad(){try{return JSON.parse(lsGet(SPEAK_SRS_KEY)||"{}")}catch(e){return{}}}
function speakSrsSave(o){try{lsSet(SPEAK_SRS_KEY,JSON.stringify(o))}catch(e){}}
function speakSrsUpdate(id,ok){
  const st=speakSrsLoad(),r=st[id]||{box:0,seen:0};
  const n=fsrsUpdate(r,ok,srsToday());
  r.box=n.box;r.due=n.due;r.seen=n.seen;r.s=n.s;r.d=n.d;r.last=n.last;
  st[id]=r;speakSrsSave(st);
}
function speakStageGet(){try{const v=parseInt(lsGet(SPEAK_STAGE_KEY)||"1");return(v>=1&&v<=3)?v:1}catch(e){return 1}}
function speakStageSet(v){try{lsSet(SPEAK_STAGE_KEY,String(v))}catch(e){}}
// المستحقّ أولاً ثم الجديد (الأقصر أولاً) — نفس منطق الخطة اليومية
function buildSpeakSession(){
  const st=speakSrsLoad(),today=srsToday();
  const due=SPEAK_ITEMS.filter(i=>st[i.id]&&st[i.id].due<=today);
  const fresh=SPEAK_ITEMS.filter(i=>!st[i.id]).sort((a,b)=>pronWords(a.en).length-pronWords(b.en).length);
  const out=shuffle(due).slice(0,SPEAK_LEN);
  for(const it of fresh){if(out.length>=SPEAK_LEN)break;if(out.filter(x=>!st[x.id]).length>=SPEAK_NEW_CAP)break;out.push(it)}
  if(!out.length)out.push(...shuffle(SPEAK_ITEMS).slice(0,SPEAK_LEN)); // لا شيء مستحق: مراجعة حرّة بدل شاشة فارغة
  return out.map(i=>Object.assign({},i,{_isNew:!st[i.id],_box:st[i.id]?st[i.id].box:null}));
}
let speakSession=[],speakIdx=0,speakStage=1,speakStreak=0,speakMiss=0,speakResult=null,speakScore=0,speakSkipped=0,speakDone=false,speakTries=0,speakUnsupported=false;
let speakRec=null,speakStream=null,speakChunks=[],speakTimer=null,speakElapsed=0,speakListening=false,speakBusy=false;
function startSpeaking(){
  mode="speak";speakSession=buildSpeakSession();speakIdx=0;speakResult=null;speakScore=0;speakSkipped=0;speakDone=false;speakTries=0;
  speakStage=speakStageGet();speakStreak=0;speakMiss=0;
  speakListening=false;speakBusy=false;speakElapsed=0;if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  speakUnsupported=!micSupported();
  window.scrollTo(0,0);render();
  if(!speakUnsupported&&speakStage!==2)setTimeout(()=>speakEnglish(speakSession[0].en),400);
}
function speakCur(){return speakSession[speakIdx]}
function speakReplay(){const it=speakCur();if(it)speakEnglish(it.en)}
async function speakStart(){
  if(speakListening||speakBusy)return;
  if(!micSupported()){speakUnsupported=true;render();return}
  speakResult=null;
  try{
    speakStream=await navigator.mediaDevices.getUserMedia({audio:true});
    speakChunks=[];
    speakRec=new MediaRecorder(speakStream);
    speakRec.ondataavailable=(e)=>{if(e.data&&e.data.size>0)speakChunks.push(e.data)};
    speakRec.onstop=()=>{speakFinish()};
    speakRec.start();
    speakListening=true;speakElapsed=0;
    speakTimer=setInterval(()=>{speakElapsed+=0.25;if(speakElapsed*1000>=PRON_MAX_MS){speakStop();return}render()},250);
    render();
  }catch(e){speakListening=false;speakResult={heard:"",error:true};render()}
}
function speakStop(){
  if(!speakListening)return;
  speakListening=false;speakBusy=true;
  if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  try{if(speakRec&&speakRec.state!=="inactive")speakRec.stop();else{speakBusy=false}}catch(e){speakBusy=false}
  render();
}
async function speakFinish(){
  const it=speakCur();const target=it?it.en:"";
  if(speakStream){try{speakStream.getTracks().forEach(t=>t.stop())}catch(e){}speakStream=null}
  // محاولة مُهمَلة: لا تُحتسب خطأً ولا تُكتب في التباعد — الجملة تبقى كما هي لتعيدها
  if(speakElapsed*1000<PRON_MIN_MS){
    speakResult={heard:"",discarded:true,why:"short"};speakBusy=false;
    logAnswer("speaking","discarded",false,"[too_short]",it?it.id:null,Math.round(speakElapsed*1000),{is_new:!!(it&&it._isNew),srs_box:it?it._box:null});
    render();return;
  }
  try{
    const blob=new Blob(speakChunks,{type:(speakRec&&speakRec.mimeType)||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetchTimeout(PRON_GROQ_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:target,targetWords:pronWords(target)})});
    const data=await res.json();
    const bad=data&&data.ok&&(data.lowConfidence||data.garbled||pronHallucinated(target,data.heard));
    if(bad){
      speakResult={heard:data.heard||"",discarded:true,why:"noisy"};
      logAnswer("speaking","discarded",false,data.heard||"[low_confidence]",it.id,Math.round(speakElapsed*1000),{is_new:!!it._isNew,srs_box:it._box});
    }else if(data&&data.ok){
      const sc=pronScoreOf(target,data.heard,data.judged);
      speakTries++;
      speakResult={heard:data.heard,ok:sc.ok,sc,note:data.note||""};
      logAnswer("speaking","stage"+speakStage,sc.ok,data.heard,it.id,Math.round(speakElapsed*1000),{score_pct:sc.pct,is_new:!!it._isNew,srs_box:it._box,judged_by:sc.by});
    }else{
      speakResult={heard:"",error:true,notConfigured:!!(data&&data.error==="not_configured")};
      logAnswer("speaking","stage"+speakStage,false,"[transcription_error]",it.id);
    }
  }catch(e){speakResult={heard:"",error:true}}
  speakBusy=false;render();
}
// تُحسب النتيجة والتباعد مرة واحدة لكل جملة عند الانتقال — فالمحاولات المتكررة تدريب لا عقوبة
function speakNext(skip){
  const it=speakCur(),ok=!skip&&!!(speakResult&&speakResult.ok);
  // المحاولة المُهمَلة (صوت قصير أو مشوّش) تُتخطّى بلا تباعد ولا سلسلة ولا درجة — لأنها لا تصف نطقها
  if(skip){speakSkipped++}
  else{
    if(it){speakSrsUpdate(it.id,ok);if(ok)speakScore++}
    if(ok){speakStreak++;speakMiss=0}else{speakMiss++;speakStreak=0}
    if(speakStreak>=SPEAK_REQ&&speakStage<3){speakStage++;speakStageSet(speakStage);speakStreak=0}
    else if(speakMiss>=SPEAK_BACK&&speakStage>1){speakStage--;speakStageSet(speakStage);speakMiss=0}
  }
  if(speakTimer){clearInterval(speakTimer);speakTimer=null}
  speakListening=false;speakBusy=false;speakTries=0;
  if(speakIdx+1>=speakSession.length){speakDone=true;window.scrollTo(0,0);render();return}
  speakIdx++;speakResult=null;render();
  if(speakStage!==2)setTimeout(()=>speakEnglish(speakSession[speakIdx].en),300);
}

function alias(){return (lsGet("mawhiba_alias")||profileOf().alias).trim()||profileOf().alias}
function saveAlias(v){lsSet("mawhiba_alias",v)}
let mode="home",currentMode="full",filtered=[],idx=0,picked=null,locked=false,score=0,done=false,answered=[],attempts=[],loading=false;
