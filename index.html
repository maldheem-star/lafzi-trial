<script>
// ===== إعدادات =====
const SB_URL="https://yzznkerweqkmhrtbidrl.supabase.co";
const SB_KEY="sb_publishable_W9ijdHn1vHj3-rUDCx2U5Q_yq6ebbsI";
const FN_URL=SB_URL+"/functions/v1/generate-question";
const TBL="mawhiba_attempts";
const TBL_LOG="mawhiba_answer_log";
const DOMAINS={
  verbal:{name:"الاستدلال اللغوي",color:"#2563EB",soft:"#DBEAFE"},
  quant:{name:"الرياضي والمكاني",color:"#0D9488",soft:"#CCFBF1"},
  science:{name:"الاستدلال العلمي",color:"#7C3AED",soft:"#EDE9FE"},
  flex:{name:"المرونة والأنماط",color:"#D97706",soft:"#FEF3C7"},
};
const L=["أ","ب","ج","د"];
const PER=12;
const DAILY_CAP=80; // حد أقصى لطلبات الذكاء الاصطناعي يومياً (تحكّم بالتكلفة)

// ===== أدوات =====
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const toAr=n=>String(n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
function arSeq(a){return a.map(toAr).join(" ، ")}
function mcNum(correct,cands){const opts=[correct];(cands||[]).forEach(x=>{x=Math.round(x);if(opts.length<4&&Number.isFinite(x)&&x>=0&&!opts.includes(x))opts.push(x)});let p=1;while(opts.length<4){[correct+p,correct-p].forEach(x=>{if(opts.length<4&&x>=0&&!opts.includes(x))opts.push(x)});p++;if(p>300)break}const sh=shuffle(opts);return{choices:sh.map(toAr),answer:sh.indexOf(correct)}}
function qz(d,q,correct,cands,w){const m=mcNum(correct,cands);return{d,q,c:m.choices,a:m.answer,w}}

// ===== مولّدات الرياضي =====
function gArith(){const s=rand(2,9),a=rand(1,9);const q=[a];for(let i=0;i<3;i++)q.push(q[i]+s);const ans=q[3]+s;return qz("quant",`أكمل المتتالية: ${arSeq(q)} ، ...`,ans,[ans+s,ans-s,q[3]+1],`يزيد العدد ${toAr(s)} في كل مرة: ${toAr(q[3])} + ${toAr(s)} = ${toAr(ans)}.`)}
function gGeo(){const r=pick([2,3]),a=rand(2,5);const q=[a];for(let i=0;i<3;i++)q.push(q[i]*r);const ans=q[3]*r;return qz("quant",`أكمل المتتالية: ${arSeq(q)} ، ...`,ans,[ans-a,q[3]+r,ans+a],`كل عدد = الذي قبله × ${toAr(r)}: ${toAr(q[3])} × ${toAr(r)} = ${toAr(ans)}.`)}
function gPrice(){const per=rand(2,6),k=rand(2,4),m=rand(5,8);const ck=per*k;return qz("quant",`إذا كان ثمن ${toAr(k)} أقلام ${toAr(ck)} ريالاً، فكم ثمن ${toAr(m)} أقلام؟`,per*m,[per*m+per,per*m-per,per*(m+1)],`سعر القلم = ${toAr(ck)} ÷ ${toAr(k)} = ${toAr(per)}، إذن ${toAr(m)} × ${toAr(per)} = ${toAr(per*m)} ريالاً.`)}
function gPerim(){if(pick([0,1])){const side=rand(3,12);return qz("quant",`محيط مربع طول ضلعه ${toAr(side)} سم. كم محيطه؟`,4*side,[4*side+4,4*side-4,side*3],`محيط المربع = ٤ × الضلع = ${toAr(4*side)} سم.`)}const per=4*rand(3,12);return qz("quant",`محيط مربع يساوي ${toAr(per)} سم. كم طول ضلعه؟`,per/4,[per/4+1,per/4-1,per/2],`الضلع = المحيط ÷ ٤ = ${toAr(per/4)} سم.`)}
function gClock(){const names=["","الواحدة","الثانية","الثالثة","الرابعة","الخامسة","السادسة"];const h=rand(1,6),ang=30*h;return qz("quant",`عندما تشير الساعة إلى ${names[h]} تماماً، كم الزاوية بين عقربَيها؟`,ang,[ang+30,ang-30,ang+15],`كل ساعة = ٣٠°، وعند ${toAr(h)}:٠٠ الزاوية = ${toAr(ang)}°.`)}
function gSides(){const sh=pick([["المثلث",3],["المربع",4],["الشكل الخماسي",5],["الشكل السداسي",6],["الشكل الثماني",8]]);return qz("quant",`كم عدد أضلاع ${sh[0]}؟`,sh[1],[sh[1]+1,sh[1]-1,sh[1]+2],`${sh[0]} له ${toAr(sh[1])} أضلاع.`)}
// متقدّمة
function gWorkers(){const w1=rand(3,6),f=rand(2,4),d2=rand(3,6);const total=w1*d2*f;const d1=total/w1;const w2=total/d2;return qz("quant",`يستطيع ${toAr(w1)} عمّال دهن بيت في ${toAr(d1)} يوماً. كم عاملاً يدهنون نفس البيت في ${toAr(d2)} أيام؟`,w2,[w2+1,w2-1,w1+d2],`العمل ثابت: العمّال × الأيام = ${toAr(total)}. العمّال = ${toAr(total)} ÷ ${toAr(d2)} = ${toAr(w2)}.`)}
function gMedian(){const mid=rand(4,20),sum=5*mid;return qz("quant",`مجموع خمسة أعداد صحيحة متتالية يساوي ${toAr(sum)}. أوجد وسيطها.`,mid,[mid+1,mid-1,Math.round(sum/4)],`الوسيط = المجموع ÷ العدد = ${toAr(sum)} ÷ ٥ = ${toAr(mid)}.`)}
function gCube(){const s=rand(2,5),v=s*s*s,nv=(2*s)**3;return qz("quant",`مكعّب حجمه ${toAr(v)} سم³. إذا ضاعفنا طول ضلعه، فما حجمه الجديد؟`,nv,[v*2,v*4,v*6],`مضاعفة الضلع تضاعف الحجم ٨ مرّات: ${toAr(v)} × ٨ = ${toAr(nv)} سم³.`)}
function gPercent(){const rentP=pick([30,40,50]),expP=pick([20,30]),leftP=100-rentP-expP;if(leftP<=0)return gPercent();const salary=pick([6000,8000,9000,10000,12000]);const left=salary*leftP/100;if(!Number.isInteger(left))return gPercent();const onePercent=left/leftP;return qz("quant",`دفع سالم ${toAr(rentP)}% من راتبه إيجاراً و${toAr(expP)}% مصروفات، وتبقّى له ${toAr(left)} ريال. كم راتبه؟`,salary,[salary+1000,salary-1000,left*2],`المتبقّي = ${toAr(leftP)}% من الراتب = ${toAr(left)} ريال. قيمة ١% واحد = ${toAr(left)} ÷ ${toAr(leftP)} = ${toAr(onePercent)} ريال. الراتب الكامل = ${toAr(onePercent)} × ١٠٠ = ${toAr(salary)} ريال.`)}
function gPaths(){const p=rand(2,4),q=rand(2,4);return qz("quant",`عدد الطرق من (أ) إلى (ب) ${toAr(p)}، ومن (ب) إلى (ج) ${toAr(q)}. كم عدد الطرق من (أ) إلى (ج)؟`,p*q,[p+q,p*q+1,p*q-1],`نضرب: ${toAr(p)} × ${toAr(q)} = ${toAr(p*q)} طريقاً.`)}

// ===== مولّدات المرونة والأنماط =====
function fDouble(){const a=pick([1,2,3]);const q=[a];for(let i=0;i<4;i++)q.push(q[i]*2);const ans=q[4]*2;return qz("flex",`أكمل النمط: ${arSeq(q)} ، ...`,ans,[ans-a,q[4]+2,ans+2],`كل عدد ضعف الذي قبله: ${toAr(q[4])} × ٢ = ${toAr(ans)}.`)}
function fTriple(){const a=rand(1,3);const q=[a];for(let i=0;i<3;i++)q.push(q[i]*3);const ans=q[3]*3;return qz("flex",`أكمل النمط: ${arSeq(q)} ، ...`,ans,[ans-a,q[3]+3,ans+3],`كل عدد = الذي قبله × ٣: ${toAr(q[3])} × ٣ = ${toAr(ans)}.`)}
function fFib(){let a=rand(1,4),b=rand(1,5);const q=[a,b];for(let i=0;i<4;i++)q.push(q[q.length-1]+q[q.length-2]);const ans=q[5]+q[4];return qz("flex",`أكمل النمط: ${arSeq(q)} ، ...`,ans,[ans+1,ans-1,q[5]*2],`كل عدد = مجموع العددين قبله: ${toAr(q[4])} + ${toAr(q[5])} = ${toAr(ans)}.`)}
function fSq(){const c=pick([0,1]);const q=[];for(let n=1;n<=4;n++)q.push(n*n+c);const ans=25+c;return qz("flex",`أكمل النمط: ${arSeq(q)} ، ...`,ans,[ans+2,ans-2,ans+5],`مربعات الأعداد${c?" + ١":""}: والتالي ٥²${c?" + ١":""} = ${toAr(ans)}.`)}
function fOpp(){const dict={"طويل":"قصير","كبير":"صغير","سريع":"بطيء","قوي":"ضعيف","مفتوح":"مغلق","صعب":"سهل","ثقيل":"خفيف","بعيد":"قريب","كثير":"قليل","النور":"الظلام","الفرح":"الحزن"};const keys=Object.keys(dict);const w=pick(keys);const correct=dict[w];const others=shuffle(keys.filter(k=>k!==w).map(k=>dict[k]).filter(v=>v!==correct)).slice(0,3);const opts=shuffle([correct,...others]);return{d:"flex",q:`ما ضدّ كلمة «${w}»؟`,c:opts,a:opts.indexOf(correct),w:`ضدّ «${w}» هو «${correct}».`}}
// الهرم العددي (مُصلَح: c/a)
function gPyramid(){const known=rand(2,12),other=rand(2,12),top=(known+other)*2;const m=mcNum(other,[other+2,other-2,Math.round(top/2)]);const knownOnLeft=Math.random()<0.5;const svg=pyramidSVG(toAr(top),knownOnLeft?toAr(known):"؟",knownOnLeft?"؟":toAr(known),knownOnLeft,!knownOnLeft);return{d:"flex",q:`هرم عددي: مجموع العددين السفليين × ٢ = العلوي. ما العدد الناقص؟`,svg,c:m.choices,a:m.answer,w:`العلوي ÷ ٢ = ${toAr(top/2)}، ثم ${toAr(top/2)} − ${toAr(known)} = ${toAr(other)}.`}}
function gCircleNum(){const a=rand(2,15),b=rand(2,15);return qz("flex",`دائرة مقسومة: العلوي = مجموع السفليين. إذا كان السفليان ${toAr(a)} و ${toAr(b)}، فما العلوي؟`,a+b,[a+b+2,a+b-2,a*b],`العلوي = ${toAr(a)} + ${toAr(b)} = ${toAr(a+b)}.`)}
function gShapeEq(){const star=rand(3,9),spiral=rand(2,8);const rowSum=star+2*spiral;return qz("flex",`لغز الأشكال: ★ + ● + ● = ${toAr(rowSum)}، وكانت ● = ${toAr(spiral)}. فما قيمة ★؟`,star,[star+1,star-1,spiral],`★ = ${toAr(rowSum)} − (٢ × ${toAr(spiral)}) = ${toAr(star)}.`)}
// الترتيب التسلسلي
const SEQS=[{n:"مراحل عمر الإنسان",it:["جنين","رضيع","طفل","صبي","شاب","كهل","شيخ"]},{n:"أيام الأسبوع",it:["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"]},{n:"مراحل النبات",it:["بذرة","برعم","نبتة","شجرة"]},{n:"مراحل الفراشة",it:["بيضة","يرقة","شرنقة","فراشة"]},{n:"الأعداد الترتيبية",it:["الأول","الثاني","الثالث","الرابع","الخامس","السادس"]}];
function gSeq(){const s=pick(SEQS);const maxStart=Math.max(0,s.it.length-4);const st=rand(0,maxStart);const shown=s.it.slice(st,st+3);const ans=s.it[st+3];const pool=s.it.filter(x=>!shown.includes(x)&&x!==ans);let dis=shuffle(pool).slice(0,3);if(dis.length<3){const o=pick(SEQS.filter(z=>z!==s));dis=dis.concat(shuffle(o.it).slice(0,3-dis.length))}const opts=shuffle([ans,...dis.slice(0,3)]);return{d:"flex",q:`ما الكلمة التالية في الترتيب؟  ${shown.join(" ← ")} ← ...`,c:opts,a:opts.indexOf(ans),w:`الترتيب حسب «${s.n}»: بعد «${shown[shown.length-1]}» يأتي «${ans}».`}}
// النرد
function gDice(){const faces=rand(1,6),opp=7-faces;return qz("flex",`في حجر النرد، مجموع النقاط على الوجهين المتقابلين ٧. إذا ظهر الوجه ${toAr(faces)}، فكم نقاط الوجه المقابل؟`,opp,[opp+1,opp-1,faces],`الوجه المقابل = ٧ − ${toAr(faces)} = ${toAr(opp)}.`)}


// ===== مولّدات رياضية إضافية (من المرجع) =====
function gCompound(){const m1=rand(2,5),h1=rand(2,6),rate=rand(2,5);const units1=m1*h1*rate;const m2=rand(2,6);const h2=units1/(m2*rate);if(!Number.isInteger(h2)||h2<1||h2>12)return gCompound();return qz("quant",`${toAr(m1)} آلات تنتج ${toAr(units1)} قطعة في ${toAr(h1)} ساعات. كم ساعة تحتاج ${toAr(m2)} آلات لإنتاج نفس الكمية؟`,h2,[h2+1,h2-1,h1],`الإنتاج ثابت: آلات×ساعات×معدّل = ${toAr(units1)}. الساعات = ${toAr(units1)} ÷ (${toAr(m2)}×${toAr(rate)}) = ${toAr(h2)}.`)}
function gFraction(){const opts=pick([[[1,4],[1,3],"٥/١٢"],[[1,2],[1,4],"١/٤"],[[1,3],[1,6],"١/٢"],[[2,5],[1,5],"٢/٥"]]);const [[n1,d1],[n2,d2],correct]=opts;const distract=shuffle(["١/٣","٢/٣","٣/٤","١/٢","١/٤","٥/١٢","٧/١٢"].filter(x=>x!==correct)).slice(0,3);const all=shuffle([correct,...distract]);return {d:"quant",q:`قضى محمد ${toAr(n1)}/${toAr(d1)} من يومه في المدرسة، و${toAr(n2)}/${toAr(d2)} في النوم. ما الكسر المتبقّي من يومه؟`,c:all,a:all.indexOf(correct),w:`المتبقّي = ١ − ${toAr(n1)}/${toAr(d1)} − ${toAr(n2)}/${toAr(d2)} = ${correct}.`}}
function gTrees(){const L=pick([12,18,24,30]),W=pick([6,9,12]);const perim=2*(L+W);const gap=pick([2,3,6]);if(perim%gap!==0)return gTrees();const trees=perim/gap;return qz("quant",`بستان مستطيل طوله ${toAr(L)}م وعرضه ${toAr(W)}م. زُرعت أشجار على حدوده كل ${toAr(gap)} أمتار. كم شجرة زُرعت؟`,trees,[trees+1,trees-1,perim],`المحيط = ٢×(${toAr(L)}+${toAr(W)}) = ${toAr(perim)}م. الأشجار = ${toAr(perim)} ÷ ${toAr(gap)} = ${toAr(trees)}.`)}
function gCircleValue(){const rule=pick(["sum","prod"]);if(rule==="sum"){const a=rand(3,12),b=rand(3,12);return qz("quant",`في الدائرة: العلوي = مجموع السفليين. إذا كان العلوي ${toAr(a+b)} وأحد السفليين ${toAr(a)}، فما الآخر؟`,b,[b+2,b-2,a],`الآخر = ${toAr(a+b)} − ${toAr(a)} = ${toAr(b)}.`)}const a=rand(2,6),b=rand(2,6);return qz("quant",`في الدائرة: العلوي = حاصل ضرب السفليين. إذا كان العلوي ${toAr(a*b)} وأحد السفليين ${toAr(a)}، فما الآخر؟`,b,[b+1,b-1,a],`الآخر = ${toAr(a*b)} ÷ ${toAr(a)} = ${toAr(b)}.`)}
function gConsec(){const count=pick([3,5]),mid=rand(5,20);const sum=count*mid;const first=mid-Math.floor(count/2);return qz("quant",`مجموع ${toAr(count)} أعداد صحيحة متتالية يساوي ${toAr(sum)}. ما العدد الأول (الأصغر)؟`,first,[first+1,first-1,mid],`الأوسط = ${toAr(sum)} ÷ ${toAr(count)} = ${toAr(mid)}. الأول = ${toAr(mid)} − ${toAr(Math.floor(count/2))} = ${toAr(first)}.`)}

// ===== أدوات هندسية مشتركة (زوايا) =====
// نقطة على بعد r من V باتجاه الزاوية phi (٠=يمين، ٩٠=أعلى)
function vAngleDeg(V,r,phi){const rad=phi*Math.PI/180;return{x:V.x+r*Math.cos(rad),y:V.y-r*Math.sin(rad)}}
function uDir(phi){const rad=phi*Math.PI/180;return{x:Math.cos(rad),y:-Math.sin(rad)}}
function unitTo(V,P){const dx=P.x-V.x,dy=P.y-V.y;const m=Math.hypot(dx,dy)||1;return{x:dx/m,y:dy/m}}
// نقطة منتصف الزاوية (منصّف) بين اتجاهين عند رأس V، تُستخدم لوضع رقم الزاوية داخلها
function bisectorPoint(V,u1,u2,r){let bx=u1.x+u2.x,by=u1.y+u2.y,bm=Math.hypot(bx,by);if(bm<1e-6){bx=-u1.y;by=u1.x;bm=1}return{x:V.x+(bx/bm)*r,y:V.y+(by/bm)*r}}
function arcPathBetween(V,u1,u2,r){const p1={x:V.x+u1.x*r,y:V.y+u1.y*r},p2={x:V.x+u2.x*r,y:V.y+u2.y*r};const cross=u1.x*u2.y-u1.y*u2.x;const sweep=cross>0?1:0;return`M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${r} ${r} 0 0 ${sweep} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`}
// يرسم مروحة زوايا حول رأس O بدءاً من startPhi، بقيم values المتتابعة، مع تمييز الزاوية المجهولة برقم unknownIdx
function renderSectorFan(O,startPhi,values,unknownIdx,extraSVG){
  const rayLen=68,arcR=24,labR=38;
  let phis=[startPhi];values.forEach(v=>phis.push(phis[phis.length-1]+v));
  let rays="",arcs="",labels="";
  phis.forEach(p=>{const pt=vAngleDeg(O,rayLen,p);rays+=`<line x1="${O.x}" y1="${O.y}" x2="${pt.x.toFixed(1)}" y2="${pt.y.toFixed(1)}" stroke="#1E293B" stroke-width="2.5"/>`});
  for(let i=0;i<values.length;i++){
    const u1=uDir(phis[i]),u2=uDir(phis[i+1]),isUnk=i===unknownIdx;
    arcs+=`<path d="${arcPathBetween(O,u1,u2,arcR)}" fill="none" stroke="${isUnk?'#D97706':'#0D9488'}" stroke-width="2"/>`;
    const lp=bisectorPoint(O,u1,u2,labR);
    labels+=`<text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="${isUnk?'#D97706':'#0D9488'}">${isUnk?'ص':toAr(values[i])+'°'}</text>`;
  }
  return`<svg viewBox="0 0 200 200" width="200" height="200">${extraSVG||""}${rays}<circle cx="${O.x}" cy="${O.y}" r="3" fill="#1E293B"/>${arcs}${labels}</svg>`;
}

// ===== مولّدات الزوايا (بصرية) =====
function gAngleTriangle(){
  const a=rand(35,95),b=rand(35,95);
  if(a+b>=150||a+b<=60)return gAngleTriangle();
  const A={x:35,y:155},B={x:165,y:155},rad=Math.PI/180;
  const t=(B.x-A.x)*Math.sin(b*rad)/Math.sin((a+b)*rad);
  const C={x:A.x+t*Math.cos(a*rad),y:A.y-t*Math.sin(a*rad)};
  if(C.y<15||C.y>172)return gAngleTriangle();
  const ans=180-a-b;
  const uAB=unitTo(A,B),uAC=unitTo(A,C),uBA=unitTo(B,A),uBC=unitTo(B,C),uCA=unitTo(C,A),uCB=unitTo(C,B);
  const arcR=22,labR=32;
  const lA=bisectorPoint(A,uAB,uAC,labR),lB=bisectorPoint(B,uBA,uBC,labR),lC=bisectorPoint(C,uCA,uCB,labR);
  const svg=`<svg viewBox="0 0 200 200" width="200" height="200">
    <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x.toFixed(1)},${C.y.toFixed(1)}" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <path d="${arcPathBetween(A,uAB,uAC,arcR)}" fill="none" stroke="#0D9488" stroke-width="2"/>
    <path d="${arcPathBetween(B,uBA,uBC,arcR)}" fill="none" stroke="#0D9488" stroke-width="2"/>
    <path d="${arcPathBetween(C,uCA,uCB,arcR)}" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="${lA.x.toFixed(1)}" y="${lA.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#0D9488">${toAr(a)}°</text>
    <text x="${lB.x.toFixed(1)}" y="${lB.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#0D9488">${toAr(b)}°</text>
    <text x="${lC.x.toFixed(1)}" y="${lC.y.toFixed(1)}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" fill="#D97706">ص</text>
  </svg>`;
  const m=mcNum(ans,[ans+10,ans-10,180-ans]);
  return{d:"quant",q:"في المثلث المجاور، ما قيمة الزاوية ص؟",c:m.choices.map(x=>x+"°"),a:m.answer,w:`مجموع زوايا المثلث ١٨٠°: ص = ١٨٠ − ${toAr(a)} − ${toAr(b)} = ${toAr(ans)}°.`,svg};
}
function gAngleLine(){

  else{const v0=rand(25,90);const rem=180-v0;const v1=rand(25,rem-25);values=[v0,v1,rem-v1]}

function gAnglePoint(){

function gAngleSquare(){

function gAngleEqualRays(){

  const outerText=`<text x="${outerLabel.x.toFixed(1)}" y="${outerLabel.y.toFixed(1)}" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">المجموع ${toAr(total)}°</text>`;
  const svg=`<svg viewBox="0 0 200 200" width="200" height="200">${rays}<circle cx="${O.x}" cy="${O.y}" r="3" fill="#1E293B"/>${arcs}${labels}${outerArc}${outerText}</svg>`;
  const m=mcNum(part,[part+8,part-8,total]);

}

function dotsMarkup(n){const pos=[[10,10],[25,10],[40,10],[10,25],[25,25],[40,25],[10,40],[25,40],[40,40]];let s="";for(let i=0;i<n&&i<9;i++)s+=`<circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="5" fill="#1E293B"/>`;return s}

function gridCell(x,y,inner){return`<rect x="${x}" y="${y}" width="55" height="55" fill="#fff" stroke="#CBD5E1" stroke-width="1.5"/><g transform="translate(${x+2.5},${y+2.5})">${inner}</g>`}
function gridQCell(x,y){return`<rect x="${x}" y="${y}" width="55" height="55" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+27}" y="${y+35}" font-size="26" font-weight="800" fill="#D97706" text-anchor="middle">؟</text>`}
function gRavenCount(){

const RAVEN_COLORS=["#0D9488","#7C3AED","#D97706"];
function triMarkup(color,rot){return`<g transform="rotate(${rot} 25 25)"><polygon points="25,10 38,38 12,38" fill="${color}"/></g>`}
function triSVG(color,rot){return`<svg viewBox="0 0 50 50" width="50" height="50">${triMarkup(color,rot)}</svg>`}
function gRavenRotate(){

}

// ===== الرسوم البيانية (سرعة/زمن) =====

  return`<svg viewBox="0 0 90 60" width="90" height="60"><line x1="10" y1="50" x2="85" y2="50" stroke="#94A3B8" stroke-width="1.5"/><line x1="10" y1="5" x2="10" y2="50" stroke="#94A3B8" stroke-width="1.5"/><path d="${path}" fill="none" stroke="#334155" stroke-width="3"/><text x="45" y="59" font-size="7" fill="#64748B" text-anchor="middle">الزمن</text><text x="3" y="11" font-size="7" fill="#64748B">السرعة</text></svg>`;
}
function gSpeedGraph(){
  const kinds=[
    {key:"accel",desc:"تنطلق السيارة من السكون وتزداد سرعتها باستمرار",exp:"خط مستقيم صاعد (السرعة تزداد بثبات)."},

    {key:"decel",desc:"تتباطأ السيارة تدريجياً حتى تتوقف تماماً",exp:"خط مستقيم هابط حتى الصفر (السرعة تقل حتى التوقف)."},

  if(ans>6)return gDicePattern();
  const svg=`<div style="display:flex;gap:10px;align-items:center;justify-content:center">${seq.map(n=>dieFaceSVG(n)).join("")}<span style="font-size:26px;font-weight:800;color:#D97706">؟</span></div>`;
  const distractVals=shuffle([1,2,3,4,5,6].filter(x=>x!==ans)).slice(0,3);
  const optsVals=shuffle([ans,...distractVals]);
  const c=optsVals.map(n=>dieFaceSVG(n));
  return{d:"flex",q:"لاحظي عدد النقاط على أوجه النرد المتتالية، ما الوجه التالي؟",c,a:optsVals.indexOf(ans),w:`عدد النقاط يزيد بمقدار واحد في كل مرة: بعد ${toAr(seq[3])} يأتي ${toAr(ans)}.`,svg};
}

// ===== سلسلة أشكال هندسية (زيادة الأضلاع) =====
function regularPolygon(n,color){
  const cx=25,cy=27,r=18;let pts=[];
  for(let i=0;i<n;i++){const ang=-Math.PI/2+i*2*Math.PI/n;pts.push(`${(cx+r*Math.cos(ang)).toFixed(1)},${(cy+r*Math.sin(ang)).toFixed(1)}`)}
  return`<svg viewBox="0 0 50 50" width="50" height="50"><polygon points="${pts.join(" ")}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2.5"/></svg>`;
}
function gShapeSeries(){
  const start=rand(3,4),seq=[start,start+1,start+2,start+3],ans=start+4;
  if(ans>9)return gShapeSeries();
  const svg=`<div style="display:flex;gap:10px;align-items:center;justify-content:center">${seq.map(n=>regularPolygon(n,"#0D9488")).join("")}<span style="font-size:26px;font-weight:800;color:#D97706">؟</span></div>`;
  let distract=[ans-1,ans+1,ans-2].filter(x=>x>=3&&x!==ans);
  while(distract.length<3){const x=rand(3,9);if(x!==ans&&!distract.includes(x))distract.push(x)}
  const optsVals=shuffle([ans,...distract.slice(0,3)]);
  const c=optsVals.map(n=>regularPolygon(n,"#7C3AED"));
  return{d:"flex",q:"لاحظي عدد أضلاع الأشكال في السلسلة، ما الشكل التالي؟",c,a:optsVals.indexOf(ans),w:`عدد الأضلاع يزيد بمقدار واحد في كل مرة: بعد شكل بـ ${toAr(seq[3])} أضلاع يأتي شكل بـ ${toAr(ans)} أضلاع.`,svg};
}

// ===== مساحة الجزء المظلّل =====
function gShadedArea(){
  const S=pick([4,6,8,10,12]),ans=S*S/2;
  const svg=`<svg viewBox="0 0 200 200" width="200" height="200">
    <rect x="30" y="30" width="140" height="140" fill="none" stroke="#334155" stroke-width="2.5"/>
    <polygon points="100,30 170,100 100,170 30,100" fill="#D97706" fill-opacity="0.35" stroke="#D97706" stroke-width="2.5"/>
    <text x="100" y="22" font-size="13" text-anchor="middle" fill="#334155">${toAr(S)} سم</text>
  </svg>`;
  const m=mcNum(ans,[Math.round(ans/2),ans*2,S*S]);
  return{d:"quant",q:`مربّع طول ضلعه ${toAr(S)} سم، ورُسم داخله مربّع آخر (المُظلّل) بتوصيل منتصفات أضلاعه كما في الشكل. ما مساحة الجزء المُظلّل؟`,c:m.choices.map(x=>x+" سم²"),a:m.answer,w:`مساحة المربع الكبير = ${toAr(S)}×${toAr(S)} = ${toAr(S*S)} سم². توصيل منتصفات الأضلاع يعطي مربّعاً مساحته نصف الكبير دائماً = ${toAr(ans)} سم².`,svg};
}

// ===== خط الأعداد (بصري) =====
function gNumberLine(){
  const start=rand(0,20),step=pick([1,2,5,10]),ticksCount=6;
  const markIdx=rand(1,ticksCount-2);
  const values=Array.from({length:ticksCount},(_,i)=>start+i*step);
  const ans=values[markIdx];
  const width=260,marginL=20,marginR=20,innerW=width-marginL-marginR;
  const xAt=i=>marginL+i*(innerW/(ticksCount-1));
  let ticks="",labels="";
  for(let i=0;i<ticksCount;i++){
    const x=xAt(i);
    ticks+=`<line x1="${x.toFixed(1)}" y1="34" x2="${x.toFixed(1)}" y2="46" stroke="#334155" stroke-width="2"/>`;
    if(i!==markIdx)labels+=`<text x="${x.toFixed(1)}" y="66" font-size="13" text-anchor="middle" fill="#334155">${toAr(values[i])}</text>`;
  }
  const mx=xAt(markIdx);
  const marker=`<circle cx="${mx.toFixed(1)}" cy="40" r="6" fill="#D97706"/><text x="${mx.toFixed(1)}" y="66" font-size="15" font-weight="800" text-anchor="middle" fill="#D97706">؟</text>`;
  const svg=`<svg viewBox="0 0 ${width} 80" width="${width}" height="80"><line x1="${marginL}" y1="40" x2="${width-marginR}" y2="40" stroke="#94A3B8" stroke-width="2"/>${ticks}${labels}${marker}</svg>`;
  const m=mcNum(ans,[ans+step,ans-step,ans+2*step]);
  return{d:"quant",q:"خط الأعداد مقسوم إلى أجزاء متساوية. ما العدد الذي تشير إليه النقطة؟",c:m.choices,a:m.answer,w:`الفرق بين كل علامتين متتاليتين ثابت = ${toAr(step)}. النقطة = ${toAr(ans)}.`,svg};
}

// ===== الانعكاس المرآتي (بصري) =====
function mirrorFlagMarkup(color){return`<polygon points="-15,-18 -15,18 -3,18 -3,4 12,4 12,-6 -3,-6 -3,-18" fill="${color}"/>`}
function mirrorFlagSVG(transformExtra,color){return`<svg viewBox="0 0 50 50" width="50" height="50"><g transform="translate(25,25) ${transformExtra}">${mirrorFlagMarkup(color||'#0D9488')}</g></svg>`}
function gMirrorReflect(){
  const color="#0D9488";
  const mainSVG=`<svg viewBox="0 0 140 90" width="140" height="90"><line x1="70" y1="5" x2="70" y2="85" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(95,45) scale(0.9,0.9)">${mirrorFlagMarkup(color)}</g></svg>`;
  const correct={t:"scale(-0.9,0.9)"};
  const distract=[{t:"scale(0.9,0.9)"},{t:"scale(0.9,-0.9)"},{t:"rotate(180) scale(0.9,0.9)"}];
  const all=shuffle([correct,...distract]);
  const c=all.map(o=>mirrorFlagSVG(o.t,color));
  return{d:"flex",q:"الشكل يقع على يمين الخط المتقطّع (خط الانعكاس). ما انعكاسه المرآتي الصحيح على الجانب الآخر من الخط؟",c,a:all.indexOf(correct),w:"الانعكاس المرآتي يقلب الشكل أفقياً (يمين ↔ يسار) حول خط الانعكاس، دون تدويره أو قلبه رأسياً.",svg:mainSVG};
}

// ===== محرّك الذكاء الاصطناعي (Gemini) + التحكّم بالتكلفة =====
function todayKey(){return new Date().toISOString().slice(0,10)}
function geminiUsage(){try{const u=JSON.parse(localStorage.getItem("gemini_day")||"{}");if(u.date!==todayKey())return{date:todayKey(),count:0};return u}catch(e){return{date:todayKey(),count:0}}}
function bumpUsage(n){const u=geminiUsage();u.count+=n;localStorage.setItem("gemini_day",JSON.stringify(u))}
function cacheGet(type){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");return c[type]||[]}catch(e){return[]}}
function cachePut(type,arr){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");c[type]=((c[type]||[]).concat(arr)).slice(-40);localStorage.setItem("gemini_cache",JSON.stringify(c))}catch(e){}}

// يجلب أسئلة من المحرّك، مع تخزين الفائض وإعادة الاستخدام، واحترام الحد اليومي
async function fetchGemini(type,need){
  const out=[];
  // 1) استهلك من الكاش أولاً
  let cache=cacheGet(type);
  while(out.length<need && cache.length){out.push(cache.shift())}
  cachePutReplace(type,cache);
  if(out.length>=need)return out.map(tagAI(type));
  // 2) تحقّق من الحد اليومي
  if(geminiUsage().count>=DAILY_CAP)return out.map(tagAI(type)); // نكتفي بالمتاح
  // 3) اطلب دفعة (3) لتقليل عدد النداءات
  try{
    const res=await fetch(FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({type,count:3})});
    if(res.ok){const data=await res.json();bumpUsage(1);const qs=(data.questions||[]).map(normAI(type));const take=qs.slice(0,need-out.length);out.push(...take);cachePut(type,qs.slice(take.length))}
  }catch(e){}
  return out.map(tagAI(type));
}
function cachePutReplace(type,arr){try{const c=JSON.parse(localStorage.getItem("gemini_cache")||"{}");c[type]=arr;localStorage.setItem("gemini_cache",JSON.stringify(c))}catch(e){}}
function normAI(type){return q=>({d:aiDomain(type),q:q.q,c:q.choices,a:q.answer,w:q.why||"",qtype:type})}
function tagAI(type){return q=>q}
function aiDomain(type){return (type==="science")?"science":"verbal"}

// أنواع لفظية وعلمية من المحرّك
const AI_VERBAL=["reading","logic","analogy","vocabulary"];
const AI_SCIENCE=["science"];

// ===== منع تكرار نص السؤال داخل الجلسة الحالية =====
// يتذكّر نصوص الأسئلة التي عُرضت فعلاً منذ فتح الصفحة (كل الأوضاع)، ويتجنّب إعادتها
const sessionSeenQuestions=new Set();
function markSeen(q){if(q&&q.q)sessionSeenQuestions.add(q.q);return q}
function isSeen(q){return !!(q&&sessionSeenQuestions.has(q.q))}
// يولّد من قائمة مولّدات عشوائياً حتى يجد نصاً لم يُعرض من قبل (بحد أقصى من المحاولات تفادياً لحلقة لا نهائية)
function uniqueFromGens(gens,maxTries){
  maxTries=maxTries||50;
  for(let i=0;i<maxTries;i++){const q=pick(gens)();if(!isSeen(q))return markSeen(q)}
  return markSeen(pick(gens)()); // البنك التوليدي نفد تنويعاً؛ نقبل الأحدث كحل أخير
}
// يفلتر قائمة أسئلة (من الذكاء الاصطناعي أو البنك) مبقياً على غير المعروض فقط
function dedupeList(arr){const out=[];(arr||[]).forEach(q=>{if(!isSeen(q)){out.push(q);markSeen(q)}});return out}
// يأخذ أول "need" سؤالاً غير معروض من قائمة (تُستخدم لتعبئة النقص من البنك الاحتياطي)
function takeUniqueFrom(arr,need){const out=[];for(const q of (arr||[])){if(out.length>=need)break;if(!isSeen(q)){out.push(q);markSeen(q)}}return out}
// حل أخير عند نفاد البنك عالمياً: يكمل من pool متفادياً تكرار نص موجود مسبقاً في نفس الدفعة (existing)،
// حتى لو تجاوزنا حدود التتبّع العالمي لهذه الجلسة
function fillAvoidingBatchDupes(existing,pool,need){
  const seenQ=new Set(existing.map(q=>q.q));
  const out=[];
  for(const item of shuffle(pool)){
    if(out.length>=need)break;
    if(!seenQ.has(item.q)){out.push(item);seenQ.add(item.q)}
  }
  return out;
}

// يبني مجموعة أسئلة لمجال، ممزوجة (محرّك + كود) مع احتياط، وبلا تكرار لنص سبق عرضه في هذه الجلسة
async function buildDomain(domKey,n){
  if(domKey==="quant")return Array.from({length:n},()=>uniqueFromGens(QUANT_GENS));
  if(domKey==="flex")return Array.from({length:n},()=>uniqueFromGens(FLEX_GENS));
  if(domKey==="verbal"){
    const types=shuffle(AI_VERBAL);let qs=[];
    for(const t of types){if(qs.length>=n)break;const got=await fetchGemini(t,Math.ceil(n/2));qs=qs.concat(dedupeList(got))}
    // احتياط من البنك لو نقص، مع تفادي تكرار ما سبق عرضه
    if(qs.length<n){qs=qs.concat(takeUniqueFrom(shuffle(VERBAL),n-qs.length).map(q=>({...q,qtype:"bank"})))}
    if(qs.length<n){qs=qs.concat(fillAvoidingBatchDupes(qs,VERBAL,n-qs.length).map(q=>({...q,qtype:"bank"})))} // البنك نفد تنويعاً؛ حل أخير
    return shuffle(qs).slice(0,n);
  }
  if(domKey==="science"){
    let qs=dedupeList(await fetchGemini("science",n));
    if(qs.length<n){qs=qs.concat(takeUniqueFrom(shuffle(SCIENCE),n-qs.length))}
    if(qs.length<n){qs=qs.concat(fillAvoidingBatchDupes(qs,SCIENCE,n-qs.length))} // البنك نفد تنويعاً؛ حل أخير
    return shuffle(qs).slice(0,n);
  }
  return [];
}
async function buildFull(){
  const per=12;
  const [v,q,s,f]=await Promise.all([buildDomain("verbal",per),Promise.resolve(buildDomain("quant",per)),buildDomain("science",per),Promise.resolve(buildDomain("flex",per))]);
  const qq=await Promise.resolve(q),ff=await Promise.resolve(f);
  return shuffle([...(await v),...qq,...(await s),...ff]);
}

function fadeDedupe(correct,dist){const out=[];for(const d of dist){if(d!==correct&&!out.includes(d))out.push(d)}let p=1;while(out.length<3){[correct+p,correct-p].forEach(x=>{if(out.length<3&&x>0&&x!==correct&&!out.includes(x))out.push(x)});p++}return out.slice(0,3)}

  const opts=shuffle([fadeCur.ans,...fadeDedupe(fadeCur.ans,d)]);fadeCur.opts=opts;fadeCur.ai=opts.indexOf(fadeCur.ans);

// ===== تدريب الأساسيات: عائلات الحقائق (ضرب/قسمة) + الجمع بالحمل + الطرح بالاستلاف (عشرات/مئات) =====
// نهج CRA (محسوس ← مرتبط بالرسم ← مجرّد بقاعدة ← مستقل)، نفس فلسفة وضع التقوية أعلاه
const BASICS_REQ=2;
const BASICS_SUBS={
  multdiv:{label:"عائلات الضرب والقسمة",short:"عائلات الضرب والقسمة"},
  addcarry:{label:"الجمع بالحمل (عشرات/مئات)",short:"الجمع بالحمل"},
  subborrow:{label:"الطرح بالاستلاف (عشرات/مئات)",short:"الطرح بالاستلاف"},
  percent:{label:"أساسيات النسبة المئوية",short:"النسبة المئوية"}
};
let basicsSub="multdiv",basicsStage=1,basicsStreak=0,basicsCur=null,basicsLocked=false,basicsPicked=-1,basicsMasteryStreak=0,basicsMidSupport=false,basicsMidRecoveryStreak=0,basicsFinalSupport=false,basicsFinalRecoveryStreak=0;

function groupsVisual(n,m){
  let groups="";
  for(let g=0;g<n;g++){
    let dots="";
    for(let i=0;i<m;i++){const row=Math.floor(i/3),col=i%3;dots+=`<circle cx="${8+col*13}" cy="${8+row*13}" r="4.5" fill="#0D9488"/>`}
    const h=Math.ceil(m/3)*13+8;
    groups+=`<div style="background:#F0FDFA;border:1.5px solid #99F6E4;border-radius:9px;padding:3px;display:inline-block;margin:3px"><svg viewBox="0 0 39 ${h}" width="39" height="${h}">${dots}</svg></div>`;
  }
  return`<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:320px;margin:0 auto">${groups}</div>`;
}
function percentGridVisual(p){
  let cells="";
  for(let i=0;i<100;i++){
    const shaded=i<p,x=(i%10)*11,y=Math.floor(i/10)*11;
    cells+=`<rect x="${x}" y="${y}" width="9" height="9" rx="1.5" fill="${shaded?'#0D9488':'#E2E8F0'}"/>`;
  }
  return `<svg viewBox="0 0 108 108" width="140" height="140">${cells}</svg>`;
}
function placeValueVisual(n){
  const hundreds=Math.floor(n/100),tens=Math.floor((n%100)/10),ones=n%10;
  let h="";for(let i=0;i<hundreds;i++)h+=`<div style="background:#0D9488;width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:800">١٠٠</div>`;
  let t="";for(let i=0;i<tens;i++)t+=`<div style="background:#2DD4BF;width:9px;height:32px;border-radius:2px"></div>`;
  let o="";for(let i=0;i<ones;i++)o+=`<div style="background:#99F6E4;width:8px;height:8px;border-radius:2px"></div>`;
  return`<div style="display:flex;gap:6px;align-items:flex-end;justify-content:center;min-height:38px">${h?`<div style="display:flex;gap:2px">${h}</div>`:""}${t?`<div style="display:flex;gap:2px;align-items:flex-end">${t}</div>`:""}${o?`<div style="display:flex;flex-wrap:wrap;gap:2px;width:36px;align-content:flex-end">${o}</div>`:""}</div>`;
}
function additionSteps(a,b){
  const ad=String(a).split("").reverse().map(Number),bd=String(b).split("").reverse().map(Number);
  const len=Math.max(ad.length,bd.length),placeNames=["الآحاد","العشرات","المئات"];
  let carry=0,steps=[];
  for(let i=0;i<len||carry;i++){
    const da=ad[i]||0,db=bd[i]||0,s=da+db+carry,digit=s%10,newCarry=Math.floor(s/10);
    steps.push(`${placeNames[i]||("خانة "+toAr(i+1))}: ${toAr(da)}+${toAr(db)}${carry?" + "+toAr(carry)+" (محمول)":""} = ${toAr(s)}${newCarry?` ← اكتبي ${toAr(digit)} واحملي ${toAr(newCarry)}`:` ← اكتبي ${toAr(digit)}`}`);
    carry=newCarry;
    if(i>=len&&!carry)break;
  }
  return steps;
}
function subtractionSteps(a,b){
  const ad=String(a).split("").reverse().map(Number),bd=String(b).split("").reverse().map(Number);
  const len=Math.max(ad.length,bd.length),placeNames=["الآحاد","العشرات","المئات"];
  let borrow=0,steps=[];
  for(let i=0;i<len;i++){
    const rawA=ad[i]||0,db=bd[i]||0,da=rawA-borrow;
    const borrowedNote=borrow?` (بعد الاستلاف: ${toAr(rawA)}-١=${toAr(da)})`:"";
    if(da<db){
      steps.push(`${placeNames[i]||("خانة "+toAr(i+1))}: ${toAr(da)}${borrowedNote} أصغر من ${toAr(db)}، فنستلف ١ من الخانة التالية: ${toAr(da+10)} - ${toAr(db)} = ${toAr(da+10-db)}`);
      borrow=1;
    }else{
      steps.push(`${placeNames[i]||("خانة "+toAr(i+1))}: ${toAr(da)}${borrowedNote} - ${toAr(db)} = ${toAr(da-db)}`);
      borrow=0;
    }
  }
  return steps;
}
function basicsMakeFamily(){const a=rand(2,9),b=rand(2,9);return{a,b,c:a*b}}
function basicsMakeAddCarry(){const o1=rand(5,9),o2=rand(5,9),t1=rand(1,8),t2=rand(1,8);const a=t1*10+o1,b=t2*10+o2;return{a,b,c:a+b}}
function basicsMakeSubBorrow(){const o2=rand(2,9),o1=rand(0,o2-1),t2=rand(1,7),t1=rand(t2+1,9);const a=t1*10+o1,b=t2*10+o2;return{a,b,c:a-b}}
function basicsMakePercent(){const a=pick([100,200,300,400,500,600,800,1000]),b=pick([10,20,25,30,40,50,60,70,75,80,90]);const onePercent=a/100,c=onePercent*b;return{a,b,c,onePercent}}
function basicsFamilyQ(f){
  const kind=pick(["mul1","mul2","div1","div2"]);
  if(kind==="mul1")return{text:`${toAr(f.a)} × ${toAr(f.b)} = ؟`,ans:f.c};
  if(kind==="mul2")return{text:`${toAr(f.b)} × ${toAr(f.a)} = ؟`,ans:f.c};
  if(kind==="div1")return{text:`${toAr(f.c)} ÷ ${toAr(f.a)} = ؟`,ans:f.b};
  return{text:`${toAr(f.c)} ÷ ${toAr(f.b)} = ؟`,ans:f.a};
}
function basicsPrep(){
  const f=basicsCur.fam;
  if(basicsStage===1){basicsCur.opts=null;basicsCur.ai=-1;return}
  let ans;
  if(basicsSub==="multdiv"){const fq=basicsFamilyQ(f);basicsCur.qText=fq.text;ans=fq.ans}
  else if(basicsSub==="addcarry"){ans=f.c;basicsCur.qText=`${toAr(f.a)} + ${toAr(f.b)} = ؟`}
  else if(basicsSub==="subborrow"){ans=f.c;basicsCur.qText=`${toAr(f.a)} - ${toAr(f.b)} = ؟`}
  else{ans=f.c;basicsCur.qText=`${toAr(f.b)}% من ${toAr(f.a)} = ؟`}
  const m=basicsSub==="percent"?mcNum(ans,[ans+f.onePercent,ans-f.onePercent,f.a*f.b]):mcNum(ans,[ans+1,ans-1,ans+10]);
  basicsCur.opts=m.choices;basicsCur.ai=m.answer;
}
function basicsNew(){
  const gen=basicsSub==="multdiv"?basicsMakeFamily:basicsSub==="addcarry"?basicsMakeAddCarry:basicsSub==="subborrow"?basicsMakeSubBorrow:basicsMakePercent;

function renderBasics(){

    body=`<div style="background:#EFF6FF;border-radius:14px;padding:16px;font-size:14px;line-height:1.8;color:#1E40AF;margin-bottom:16px">📘 هذا <b>مثال محلول</b>. اقرئي الحل خطوة بخطوة، ثم اضغطي «فهمت».</div>

    let hint="";
    const ruleText=basicsSub==="multdiv"

      :basicsSub==="subborrow"

    else if(basicsStage===4&&basicsMidSupport)hint=`<div style="background:#FEF9C3;border-inline-start:4px solid #EAB308;border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px;color:#854D0E">🌱 القاعدة: ${ruleText} جاوبي صح مرتين ليختفي التذكير.</div>`;
    else if(basicsStage===5&&basicsFinalSupport)hint=`<div style="background:#FEF9C3;border-inline-start:4px solid #EAB308;border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px;color:#854D0E">🌱 ما عليك، مراجعة سريعة: ${ruleText} جاوبي صح مرتين ليختفي التذكير.</div>`;
    const why=basicsLocked?`<div class="why" style="margin-bottom:10px">${basicsPicked===basicsCur.ai?"✓ "+(basicsStage===5?"حللتِها وحدك! 🌟":"أحسنتِ"):"الصحيحة بالأخضر"}.</div><button class="btn" style="background:${basicsStage===5?'#059669':'#0D9488'}" onclick="${basicsStage===5?'basicsFinalNext()':'basicsAdvance()'}">${basicsStage===5?'سؤال جديد ←':'التالي ←'}</button>`:"";
    const mtr=basicsStage<4?`<div style="font-size:13px;color:#64748B;text-align:center;margin-top:10px">جاوبي صح مرتين متتاليتين للانتقال (${toAr(basicsStreak)}/${toAr(BASICS_REQ)})</div>`

      :basicsFinalSupport?`<div style="font-size:13px;color:#854D0E;text-align:center;margin-top:10px">🌱 مراجعة: (${toAr(basicsFinalRecoveryStreak)}/${toAr(RECOVERY_REQ)}) لإخفاء التذكير مرة أخرى</div>`
      :`<div style="font-size:13px;color:#64748B;text-align:center;margin-top:10px">🎓 حل مستقل — (${toAr(basicsMasteryStreak)}/${toAr(MASTERY_REQ)}) متتالية لإتقان هذا النوع</div>`;

  }

// ===== نطق إنجليزي بصوت أمريكي عبر خاصية المتصفح المدمجة (بلا أي خدمة خارجية) =====
// onDone (اختياري): يبلغ بنتيجة فعلية {ok,voicesCount,hasEnVoice,voiceName} أو {ok:false,reason,errorType} — يُستخدم في تشخيص الصوت
function speakEnglish(text,onDone){
  try{
    if(!text||!('speechSynthesis' in window)){if(onDone)onDone({ok:false,reason:'unsupported'});return}
    const synth=window.speechSynthesis;
    let done=false,triedFallback=false;
    const attempt=(forceNoLang)=>{
      synth.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const voices=synth.getVoices();
      const usVoice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang&&v.lang.startsWith('en'));
      if(!forceNoLang){u.lang='en-US';u.rate=0.85;try{if(usVoice)u.voice=usVoice}catch(e){}}
      else{u.rate=0.85} // لا نفرض لغة/صوتاً غير متوفرين على الجهاز، نترك المتصفح يختار افتراضياً
      u.onstart=()=>{if(onDone)onDone({ok:true,voicesCount:voices.length,hasEnVoice:!!usVoice,voiceName:usVoice&&usVoice.name,fallback:!!forceNoLang})};
      u.onerror=(e)=>{
        if(!forceNoLang&&!triedFallback){triedFallback=true;attempt(true);return}
        if(onDone)onDone({ok:false,reason:'speak_error',errorType:e&&e.error,voicesCount:voices.length,hasEnVoice:!!usVoice});
      };
      synth.resume();
      synth.speak(u);
    };
    const doSpeak=()=>{if(done)return;done=true;attempt(false)};
    // بعض متصفحات أندرويد تحمّل قائمة الأصوات بشكل غير متزامن؛ النطق قبل اكتمالها يُتجاهل بصمت
    if(synth.getVoices().length>0){
      doSpeak();
    }else{
      synth.addEventListener('voiceschanged',doSpeak,{once:true});
      setTimeout(doSpeak,300);
    }
  }catch(e){if(onDone)onDone({ok:false,reason:'exception',message:String(e&&e.message||e)})}
}
// ===== تشخيص الصوت: أداة تساعد لو النطق ما يشتغل على جهاز معيّن =====
let audioDiagResult=null;
function startAudioDiag(){mode="audiodiag";audioDiagResult=null;window.scrollTo(0,0);render()}
function runAudioDiag(){
  audioDiagResult={status:"⏳ جارٍ التجربة..."};render();
  speakEnglish("Hello, can you hear this?",(r)=>{audioDiagResult=r;render()});
}
function renderAudioDiag(){
  const supported='speechSynthesis' in window;
  const voices=supported?window.speechSynthesis.getVoices():[];
  const enVoices=voices.filter(v=>v.lang&&v.lang.startsWith('en'));
  let resultBox="";
  if(audioDiagResult){
    if(audioDiagResult.status)resultBox=`<div style="background:#F1F5F9;border-radius:12px;padding:14px;margin-top:14px;font-size:14px">${audioDiagResult.status}</div>`;
    else if(audioDiagResult.ok)resultBox=`<div style="background:#ECFDF5;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#065F46">✓ المتصفح نفّذ أمر النطق فعلاً${audioDiagResult.fallback?" (بصوت افتراضي، لأن الصوت الإنجليزي المحدد ما اشتغل)":""}. الصوت المستخدم: ${audioDiagResult.voiceName||"افتراضي الجهاز"}.<br>لو ما سمعتِ شيئاً رغم هذا، فالمشكلة في صوت الجهاز نفسه (كتم/مستوى الصوت) وليست في الموقع.</div>`;
    else resultBox=`<div style="background:#FEF2F2;border-radius:12px;padding:14px;margin-top:14px;font-size:14px;color:#991B1B">✗ فشل النطق فعلياً: ${audioDiagResult.reason}${audioDiagResult.errorType?" ("+audioDiagResult.errorType+")":""}.<br>هذا يعني الجهاز/المتصفح لا يقدر يشغّل تحويل النص لصوت حالياً.</div>`;
  }
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="card">
    <div style="font-weight:800;font-size:17px;margin-bottom:14px">🔊 تشخيص الصوت</div>
    <div style="font-size:14px;color:#475569;line-height:1.9;margin-bottom:14px">
      يدعم المتصفح تحويل النص لصوت: <b>${supported?"نعم":"لا"}</b><br>
      عدد الأصوات المتوفرة على الجهاز: <b>${toAr(voices.length)}</b><br>
      عدد الأصوات الإنجليزية: <b>${toAr(enVoices.length)}</b>${enVoices.length?" ("+enVoices.map(v=>v.name).join("، ")+")":""}
    </div>
    <button class="btn" style="background:#0891B2" onclick="runAudioDiag()">🔊 جربي النطق الآن</button>
    ${resultBox}
    <div style="font-size:13px;color:#94A3B8;margin-top:18px;line-height:1.8">لو ظهر "فشل النطق فعلياً"، أو ظهر "نجح" لكن ما سمعتِ صوتاً: تأكدي إن صوت الجهاز غير مكتوم وبمستوى عالٍ كافٍ، وافتحي إعدادات الهاتف ← إعدادات إضافية/تحويل النص إلى كلام ← تأكدي إن حزمة الصوت الإنجليزي منزّلة (قد تحتاجين تنزيلها لأول مرة)، ثم أعيدي المحاولة.</div>
  </div>`;
}

const ENGLISH_BANKS={a1:ENGLISH_A1,a2:ENGLISH_A2};
function buildEnglishSession(n,level){
  const bank=ENGLISH_BANKS[level]||ENGLISH_A1;
  const chosen=takeUniqueFrom(shuffle(bank),n);
  if(chosen.length<n)chosen.push(...fillAvoidingBatchDupes(chosen,bank,n-chosen.length)); // البنك نفد تنويعاً؛ حل أخير
  return chosen.map(item=>{
    const order=shuffle([0,1,2,3]); // نعيد ترتيب الخيارات في كل جلسة حتى لا يُحفظ موضع الإجابة
    return{q:item.q,passage:item.passage,c:order.map(i=>item.c[i]),cEn:item.cEn?order.map(i=>item.cEn[i]):null,a:order.indexOf(item.a),w:item.w,listen:item.listen};
  });
}

const READING_ARABIC_STREAK=4;
function readingCorrectCount(){try{return parseInt(localStorage.getItem("mawhiba_reading_correct")||"0")}catch(e){return 0}}
function bumpReadingCorrect(){try{localStorage.setItem("mawhiba_reading_correct",String(readingCorrectCount()+1))}catch(e){}}
let engLevel="a1",engFiltered=[],engIdx=0,engPicked=null,engLocked=false,engScore=0,engDone=false,engAnswered=[];
function startEnglish(level){mode="english";engLevel=level||engLevel||"a1";engFiltered=buildEnglishSession(12,engLevel);engIdx=0;engPicked=null;engLocked=false;engScore=0;engDone=false;engAnswered=[];window.scrollTo(0,0);render()}
function engChoose(i){
  if(engLocked)return;engPicked=i;engLocked=true;
  const item=engFiltered[engIdx],ok=i===item.a;
  if(ok){engScore++;if(item.passage&&engLevel==="a1")bumpReadingCorrect()}
  engAnswered[engIdx]=ok;
  logAnswer("english_"+engLevel,item.passage?"reading":"vocab_grammar",ok);
  render();
}
function engNext(){if(engIdx+1>=engFiltered.length){engDone=true;window.scrollTo(0,0)}else{engIdx++;engPicked=null;engLocked=false}render()}
function renderEnglish(){
  if(engDone)return renderEnglishResult();
  const q=engFiltered[engIdx];
  const prog=engFiltered.map((_,i)=>`<div class="seg" style="background:${i<=engIdx?'#0891B2':'#E2E8F0'};opacity:${i<=engIdx?1:.5}"></div>`).join("");
  const useEnglishChoices=q.passage&&q.cEn&&(engLevel==="a2"||readingCorrectCount()>=READING_ARABIC_STREAK);
  const displayChoices=useEnglishChoices?q.cEn:q.c;
  const choices=displayChoices.map((c,i)=>{
    let bg="#fff",bd="#E2E8F0",col="#334155";
    if(engLocked){if(i===q.a){bg="#ECFDF5";bd="#10B981";col="#065F46"}else if(i===engPicked){bg="#FEF2F2";bd="#EF4444";col="#991B1B"}}
    return `<button class="choice" style="background:${bg};border-color:${bd};color:${col}" onclick="engChoose(${i})" ${engLocked?"disabled":""}><span class="letter">${L[i]}</span>${c}</button>`}).join("");
  const explain=engLocked?`<div class="explain"><div class="explain-title" style="color:${engPicked===q.a?'#059669':'#B45309'}">${engPicked===q.a?"✓ إجابة صحيحة":"الصحيحة بالأخضر"}</div><div class="explain-body">${q.w||""}</div></div>`:"";
  const btn=engLocked?`<button class="btn" style="background:#0891B2" onclick="engNext()">${engIdx+1>=engFiltered.length?"إنهاء ومشاهدة النتيجة":"السؤال التالي ←"}</button>`:"";
  const levelLabel=engLevel.toUpperCase();

  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="bar">${prog}</div>
  <div class="meta"><span>سؤال ${toAr(engIdx+1)} من ${toAr(engFiltered.length)}</span><span>English · ${levelLabel}</span></div>
  <div class="card">
    <span class="tag" style="background:#CFFAFE;color:#0891B2">🇬🇧 تعلّم الإنجليزية · مستوى ${levelLabel}</span>
    ${q.passage?`<div style="background:#F0FDFA;border:1px solid #99F6E4;border-radius:12px;padding:14px;margin-bottom:12px;font-size:16px;line-height:1.7;direction:ltr;text-align:left;color:#0F766E;font-family:Georgia,serif">${q.passage}</div>`:""}
    <div class="q">${q.q}</div>
    ${q.listen?`<button type="button" onclick="speakEnglish(engFiltered[${engIdx}].listen)" style="background:#ECFEFF;border:1.5px solid #A5F3FC;color:#0891B2;border-radius:10px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;font-family:inherit">🔊 استمعي</button>`:""}
    <div class="choices">${choices}</div>
    ${explain}
  </div>

function micSupported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)}

// ===== تقييم دقيق تجريبي عبر Azure AI Speech (اختياري، يحتاج مفتاحاً مُعدّاً في المشروع) =====
const PRON_FN_URL=SB_URL+"/functions/v1/assess-pronunciation";
let azureRecording=false,azureBusy=false,azureResult=null;
function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onloadend=()=>resolve(String(reader.result).split(",")[1]||"");
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}
async function azureAssess(){
  if(azureBusy)return;
  azureResult=null;azureBusy=true;azureRecording=true;render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];
    const rec=new MediaRecorder(stream);
    rec.ondataavailable=(e)=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
    const stopped=new Promise(resolve=>{rec.onstop=resolve});
    rec.start();
    await new Promise(r=>setTimeout(r,2500));
    rec.stop();
    stream.getTracks().forEach(t=>t.stop());
    await stopped;
    azureRecording=false;render();
    const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetch(PRON_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:pronSession[pronIdx].w})});
    azureResult=await res.json();
  }catch(e){
    azureResult={error:"client_error",message:String(e&&e.message||e)};
  }
  azureBusy=false;azureRecording=false;render();
}
async function pronListen(){
  if(pronListening)return;
  if(!micSupported()){pronUnsupported=true;render();return}
  pronListening=true;pronResult=null;render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];
    const rec=new MediaRecorder(stream);
    rec.ondataavailable=(e)=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
    const stopped=new Promise(resolve=>{rec.onstop=resolve});
    rec.start();
    await new Promise(r=>setTimeout(r,2200));
    rec.stop();
    stream.getTracks().forEach(t=>t.stop());
    await stopped;
    const blob=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    const b64=await blobToBase64(blob);
    const res=await fetch(PRON_GROQ_FN_URL,{method:"POST",headers:{"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({audio:b64,mimeType:blob.type,referenceText:pronSession[pronIdx].w})});
    const data=await res.json();
    if(data&&data.ok){
      pronResult={heard:data.heard,ok:data.matched};
      if(data.matched)pronScore++;
      logAnswer("pronunciation_a1","word",data.matched);
    }else if(data&&data.error==="not_configured"){
      pronResult={heard:"",ok:false,error:true,notConfigured:true};
    }else{
      pronResult={heard:"",ok:false,error:true};
    }
  }catch(e){
    pronResult={heard:"",ok:false,error:true};
  }
  pronListening=false;render();
}

    }
    const azureSection=`<div style="margin-top:18px;padding-top:16px;border-top:1px dashed #E2E8F0">

// ===== الحالة والتدفّق =====
function alias(){return (localStorage.getItem("mawhiba_alias")||"بنتي").trim()||"بنتي"}
function saveAlias(v){localStorage.setItem("mawhiba_alias",v)}
let mode="home",currentMode="full",filtered=[],idx=0,picked=null,locked=false,score=0,done=false,answered=[],attempts=[],loading=false;
const app=document.getElementById("app");

// ===== إدارة الحمل المعرفي: كشف الإجابات السريعة المتتالية واقتراح استراحة (بحسب الجلسة الحالية فقط) =====
let sessionAnswered=0,questionShownAt=0,recentAnswerTimes=[],rapidNudge=false,breakSuggest=false,breakShownFor=[];
const BREAK_EVERY=20,RAPID_MS=2500,RAPID_STREAK=4;

async function start(domKey){
  currentMode=domKey;mode="quiz";idx=0;picked=null;locked=false;score=0;done=false;answered=[];
  recentAnswerTimes=[];rapidNudge=false;breakSuggest=false;
  const needsAI=(domKey==="verbal"||domKey==="science"||domKey==="full");
  if(needsAI){loading=true;render();}
  if(domKey==="full"){filtered=await buildFull()}
  else{filtered=await buildDomain(domKey,PER)}
  loading=false;questionShownAt=Date.now();render();
}
async function home(){mode="home";window.scrollTo(0,0);render();await loadWeakness();if(mode==="home")render()}
function choose(i){
  if(locked)return;
  picked=i;locked=true;
  const q=filtered[idx];
  const ok=i===q.a;
  if(ok)score++;
  answered[idx]=ok;
  if(q.d==="verbal")logAnswer("verbal",q.qtype||"bank",ok);
  const elapsed=Date.now()-questionShownAt;
  recentAnswerTimes.push(elapsed);
  if(recentAnswerTimes.length>RAPID_STREAK)recentAnswerTimes.shift();
  sessionAnswered++;
  rapidNudge=recentAnswerTimes.length===RAPID_STREAK&&recentAnswerTimes.every(t=>t<RAPID_MS);
  if(rapidNudge)recentAnswerTimes=[];
  breakSuggest=!rapidNudge&&sessionAnswered%BREAK_EVERY===0&&!breakShownFor.includes(sessionAnswered);
  if(breakSuggest)breakShownFor.push(sessionAnswered);
  render();
}
function next(){if(idx+1>=filtered.length){done=true;window.scrollTo(0,0);saveAttempt()}else{idx++;picked=null;locked=false;rapidNudge=false;breakSuggest=false;questionShownAt=Date.now()}render()}
function domainStats(){const acc={};Object.keys(DOMAINS).forEach(k=>acc[k]={r:0,t:0});filtered.forEach((q,i)=>{if(acc[q.d]){acc[q.d].t++;if(answered[i])acc[q.d].r++}});return acc}
function weakestOf(acc){let key=null,pct=101;Object.keys(DOMAINS).forEach(k=>{if(acc[k].t){const p=acc[k].r/acc[k].t*100;if(p<pct){pct=p;key=k}}});return{key,pct}}

async function saveAttempt(){
  const acc=domainStats();
  const row={student_alias:alias(),mode:currentMode,score,total:filtered.length,
    verbal_correct:acc.verbal.r,verbal_total:acc.verbal.t,quant_correct:acc.quant.r,quant_total:acc.quant.t,
    science_correct:acc.science.r,science_total:acc.science.t,flex_correct:acc.flex.r,flex_total:acc.flex.t};
  try{await fetch(`${SB_URL}/rest/v1/${TBL}`,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Content-Type":"application/json","Prefer":"return-minimal"},body:JSON.stringify(row)})}catch(e){}
}
async function loadProgress(){mode="progress";attempts=null;window.scrollTo(0,0);render();try{const res=await fetch(`${SB_URL}/rest/v1/${TBL}?student_alias=eq.${encodeURIComponent(alias())}&order=created_at.asc&select=*`,{headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}});attempts=res.ok?await res.json():[]}catch(e){attempts=[]}render()}




// ===== التوجيه الذكي: اقتراح التقوية للأضعف =====
let weakSuggestion=null; // {domKey, pct}
async function loadWeakness(){
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${TBL}?student_alias=eq.${encodeURIComponent(alias())}&order=created_at.desc&limit=12&select=*`,{headers:{"apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`}});
    if(!res.ok)return null;
    const rows=await res.json();
    const acc={verbal:{r:0,t:0},quant:{r:0,t:0},science:{r:0,t:0},flex:{r:0,t:0}};
    rows.forEach(a=>{acc.verbal.r+=a.verbal_correct||0;acc.verbal.t+=a.verbal_total||0;acc.quant.r+=a.quant_correct||0;acc.quant.t+=a.quant_total||0;acc.science.r+=a.science_correct||0;acc.science.t+=a.science_total||0;acc.flex.r+=a.flex_correct||0;acc.flex.t+=a.flex_total||0});
    let key=null,pct=101;
    Object.keys(acc).forEach(k=>{if(acc[k].t>=6){const p=Math.round(acc[k].r/acc[k].t*100);if(p<pct){pct=p;key=k}}});
    if(key&&pct<55){weakSuggestion={domKey:key,pct}}else{weakSuggestion=null}
  }catch(e){weakSuggestion=null}
}

// ===== طبقة التشجيع (مبنية على إظهار النمو والكفاءة) =====
function todayStr(){return new Date().toISOString().slice(0,10)}
function getStreak(){try{return JSON.parse(localStorage.getItem("mawhiba_streak")||'{"days":0,"last":""}')}catch(e){return{days:0,last:""}}}
function bumpStreak(){const st=getStreak();const t=todayStr();if(st.last===t)return st;const y=new Date(Date.now()-86400000).toISOString().slice(0,10);st.days=(st.last===y)?st.days+1:1;st.last=t;localStorage.setItem("mawhiba_streak",JSON.stringify(st));return st}
// رسالة نمو: تقارن بأفضل نتيجة سابقة لنفس الوضع
function growthMsg(modeKey,pct){try{const key="mawhiba_best_"+modeKey;const prev=parseInt(localStorage.getItem(key)||"-1");let msg="";if(prev<0){msg="أول محاولة في هذا القسم — انطلاقة موفّقة! 🌱"}else if(pct>prev){msg=`تحسّنتِ عن أفضل نتيجة سابقة (${toAr(prev)}%)! تقدّم رائع 📈`}else if(pct===prev){msg="ثبات على أفضل مستوى سابق 💪"}else{msg="واصلي، كل محاولة تبني مهارتك 🌟"}if(pct>prev)localStorage.setItem(key,String(pct));return msg}catch(e){return""}}

// ===== العرض =====
function render(){if(mode==="home")return renderHome();if(mode==="english")return renderEnglish();if(mode==="dictation")return renderDictation();if(mode==="pron")return renderPron();if(mode==="fadeMenu")return renderFadeMenu();if(mode==="fade")return renderFade();if(mode==="fadeDone")return renderFadeDone();if(mode==="basics")return renderBasics();if(mode==="basicsDone")return renderBasicsDone();if(mode==="audiodiag")return renderAudioDiag();if(mode==="progress")return renderProgress();if(loading)return renderLoading();if(done)return renderResult();renderQuiz()}

function renderHome(){
  app.innerHTML=`
  <div class="hero">
    <h1>برنامج موهبة المكثّف</h1>
    <p>تدريب ذكي على مقياس القدرات العقلية المتعددة — المستوى الثاني. أسئلة تتجدّد كل مرة، والاستدلال اللغوي والعلمي يولّدها الذكاء الاصطناعي.</p>
    <div class="alias"><label>اسم المتدرّبة:</label><input id="aliasIn" value="${alias()}" placeholder="بنتي" oninput="saveAlias(this.value)"></div>
  </div>
  ${weakSuggestion?`<div style="background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 20px rgba(217,119,6,.15)"><div style="font-weight:800;font-size:15px;color:#92400E;margin-bottom:6px">🎯 اقتراح لكِ</div><div style="font-size:14px;color:#78350F;line-height:1.7;margin-bottom:12px">مستواكِ في «${DOMAINS[weakSuggestion.domKey].name}» يحتاج تقوية (${toAr(weakSuggestion.pct)}%). جرّبي وضع التقوية — يعلّمكِ خطوة بخطوة، أسهل من الاختبار المباشر.</div><button class="btn" style="background:#D97706;margin:0" onclick="goFadeMenu()">🎓 ابدئي التقوية خطوة بخطوة</button></div>`:""}
  <div class="section-title"><span>ابدئي التدريب</span></div>
  <div class="modes">
    <button class="mode" onclick="start('verbal')"><span class="dot" style="background:#2563EB"></span><span class="m-name">الاستدلال اللغوي</span><div class="m-sub">فهم مقروء، تناظر، منطق — بالذكاء الاصطناعي</div></button>
    <button class="mode" onclick="start('quant')"><span class="dot" style="background:#0D9488"></span><span class="m-name">الرياضي والمكاني</span><div class="m-sub">متتاليات، نسب، حجوم، مسارات</div></button>
    <button class="mode" onclick="start('science')"><span class="dot" style="background:#7C3AED"></span><span class="m-name">الاستدلال العلمي</span><div class="m-sub">استنتاج علمي بمشهد — بالذكاء الاصطناعي</div></button>
    <button class="mode" onclick="start('flex')"><span class="dot" style="background:#D97706"></span><span class="m-name">المرونة والأنماط</span><div class="m-sub">أنماط، هرم، نرد، ترتيب، ألغاز</div></button>
    <button class="mode full" onclick="start('full')"><span class="m-name">🎯 محاكاة شاملة (٤٨ سؤالاً)</span><div class="m-sub">من كل المجالات — الأقرب للاختبار الحقيقي</div></button>
    <button class="mode" style="border-color:#FDE68A" onclick="goFadeMenu()"><span class="m-name">🎓 وضع التقوية (تلاشٍ تدريجي)</span><div class="m-sub">اختاري مهارة وتدرّبي عليها خطوة بخطوة — مبني على دراسات التعلّم</div></button>
    <button class="mode prog" onclick="loadProgress()"><span class="m-name">📈 متابعة التقدّم</span><div class="m-sub">نتائجك السابقة وتحليل المستوى لكل مجال</div></button>
    <button class="mode full" style="background:#0D9488;border-color:#0D9488" onclick="startBasics('multdiv')"><span class="m-name">🧱 تدريب الأساسيات: عائلات الحقائق</span><div class="m-sub">ضرب/قسمة مرتبطان + جمع بالحمل + طرح بالاستلاف + أساسيات النسبة المئوية</div></button>
    <button class="mode full" style="background:#0891B2;border-color:#0891B2" onclick="startEnglish('a1')"><span class="m-name">🇬🇧 تعلّم الإنجليزية · مستوى A1</span><div class="m-sub">مفردات وقواعد وقراءة، مع نطق بصوت أمريكي 🔊 — الخطوة الأولى نحو C2</div></button>
    <button class="mode full" style="background:#155E75;border-color:#155E75" onclick="startEnglish('a2')"><span class="m-name">🇬🇧 تعلّم الإنجليزية · مستوى A2</span><div class="m-sub">أزمنة الماضي والمستقبل، المقارنة، أفعال الوجوب — الخطوة الثانية نحو C2</div></button>
    <button class="mode full" style="background:#0E7490;border-color:#0E7490" onclick="startDictation()"><span class="m-name">✍️ إملاء بالإنجليزية</span><div class="m-sub">استمعي للكلمة، ثم اكتبيها — مستوى A1</div></button>
    <button class="mode full" style="background:#7C3AED;border-color:#7C3AED" onclick="startPronunciation()"><span class="m-name">🎤 تمرين النطق</span><div class="m-sub">تحقّق أساسي هل نطقتِ الكلمة صح (يحتاج ميكروفون) — وليس تصحيح لهجة دقيق</div></button>
  </div>
  <button class="link-btn" onclick="startAudioDiag()">🔊 الصوت ما يشتغل؟ اضغطي هنا لتشخيص السبب</button>
  <div class="tips">
    <h3>💡 استراتيجيات موهبة</h3>
    <ul>
      <li>افهمي السؤال جيداً؛ فهم السؤال نصف الإجابة.</li>
      <li>الرسوم ليست دقيقة على القياس — اعتمدي على المعطيات.</li>
      <li>لا تقفي طويلاً عند الصعب؛ خمّني بذكاء ولا تتركي سؤالاً فارغاً.</li>
      <li>استخدمي الورقة لرسم أو تلخيص المعطيات.</li>
    </ul>
  </div>`;
}

function renderLoading(){
  const d=DOMAINS[currentMode]||{name:"المحاكاة الشاملة",color:"#1E293B"};
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع</button>
  <div class="card" style="text-align:center;padding:48px 24px">
    <div class="spin"></div>
    <div style="font-size:18px;font-weight:800;margin-top:20px;color:${d.color}">نُحضّر أسئلة جديدة…</div>
    <div style="font-size:14px;color:#64748B;margin-top:8px;line-height:1.7">الذكاء الاصطناعي يولّد أسئلة أصيلة متجدّدة خصيصاً لكِ.<br>لحظات من فضلك.</div>
  </div>`;
}

function renderQuiz(){
  const q=filtered[idx];if(!q){home();return}
  const d=DOMAINS[q.d];
  const prog=filtered.map((_,i)=>`<div class="seg" style="background:${i<idx?d.color:(i===idx?d.color:'#E2E8F0')};opacity:${i<=idx?1:.5}"></div>`).join("");
  const choices=q.c.map((c,i)=>{
    let bg="#fff",bd="#E2E8F0",col="#334155";
    if(locked){if(i===q.a){bg="#ECFDF5";bd="#10B981";col="#065F46"}else if(i===picked){bg="#FEF2F2";bd="#EF4444";col="#991B1B"}}
    return `<button class="choice" style="background:${bg};border-color:${bd};color:${col}" onclick="choose(${i})" ${locked?"disabled":""}><span class="letter">${L[i]}</span>${c}</button>`}).join("");
  const explain=locked?`<div class="explain"><div class="explain-title" style="color:${picked===q.a?'#059669':'#B45309'}">${picked===q.a?"✓ إجابة صحيحة":"الصحيحة بالأخضر"}</div><div class="explain-body">${q.w||""}</div></div>`:"";
  const svg=q.svg?`<div class="svgbox" style="background:#F8FAFC;border-radius:14px;padding:16px;display:flex;justify-content:center;margin-bottom:16px">${q.svg}</div>`:"";
  const banner=locked&&rapidNudge?`<div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#92400E;line-height:1.7">⏱️ لاحظنا إجابات سريعة متتالية — خذي وقتك في قراءة السؤال جيداً قبل الاختيار.</div>`
    :locked&&breakSuggest?`<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;color:#1D4ED8;line-height:1.7">🌿 جاوبتِ على ${toAr(sessionAnswered)} سؤالاً في هذه الجلسة. استراحة قصيرة (٥ دقائق) تساعدك على التركيز أكثر — لا داعي للاستعجال.</div>`
    :"";
  const btn=locked?`<button class="btn" style="background:${d.color}" onclick="next()">${idx+1>=filtered.length?"إنهاء ومشاهدة النتيجة":"السؤال التالي ←"}</button>`:"";
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="bar">${prog}</div>
  <div class="meta"><span>سؤال ${toAr(idx+1)} من ${toAr(filtered.length)}</span><span>${d.name}</span></div>
  <div class="card">
    <span class="tag" style="background:${d.soft};color:${d.color}">${d.name}</span>
    <div class="q">${q.q}</div>
    ${svg}
    <div class="choices">${choices}</div>
    ${explain}
    ${banner}
  </div>
  ${btn}`;
}

function renderResult(){
  const pct=Math.round(score/filtered.length*100);
  const acc=domainStats();
  const doms=Object.keys(DOMAINS).filter(k=>acc[k].t).map(k=>{const d=DOMAINS[k];const p=Math.round(acc[k].r/acc[k].t*100);return `<div class="dom-row"><div class="dom-head"><span>${d.name}</span><span>${toAr(acc[k].r)}/${toAr(acc[k].t)} (${toAr(p)}%)</span></div><div class="track"><div class="fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join("");
  const weak=weakestOf(acc);
  let remedy="";
  if(weak.key&&weak.pct<100){const wd=DOMAINS[weak.key];remedy=`<div class="remedy"><div class="r-title">🎯 لنقوِّ نقطة الضعف</div><div class="r-body">أضعف مجال كان «${wd.name}» (${toAr(Math.round(weak.pct))}%). تدرّبي عليه الآن بأسئلة جديدة.</div><button class="btn" style="background:${wd.color}" onclick="start('${weak.key}')">تدريب مركّز على ${wd.name}</button></div>`}
  app.innerHTML=`
  <div class="card">
    <div class="score-row"><span class="score-big" style="color:${pct>=70?'#059669':pct>=50?'#D97706':'#DC2626'}">${toAr(score)}</span><span class="score-total">/ ${toAr(filtered.length)}</span><span class="score-pct">${toAr(pct)}%</span></div>
    <div style="color:#64748B;font-size:15px;margin-bottom:14px">${pct>=85?"أداء ممتاز! 🌟":pct>=70?"جيد جداً، واصلي 💪":pct>=50?"جيد، وفيه مجال للتحسّن":"لا بأس، التدريب يصنع الفرق 🌱"}</div>
    <div style="background:#FEF3C7;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:#92400E;font-weight:700">${growthMsg(currentMode,pct)}</div>
    <div style="display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:18px;font-size:14px;color:#D97706;font-weight:800">🔥 سلسلة المواظبة: ${toAr(bumpStreak().days)} ${bumpStreak().days===1?"يوم":"أيام"}</div>
    ${doms}
    ${remedy}
    <button class="btn" style="background:#1E293B;margin-top:18px" onclick="start('${currentMode==='full'?'full':currentMode}')">إعادة (أسئلة جديدة)</button>
    <button class="link-btn" onclick="loadProgress()">📈 متابعة التقدّم</button>
    <button class="link-btn" onclick="home()">→ الرئيسية</button>
  </div>`;
}

function fmtDate(s){const d=new Date(s);return d.toLocaleDateString('ar-SA',{month:'numeric',day:'numeric'})+' '+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})}
function renderProgress(){
  if(attempts===null){app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع</button><div class="card"><div class="empty">جارٍ تحميل النتائج…</div></div>`;return}
  if(!attempts.length){app.innerHTML=`<button class="link-btn" onclick="home()">→ رجوع</button><div class="card"><div class="empty">ما فيه نتائج بعد.<br>ابدئي أول تدريب وستظهر هنا. 🌱</div><button class="btn" style="background:#1E293B" onclick="home()">ابدئي الآن</button></div>`;return}
  const acc={verbal:{r:0,t:0},quant:{r:0,t:0},science:{r:0,t:0},flex:{r:0,t:0}};
  attempts.forEach(a=>{acc.verbal.r+=a.verbal_correct||0;acc.verbal.t+=a.verbal_total||0;acc.quant.r+=a.quant_correct||0;acc.quant.t+=a.quant_total||0;acc.science.r+=a.science_correct||0;acc.science.t+=a.science_total||0;acc.flex.r+=a.flex_correct||0;acc.flex.t+=a.flex_total||0});
  const doms=Object.keys(DOMAINS).filter(k=>acc[k].t).map(k=>{const d=DOMAINS[k];const p=Math.round(acc[k].r/acc[k].t*100);return `<div class="dom-row"><div class="dom-head"><span>${d.name}</span><span>${toAr(p)}%</span></div><div class="track"><div class="fill" style="width:${p}%;background:${d.color}"></div></div></div>`}).join("");
  const rows=attempts.slice().reverse().slice(0,12).map(a=>{const p=Math.round((a.score/a.total)*100);const mn=a.mode==="full"?"محاكاة شاملة":(DOMAINS[a.mode]?DOMAINS[a.mode].name:a.mode);return `<div class="attempt"><div><div class="att-mode">${mn}</div><div class="att-date">${fmtDate(a.created_at)}</div></div><div class="att-score" style="color:${p>=70?'#059669':p>=50?'#D97706':'#DC2626'}">${toAr(a.score)}/${toAr(a.total)} · ${toAr(p)}%</div></div>`}).join("");
  app.innerHTML=`
  <button class="link-btn" onclick="home()">→ رجوع للرئيسية</button>
  <div class="section-title"><span>متابعة تقدّم ${alias()}</span></div>
  <div class="card"><div style="font-weight:800;margin-bottom:14px">متوسّط المستوى لكل مجال</div>${doms}</div>
  <div class="card"><div style="font-weight:800;margin-bottom:6px">آخر المحاولات</div>${rows}</div>`;
}

render();

</script>
</body>
</html>
